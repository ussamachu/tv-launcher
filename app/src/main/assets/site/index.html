<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TV Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── BASE ──────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#7db4ff;
  --gold:#ffc65c;
  --ink:#ffffff;
  --ink2:rgba(255,255,255,.74);
  --ink3:rgba(255,255,255,.50);
  --line:rgba(255,255,255,.14);
  --card:rgba(15,23,42,0.88);
  --font-app:'IBM Plex Sans Arabic',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:#05080d;color:var(--ink);
  font-family:var(--font-app);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;user-select:none;
  font-synthesis-weight:none;text-rendering:optimizeLegibility}
button,input,select,textarea{font-family:var(--font-app);font-feature-settings:"kern" 1}
body{position:relative}
.ic{display:block;flex-shrink:0}
i[data-ic]{display:inline-flex;align-items:center;justify-content:center;font-style:normal}

#bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 90% 70% at 78% 74%,rgba(30,52,86,.55) 0%,transparent 65%) no-repeat,
             linear-gradient(165deg,#0d1524 0%,#070c14 58%,#04070c 100%);
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat}
#bg::after{content:'';position:absolute;inset:0;
  background:
   linear-gradient(180deg,rgba(4,8,14,.50) 0%,rgba(4,8,14,.18) 38%,rgba(4,8,14,.72) 100%),
   radial-gradient(ellipse 80% 60% at 80% 70%,rgba(4,8,14,.35) 0%,transparent 70%)}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;z-index:1;
  padding:34px 64px 38px;display:flex;flex-direction:column;gap:22px}

/* ─── FOCUS ─────────────────────────────────────────────────── */
.dpad-focusable{outline:none;position:relative;cursor:pointer;transition:transform .2s cubic-bezier(.2,0,0,1),box-shadow .2s,background .2s,color .2s}
.dpad-focusable.dpad-active{box-shadow:0 0 0 4px #fff,0 0 0 9px rgba(125,180,255,.55),0 18px 44px rgba(0,0,0,.55)!important;transform:scale(1.04);z-index:8}

/* ─── CARD ──────────────────────────────────────────────────── */
.card{background:rgba(15, 23, 42, 0.88);
  border:1px solid rgba(255, 255, 255, 0.12);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}

/* ─── HEADER ────────────────────────────────────────────────── */
.hdr{display:flex;align-items:center;justify-content:space-between;height:60px;flex-shrink:0}
.hdr-side{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:14px;font-size:32px;font-weight:700;margin-inline-end:10px}
.pill{height:52px;padding:0 22px;border-radius:26px;background:rgba(255,255,255,.10);border:1px solid var(--line);
  display:flex;align-items:center;gap:10px;font-size:22px;font-weight:500;color:var(--ink)}
.pill.offline{color:#ff8f8f;background:rgba(255,120,120,.16);border-color:rgba(255,120,120,.4)}
.pill .dot{opacity:.4}
.ibtn{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:#fff}

/* ─── MAIN GRID ─────────────────────────────────────────────── */
.main{flex:1;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:40px}

/* HERO */
.hero{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;padding-top:4px;min-width:0}
.hero-greet{font-size:48px;font-weight:700;line-height:1.15;color:var(--ink2)}
.hero-sub{font-size:24px;font-weight:400;color:var(--ink3);margin-top:8px;min-height:30px}
.hero-clock-row{display:flex;align-items:center;gap:16px;margin:2px 0 18px}
.hero-clock{font-size:200px;font-weight:300;line-height:1;direction:ltr;letter-spacing:-6px}
.hero-ampm{font-size:28px;font-weight:700;color:var(--accent);background:rgba(125,180,255,.16);border:1px solid rgba(125,180,255,.4);padding:4px 14px;border-radius:14px;display:none}
.hero-date{font-size:26px;font-weight:500;color:var(--ink2)}
.hero-hijri{font-size:22px;font-weight:500;color:var(--gold);margin-top:8px}

/* CARDS ROW (Square Widgets Side-by-Side) */
.cards{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:28px;flex:none}

/* PRAYER CARD — Square Widget */
#prayer-card{width:380px;height:380px;padding:26px 24px 22px;border-radius:38px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;flex:none}
.p-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.p-badge{font-size:16px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:6px}
.p-capsule{display:flex;flex-direction:column;align-items:flex-end;background:none;border:none;padding:0;box-shadow:none;gap:4px}
.p-capsule .p-name{font-size:28px;font-weight:700;color:var(--gold);line-height:1.1}
.p-capsule .p-count{font-size:44px;font-weight:400;color:#fff;direction:ltr;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.p-mid{display:flex;align-items:center;justify-content:center;flex:1;min-height:0}
.prayer-svg{width:118px;height:118px;display:flex;align-items:center;justify-content:center}
.prayer-svg svg{width:100%;height:100%}
.p-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-top:10px;border-top:none}
.pr{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:14px;color:var(--ink3)}
.pr .pi{display:none}
.pr .pn{font-size:14px;font-weight:500;color:var(--ink3)}
.pr .pt{font-size:17px;font-weight:700;color:var(--ink2);direction:ltr;font-variant-numeric:tabular-nums}
.pr.calm{color:var(--gold);background:rgba(255,198,92,.12);box-shadow:none}
.pr.calm .pn{color:var(--gold);font-weight:700}
.pr.calm .pt{color:#fff}
.pr.past{opacity:.4}

/* WEATHER CARD — Square Widget (San Francisco iOS Style) */
#weather-card{width:380px;height:380px;padding:26px 24px 22px;border-radius:38px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;flex:none}
.w-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.w-temp{font-size:76px;font-weight:300;line-height:0.95;letter-spacing:-3px;direction:ltr;color:#fff}
.w-city-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:end;padding-top:4px}
.w-city-name{font-size:22px;font-weight:700;color:#fff;line-height:1.2}
.w-cond{font-size:16px;font-weight:400;color:var(--ink3);line-height:1.3}
.w-mid{display:flex;align-items:center;justify-content:center;flex:1;min-height:0}
.w-icon{width:128px;height:128px;display:flex;align-items:center;justify-content:center}
.w-icon svg{width:100%;height:100%}
.w-hourly{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-top:10px;border-top:none}
.hcell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px}
.hcell .ht{font-size:13px;color:var(--ink3);font-weight:500}
.hcell .hi{width:30px;height:30px}.hcell .hi svg{width:100%;height:100%}
.hcell .hd{font-size:17px;font-weight:700;direction:ltr;color:#fff}
.hcell .hp{display:none}

/* ─── DOCK ──────────────────────────────────────────────────── */
.dock-wrap{flex-shrink:0;display:flex;flex-direction:column;gap:10px}
.dock-head{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 4px}
.dock-name{font-size:38px;font-weight:800}
.allapps-btn{display:flex;align-items:center;gap:12px;height:52px;padding:0 26px;border-radius:26px;font-size:23px;font-weight:600;
  background:rgba(255,255,255,.12);border:1px solid var(--line)}
.allapps-btn.dpad-active{background:var(--accent);color:#07111f}
.dock{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:20px;height:184px;padding:8px 6px 0}
.tile{border-radius:26px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:var(--tbg,#222);color:var(--tfg,#fff);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 36px rgba(0,0,0,.35);
  transition:transform .2s cubic-bezier(.2,0,0,1),box-shadow .2s,border-color .2s}
.tile.dpad-focusable.dpad-active{transform:scale(1.08);border-color:var(--accent);
  box-shadow:0 0 0 4px #fff,0 0 0 9px rgba(125,180,255,.55),0 0 44px rgba(125,180,255,.40),0 24px 56px rgba(0,0,0,.55)!important;z-index:8}
.tile::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 55%)}
.tile .mark{position:relative;display:flex;align-items:center;justify-content:center;width:96px;height:96px}
.tile .mark svg{width:auto;height:80px}
.tile .mark img{width:84px;height:84px;object-fit:contain;border-radius:12px}
.letter{font-size:72px;font-weight:900}

/* ─── OVERLAYS ──────────────────────────────────────────────── */
.overlay{position:absolute;inset:-40px -64px -40px -64px;z-index:50;display:none;background:rgba(3,6,12,.84)}
.overlay.open{display:block}

/* drawer */
.drawer{position:absolute;left:64px;right:64px;bottom:0;top:auto;height:720px;padding:34px 44px 30px;
  background:rgba(14,20,30,.95);border:1px solid var(--line);border-bottom:none;border-radius:44px 44px 0 0;
  display:flex;flex-direction:column;gap:22px;box-shadow:0 -30px 80px rgba(0,0,0,.7)}
.drawer-top{display:flex;align-items:center;justify-content:space-between}
.drawer-title{display:flex;align-items:center;gap:14px;font-size:34px;font-weight:700}
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;overflow-y:auto;padding:14px 8px 20px}
.dapp{height:184px;border-radius:26px;display:flex;align-items:center;justify-content:center}
.dapp .mark{width:96px;height:96px}
.dapp .mark svg{height:84px;width:auto}
.dapp .mark img{width:84px;height:84px}
.dlabel{position:absolute;bottom:14px;inset-inline:0;text-align:center;font-size:21px;font-weight:600;direction:ltr}
.star{position:absolute;top:12px;inset-inline-end:12px;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff;z-index:3}
.star.fav{color:var(--gold);background:rgba(0,0,0,.55)}

/* settings */
.settings-panel{position:absolute;left:204px;top:90px;width:1512px;height:900px;
  background:linear-gradient(165deg,rgba(21,29,43,.985),rgba(9,14,22,.975));
  border:1px solid rgba(255,255,255,.12);border-radius:40px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.10)}
.sp-head{display:flex;align-items:center;justify-content:space-between;padding:24px 36px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
.sp-title{display:flex;align-items:center;gap:14px;font-size:36px;font-weight:800}
.sp-body{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0;overflow:hidden}
.sp-col{padding:18px 30px 20px;display:flex;flex-direction:column;gap:16px;min-height:0;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
.sp-col:first-child{border-inline-end:1px solid rgba(255,255,255,.07)}
.sp-col::-webkit-scrollbar{width:8px}
.sp-col::-webkit-scrollbar-track{background:transparent}
.sp-col::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}
.sp-sec{display:flex;flex-direction:column;gap:8px;min-height:0;flex-shrink:0}
.sp-sec h3{font-size:20px;font-weight:700;color:var(--ink3);letter-spacing:.2px;margin:0;display:flex;align-items:center;gap:10px}
.sp-sec h3::before{content:'';width:5px;height:17px;border-radius:3px;background:var(--accent);opacity:.9;flex-shrink:0}
.sp-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.085);border-radius:22px;padding:4px 8px;display:flex;flex-direction:column;min-height:0}
.srow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding:9px 8px;font-size:23px;font-weight:500;border-radius:14px}
.srow + .srow{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.srow.dpad-focusable:hover{background:rgba(255,255,255,.04)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:46px;padding:0 20px;border-radius:14px;font-size:20px;font-weight:600;display:flex;align-items:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:var(--ink2);transition:background .15s,color .15s,border-color .15s}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#07111f}
.inp{flex:1;min-width:0;height:50px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:0 18px;color:#fff;font-family:inherit;font-size:21px;outline:none}
.btn{height:50px;padding:0 24px;border-radius:16px;background:var(--accent);color:#07111f;border:none;font-family:inherit;font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px}
.btn.ghost{background:rgba(255,255,255,.05);color:#fff;border:1px dashed rgba(255,255,255,.18);width:100%;justify-content:center;height:46px;font-size:19px}
.srow.search{background:none;border:none;padding:4px;flex-wrap:nowrap;box-shadow:none}
.sp-card .city-results{padding:4px 4px 2px}
.sp-card > .opts{padding:2px 4px 6px}
.sp-card.walls{padding:12px;gap:12px}
.city-results{display:flex;flex-direction:column;gap:8px}
.cres{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:21px}
.cres small{font-size:17px;color:var(--ink3)}
.cres-msg{font-size:19px;color:var(--ink3);padding:4px 6px}
.wp-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.wp{height:68px;border-radius:14px;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.14)}
.wp.active{border-color:var(--accent);box-shadow:0 0 20px rgba(125,180,255,.55)}
.tg{width:64px;height:36px;border-radius:20px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;flex-shrink:0}
.tg::after{content:'';position:absolute;top:4px;inset-inline-start:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--accent)}
.tg.on::after{transform:translateX(28px)}
[dir="rtl"] .tg.on::after{transform:translateX(-28px)}
.sp-sec.apps-sec{flex:1 1 auto;min-height:0}
.sp-card.apps{padding:4px 8px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 26px),rgba(0,0,0,.35) 100%);
  mask-image:linear-gradient(180deg,#000 calc(100% - 26px),rgba(0,0,0,.35) 100%)}
.sp-card.apps::-webkit-scrollbar{width:8px}
.sp-card.apps::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}
.arow{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:14px;margin:0}
.arow + .arow{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.arow .al{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:600}
.arow .ai{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--tbg,#222);color:var(--tfg,#fff)}
.arow .ai svg{height:24px;width:auto}
.arow .ai .letter{font-size:22px}
.arow .acts{display:flex;gap:7px}
.sbtn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff}
.favtag{font-size:15px;font-weight:800;color:#241800;background:var(--gold);border-radius:9px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.dev{padding:14px 18px;border-radius:20px;display:flex;align-items:center;gap:14px;margin-top:auto;flex-shrink:0;
  background:linear-gradient(135deg,rgba(125,180,255,.14),rgba(255,198,92,.08));border:1px solid rgba(255,255,255,.09)}
.dev .badge{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#07111f;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dev .t1{font-size:21px;font-weight:700}.dev .t2{font-size:16px;color:var(--ink3);margin-top:2px}

/* ─── WEATHER ANIM ──────────────────────────────────────────── */
@keyframes drop{0%{opacity:0;transform:translateY(-5px)}40%{opacity:1}100%{opacity:0;transform:translateY(8px)}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes flash{0%,88%,100%{opacity:.15}92%,96%{opacity:1}}
@keyframes snowf{0%{opacity:0;transform:translateY(-4px)}40%{opacity:1}100%{opacity:0;transform:translateY(7px)}}
.a-d1{animation:drop 1.2s linear infinite}.a-d2{animation:drop 1.2s linear .4s infinite}.a-d3{animation:drop 1.2s linear .8s infinite}
.a-s1{animation:snowf 2.2s linear infinite}.a-s2{animation:snowf 2.2s linear .7s infinite}.a-s3{animation:snowf 2.2s linear 1.4s infinite}
.a-tw1{animation:twinkle 2.6s ease-in-out infinite}.a-tw2{animation:twinkle 3.2s ease-in-out .9s infinite}
.a-bob{animation:bob 5s ease-in-out infinite}
.a-flash{animation:flash 3.5s ease-in-out infinite}

/* ─── SCREENSAVER ─────────────────────────────────── */

#screensaver-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:stretch;background:#05080d;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .55s ease,visibility .55s ease}
#screensaver-overlay.show{opacity:1;visibility:visible;pointer-events:auto}
/* طبقة صورة الخلفية داخل شاشة التوقف (لا ما للخلفية القديمة) — تلاشٍ متقاطع بين طبقتين */
#sv-bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 90% 70% at 78% 74%,rgba(30,52,86,.45) 0%,transparent 65%) no-repeat,linear-gradient(165deg,#0d1524 0%,#070c14 58%,#04070c 100%)}
#sv-bg .sv-bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.5s ease}
#sv-bg .sv-bgimg.on{opacity:1}
/* تعتيم خفيف أعلى وأسفل فقط لقراءة النصوص دون حجب الصورة */
#sv-bg::before{content:'';position:absolute;top:0;inset-inline:0;height:36%;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,6,12,.74),rgba(3,6,12,0))}
#sv-bg::after{content:'';position:absolute;bottom:0;inset-inline:0;height:46%;z-index:2;pointer-events:none;
  background:linear-gradient(0deg,rgba(3,6,12,.84),rgba(3,6,12,0))}
#sv-bg .sv-dim{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.36);opacity:0;transition:opacity 1.5s ease;pointer-events:none}
#screensaver-overlay.nightdim #sv-bg .sv-dim{opacity:1}
#sv-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;z-index:4}
.sv-grid{position:relative;z-index:4;display:flex;flex-direction:column;width:100%;height:100%;padding:44px 56px 0;
  transition:transform 1.2s ease}
.sv-top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}
.sv-dateblock{text-align:start}
.sv-hijri{font-size:34px;font-weight:700;color:#fff}
.sv-greg{font-size:22px;font-weight:400;color:rgba(233,240,250,.80);margin-top:8px}
.sv-div{width:64px;height:3px;border-radius:2px;background:var(--accent);opacity:.85;margin-top:14px}
.sv-market{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.sv-wrow{display:flex;align-items:center;gap:16px;justify-content:flex-end;direction:ltr}
.sv-wicon{width:68px;height:68px;flex-shrink:0}
.sv-wtemp{font-size:48px;font-weight:700;color:#fff;direction:ltr}
.sv-wcond{font-size:22px;color:rgba(233,240,250,.88)}
.sv-wcity{font-size:20px;color:rgba(233,240,250,.62)}
.sv-whl{font-size:20px;color:rgba(233,240,250,.74);direction:ltr}
.sv-wupdated{font-size:20px;color:rgba(233,240,250,.52)}
.sv-mid{flex:1;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;min-height:0}
.sv-clockwrap{justify-self:start;text-align:start}
.sv-clock-row{display:flex;align-items:center;gap:22px;direction:ltr;margin:2px 0 18px}
.sv-clock{font-size:200px;font-weight:300;line-height:1;letter-spacing:-6px;color:#fff;display:inline-block}
.sv-ampm{font-size:30px;font-weight:700;color:var(--accent);background:rgba(125,180,255,.16);border:1px solid rgba(125,180,255,.4);padding:6px 16px;border-radius:16px}
.sv-cityrow{display:flex;align-items:center;gap:12px;font-size:26px;color:rgba(233,240,250,.82);margin-top:2px}
.sv-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(125,180,255,.16)}
.sv-daily{justify-self:end;text-align:end;max-width:660px;background:rgba(6,10,18,.55);border:1px solid rgba(255,255,255,.10);
  border-radius:24px;padding:30px 36px;overflow:hidden}
.sv-daily-title{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.sv-daily-text{font-size:33px;font-weight:500;line-height:1.68;color:#f2f6fc;margin-top:12px;word-break:break-word}
.sv-daily-text.small{font-size:23px;line-height:1.6;color:rgba(242,246,252,.88);margin-top:10px}
.sv-daily-sep{border:none;height:1px;background:rgba(255,255,255,.12);margin:14px 0 4px}
.sv-daily-src{font-size:20px;color:rgba(233,240,250,.62);margin-top:14px}
.sv-bottom{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.12);padding:20px 0 26px;margin-top:8px}
.sv-bcell{text-align:center;padding:4px 20px}
.sv-bcell+.sv-bcell{border-inline-start:1px solid rgba(255,255,255,.10)}
.sv-blabel{display:block;font-size:20px;color:rgba(233,240,250,.62);margin-bottom:6px}
.sv-bval{display:block;font-size:34px;font-weight:700;color:#fff}
.sv-bsub{display:block;font-size:20px;color:rgba(233,240,250,.74);margin-top:4px}
.mark img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.dapp .mark img{width:78px;height:78px}
.arow .ai img{width:100%;height:100%;object-fit:contain}
</style>

<body>

<!-- shared SVG gradients -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gSun" gradientUnits="userSpaceOnUse" x1="-11" y1="-11" x2="11" y2="11"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ffa62b"/></linearGradient>
  <linearGradient id="gMoon" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="21"><stop offset="0" stop-color="#fff6cf"/><stop offset="1" stop-color="#f0c24f"/></linearGradient>
  <linearGradient id="gCloud" gradientUnits="userSpaceOnUse" x1="0" y1="21" x2="0" y2="49"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cddbee"/></linearGradient>

<div id="bg"></div>

<div id="stage">

  <!-- HEADER -->

      <div class="ibtn dpad-focusable" id="btn-settings" tabindex="0" onclick="openSettings()"><i data-ic="sliders" data-s="26"></i></div>
      <div class="ibtn dpad-focusable" id="btn-input" tabindex="0" onclick="triggerInputSource()"><i data-ic="input" data-s="26"></i></div>

      <div class="ibtn dpad-focusable" id="btn-screensaver" tabindex="0" onclick="showScreensaver()"><i data-ic="screensaver" data-s="26"></i></div>

      <div class="hero-hijri" id="hero-hijri-date"></div>

    <section class="cards">

        </div>
        <div class="p-mid"><div class="prayer-svg a-bob" id="prayer-svg"></div></div>
        <div class="p-row" id="prayers-row"></div>
      </div>

      <!-- WEATHER -->
      <div class="card" id="weather-card">

          <div class="w-temp" id="weather-main-temp">--°</div>
          <div class="w-city-wrap">
            <div class="w-city-name" id="w-city-name">--</div>
            <div class="w-cond" id="weather-cond-text">--</div>

      </div>
    </div>
    <div class="dock" id="dock"></div>
  </footer>

  <!-- ALL APPS DRAWER -->

      </div>

/* ═══ 2. WEATHER SVG (self-contained, animated) ═══ */
function weatherKind(c){
  if(c===0) return 'clear';
  if(c===1) return 'mostly';
  if(c===2) return 'partly';
  if(c===3) return 'cloud';
  if(c===45||c===48) return 'fog';
  if(c>=51&&c<=57) return 'drizzle';
  if((c>=61&&c<=67)||(c>=80&&c<=82)) return 'rain';
  if((c>=71&&c<=77)||c===85||c===86) return 'snow';
  if(c>=95) return 'storm';
  return 'cloud';
}
function sunG(cx,cy,s){
  let rays='';
  for(let i=0;i<8;i++){const a=i*Math.PI/4;
    rays+='<line x1="'+(Math.cos(a)*17).toFixed(1)+'" y1="'+(Math.sin(a)*17).toFixed(1)+'" x2="'+(Math.cos(a)*23).toFixed(1)+'" y2="'+(Math.sin(a)*23).toFixed(1)+'"/>';}
  return '<g transform="translate('+cx+' '+cy+') scale('+s+')"><g stroke="#ffc94d" stroke-width="3.6" stroke-linecap="round">'+rays+
    '<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></g><circle r="11" fill="url(#gSun)"/></g>';
}
function moonG(x,y,s){return '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="url(#gMoon)"/></g>';}
function cloudG(x,y,s,dark){
  return '<g transform="translate('+x+' '+y+') scale('+(s||1)+')" fill="'+(dark?'url(#gCloudD)':'url(#gCloud)')+'"><circle cx="24" cy="40" r="9"/><circle cx="35" cy="33" r="12"/><circle cx="46" cy="41" r="8"/><rect x="24" y="38" width="22" height="11"/></g>';
}
function starsG(){return '<circle class="a-tw1" cx="50" cy="14" r="1.8" fill="#fff"/><circle class="a-tw2" cx="56" cy="26" r="1.3" fill="#9cc9ff"/><circle class="a-tw1" cx="12" cy="18" r="1.3" fill="#fff"/>';}
function createWeatherSVG(code,isDay){
  const k=weatherKind(code); let b='';
  if(k==='clear') b = isDay ? sunG(32,32,1.25) : moonG(6,6,2.2)+starsG();
  else if(k==='mostly') b = isDay ? sunG(30,28,1.05)+'<g class="a-bob">'+cloudG(14,16,.62)+'</g>' : moonG(14,2,1.7)+starsG()+'<g class="a-bob">'+cloudG(14,16,.62)+'</g>';
  else if(k==='partly') b = isDay ? sunG(42,22,.85)+'<g class="a-bob">'+cloudG(-3,8,1)+'</g>' : moonG(28,2,1.5)+'<g class="a-bob">'+cloudG(-3,8,1)+'</g>';
  else if(k==='cloud') b = cloudG(10,-2,.9,true)+'<g class="a-bob">'+cloudG(-3,8,1)+'</g>';
  else if(k==='fog') b = '<g class="a-bob">'+cloudG(0,-6,1)+'</g><g stroke="#d3dce8" stroke-width="3.6" stroke-linecap="round"><line x1="14" y1="50" x2="50" y2="50"/><line x1="20" y1="56" x2="56" y2="56"/><line x1="12" y1="62" x2="44" y2="62"/></g>';
  else if(k==='drizzle'||k==='rain'){
    const w = k==='rain'?3.2:2.2;
    b = cloudG(0,-8,1,true)+'<g stroke="#6cb8ff" stroke-width="'+w+'" stroke-linecap="round"><line class="a-d1" x1="24" y1="46" x2="21" y2="54"/><line class="a-d2" x1="34" y1="46" x2="31" y2="54"/><line class="a-d3" x1="44" y1="46" x2="41" y2="54"/>'+(k==='rain'?'<line class="a-d2" x1="29" y1="53" x2="26" y2="61"/><line class="a-d3" x1="39" y1="53" x2="36" y2="61"/>':'')+'</g>';
  }
  else if(k==='snow') b = cloudG(0,-8,1,true)+'<g fill="#fff"><circle class="a-s1" cx="23" cy="50" r="2.6"/><circle class="a-s2" cx="34" cy="55" r="2.6"/><circle class="a-s3" cx="45" cy="50" r="2.6"/><circle class="a-s2" cx="28" cy="60" r="2.2"/><circle class="a-s1" cx="40" cy="61" r="2.2"/></g>';
  else if(k==='storm') b = cloudG(0,-10,1,true)+'<polygon class="a-flash" points="35,36 25,52 32,52 29,63 42,45 35,45 38,36" fill="#ffd34d" stroke="#fff3b0" stroke-width=".8" stroke-linejoin="round"/>';
  return '<svg viewBox="0 0 64 64" width="100%" height="100%" fill="none">'+b+'</svg>';
}

   بقي فقط إعداد التلفاز كثابت: */

/* فتح إعدادات التلفاز: اختر حزمة الإعدادات الموجودة فعلاً على الجهاز */
function launchSettingsApp(){
  const candidates=['com.android.tv.settings','com.android.settings'];
  const installed=(window.__installedApps||[]).map(a=>a.pkg);
  const pkg=candidates.find(p=>installed.includes(p))||candidates[0];
  launchApp(pkg);
}
/* مزامنة قائمة التطبيقات الحقيقية المثبتة من الجهاز (يُستدعى عند الإقلاع قبل renderDock):
   - يعبّئ window.__installedApps (يستخدمه launchSettingsApp)
   - يدمج التطبيقات الجديدة في STATE.extraApps ويحذف التي لم تعد مثبتة
   - عند مفضّلة فارغة/شبه فارغة يملأ الـ dock تلقائياً من أول 6 تطبيقات مثبتة */
function syncInstalledApps(){
  try{
    if(!(window.AndroidTV&&typeof window.AndroidTV.getInstalledApps==='function')) return;
    const inst=JSON.parse(window.AndroidTV.getInstalledApps())||[];
    window.__installedApps=inst;
    /* حذف الإضافية التي لم تعد مثبتة */
    STATE.extraApps=(STATE.extraApps||[]).filter(a=>inst.some(it=>it.pkg===a.pkg));
    /* دمج الجديدة */
    inst.forEach(it=>{
      if(!getApps().some(a=>a.pkg===it.pkg))
        STATE.extraApps.push({id:it.pkg,label:it.label||it.pkg,pkg:it.pkg,icon:it.icon||null});
    });
    /* حذف المفضلة الغير موجودة، ثم الملء التلقائي */
    const valid=getApps().map(a=>a.id);
    STATE.favAppIds=(STATE.favAppIds||[]).filter(id=>valid.includes(id));
    if(STATE.favAppIds.filter(id=>id!=='tv-settings').length<2){
      const picks=inst.slice(0,STATE.maxDockApps).map(it=>it.pkg);
      STATE.favAppIds=picks.filter(Boolean);
      /* بلا تطبيقات مثبتة ← tile الإعدادات وحده */
      if(!STATE.favAppIds.length) STATE.favAppIds=['tv-settings'];
    }
    saveState();
  }catch(e){ console.warn('syncInstalledApps fail',e); }
}

function toLatin(s){ return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); }
function pad2(n){ return String(n).padStart(2,'0'); }
function t(key,sub){
  const L = I18N[STATE.lang]||I18N.ar;
  if(sub) return (L[key]&&L[key][sub])||sub;
  return L[key]!==undefined?L[key]:key;
}
function cityTz(){ const z=STATE.city.tz; return (z&&z!=='auto')?z:undefined; }
function cityNow(){
  try{ return new Date(new Date().toLocaleString('en-US',{timeZone:cityTz()})); }catch(e){ return new Date(); }
}
function fmtTime(h,m){
  if(STATE.clockFormat===12){
    const pm=h>=12, h12=h%12||12;
    return pad2(h12)+':'+pad2(m)+' '+(pm?(STATE.lang==='ar'?'م':'PM'):(STATE.lang==='ar'?'ص':'AM'));
  }
  return pad2(h)+':'+pad2(m);
}
function fmtHM(str){ const p=str.substring(0,5).split(':'); return fmtTime(parseInt(p[0],10),parseInt(p[1],10)); }
function tempFmt(c){ return STATE.tempUnit==='F' ? Math.round(c*9/5+32)+'°' : Math.round(c)+'°'; }
function fitMemoryKeep(fn){
  const fk = dpadFocused && dpadFocused.dataset ? dpadFocused.dataset.fk : null;
  fn();
  if(fk){ const el=document.querySelector('[data-fk="'+fk+'"]'); if(el) dpadSetFocus(el); }
}
async function fetchJSON(url,cacheKey){
  try{
    const r = await fetch(url); const j = await r.json();
    try{localStorage.setItem(cacheKey,JSON.stringify(j));}catch(e){}
    return j;
  }catch(e){
    try{ const c=localStorage.getItem(cacheKey); if(c) return JSON.parse(c); }catch(_){}
    throw e;
  }
}

/* ═══ 9. CLOCK ═══ */
function updateClock(){
  const now=new Date(); let h=now.getHours(); const m=pad2(now.getMinutes());
  const am=document.getElementById('hero-ampm');
  if(STATE.clockFormat===12){
    am.style.display='block';
    am.textContent=h>=12?(STATE.lang==='ar'?'م':'PM'):(STATE.lang==='ar'?'ص':'AM');
    h=h%12||12;
  }else am.style.display='none';
  document.getElementById('hero-clock').textContent=pad2(h)+':'+m;

  const hr=now.getHours(); let g='night';
  if(hr>=5&&hr<12) g='morning'; else if(hr>=12&&hr<17) g='afternoon'; else if(hr>=17&&hr<22) g='evening';
  document.getElementById('hero-greeting').textContent=t('greetings',g);

  const loc=STATE.lang==='ar'?'ar-MA-u-nu-latn':(STATE.lang==='fr'?'fr-FR':'en-US');
  document.getElementById('hero-greg-date').textContent=toLatin(now.toLocaleDateString(loc,{weekday:'long',year:'numeric',month:'long',day:'numeric'}));
  let hij='';
  try{
    hij=toLatin(now.toLocaleDateString('ar-u-ca-islamic-umalqura-nu-latn',{year:'numeric',month:'long',day:'numeric'}))
      .replace(/[\s\u00A0]*(هـ|AH)\s*$/i,'').trim()+' '+(STATE.lang==='ar'?'هـ':'AH');
  }catch(e){}
  document.getElementById('hero-hijri-date').textContent=hij;
}

/* ═══ 10. PRAYER TIMES ═══ */
let prayerTimings=null, prayersDay='', lastNextKey=null;
async function loadPrayers(){
  try{
    const n=cityNow();
    const url='https://api.aladhan.com/v1/timings/'+pad2(n.getDate())+'-'+pad2(n.getMonth()+1)+'-'+n.getFullYear()+'?latitude='+STATE.city.lat+'&longitude='+STATE.city.lon+'&method='+STATE.prayerMethod;
    const j=await fetchJSON(url,'tv_cache_prayer_'+STATE.city.lat+'_'+STATE.city.lon+'_'+STATE.prayerMethod+'_'+n.getDate());
    prayerTimings=j.data.timings; prayersDay=n.toDateString();
    PRAYERS_GRID.forEach(k=>{
      const el=document.getElementById('ptime-'+k);
      if(el&&prayerTimings[k]) el.textContent=toLatin(fmtHM(prayerTimings[k]));
    });
    lastNextKey=null; calcPrayer();
  }catch(e){ console.warn('prayer fail',e); }
}
function pDate(base,k,off){
  const p=prayerTimings[k].substring(0,5).split(':');
  const d=new Date(base); d.setDate(d.getDate()+(off||0)); d.setHours(parseInt(p[0],10),parseInt(p[1],10),0,0); return d;
}
function calcPrayer(){
  if(!prayerTimings) return;
  const now=cityNow();
  if(prayersDay && now.toDateString()!==prayersDay){ prayersDay=now.toDateString(); loadPrayers(); return; }
  const ev=[
    {k:'Isha',d:pDate(now,'Isha',-1)},
    {k:'Fajr',d:pDate(now,'Fajr')},{k:'Dhuhr',d:pDate(now,'Dhuhr')},{k:'Asr',d:pDate(now,'Asr')},
    {k:'Maghrib',d:pDate(now,'Maghrib')},{k:'Isha',d:pDate(now,'Isha')},
    {k:'Fajr',d:pDate(now,'Fajr',1)}
  ];
  let ni=ev.findIndex(e=>e.d>now); if(ni<1) ni=ev.length-1;
  const next=ev[ni], prev=ev[ni-1];

  if(lastNextKey!==next.k){
    lastNextKey=next.k;
    PRAYERS_GRID.forEach(k=>{
      const b=document.getElementById('pbox-'+k); if(!b) return;
      b.classList.toggle('calm',k===next.k);
    });
    document.getElementById('prayer-next-title').textContent=t('prayers',next.k);
    document.getElementById('prayer-svg').innerHTML=prayerSVG(next.k);
  }
  PRAYERS_GRID.forEach(k=>{
    const b=document.getElementById('pbox-'+k); if(!b) return;
    b.classList.toggle('past',k!==next.k && pDate(now,k)<now);
  });
  const diff=Math.max(0,Math.floor((next.d-now)/1000));
  document.getElementById('prayer-countdown').textContent=pad2(Math.floor(diff/3600))+':'+pad2(Math.floor(diff%3600/60))+':'+pad2(diff%60);
  APP_DATA.next={k:next.k,time:prayerTimings[next.k],rem:diff};
}
setInterval(calcPrayer,1000);

function wDesc(code){
  const map={clear:'clear',mostly:'mostlyClear',partly:'partlyCloudy',cloud:'overcast',fog:'fog',drizzle:'drizzle',rain:'rain',snow:'snow',storm:'thunder'};
  return t('weather',map[weatherKind(code)]);
}
async function loadWeather(){
  try{
    const tz=STATE.city.tz?encodeURIComponent(STATE.city.tz):'auto';
    const url='https://api.open-meteo.com/v1/forecast?latitude='+STATE.city.lat+'&longitude='+STATE.city.lon+
      '&current=temperature_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,relative_humidity_2m'+
      '&hourly=temperature_2m,weather_code,is_day,precipitation_probability'+
      '&daily=temperature_2m_max,temperature_2m_min&timezone='+tz+'&forecast_days=2';
    const d=await fetchJSON(url,'tv_cache_weather_'+STATE.city.lat+'_'+STATE.city.lon);
    const cur=d.current, daily=d.daily, hourly=d.hourly;
    const isDay=cur.is_day===1, code=cur.weather_code;
    const desc=wDesc(code);

    document.getElementById('hero-sky-desc').textContent=desc+' • '+(isDay?t('weather','day'):t('weather','night'));
    document.getElementById('weather-main-svg').innerHTML=createWeatherSVG(code,isDay);
    document.getElementById('weather-main-temp').textContent=tempFmt(cur.temperature_2m);
    document.getElementById('weather-cond-text').textContent=desc;
    document.getElementById('w-city-name').textContent=STATE.city.name+(STATE.city.country?' • '+STATE.city.country:'');
    APP_DATA.weather={code:code,isDay:isDay,temp:cur.temperature_2m,hi:daily.temperature_2m_max[0],lo:daily.temperature_2m_min[0],fetchedAt:Date.now()};

    const strip=document.getElementById('hourly-strip'); strip.innerHTML='';
    const prefix=(cur.time||'').substring(0,13);
    let si=hourly.time.findIndex(x=>x.startsWith(prefix)); if(si<0) si=0;
    for(let s=0;s<6;s++){
      const i=si+s; if(i>=hourly.time.length) break;
      const isNow=s===0, hh=+hourly.time[i].substring(11,13);
      let label=isNow?t('now'):(STATE.clockFormat===12?((hh%12||12)+(hh>=12?(STATE.lang==='ar'?' م':' PM'):(STATE.lang==='ar'?' ص':' AM'))):pad2(hh)+':00');
      const c=isNow?code:hourly.weather_code[i], dy=isNow?isDay:hourly.is_day[i]===1, tp=isNow?cur.temperature_2m:hourly.temperature_2m[i];
      const pp=hourly.precipitation_probability?hourly.precipitation_probability[i]:null;
      const cell=document.createElement('div'); cell.className='hcell'+(isNow?' now':'');
      cell.innerHTML='<div class="ht">'+toLatin(label)+'</div><div class="hi">'+createWeatherSVG(c,dy)+'</div><div class="hd">'+tempFmt(tp)+'</div><div class="hp">'+(pp!=null&&pp>=10?ic('droplet',15)+pp+'%':'')+'</div>';
      strip.appendChild(cell);
    }
  }catch(e){ console.warn('weather fail',e); }
}

let idb=null;
function openDB(){ return new Promise(res=>{ if(idb) return res(idb); try{ const r=indexedDB.open('TVLauncherDB',1); r.onupgradeneeded=e=>e.target.result.createObjectStore('wallpapers'); r.onsuccess=e=>{idb=e.target.result;res(idb)}; r.onerror=()=>res(null);}catch(e){res(null)} }); }
async function saveWallpaperDB(u){ const d=await openDB(); if(!d) return; d.transaction('wallpapers','readwrite').objectStore('wallpapers').put(u,'current'); }
async function loadWallpaperDB(){ const d=await openDB(); if(!d) return null; return new Promise(res=>{ const q=d.transaction('wallpapers','readonly').objectStore('wallpapers').get('current'); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }
function applyWallpaper(u){ document.getElementById('bg').style.backgroundImage="url('"+u+"')"; }

/* ─── خلفيات مدمجة محليّة (assets) → فتح فوري بدون إنترنت وبدون كاش ─── */
function wallURLFor(id){
  const w=BUILTIN_WALLPAPERS.find(x=>x.id===id)||BUILTIN_WALLPAPERS[0];
  return w.url;
}
async function applyWallpaperForId(id){
  const w=BUILTIN_WALLPAPERS.find(x=>x.id===id)||BUILTIN_WALLPAPERS[0];
  if(STATE.wallpaperCustom) return;          /* خلفية مخصصة نشطة — لا شيء هنا */
  applyWallpaper(w.url);
}

function renderWallpapersStrip(){
  fitMemoryKeep(function(){
    const s=document.getElementById('wallpapers-strip'); s.innerHTML='';
    BUILTIN_WALLPAPERS.forEach(w=>{
      const b=document.createElement('div');
      b.className='wp dpad-focusable'+((!STATE.wallpaperCustom&&STATE.wallpaperId===w.id)?' active':'');
      b.tabIndex=0; b.dataset.fk='wp-'+w.id; b.title=w.name;
      /* الصورة المصغّرة من الأصول المحلية مباشرة */
      b.style.backgroundImage="url('"+wallURLFor(w.id)+"')";
      b.onclick=async()=>{
        STATE.wallpaperId=w.id; STATE.wallpaperCustom=null; saveState();
        await applyWallpaperForId(w.id);
        renderWallpapersStrip();
      };
      s.appendChild(b);
    });
  });
}
function pickWallpaper(){
  if(window.AndroidTV&&typeof window.AndroidTV.pickWallpaper==='function') window.AndroidTV.pickWallpaper();
  else document.getElementById('wallpaper-file-input').click();
}
async function setCustomWallpaper(dataUrl){
  customWallURL=dataUrl; applyWallpaper(dataUrl); await saveWallpaperDB(dataUrl); STATE.wallpaperCustom='custom'; saveState(); renderWallpapersStrip();
}
window.setWallpaperFromNative=setCustomWallpaper; /* call from Android: webView.evaluateJavascript("setWallpaperFromNative('data:image/...')") */
function handleWallpaperFile(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=ev=>setCustomWallpaper(ev.target.result); r.readAsDataURL(f);
}
async function initWallpaper(){
  /* مسح كاش الخلفيات القديم (IndexedDB) كلياً: الخلفيات أصبحت أصولاً محلية مضغوطة */
  try{ indexedDB.deleteDatabase('TVLauncherDB'); }catch(e){}
  STATE.wallpaperCustom = null;
  if(!BUILTIN_WALLPAPERS.some(w=>w.id===STATE.wallpaperId)) STATE.wallpaperId = BUILTIN_WALLPAPERS[0].id;
  renderWallpapersStrip();
  applyWallpaperForId(STATE.wallpaperId);
}

/* ═══ 15. SETTINGS ═══ */
function openSettings(){
  returnFocus=dpadFocused;
  renderSettingsUI();
  document.getElementById('settings-modal').classList.add('open');
  dpadSetFocus(document.querySelector('#settings-modal .sp-body .dpad-focusable')||document.getElementById('s-close'));
}
function closeSettings(){
  document.getElementById('settings-modal').classList.remove('open');
  renderDock();
  const el=(returnFocus&&document.body.contains(returnFocus))?returnFocus:document.getElementById('btn-settings');
  dpadSetFocus(el);
}
function renderSettingsUI(){
  Array.from(document.getElementById('dock-count-chips').children).forEach((c,i)=>c.classList.toggle('sel',5+i===STATE.maxDockApps));
  document.getElementById('method-21').classList.toggle('sel',STATE.prayerMethod===21);
  document.getElementById('method-4').classList.toggle('sel',STATE.prayerMethod===4);
  document.getElementById('chip-c').classList.toggle('sel',STATE.tempUnit==='C');
  document.getElementById('chip-f').classList.toggle('sel',STATE.tempUnit==='F');
  document.getElementById('chip-24').classList.toggle('sel',STATE.clockFormat===24);
  document.getElementById('chip-12').classList.toggle('sel',STATE.clockFormat===12);
  document.getElementById('sw-prayer').classList.toggle('on',STATE.showPrayer);
  document.getElementById('sw-weather').classList.toggle('on',STATE.showWeather);
  [1,3,5].forEach(n=>{const el=document.getElementById('ss-'+n); if(el) el.classList.toggle('sel',STATE.screensaverDelay===n);});
  [0,10,30,60].forEach(n=>{const el=document.getElementById('ssi-'+n); if(el) el.classList.toggle('sel',ssBgInterval()===n);});
  const dm=STATE.ssDailyMode||'both';
  [['both','dailyBoth'],['ayah','dailyAyah'],['hadith','dailyHadith']].forEach(pr=>{ const el=document.getElementById('ssm-'+pr[0]); if(el){ el.textContent=t(pr[1]); el.classList.toggle('sel',dm===pr[0]); } });
  [-2,-1,0,1,2].forEach(o=>{const el=document.getElementById('hoff-'+(o<0?('m'+(-o)):o)); if(el) el.classList.toggle('sel',(parseInt(STATE.hijriOffset,10)||0)===o);});
  const sd=document.getElementById('sw-ssdim'); if(sd) sd.classList.toggle('on',STATE.ssNightDim!==false);
  OCC_TABLE.forEach(o=>{ const el=document.getElementById('occ-'+o.k); if(el){ el.textContent=t('occasions',o.k); el.classList.toggle('sel',!!(STATE.ssOcc&&STATE.ssOcc[o.k])); } });
  renderQuickCities(); renderSettingsAppsList(); renderWallpapersStrip();
}
function setScreensaverDelay(n){ STATE.screensaverDelay=n; saveState(); renderSettingsUI(); resetIdleTimer(); }
function ssBgInterval(){ const v=STATE.ssBgInterval; return (v===undefined||v===null)?0:(+v||0); }
const DEV_URL='https://oussamachu.framer.website/';
function openDevLink(){
  try{ if(window.AndroidTV&&typeof window.AndroidTV.openUrl==='function'){ window.AndroidTV.openUrl(DEV_URL); return; } }catch(e){}
  try{ window.open(DEV_URL,'_blank','noopener'); }catch(e){}
}
function setSsBgInterval(n){ STATE.ssBgInterval=n; saveState(); renderSettingsUI(); }
function setSsDailyMode(m){ STATE.ssDailyMode=(m==='ayah'||m==='hadith')?m:'both'; saveState(); renderSettingsUI(); }
function setHijriOffset(o){ STATE.hijriOffset=Math.max(-2,Math.min(2,parseInt(o,10)||0)); saveState(); ssOccCache=null; renderSettingsUI(); }
function setSsNightDim(){ STATE.ssNightDim=STATE.ssNightDim===false; saveState(); renderSettingsUI(); if(ssActive) ssApplyNight(); }
function setOccToggle(k){ STATE.ssOcc=STATE.ssOcc||{}; STATE.ssOcc[k]=!STATE.ssOcc[k]; saveState(); ssOccCache=null; renderSettingsUI(); if(ssActive) ssSlow(); }
function renderSettingsAppsList(){
  const cont=document.getElementById('settings-apps-list');
  fitMemoryKeep(function(){
    cont.innerHTML='';
    const favs=STATE.favAppIds.filter(id=>getApp(id));
    const others=getApps().filter(a=>!favs.includes(a.id)).map(a=>a.id);
    favs.concat(others).forEach(id=>{
      const app=getApp(id); const isFav=favs.includes(id);
      const row=document.createElement('div'); row.className='arow';
      row.innerHTML=
        '<div class="al"><div class="ai" style="'+tileStyle(app)+'">'+app.icon+'</div><span>'+app.label+'</span>'+(isFav?'<span class="favtag">'+(favs.indexOf(id)+1)+'</span>':'')+'</div>'+
        '<div class="acts">'+
          (isFav?
          '<div class="sbtn dpad-focusable" tabindex="0" data-fk="top-'+id+'" onclick="moveAppToTop(\''+id+'\')">'+ic('top',24)+'</div>'+
          '<div class="sbtn dpad-focusable" tabindex="0" data-fk="up-'+id+'" onclick="moveAppStep(\''+id+'\',-1)">'+ic('up',24)+'</div>'+
          '<div class="sbtn dpad-focusable" tabindex="0" data-fk="dn-'+id+'" onclick="moveAppStep(\''+id+'\',1)">'+ic('down',24)+'</div>':'')+
          '<div class="sbtn dpad-focusable" tabindex="0" data-fk="tg-'+id+'" style="background:'+(isFav?'rgba(235,94,85,.28)':'rgba(125,180,255,.28)')+'" onclick="toggleFav(\''+id+'\')">'+ic(isFav?'minus':'plus',24)+'</div>'+
        '</div>';
      cont.appendChild(row);
    });
  });
}
function setDockMax(n){ STATE.maxDockApps=n; saveState(); renderSettingsUI(); }
function moveAppToTop(id){
  const i=STATE.favAppIds.indexOf(id);
  if(i>0){ STATE.favAppIds.splice(i,1); STATE.favAppIds.unshift(id); saveState(); renderSettingsAppsList(); }
}
function moveAppStep(id,dir){
  const i=STATE.favAppIds.indexOf(id), j=i+dir;
  if(i<0||j<0||j>=STATE.favAppIds.length) return;
  const a=STATE.favAppIds; const x=a[i]; a[i]=a[j]; a[j]=x; saveState(); renderSettingsAppsList();
}
function setPrayerMethod(m){ STATE.prayerMethod=m; saveState(); renderSettingsUI(); loadPrayers(); }
function setTempUnit(u){ STATE.tempUnit=u; saveState(); renderSettingsUI(); loadWeather(); }
function setClockFormat(f){ STATE.clockFormat=f; saveState(); renderSettingsUI(); updateClock(); loadPrayers(); loadWeather(); }
function toggleCard(type){
  if(type==='prayer'){ STATE.showPrayer=!STATE.showPrayer; document.getElementById('prayer-card').style.display=STATE.showPrayer?'':'none'; }
  else { STATE.showWeather=!STATE.showWeather; document.getElementById('weather-card').style.display=STATE.showWeather?'':'none'; }
  saveState(); renderSettingsUI();
}
function triggerInputSource(){
  if(window.AndroidTV&&typeof window.AndroidTV.openInputSources==='function') window.AndroidTV.openInputSources();
  else console.log('[AndroidTV] input sources');
}
function refreshAll(){ loadPrayers(); loadWeather(); updateNetwork(); }
setInterval(loadWeather,15*60*1000);

/* ═══ 16. NETWORK ═══ */
function updateNetwork(){
  const icon=document.getElementById('net-icon'), label=document.getElementById('net-label'), pill=document.getElementById('net-pill');
  if(!navigator.onLine){ icon.innerHTML=ic('wifiOff',26); label.textContent=t('offline'); pill.classList.add('offline'); return; }
  pill.classList.remove('offline');
  let type='wifi';
  if(window.AndroidTV&&typeof window.AndroidTV.getNetworkType==='function') type=window.AndroidTV.getNetworkType();
  else if(navigator.connection&&navigator.connection.type) type=navigator.connection.type;
  if(type==='ethernet'){ icon.innerHTML=ic('ethernet',26); label.textContent=t('ethernet'); }
  else { icon.innerHTML=ic('wifi',26); label.textContent=t('wifi'); }
}
addEventListener('online',updateNetwork); addEventListener('offline',updateNetwork);

ch of the favors of your Lord would you deny?","ref":{"ar":"سورة الرحمن · الآية 13","fr":"Ar-Rahmaan · 55:13","en":"Ar-Rahmaan · 55:13"}},{"type":"ayah","ar":"وَلَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ وَنَعْلَمُ مَا تُوَسْوِسُ بِهِۦ نَفْسُهُۥ وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ ٱلْوَرِيدِ","fr":"Nous avons effectivement créé l'homme et Nous savons ce que son âme lui suggère et Nous sommes plus près de lui que sa veine jugulaire","en":"And We have already created man and know what his soul whispers to him, and We are closer to him than [his] jugular vein","ref":{"ar":"سورة ق · الآية 16","fr":"Qaaf · 50:16","en":"Qaaf · 50:16"}},{"type":"ayah","ar":"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً إِنَّكَ أَنتَ ٱلْوَهَّابُ","fr":"«Seigneur! Ne laisse pas dévier nos cœurs après que Tu nous aies guidés; et accorde-nous Ta miséricorde. C'est Toi, certes, le Grand Donateur!","en":"[Who say], \"Our Lord, let not our hearts deviate after You have guided us and grant us from Yourself mercy. Indeed, You are the Bestower.","ref":{"ar":"سورة آل عمران · الآية 8","fr":"Aal-i-Imraan · 3:8","en":"Aal-i-Imraan · 3:8"}},{"type":"ayah","ar":"وَمِنْهُم مَّن يَقُولُ رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا حَسَنَةًۭ وَفِى ٱلْءَاخِرَةِ حَسَنَةًۭ وَقِنَا عَذَابَ ٱلنَّارِ","fr":"Et il est des gens qui disent: «Seigneur! Accorde nous belle part ici-bas, et belle part aussi dans l'au-delà; et protège-nous du châtiment du Feu!»","en":"But among them is he who says, \"Our Lord, give us in this world [that which is] good and in the Hereafter [that which is] good and protect us from the punishment of the Fire.\"","ref":{"ar":"سورة البقرة · الآية 201","fr":"Al-Baqara · 2:201","en":"Al-Baqara · 2:201"}},{"type":"ayah","ar":"قَالَ رَبِّ ٱشْرَحْ لِى صَدْرِى","fr":"[Moïse] dit: «Seigneur, ouvre-moi ma poitrine,","en":"[Moses] said, \"My Lord, expand for me my breast [with assurance]","ref":{"ar":"سورة طه · الآية 25","fr":"Taa-Haa · 20:25","en":"Taa-Haa · 20:25"}},{"type":"ayah","ar":"وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰٓ","fr":"Ton Seigneur t'accordera certes [Ses faveurs], et alors tu seras satisfait.","en":"And your Lord is going to give you, and you will be satisfied.","ref":{"ar":"سورة الضحى · الآية 5","fr":"Ad-Dhuhaa · 93:5","en":"Ad-Dhuhaa · 93:5"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱذْكُرُوا۟ ٱللَّهَ ذِكْرًۭا كَثِيرًۭا","fr":"O vous qui croyez! Evoquez Allah d'une façon abondante,","en":"O you who have believed, remember Allah with much remembrance","ref":{"ar":"سورة الأحزاب · الآية 41","fr":"Al-Ahzaab · 33:41","en":"Al-Ahzaab · 33:41"}},{"type":"ayah","ar":"يُرِيدُ ٱللَّهُ أَن يُخَفِّفَ عَنكُمْ وَخُلِقَ ٱلْإِنسَٰنُ ضَعِيفًۭا","fr":"Allah veut vous alléger (les obligations,) car l'homme a été créé faible.","en":"And Allah wants to lighten for you [your difficulties]; and mankind was created weak.","ref":{"ar":"سورة النساء · الآية 28","fr":"An-Nisaa · 4:28","en":"An-Nisaa · 4:28"}},{"type":"ayah","ar":"ٱلْمَالُ وَٱلْبَنُونَ زِينَةُ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَٱلْبَٰقِيَٰتُ ٱلصَّٰلِحَٰتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًۭا وَخَيْرٌ أَمَلًۭا","fr":"Les biens et les enfants sont l'ornement de la vie de ce monde. Cependant, les bonnes œuvres qui persistent ont auprès de ton Seigneur une meilleure récompense et [suscitent] une belle espérance.","en":"Wealth and children are [but] adornment of the worldly life. But the enduring good deeds are better to your Lord for reward and better for [one's] hope.","ref":{"ar":"سورة الكهف · الآية 46","fr":"Al-Kahf · 18:46","en":"Al-Kahf · 18:46"}},{"type":"ayah","ar":"قُلْ يَٰعِبَادِىَ ٱلَّذِينَ أَسْرَفُوا۟ عَلَىٰٓ أَنفُسِهِمْ لَا تَقْنَطُوا۟ مِن رَّحْمَةِ ٱللَّهِ إِنَّ ٱللَّهَ يَغْفِرُ ٱلذُّنُوبَ جَمِيعًا إِنَّهُۥ هُوَ ٱلْغَفُورُ ٱلرَّحِيمُ","fr":"Dis: «O Mes serviteurs qui avez commis des excès à votre propre détriment, ne désespérez pas de la miséricorde d'Allah. Car Allah pardonne tous les péchés. Oui, c'est Lui le Pardonneur, le Très Miséricordieux.","en":"Say, \"O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful.\"","ref":{"ar":"سورة الزمر · الآية 53","fr":"Az-Zumar · 39:53","en":"Az-Zumar · 39:53"}},{"type":"ayah","ar":"وَقَالَ رَبُّكُمُ ٱدْعُونِىٓ أَسْتَجِبْ لَكُمْ إِنَّ ٱلَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِى سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ","fr":"Et votre Seigneur dit: «Appelez-Moi, Je vous répondrai. Ceux qui, par orgueil, se refusent à M'adorer entreront bientôt dans l'Enfer, humiliés».","en":"And your Lord says, \"Call upon Me; I will respond to you.\" Indeed, those who disdain My worship will enter Hell [rendered] contemptible.","ref":{"ar":"سورة غافر · الآية 60","fr":"Ghafir · 40:60","en":"Ghafir · 40:60"}},{"type":"ayah","ar":"وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى قَرِيبٌ أُجِيبُ دَعْوَةَ ٱلدَّاعِ إِذَا دَعَانِ فَلْيَسْتَجِيبُوا۟ لِى وَلْيُؤْمِنُوا۟ بِى لَعَلَّهُمْ يَرْشُدُونَ","fr":"Et quand Mes serviteurs t'interrogent sur Moi.. alors Je suis tout proche: Je réponds à l'appel de celui qui Me prie quand il Me prie. Qu'ils répondent à Mon appel, et qu'ils croient en Moi, afin qu'ils soient bien guidés.","en":"And when My servants ask you, [O Muhammad], concerning Me - indeed I am near. I respond to the invocation of the supplicant when he calls upon Me. So let them respond to Me [by obedience] and believe in Me that they may be [rightly] guided.","ref":{"ar":"سورة البقرة · الآية 186","fr":"Al-Baqara · 2:186","en":"Al-Baqara · 2:186"}},{"type":"ayah","ar":"وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ وَمَن يَتَوَكَّلْ عَلَى ٱللَّهِ فَهُوَ حَسْبُهُۥٓ إِنَّ ٱللَّهَ بَٰلِغُ أَمْرِهِۦ قَدْ جَعَلَ ٱللَّهُ لِكُلِّ شَىْءٍۢ قَدْرًۭا","fr":"et lui accordera Ses dons par [des moyens] sur lesquels il ne comptait pas. Et quiconque place sa confiance en Allah, Il [Allah] lui suffit. Allah atteint ce qu'Il Se propose, et Allah a assigné une mesure à chaque chose.","en":"And will provide for him from where he does not expect. And whoever relies upon Allah - then He is sufficient for him. Indeed, Allah will accomplish His purpose. Allah has already set for everything a [decreed] extent.","ref":{"ar":"سورة الطلاق · الآية 3","fr":"At-Talaaq · 65:3","en":"At-Talaaq · 65:3"}},{"type":"ayah","ar":"وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ وَلَا تَنَٰزَعُوا۟ فَتَفْشَلُوا۟ وَتَذْهَبَ رِيحُكُمْ وَٱصْبِرُوٓا۟ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ","fr":"Et obéissez à Allah et à Son messager; et ne vous disputez pas, sinon vous fléchirez et perdrez votre force. Et soyez endurants, car Allah est avec les endurants.","en":"And obey Allah and His Messenger, and do not dispute and [thus] lose courage and [then] your strength would depart; and be patient. Indeed, Allah is with the patient.","ref":{"ar":"سورة الأنفال · الآية 46","fr":"Al-Anfaal · 8:46","en":"Al-Anfaal · 8:46"}},{"type":"ayah","ar":"وَٱلَّذِينَ يَقُولُونَ رَبَّنَا هَبْ لَنَا مِنْ أَزْوَٰجِنَا وَذُرِّيَّٰتِنَا قُرَّةَ أَعْيُنٍۢ وَٱجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا","fr":"et qui disent: «Seigneur, donne-nous, en nos épouses et nos descendants, la joie des yeux, et fais de nous un guide pour les pieux».","en":"And those who say, \"Our Lord, grant us from among our wives and offspring comfort to our eyes and make us an example for the righteous.\"","ref":{"ar":"سورة الفرقان · الآية 74","fr":"Al-Furqaan · 25:74","en":"Al-Furqaan · 25:74"}},{"type":"ayah","ar":"وَلَا تُفْسِدُوا۟ فِى ٱلْأَرْضِ بَعْدَ إِصْلَٰحِهَا وَٱدْعُوهُ خَوْفًۭا وَطَمَعًا إِنَّ رَحْمَتَ ٱللَّهِ قَرِيبٌۭ مِّنَ ٱلْمُحْسِنِينَ","fr":"Et ne semez pas la corruption sur la terre après qu'elle ait été réformée. Et invoquez-Le avec crainte et espoir, car la miséricorde d'Allah est proche des bienfaisants.","en":"And cause not corruption upon the earth after its reformation. And invoke Him in fear and aspiration. Indeed, the mercy of Allah is near to the doers of good.","ref":{"ar":"سورة الأعراف · الآية 56","fr":"Al-A'raaf · 7:56","en":"Al-A'raaf · 7:56"}},{"type":"ayah","ar":"إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَتَوَاصَوْا۟ بِٱلْحَقِّ وَتَوَاصَوْا۟ بِٱلصَّبْرِ","fr":"sauf ceux qui croient et accomplissent les bonnes œuvres, s'enjoignent mutuellement la vérité et s'enjoignent mutuellement l'endurance.","en":"Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience.","ref":{"ar":"سورة العصر · الآية 3","fr":"Al-Asr · 103:3","en":"Al-Asr · 103:3"}},{"type":"ayah","ar":"وَإِلَىٰ رَبِّكَ فَٱرْغَب","fr":"et à ton Seigneur aspire.","en":"And to your Lord direct [your] longing.","ref":{"ar":"سورة الشرح · الآية 8","fr":"Ash-Sharh · 94:8","en":"Ash-Sharh · 94:8"}},{"type":"ayah","ar":"وَقُل رَّبِّ أَدْخِلْنِى مُدْخَلَ صِدْقٍۢ وَأَخْرِجْنِى مُخْرَجَ صِدْقٍۢ وَٱجْعَل لِّى مِن لَّدُنكَ سُلْطَٰنًۭا نَّصِيرًۭا","fr":"Et dis: «O mon Seigneur, fais que j'entre par une entrée de vérité et que je sorte par une sortie de vérité; et accorde-moi de Ta part, un pouvoir bénéficiant de Ton secours».","en":"And say, \"My Lord, cause me to enter a sound entrance and to exit a sound exit and grant me from Yourself a supporting authority.\"","ref":{"ar":"سورة الإسراء · الآية 80","fr":"Al-Israa · 17:80","en":"Al-Israa · 17:80"}},{"type":"ayah","ar":"وَزَكَرِيَّآ إِذْ نَادَىٰ رَبَّهُۥ رَبِّ لَا تَذَرْنِى فَرْدًۭا وَأَنتَ خَيْرُ ٱلْوَٰرِثِينَ","fr":"Et Zacharie, quand il implora son Seigneur: «Ne me laisse pas seul, Seigneur, alors que Tu es le meilleur des héritiers».","en":"And [mention] Zechariah, when he called to his Lord, \"My Lord, do not leave me alone [with no heir], while you are the best of inheritors.\"","ref":{"ar":"سورة الأنبياء · الآية 89","fr":"Al-Anbiyaa · 21:89","en":"Al-Anbiyaa · 21:89"}},{"type":"ayah","ar":"فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰٓ إِلَى ٱلظِّلِّ فَقَالَ رَبِّ إِنِّى لِمَآ أَنزَلْتَ إِلَىَّ مِنْ خَيْرٍۢ فَقِيرٌۭ","fr":"Il abreuva [les bêtes] pour elles puis retourna à l'ombre et dit: «Seigneur, j'ai grand besoin du bien que tu feras descendre vers moi».","en":"So he watered [their flocks] for them; then he went back to the shade and said, \"My Lord, indeed I am, for whatever good You would send down to me, in need.\"","ref":{"ar":"سورة القصص · الآية 24","fr":"Al-Qasas · 28:24","en":"Al-Qasas · 28:24"}},{"type":"ayah","ar":"ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ","fr":"Louange à Allah, Seigneur de l'univers.","en":"[All] praise is [due] to Allah, Lord of the worlds -","ref":{"ar":"سورة الفاتحة · الآية 2","fr":"Al-Faatiha · 1:2","en":"Al-Faatiha · 1:2"}},{"type":"ayah","ar":"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","fr":"C'est Toi [Seul] que nous adorons, et c'est Toi [Seul] dont nous implorons secours.","en":"It is You we worship and You we ask for help.","ref":{"ar":"سورة الفاتحة · الآية 5","fr":"Al-Faatiha · 1:5","en":"Al-Faatiha · 1:5"}},{"type":"ayah","ar":"ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ","fr":"Guide-nous dans le droit chemin,","en":"Guide us to the straight path -","ref":{"ar":"سورة الفاتحة · الآية 6","fr":"Al-Faatiha · 1:6","en":"Al-Faatiha · 1:6"}},{"type":"ayah","ar":"وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَمَا تُقَدِّمُوا۟ لِأَنفُسِكُم مِّنْ خَيْرٍۢ تَجِدُوهُ عِندَ ٱللَّهِ إِنَّ ٱللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌۭ","fr":"Et accomplissez la Salât et acquittez la Zakât. Et tout ce que vous avancez de bien pour vous-mêmes, vous le retrouverez auprès d'Allah, car Allah voit parfaitement ce que vous faites.","en":"And establish prayer and give zakah, and whatever good you put forward for yourselves - you will find it with Allah. Indeed, Allah of what you do, is Seeing.","ref":{"ar":"سورة البقرة · الآية 110","fr":"Al-Baqara · 2:110","en":"Al-Baqara · 2:110"}},{"type":"ayah","ar":"وَلِلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ فَأَيْنَمَا تُوَلُّوا۟ فَثَمَّ وَجْهُ ٱللَّهِ إِنَّ ٱللَّهَ وَٰسِعٌ عَلِيمٌۭ","fr":"A Allah seul appartiennent l'Est et l'Ouest. Où que vous vous tourniez, la Face (direction) d'Allah est donc là, car Allah a la grâce immense; Il est Omniscient.","en":"And to Allah belongs the east and the west. So wherever you [might] turn, there is the Face of Allah. Indeed, Allah is all-Encompassing and Knowing.","ref":{"ar":"سورة البقرة · الآية 115","fr":"Al-Baqara · 2:115","en":"Al-Baqara · 2:115"}},{"type":"ayah","ar":"ٱلَّذِينَ إِذَآ أَصَٰبَتْهُم مُّصِيبَةٌۭ قَالُوٓا۟ إِنَّا لِلَّهِ وَإِنَّآ إِلَيْهِ رَٰجِعُونَ","fr":"qui disent, quand un malheur les atteint: «Certes nous sommes à Allah, et c'est à Lui que nous retournerons.","en":"Who, when disaster strikes them, say, \"Indeed we belong to Allah, and indeed to Him we will return.\"","ref":{"ar":"سورة البقرة · الآية 156","fr":"Al-Baqara · 2:156","en":"Al-Baqara · 2:156"}},{"type":"ayah","ar":"وَإِلَٰهُكُمْ إِلَٰهٌۭ وَٰحِدٌۭ لَّآ إِلَٰهَ إِلَّا هُوَ ٱلرَّحْمَٰنُ ٱلرَّحِيمُ","fr":"Et votre Divinité est une divinité unique. Pas de divinité à part Lui, le Tout Miséricordieux, le Très Miséricordieux.","en":"And your god is one God. There is no deity [worthy of worship] except Him, the Entirely Merciful, the Especially Merciful.","ref":{"ar":"سورة البقرة · الآية 163","fr":"Al-Baqara · 2:163","en":"Al-Baqara · 2:163"}},{"type":"ayah","ar":"يُؤْتِى ٱلْحِكْمَةَ مَن يَشَآءُ وَمَن يُؤْتَ ٱلْحِكْمَةَ فَقَدْ أُوتِىَ خَيْرًۭا كَثِيرًۭا وَمَا يَذَّكَّرُ إِلَّآ أُو۟لُوا۟ ٱلْأَلْبَٰبِ","fr":"Il donne la sagesse à qui Il veut. Et celui à qui la sagesse est donnée, vraiment, c'est un bien immense qui lui est donné. Mais les doués d'intelligence seulement s'en souviennent.","en":"He gives wisdom to whom He wills, and whoever has been given wisdom has certainly been given much good. And none will remember except those of understanding.","ref":{"ar":"سورة البقرة · الآية 269","fr":"Al-Baqara · 2:269","en":"Al-Baqara · 2:269"}},{"type":"ayah","ar":"قُلْ إِن كُنتُمْ تُحِبُّونَ ٱللَّهَ فَٱتَّبِعُونِى يُحْبِبْكُمُ ٱللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ","fr":"Dis: «Si vous aimez vraiment Allah, suivez-moi, Allah vous aimera alors et vous pardonnera vos péchés. Allah est Pardonneur et Miséricordieux.","en":"Say, [O Muhammad], \"If you should love Allah, then follow me, [so] Allah will love you and forgive you your sins. And Allah is Forgiving and Merciful.\"","ref":{"ar":"سورة آل عمران · الآية 31","fr":"Aal-i-Imraan · 3:31","en":"Aal-i-Imraan · 3:31"}},{"type":"ayah","ar":"لَن تَنَالُوا۟ ٱلْبِرَّ حَتَّىٰ تُنفِقُوا۟ مِمَّا تُحِبُّونَ وَمَا تُنفِقُوا۟ مِن شَىْءٍۢ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٌۭ","fr":"Vous n'atteindrez la (vraie) piété, que si vous faites largesses de ce que vous chérissez. Tout ce dont vous faites largesses, Allah le sait certainement bien.","en":"Never will you attain the good [reward] until you spend [in the way of Allah] from that which you love. And whatever you spend - indeed, Allah is Knowing of it.","ref":{"ar":"سورة آل عمران · الآية 92","fr":"Aal-i-Imraan · 3:92","en":"Aal-i-Imraan · 3:92"}},{"type":"ayah","ar":"ٱلَّذِينَ يُنفِقُونَ فِى ٱلسَّرَّآءِ وَٱلضَّرَّآءِ وَٱلْكَٰظِمِينَ ٱلْغَيْظَ وَٱلْعَافِينَ عَنِ ٱلنَّاسِ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ","fr":"qui dépensent dans l'aisance et dans l'adversité, qui dominent leur rage et pardonnent à autrui - car Allah aime les bienfaisants -","en":"Who spend [in the cause of Allah] during ease and hardship and who restrain anger and who pardon the people - and Allah loves the doers of good;","ref":{"ar":"سورة آل عمران · الآية 134","fr":"Aal-i-Imraan · 3:134","en":"Aal-i-Imraan · 3:134"}},{"type":"ayah","ar":"ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدْ جَمَعُوا۟ لَكُمْ فَٱخْشَوْهُمْ فَزَادَهُمْ إِيمَٰنًۭا وَقَالُوا۟ حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ","fr":"Certes ceux auxquels l'on disait: «Les gens se sont rassemblés contre vous; craignez-les» - cela accrut leur foi - et ils dirent: «Allah nous suffit; Il est notre meilleur garant».","en":"Those to whom hypocrites said, \"Indeed, the people have gathered against you, so fear them.\" But it [merely] increased them in faith, and they said, \"Sufficient for us is Allah, and [He is] the best Disposer of affairs.\"","ref":{"ar":"سورة آل عمران · الآية 173","fr":"Aal-i-Imraan · 3:173","en":"Aal-i-Imraan · 3:173"}},{"type":"ayah","ar":"كُلُّ نَفْسٍۢ ذَآئِقَةُ ٱلْمَوْتِ وَإِنَّمَا تُوَفَّوْنَ أُجُورَكُمْ يَوْمَ ٱلْقِيَٰمَةِ فَمَن زُحْزِحَ عَنِ ٱلنَّارِ وَأُدْخِلَ ٱلْجَنَّةَ فَقَدْ فَازَ وَمَا ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا مَتَٰعُ ٱلْغُرُورِ","fr":"Toute âme goûtera la mort. Mais c'est seulement au Jour de la Résurrection que vous recevrez votre entière rétribution. Quiconque donc est écarté du Feu et introduit au Paradis, a certes réussi. Et la vie présente n'est qu'un objet de jouissance trompeuse.","en":"Every soul will taste death, and you will only be given your [full] compensation on the Day of Resurrection. So he who is drawn away from the Fire and admitted to Paradise has attained [his desire]. And what is the life of this world except the enjoyment of delusion.","ref":{"ar":"سورة آل عمران · الآية 185","fr":"Aal-i-Imraan · 3:185","en":"Aal-i-Imraan · 3:185"}},{"type":"ayah","ar":"إِنَّ فِى خَلْقِ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَٰفِ ٱلَّيْلِ وَٱلنَّهَارِ لَءَايَٰتٍۢ لِّأُو۟لِى ٱلْأَلْبَٰبِ","fr":"En vérité, dans la création des cieux et de la terre, et dans l'alternance de la nuit et du jour, il y a certes des signes pour les doués d'intelligence,","en":"Indeed, in the creation of the heavens and the earth and the alternation of the night and the day are signs for those of understanding.","ref":{"ar":"سورة آل عمران · الآية 190","fr":"Aal-i-Imraan · 3:190","en":"Aal-i-Imraan · 3:190"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱصْبِرُوا۟ وَصَابِرُوا۟ وَرَابِطُوا۟ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُفْلِحُونَ","fr":"O les croyants! Soyez endurants. Incitez-vous à l'endurance. Luttez constamment (contre l'ennemi) et craignez Allah, afin que vous réussissiez!","en":"O you who have believed, persevere and endure and remain stationed and fear Allah that you may be successful.","ref":{"ar":"سورة آل عمران · الآية 200","fr":"Aal-i-Imraan · 3:200","en":"Aal-i-Imraan · 3:200"}},{"type":"ayah","ar":"وَإِذَا حُيِّيتُم بِتَحِيَّةٍۢ فَحَيُّوا۟ بِأَحْسَنَ مِنْهَآ أَوْ رُدُّوهَآ إِنَّ ٱللَّهَ كَانَ عَلَىٰ كُلِّ شَىْءٍ حَسِيبًا","fr":"Si on vous fait une salutation, saluez d'une façon meilleure; ou bien rendez-la (simplement). Certes, Allah tient compte de tout.","en":"And when you are greeted with a greeting, greet [in return] with one better than it or [at least] return it [in a like manner]. Indeed, Allah is ever, over all things, an Accountant.","ref":{"ar":"سورة النساء · الآية 86","fr":"An-Nisaa · 4:86","en":"An-Nisaa · 4:86"}},{"type":"ayah","ar":"وَمَن يَعْمَلْ سُوٓءًا أَوْ يَظْلِمْ نَفْسَهُۥ ثُمَّ يَسْتَغْفِرِ ٱللَّهَ يَجِدِ ٱللَّهَ غَفُورًۭا رَّحِيمًۭا","fr":"Quiconque agit mal ou fait du tort à lui-même, puis aussitôt implore d'Allah le pardon, trouvera Allah Pardonneur et Miséricordieux.","en":"And whoever does a wrong or wrongs himself but then seeks forgiveness of Allah will find Allah Forgiving and Merciful.","ref":{"ar":"سورة النساء · الآية 110","fr":"An-Nisaa · 4:110","en":"An-Nisaa · 4:110"}},{"type":"ayah","ar":"قُلْ إِنَّ صَلَاتِى وَنُسُكِى وَمَحْيَاىَ وَمَمَاتِى لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ","fr":"Dis: «En vérité, ma Salât, mes actes de dévotion, ma vie et ma mort appartiennent à Allah, Seigneur de l'Univers.","en":"Say, \"Indeed, my prayer, my rites of sacrifice, my living and my dying are for Allah, Lord of the worlds.","ref":{"ar":"سورة الأنعام · الآية 162","fr":"Al-An'aam · 6:162","en":"Al-An'aam · 6:162"}},{"type":"ayah","ar":"قَالَا رَبَّنَا ظَلَمْنَآ أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ ٱلْخَٰسِرِينَ","fr":"Tous deux dirent: «O notre Seigneur, nous avons fait du tort à nous-mêmes. Et si Tu ne nous pardonnes pas et ne nous fais pas miséricorde, nous serons très certainement du nombre des perdants».","en":"They said, \"Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.\"","ref":{"ar":"سورة الأعراف · الآية 23","fr":"Al-A'raaf · 7:23","en":"Al-A'raaf · 7:23"}},{"type":"ayah","ar":"خُذِ ٱلْعَفْوَ وَأْمُرْ بِٱلْعُرْفِ وَأَعْرِضْ عَنِ ٱلْجَٰهِلِينَ","fr":"Accepte ce qu'on t'offre de raisonnable, commande ce qui est convenable et éloigne-toi des ignorants.","en":"Take what is given freely, enjoin what is good, and turn away from the ignorant.","ref":{"ar":"سورة الأعراف · الآية 199","fr":"Al-A'raaf · 7:199","en":"Al-A'raaf · 7:199"}},{"type":"ayah","ar":"قُل لَّن يُصِيبَنَآ إِلَّا مَا كَتَبَ ٱللَّهُ لَنَا هُوَ مَوْلَىٰنَا وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ","fr":"Dis: «Rien ne nous atteindra, en dehors de ce qu'Allah a prescrit pour nous. Il est notre Protecteur. C'est en Allah que les croyants doivent mettre leur confiance».","en":"Say, \"Never will we be struck except by what Allah has decreed for us; He is our protector.\" And upon Allah let the believers rely.","ref":{"ar":"سورة التوبة · الآية 51","fr":"At-Tawba · 9:51","en":"At-Tawba · 9:51"}},{"type":"ayah","ar":"فَإِن تَوَلَّوْا۟ فَقُلْ حَسْبِىَ ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ ٱلْعَرْشِ ٱلْعَظِيمِ","fr":"Alors, s'ils se détournent dis: «Allah me suffit. Il n'y a de divinité que Lui. En Lui je place ma confiance; et Il est le Seigneur du Trône immense».","en":"But if they turn away, [O Muhammad], say, \"Sufficient for me is Allah; there is no deity except Him. On Him I have relied, and He is the Lord of the Great Throne.\"","ref":{"ar":"سورة التوبة · الآية 129","fr":"At-Tawba · 9:129","en":"At-Tawba · 9:129"}},{"type":"ayah","ar":"أَلَآ إِنَّ أَوْلِيَآءَ ٱللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","fr":"En vérité, les bien-aimés d'Allah seront à l'abri de toute crainte, et ils ne seront point affligés,","en":"Unquestionably, [for] the allies of Allah there will be no fear concerning them, nor will they grieve","ref":{"ar":"سورة يونس · الآية 62","fr":"Yunus · 10:62","en":"Yunus · 10:62"}},{"type":"ayah","ar":"وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ إِلَّا عَلَى ٱللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا كُلٌّۭ فِى كِتَٰبٍۢ مُّبِينٍۢ","fr":"Il n'y a point de bête sur terre dont la subsistance n'incombe à Allah qui connaît son gîte et son dépôt; tout est dans un Livre explicite.","en":"And there is no creature on earth but that upon Allah is its provision, and He knows its place of dwelling and place of storage. All is in a clear register.","ref":{"ar":"سورة هود · الآية 6","fr":"Hud · 11:6","en":"Hud · 11:6"}},{"type":"ayah","ar":"وَأَقِمِ ٱلصَّلَوٰةَ طَرَفَىِ ٱلنَّهَارِ وَزُلَفًۭا مِّنَ ٱلَّيْلِ إِنَّ ٱلْحَسَنَٰتِ يُذْهِبْنَ ٱلسَّيِّـَٔاتِ ذَٰلِكَ ذِكْرَىٰ لِلذَّٰكِرِينَ","fr":"Et accomplis la Salât aux deux extrémités du jour et à certaines heures de la nuit. Les bonnes œuvres dissipent les mauvaises. Cela est une exhortation pour ceux qui réfléchissent.","en":"And establish prayer at the two ends of the day and at the approach of the night. Indeed, good deeds do away with misdeeds. That is a reminder for those who remember.","ref":{"ar":"سورة هود · الآية 114","fr":"Hud · 11:114","en":"Hud · 11:114"}},{"type":"ayah","ar":"وَٱصْبِرْ فَإِنَّ ٱللَّهَ لَا يُضِيعُ أَجْرَ ٱلْمُحْسِنِينَ","fr":"Et sois patient. Car Allah ne laisse pas perdre la récompense des gens bienfaisants.","en":"And be patient, for indeed, Allah does not allow to be lost the reward of those who do good.","ref":{"ar":"سورة هود · الآية 115","fr":"Hud · 11:115","en":"Hud · 11:115"}},{"type":"ayah","ar":"قَالَ إِنَّمَآ أَشْكُوا۟ بَثِّى وَحُزْنِىٓ إِلَى ٱللَّهِ وَأَعْلَمُ مِنَ ٱللَّهِ مَا لَا تَعْلَمُونَ","fr":"- Il dit: «Je ne me plains qu'à Allah de mon déchirement et de mon chagrin. Et, je sais de la part d'Allah, ce que vous ne savez pas.","en":"He said, \"I only complain of my suffering and my grief to Allah, and I know from Allah that which you do not know.","ref":{"ar":"سورة يوسف · الآية 86","fr":"Yusuf · 12:86","en":"Yusuf · 12:86"}},{"type":"ayah","ar":"يَٰبَنِىَّ ٱذْهَبُوا۟ فَتَحَسَّسُوا۟ مِن يُوسُفَ وَأَخِيهِ وَلَا تَا۟يْـَٔسُوا۟ مِن رَّوْحِ ٱللَّهِ إِنَّهُۥ لَا يَا۟يْـَٔسُ مِن رَّوْحِ ٱللَّهِ إِلَّا ٱلْقَوْمُ ٱلْكَٰفِرُونَ","fr":"O mes fils! Partez et enquérez-vous de Joseph et de son frère. Et ne désespérez pas de la miséricorde d'Allah. Ce sont seulement les gens mécréants qui désespèrent de la miséricorde d'Allah».","en":"O my sons, go and find out about Joseph and his brother and despair not of relief from Allah. Indeed, no one despairs of relief from Allah except the disbelieving people.\"","ref":{"ar":"سورة يوسف · الآية 87","fr":"Yusuf · 12:87","en":"Yusuf · 12:87"}},{"type":"ayah","ar":"رَبِّ ٱجْعَلْنِى مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِى رَبَّنَا وَتَقَبَّلْ دُعَآءِ","fr":"O mon Seigneur! Fais que j'accomplisse assidûment la Salât ainsi qu'une partie de ma descendance; exauce ma prière, ô notre Seigneur!","en":"My Lord, make me an establisher of prayer, and [many] from my descendants. Our Lord, and accept my supplication.","ref":{"ar":"سورة إبراهيم · الآية 40","fr":"Ibrahim · 14:40","en":"Ibrahim · 14:40"}},{"type":"ayah","ar":"رَبَّنَا ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ ٱلْحِسَابُ","fr":"O notre Seigneur! pardonne-moi, ainsi qu'à mes père et mère et aux croyants, le jour de la reddition des comptes».","en":"Our Lord, forgive me and my parents and the believers the Day the account is established.\"","ref":{"ar":"سورة إبراهيم · الآية 41","fr":"Ibrahim · 14:41","en":"Ibrahim · 14:41"}},{"type":"ayah","ar":"نَبِّئْ عِبَادِىٓ أَنِّىٓ أَنَا ٱلْغَفُورُ ٱلرَّحِيمُ","fr":"Informe Mes serviteurs que c'est Moi le Pardonneur, le Très Miséricordieux.","en":"[O Muhammad], inform My servants that it is I who am the Forgiving, the Merciful.","ref":{"ar":"سورة الحجر · الآية 49","fr":"Al-Hijr · 15:49","en":"Al-Hijr · 15:49"}},{"type":"ayah","ar":"فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُن مِّنَ ٱلسَّٰجِدِينَ","fr":"Glorifie donc Ton Seigneur par Sa louange et sois de ceux qui se prosternent;","en":"So exalt [Allah] with praise of your Lord and be of those who prostrate [to Him].","ref":{"ar":"سورة الحجر · الآية 98","fr":"Al-Hijr · 15:98","en":"Al-Hijr · 15:98"}},{"type":"ayah","ar":"وَإِن تَعُدُّوا۟ نِعْمَةَ ٱللَّهِ لَا تُحْصُوهَآ إِنَّ ٱللَّهَ لَغَفُورٌۭ رَّحِيمٌۭ","fr":"Et si vous comptez les bienfaits d'Allah, vous ne saurez pas les dénombrer. Car Allah est Pardonneur, et Miséricordieux.","en":"And if you should count the favors of Allah, you could not enumerate them. Indeed, Allah is Forgiving and Merciful.","ref":{"ar":"سورة النحل · الآية 18","fr":"An-Nahl · 16:18","en":"An-Nahl · 16:18"}},{"type":"ayah","ar":"إِنَّ ٱللَّهَ يَأْمُرُ بِٱلْعَدْلِ وَٱلْإِحْسَٰنِ وَإِيتَآئِ ذِى ٱلْقُرْبَىٰ وَيَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ وَٱلْبَغْىِ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ","fr":"Certes, Allah commande l'équité, la bienfaisance et l'assistance aux proches. Et Il interdit la turpitude, l'acte répréhensible et la rébellion. Il vous exhorte afin que vous vous souveniez.","en":"Indeed, Allah orders justice and good conduct and giving to relatives and forbids immorality and bad conduct and oppression. He admonishes you that perhaps you will be reminded.","ref":{"ar":"سورة النحل · الآية 90","fr":"An-Nahl · 16:90","en":"An-Nahl · 16:90"}},{"type":"ayah","ar":"مَنْ عَمِلَ صَٰلِحًۭا مِّن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌۭ فَلَنُحْيِيَنَّهُۥ حَيَوٰةًۭ طَيِّبَةًۭ وَلَنَجْزِيَنَّهُمْ أَجْرَهُم بِأَحْسَنِ مَا كَانُوا۟ يَعْمَلُونَ","fr":"Quiconque, mâle ou femelle, fait une bonne œuvre tout en étant croyant, Nous lui ferons vivre une bonne vie. Et Nous les récompenserons, certes, en fonction des meilleures de leurs actions.","en":"Whoever does righteousness, whether male or female, while he is a believer - We will surely cause him to live a good life, and We will surely give them their reward [in the Hereafter] according to the best of what they used to do.","ref":{"ar":"سورة النحل · الآية 97","fr":"An-Nahl · 16:97","en":"An-Nahl · 16:97"}},{"type":"ayah","ar":"وَٱخْفِضْ لَهُمَا جَنَاحَ ٱلذُّلِّ مِنَ ٱلرَّحْمَةِ وَقُل رَّبِّ ٱرْحَمْهُمَا كَمَا رَبَّيَانِى صَغِيرًۭا","fr":"et par miséricorde, abaisse pour eux l'aile de l'humilité, et dis: «O mon Seigneur, fais-leur, à tous deux, miséricorde comme ils m'ont élevé tout petit».","en":"And lower to them the wing of humility out of mercy and say, \"My Lord, have mercy upon them as they brought me up [when I was] small.\"","ref":{"ar":"سورة الإسراء · الآية 24","fr":"Al-Israa · 17:24","en":"Al-Israa · 17:24"}},{"type":"ayah","ar":"وَنُنَزِّلُ مِنَ ٱلْقُرْءَانِ مَا هُوَ شِفَآءٌۭ وَرَحْمَةٌۭ لِّلْمُؤْمِنِينَ وَلَا يَزِيدُ ٱلظَّٰلِمِينَ إِلَّا خَسَارًۭا","fr":"Nous faisons descendre du Coran, ce qui est une guérison et une miséricorde pour les croyants. Cependant, cela ne fait qu'accroître la perdition des injustes.","en":"And We send down of the Qur'an that which is healing and mercy for the believers, but it does not increase the wrongdoers except in loss.","ref":{"ar":"سورة الإسراء · الآية 82","fr":"Al-Israa · 17:82","en":"Al-Israa · 17:82"}},{"type":"ayah","ar":"إِذْ أَوَى ٱلْفِتْيَةُ إِلَى ٱلْكَهْفِ فَقَالُوا۟ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةًۭ وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًۭا","fr":"Quand les jeunes gens se furent réfugiés dans la caverne, ils dirent: «O notre Seigneur, donne-nous de Ta part une miséricorde; et assure nous la droiture dans tout ce qui nous concerne».","en":"[Mention] when the youths retreated to the cave and said, \"Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.\"","ref":{"ar":"سورة الكهف · الآية 10","fr":"Al-Kahf · 18:10","en":"Al-Kahf · 18:10"}},{"type":"ayah","ar":"قَالَ لَا تَخَافَآ إِنَّنِى مَعَكُمَآ أَسْمَعُ وَأَرَىٰ","fr":"Il dit: «Ne craignez rien. Je suis avec vous: J'entends et Je vois.","en":"[Allah] said, \"Fear not. Indeed, I am with you both; I hear and I see.","ref":{"ar":"سورة طه · الآية 46","fr":"Taa-Haa · 20:46","en":"Taa-Haa · 20:46"}},{"type":"ayah","ar":"فَتَعَٰلَى ٱللَّهُ ٱلْمَلِكُ ٱلْحَقُّ وَلَا تَعْجَلْ بِٱلْقُرْءَانِ مِن قَبْلِ أَن يُقْضَىٰٓ إِلَيْكَ وَحْيُهُۥ وَقُل رَّبِّ زِدْنِى عِلْمًۭا","fr":"Que soit éxalté Allah, le Vrai Souverain! Ne te hâte pas [de réciter] le Coran avant que ne te soit achevée sa révélation. Et dis: «O mon Seigneur, accroît mes connaissances!»","en":"So high [above all] is Allah, the Sovereign, the Truth. And, [O Muhammad], do not hasten with [recitation of] the Qur'an before its revelation is completed to you, and say, \"My Lord, increase me in knowledge.\"","ref":{"ar":"سورة طه · الآية 114","fr":"Taa-Haa · 20:114","en":"Taa-Haa · 20:114"}},{"type":"ayah","ar":"وَأْمُرْ أَهْلَكَ بِٱلصَّلَوٰةِ وَٱصْطَبِرْ عَلَيْهَا لَا نَسْـَٔلُكَ رِزْقًۭا نَّحْنُ نَرْزُقُكَ وَٱلْعَٰقِبَةُ لِلتَّقْوَىٰ","fr":"Et commande à ta famille la Salât, et fais-la avec persévérance. Nous ne te demandons point de nourriture: c'est à Nous de te nourrir. La bonne fin est réservée à la piété.","en":"And enjoin prayer upon your family [and people] and be steadfast therein. We ask you not for provision; We provide for you, and the [best] outcome is for [those of] righteousness.","ref":{"ar":"سورة طه · الآية 132","fr":"Taa-Haa · 20:132","en":"Taa-Haa · 20:132"}},{"type":"ayah","ar":"وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُۥٓ أَنِّى مَسَّنِىَ ٱلضُّرُّ وَأَنتَ أَرْحَمُ ٱلرَّٰحِمِينَ","fr":"Et Job, quand il implora son Seigneur: «Le mal m'a touché. Mais Toi, tu es le plus miséricordieux des miséricordieux»!","en":"And [mention] Job, when he called to his Lord, \"Indeed, adversity has touched me, and you are the Most Merciful of the merciful.\"","ref":{"ar":"سورة الأنبياء · الآية 83","fr":"Al-Anbiyaa · 21:83","en":"Al-Anbiyaa · 21:83"}},{"type":"ayah","ar":"وَذَا ٱلنُّونِ إِذ ذَّهَبَ مُغَٰضِبًۭا فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ فَنَادَىٰ فِى ٱلظُّلُمَٰتِ أَن لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّٰلِمِينَ","fr":"Et Dû'n-Nûn (Jonas) quand il partit, irrité. Il pensa que Nous N'allions pas l'éprouver. Puis il fit, dans les ténèbres, l'appel que voici: «Pas de divinité à part Toi! Pureté à Toi! J'ai été vraiment du nombre des injustes».",
