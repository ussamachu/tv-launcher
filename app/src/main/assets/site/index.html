· 42:36"}},{"type":"ayah","ar":"وَجَزَٰٓؤُا۟ سَيِّئَةٍۢ سَيِّئَةٌۭ مِّثْلُهَا فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُۥ عَلَى ٱللَّهِ إِنَّهُۥ لَا يُحِبُّ ٱلظَّٰلِمِينَ","fr":"La sanction d'une mauvaise action est une mauvaise action [une peine] identique. Mais quiconque pardonne et réforme, son salaire incombe à Allah. Il n'aime point les injustes!","en":"And the retribution for an evil act is an evil one like it, but whoever pardons and makes reconciliation - his reward is [due] from Allah. Indeed, He does not like wrongdoers.","ref":{"ar":"سورة الشورى · الآية 40","fr":"Ash-Shura · 42:40","en":"Ash-Shura · 42:40"}},{"type":"ayah","ar":"ٱلْأَخِلَّآءُ يَوْمَئِذٍۭ بَعْضُهُمْ لِبَعْضٍ عَدُوٌّ إِلَّا ٱلْمُتَّقِينَ","fr":"Les amis, ce jour-là, seront ennemis les uns des autres; excepté les pieux.","en":"Close friends, that Day, will be enemies to each other, except for the righteous","ref":{"ar":"سورة الزخرف · الآية 67","fr":"Az-Zukhruf · 43:67","en":"Az-Zukhruf · 43:67"}},{"type":"ayah","ar":"مَنْ عَمِلَ صَٰلِحًۭا فَلِنَفْسِهِۦ وَمَنْ أَسَآءَ فَعَلَيْهَا ثُمَّ إِلَىٰ رَبِّكُمْ تُرْجَعُونَ","fr":"Quiconque fait le bien, le fait pour lui-même; et quiconque agit mal, agit contre lui-même. Puis vous serez ramenés vers votre Seigneur,","en":"Whoever does a good deed - it is for himself; and whoever does evil - it is against the self. Then to your Lord you will be returned.","ref":{"ar":"سورة الجاثية · الآية 15","fr":"Al-Jaathiya · 45:15","en":"Al-Jaathiya · 45:15"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ قَالُوا۟ رَبُّنَا ٱللَّهُ ثُمَّ ٱسْتَقَٰمُوا۟ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","fr":"Ceux qui disent: «Notre Seigneur est Allah» et qui ensuite se tiennent sur le droit chemin. Ils ne doivent avoir aucune crainte et ne seront point affligés.","en":"Indeed, those who have said, \"Our Lord is Allah,\" and then remained on a right course - there will be no fear concerning them, nor will they grieve.","ref":{"ar":"سورة الأحقاف · الآية 13","fr":"Al-Ahqaf · 46:13","en":"Al-Ahqaf · 46:13"}},{"type":"ayah","ar":"فَٱعْلَمْ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا ٱللَّهُ وَٱسْتَغْفِرْ لِذَنۢبِكَ وَلِلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ وَٱللَّهُ يَعْلَمُ مُتَقَلَّبَكُمْ وَمَثْوَىٰكُمْ","fr":"Sache donc qu'en vérité il n'y a point de divinité à part Allah et implore le pardon pour ton péché, ainsi que pour les croyants et les croyantes. Allah connaît vos activités (sur terre) et votre lieu de repos (dans l'au-delà).","en":"So know, [O Muhammad], that there is no deity except Allah and ask forgiveness for your sin and for the believing men and believing women. And Allah knows of your movement and your resting place.","ref":{"ar":"سورة محمد · الآية 19","fr":"Muhammad · 47:19","en":"Muhammad · 47:19"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقْنَٰكُم مِّن ذَكَرٍۢ وَأُنثَىٰ وَجَعَلْنَٰكُمْ شُعُوبًۭا وَقَبَآئِلَ لِتَعَارَفُوٓا۟ إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَىٰكُمْ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٌۭ","fr":"O hommes! Nous vous avons créés d'un mâle et d'une femelle, et Nous avons fait de vous des nations et des tribus, pour que vous vous entre-connaissiez. Le plus noble d'entre vous, auprès d'Allah, est le plus pieux. Allah est certes Omniscient et Grand Connaisseur.","en":"O mankind, indeed We have created you from male and female and made you peoples and tribes that you may know one another. Indeed, the most noble of you in the sight of Allah is the most righteous of you. Indeed, Allah is Knowing and Acquainted.","ref":{"ar":"سورة الحجرات · الآية 13","fr":"Al-Hujuraat · 49:13","en":"Al-Hujuraat · 49:13"}},{"type":"ayah","ar":"مَّا يَلْفِظُ مِن قَوْلٍ إِلَّا لَدَيْهِ رَقِيبٌ عَتِيدٌۭ","fr":"Il ne prononce pas une parole sans avoir auprès de lui un observateur prêt à l'inscrire.","en":"Man does not utter any word except that with him is an observer prepared [to record].","ref":{"ar":"سورة ق · الآية 18","fr":"Qaaf · 50:18","en":"Qaaf · 50:18"}},{"type":"ayah","ar":"وَأُزْلِفَتِ ٱلْجَنَّةُ لِلْمُتَّقِينَ غَيْرَ بَعِيدٍ","fr":"Le Paradis sera rapproché à proximité des pieux.","en":"And Paradise will be brought near to the righteous, not far,","ref":{"ar":"سورة ق · الآية 31","fr":"Qaaf · 50:31","en":"Qaaf · 50:31"}},{"type":"ayah","ar":"كَانُوا۟ قَلِيلًۭا مِّنَ ٱلَّيْلِ مَا يَهْجَعُونَ","fr":"ils dormaient peu, la nuit,","en":"They used to sleep but little of the night,","ref":{"ar":"سورة الذاريات · الآية 17","fr":"Adh-Dhaariyat · 51:17","en":"Adh-Dhaariyat · 51:17"}},{"type":"ayah","ar":"وَبِٱلْأَسْحَارِ هُمْ يَسْتَغْفِرُونَ","fr":"et aux dernières heures de la nuit ils imploraient le pardon [d'Allah];","en":"And in the hours before dawn they would ask forgiveness,","ref":{"ar":"سورة الذاريات · الآية 18","fr":"Adh-Dhaariyat · 51:18","en":"Adh-Dhaariyat · 51:18"}},{"type":"ayah","ar":"فَفِرُّوٓا۟ إِلَى ٱللَّهِ إِنِّى لَكُم مِّنْهُ نَذِيرٌۭ مُّبِينٌۭ","fr":"«Fuyez donc vers Allah. Moi, je suis pour vous de Sa part, un avertisseur explicite.","en":"So flee to Allah. Indeed, I am to you from Him a clear warner.","ref":{"ar":"سورة الذاريات · الآية 50","fr":"Adh-Dhaariyat · 51:50","en":"Adh-Dhaariyat · 51:50"}},{"type":"ayah","ar":"إِنَّ ٱللَّهَ هُوَ ٱلرَّزَّاقُ ذُو ٱلْقُوَّةِ ٱلْمَتِينُ","fr":"En vérité, c'est Allah qui est le Grand Pourvoyeur, Le Détenteur de la force, l'Inébranlable.","en":"Indeed, it is Allah who is the [continual] Provider, the firm possessor of strength.","ref":{"ar":"سورة الذاريات · الآية 58","fr":"Adh-Dhaariyat · 51:58","en":"Adh-Dhaariyat · 51:58"}},{"type":"ayah","ar":"كُلُّ مَنْ عَلَيْهَا فَانٍۢ","fr":"Tout ce qui est sur elle [la terre] doit disparaître,","en":"Everyone upon the earth will perish,","ref":{"ar":"سورة الرحمن · الآية 26","fr":"Ar-Rahmaan · 55:26","en":"Ar-Rahmaan · 55:26"}},{"type":"ayah","ar":"هُوَ ٱلْأَوَّلُ وَٱلْءَاخِرُ وَٱلظَّٰهِرُ وَٱلْبَاطِنُ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌ","fr":"C'est Lui le Premier et le Dernier, l'Apparent et le Caché et Il est Omniscient.","en":"He is the First and the Last, the Ascendant and the Intimate, and He is, of all things, Knowing.","ref":{"ar":"سورة الحديد · الآية 3","fr":"Al-Hadid · 57:3","en":"Al-Hadid · 57:3"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَلْتَنظُرْ نَفْسٌۭ مَّا قَدَّمَتْ لِغَدٍۢ وَٱتَّقُوا۟ ٱللَّهَ إِنَّ ٱللَّهَ خَبِيرٌۢ بِمَا تَعْمَلُونَ","fr":"O vous qui avez cru! Craignez Allah. Que chaque âme voit bien ce qu'elle a avancé pour demain. Et craignez Allah, car Allah est Parfaitement Connaisseur de ce que vous faites.","en":"O you who have believed, fear Allah. And let every soul look to what it has put forth for tomorrow - and fear Allah. Indeed, Allah is Acquainted with what you do.","ref":{"ar":"سورة الحشر · الآية 18","fr":"Al-Hashr · 59:18","en":"Al-Hashr · 59:18"}},{"type":"ayah","ar":"وَلَا تَكُونُوا۟ كَٱلَّذِينَ نَسُوا۟ ٱللَّهَ فَأَنسَىٰهُمْ أَنفُسَهُمْ أُو۟لَٰٓئِكَ هُمُ ٱلْفَٰسِقُونَ","fr":"Et ne soyez pas comme ceux qui ont oublié Allah; [Allah] leur a fait alors oublier leurs propres personnes; ceux-là sont les pervers.","en":"And be not like those who forgot Allah, so He made them forget themselves. Those are the defiantly disobedient.","ref":{"ar":"سورة الحشر · الآية 19","fr":"Al-Hashr · 59:19","en":"Al-Hashr · 59:19"}},{"type":"ayah","ar":"هُوَ ٱللَّهُ ٱلْخَٰلِقُ ٱلْبَارِئُ ٱلْمُصَوِّرُ لَهُ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ يُسَبِّحُ لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ","fr":"C'est Lui Allah, le Créateur, Celui qui donne un commencement à toute chose, le Formateur. A Lui les plus beaux noms. Tout ce qui est dans les cieux et la terre Le glorifie. Et c'est Lui le Puissant, le Sage.","en":"He is Allah, the Creator, the Inventor, the Fashioner; to Him belong the best names. Whatever is in the heavens and earth is exalting Him. And He is the Exalted in Might, the Wise.","ref":{"ar":"سورة الحشر · الآية 24","fr":"Al-Hashr · 59:24","en":"Al-Hashr · 59:24"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ","fr":"O vous qui avez cru! Pourquoi dites-vous ce que vous ne faites pas?","en":"O you who have believed, why do you say what you do not do?","ref":{"ar":"سورة الصف · الآية 2","fr":"As-Saff · 61:2","en":"As-Saff · 61:2"}},{"type":"ayah","ar":"كَبُرَ مَقْتًا عِندَ ٱللَّهِ أَن تَقُولُوا۟ مَا لَا تَفْعَلُونَ","fr":"C'est une grande abomination auprès d'Allah que de dire ce que vous ne faites pas.","en":"Great is hatred in the sight of Allah that you say what you do not do.","ref":{"ar":"سورة الصف · الآية 3","fr":"As-Saff · 61:3","en":"As-Saff · 61:3"}},{"type":"ayah","ar":"فَإِذَا قُضِيَتِ ٱلصَّلَوٰةُ فَٱنتَشِرُوا۟ فِى ٱلْأَرْضِ وَٱبْتَغُوا۟ مِن فَضْلِ ٱللَّهِ وَٱذْكُرُوا۟ ٱللَّهَ كَثِيرًۭا لَّعَلَّكُمْ تُفْلِحُونَ","fr":"Puis quand la Salât est achevée, dispersez-vous sur terre et recherchez [quelque effet] de la grâce d'Allah, et invoquez beaucoup Allah afin que vous réussissiez.","en":"And when the prayer has been concluded, disperse within the land and seek from the bounty of Allah, and remember Allah often that you may succeed.","ref":{"ar":"سورة الجمعة · الآية 10","fr":"Al-Jumu'a · 62:10","en":"Al-Jumu'a · 62:10"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُلْهِكُمْ أَمْوَٰلُكُمْ وَلَآ أَوْلَٰدُكُمْ عَن ذِكْرِ ٱللَّهِ وَمَن يَفْعَلْ ذَٰلِكَ فَأُو۟لَٰٓئِكَ هُمُ ٱلْخَٰسِرُونَ","fr":"O vous qui avez cru! Que ni vos biens ni vos enfants ne vous distraient du rappel d'Allah. Et quiconque fait cela... alors ceux-là seront les perdants.","en":"O you who have believed, let not your wealth and your children divert you from remembrance of Allah. And whoever does that - then those are the losers.","ref":{"ar":"سورة المنافقون · الآية 9","fr":"Al-Munaafiqoon · 63:9","en":"Al-Munaafiqoon · 63:9"}},{"type":"ayah","ar":"إِنَّمَآ أَمْوَٰلُكُمْ وَأَوْلَٰدُكُمْ فِتْنَةٌۭ وَٱللَّهُ عِندَهُۥٓ أَجْرٌ عَظِيمٌۭ","fr":"Vos biens et vos enfants ne sont qu'une tentation, alors qu'auprès d'Allah est une énorme récompense.","en":"Your wealth and your children are but a trial, and Allah has with Him a great reward.","ref":{"ar":"سورة التغابن · الآية 15","fr":"At-Taghaabun · 64:15","en":"At-Taghaabun · 64:15"}},{"type":"ayah","ar":"فَٱتَّقُوا۟ ٱللَّهَ مَا ٱسْتَطَعْتُمْ وَٱسْمَعُوا۟ وَأَطِيعُوا۟ وَأَنفِقُوا۟ خَيْرًۭا لِّأَنفُسِكُمْ وَمَن يُوقَ شُحَّ نَفْسِهِۦ فَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ","fr":"Craignez Allah, donc autant que vous pouvez, écoutez, obéissez et faites largesses. Ce sera un bien pour vous. Et quiconque a été protégé contre sa propre avidité... ceux-là sont ceux qui réussissent.","en":"So fear Allah as much as you are able and listen and obey and spend [in the way of Allah]; it is better for your selves. And whoever is protected from the stinginess of his soul - it is those who will be the successful.","ref":{"ar":"سورة التغابن · الآية 16","fr":"At-Taghaabun · 64:16","en":"At-Taghaabun · 64:16"}},{"type":"ayah","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ تَبَٰرَكَ ٱلَّذِى بِيَدِهِ ٱلْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ","fr":"Béni soit celui dans la main de qui est la royauté, et Il est Omnipotent.","en":"Blessed is He in whose hand is dominion, and He is over all things competent -","ref":{"ar":"سورة الملك · الآية 1","fr":"Al-Mulk · 67:1","en":"Al-Mulk · 67:1"}},{"type":"ayah","ar":"وَأَسِرُّوا۟ قَوْلَكُمْ أَوِ ٱجْهَرُوا۟ بِهِۦٓ إِنَّهُۥ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ","fr":"Que vous cachiez votre parole ou la divulguiez Il connaît bien le contenu des poitrines.","en":"And conceal your speech or publicize it; indeed, He is Knowing of that within the breasts.","ref":{"ar":"سورة الملك · الآية 13","fr":"Al-Mulk · 67:13","en":"Al-Mulk · 67:13"}},{"type":"ayah","ar":"أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ ٱللَّطِيفُ ٱلْخَبِيرُ","fr":"Ne connaît-Il pas ce qu'Il a créé alors que c'est Lui le Compatissant, le Parfaitement Connaisseur.","en":"Does He who created not know, while He is the Subtle, the Acquainted?","ref":{"ar":"سورة الملك · الآية 14","fr":"Al-Mulk · 67:14","en":"Al-Mulk · 67:14"}},{"type":"ayah","ar":"هُوَ ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ ذَلُولًۭا فَٱمْشُوا۟ فِى مَنَاكِبِهَا وَكُلُوا۟ مِن رِّزْقِهِۦ وَإِلَيْهِ ٱلنُّشُورُ","fr":"C'est Lui qui vous a soumis la terre: parcourez donc ses grandes étendues. Mangez de ce qu'Il vous fournit. Vers Lui est la Résurrection.","en":"It is He who made the earth tame for you - so walk among its slopes and eat of His provision - and to Him is the resurrection.","ref":{"ar":"سورة الملك · الآية 15","fr":"Al-Mulk · 67:15","en":"Al-Mulk · 67:15"}},{"type":"ayah","ar":"وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍۢ","fr":"Et tu es certes, d'une moralité éminente.","en":"And indeed, you are of a great moral character.","ref":{"ar":"سورة القلم · الآية 4","fr":"Al-Qalam · 68:4","en":"Al-Qalam · 68:4"}},{"type":"ayah","ar":"رَّبُّ ٱلْمَشْرِقِ وَٱلْمَغْرِبِ لَآ إِلَٰهَ إِلَّا هُوَ فَٱتَّخِذْهُ وَكِيلًۭا","fr":"le Seigneur du Levant et du Couchant. Il n'y a point de divinité à part Lui. Prends-Le donc comme Protecteur.","en":"[He is] the Lord of the East and the West; there is no deity except Him, so take Him as Disposer of [your] affairs.","ref":{"ar":"سورة المزمل · الآية 9","fr":"Al-Muzzammil · 73:9","en":"Al-Muzzammil · 73:9"}},{"type":"ayah","ar":"وَيُطْعِمُونَ ٱلطَّعَامَ عَلَىٰ حُبِّهِۦ مِسْكِينًۭا وَيَتِيمًۭا وَأَسِيرًا","fr":"et offrent la nourriture, malgré son amour, au pauvre, à l'orphelin et au prisonnier,","en":"And they give food in spite of love for it to the needy, the orphan, and the captive,","ref":{"ar":"سورة الإنسان · الآية 8","fr":"Al-Insaan · 76:8","en":"Al-Insaan · 76:8"}},{"type":"ayah","ar":"وَجَعَلْنَا نَوْمَكُمْ سُبَاتًۭا","fr":"et désigné votre sommeil pour votre repos,","en":"And made your sleep [a means for] rest","ref":{"ar":"سورة النبإ · الآية 9","fr":"An-Naba · 78:9","en":"An-Naba · 78:9"}},{"type":"ayah","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى","fr":"Glorifie le nom de ton Seigneur, le Très Haut,","en":"Exalt the name of your Lord, the Most High,","ref":{"ar":"سورة الأعلى · الآية 1","fr":"Al-A'laa · 87:1","en":"Al-A'laa · 87:1"}},{"type":"ayah","ar":"بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا","fr":"Mais, vous préférez plutôt la vie présente,","en":"But you prefer the worldly life,","ref":{"ar":"سورة الأعلى · الآية 16","fr":"Al-A'laa · 87:16","en":"Al-A'laa · 87:16"}},{"type":"ayah","ar":"أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ","fr":"Ne considèrent-ils donc pas les chameaux, comment ils ont été créés,","en":"Then do they not look at the camels - how they are created?","ref":{"ar":"سورة الغاشية · الآية 17","fr":"Al-Ghaashiya · 88:17","en":"Al-Ghaashiya · 88:17"}},{"type":"ayah","ar":"قَدْ أَفْلَحَ مَن زَكَّىٰهَا","fr":"A réussi, certes, celui qui la purifie.","en":"He has succeeded who purifies it,","ref":{"ar":"سورة الشمس · الآية 9","fr":"Ash-Shams · 91:9","en":"Ash-Shams · 91:9"}},{"type":"ayah","ar":"وَقَدْ خَابَ مَن دَسَّىٰهَا","fr":"Et est perdu, certes, celui qui la corrompt.","en":"And he has failed who instills it [with corruption].","ref":{"ar":"سورة الشمس · الآية 10","fr":"Ash-Shams · 91:10","en":"Ash-Shams · 91:10"}},{"type":"ayah","ar":"وَلَلْءَاخِرَةُ خَيْرٌۭ لَّكَ مِنَ ٱلْأُولَىٰ","fr":"La vie dernière t'est, certes, meilleure que la vie présente.","en":"And the Hereafter is better for you than the first [life].","ref":{"ar":"سورة الضحى · الآية 4","fr":"Ad-Dhuhaa · 93:4","en":"Ad-Dhuhaa · 93:4"}},{"type":"ayah","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","fr":"N'avons-Nous pas ouvert pour toi ta poitrine?","en":"Did We not expand for you, [O Muhammad], your breast?","ref":{"ar":"سورة الشرح · الآية 1","fr":"Ash-Sharh · 94:1","en":"Ash-Sharh · 94:1"}},{"type":"ayah","ar":"فَإِذَا فَرَغْتَ فَٱنصَبْ","fr":"Quand tu te libères, donc, lève-toi,","en":"So when you have finished [your duties], then stand up [for worship].","ref":{"ar":"سورة الشرح · الآية 7","fr":"Ash-Sharh · 94:7","en":"Ash-Sharh · 94:7"}},{"type":"ayah","ar":"لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍۢ","fr":"Nous avons certes créé l'homme dans la forme la plus parfaite.","en":"We have certainly created man in the best of stature;","ref":{"ar":"سورة التين · الآية 4","fr":"At-Tin · 95:4","en":"At-Tin · 95:4"}},{"type":"ayah","ar":"ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ","fr":"Lis! Ton Seigneur est le Très Noble,","en":"Recite, and your Lord is the most Generous -","ref":{"ar":"سورة العلق · الآية 3","fr":"Al-Alaq · 96:3","en":"Al-Alaq · 96:3"}},{"type":"ayah","ar":"لَيْلَةُ ٱلْقَدْرِ خَيْرٌۭ مِّنْ أَلْفِ شَهْرٍۢ","fr":"La nuit d'Al-Qadr est meilleure que mille mois.","en":"The Night of Decree is better than a thousand months.","ref":{"ar":"سورة القدر · الآية 3","fr":"Al-Qadr · 97:3","en":"Al-Qadr · 97:3"}},{"type":"ayah","ar":"وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍۢ شَرًّۭا يَرَهُۥ","fr":"et quiconque fait un mal fût-ce du poids d'un atome, le verra.","en":"And whoever does an atom's weight of evil will see it.","ref":{"ar":"سورة الزلزلة · الآية 8","fr":"Az-Zalzala · 99:8","en":"Az-Zalzala · 99:8"}},{"type":"ayah","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَلْهَىٰكُمُ ٱلتَّكَاثُرُ","fr":"La course aux richesses vous distrait,","en":"Competition in [worldly] increase diverts you","ref":{"ar":"سورة التكاثر · الآية 1","fr":"At-Takaathur · 102:1","en":"At-Takaathur · 102:1"}},{"type":"ayah","ar":"ثُمَّ لَتُسْـَٔلُنَّ يَوْمَئِذٍ عَنِ ٱلنَّعِيمِ","fr":"Puis, assurément, vous serez interrogés, ce jour-là, sur les délices.","en":"Then you will surely be asked that Day about pleasure.","ref":{"ar":"سورة التكاثر · الآية 8","fr":"At-Takaathur · 102:8","en":"At-Takaathur · 102:8"}},{"type":"ayah","ar":"إِنَّ ٱلْإِنسَٰنَ لَفِى خُسْرٍ","fr":"L'homme est certes, en perdition,","en":"Indeed, mankind is in loss,","ref":{"ar":"سورة العصر · الآية 2","fr":"Al-Asr · 103:2","en":"Al-Asr · 103:2"}},{"type":"ayah","ar":"فَلْيَعْبُدُوا۟ رَبَّ هَٰذَا ٱلْبَيْتِ","fr":"Qu'ils adorent donc le Seigneur de cette Maison [la Ka'ba],","en":"Let them worship the Lord of this House,","ref":{"ar":"سورة قريش · الآية 3","fr":"Quraish · 106:3","en":"Quraish · 106:3"}},{"type":"ayah","ar":"ٱللَّهُ ٱلصَّمَدُ","fr":"Allah, Le Seul à être imploré pour ce que nous désirons.","en":"Allah, the Eternal Refuge.","ref":{"ar":"سورة الإخلاص · الآية 2","fr":"Al-Ikhlaas · 112:2","en":"Al-Ikhlaas · 112:2"}},{"type":"ayah","ar":"لَمْ يَلِدْ وَلَمْ يُولَدْ","fr":"Il n'a jamais engendré, n'a pas été engendré non plus.","en":"He neither begets nor is born,","ref":{"ar":"سورة الإخلاص · الآية 3","fr":"Al-Ikhlaas · 112:3","en":"Al-Ikhlaas · 112:3"}},{"type":"ayah","ar":"وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ","fr":"Et nul n'est égal à Lui».","en":"Nor is there to Him any equivalent.\"","ref":{"ar":"سورة الإخلاص · الآية 4","fr":"Al-Ikhlaas · 112:4","en":"Al-Ikhlaas · 112:4"}},{"type":"ayah","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ","fr":"Dis: «Je cherche protection auprès du Seigneur de l'aube naissante,","en":"Say, \"I seek refuge in the Lord of daybreak","ref":{"ar":"سورة الفلق · الآية 1","fr":"Al-Falaq · 113:1","en":"Al-Falaq · 113:1"}},{"type":"ayah","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ","fr":"Dis: «Je cherche protection auprès du Seigneur des hommes.","en":"Say, \"I seek refuge in the Lord of mankind,","ref":{"ar":"سورة الناس · الآية 1","fr":"An-Naas · 114:1","en":"An-Naas · 114:1"}},{"type":"ayah","ar":"رَبَّنَا وَٱجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَآ أُمَّةًۭ مُّسْلِمَةًۭ لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَآ إِنَّكَ أَنتَ ٱلتَّوَّابُ ٱلرَّحِيمُ","fr":"Notre Seigneur! Fais de nous Tes Soumis, et de notre descendance une communauté soumise à Toi. Et montre nous nos rites et accepte de nous le repentir. Car c'est Toi certes l'Accueillant au repentir, le Miséricordieux.","en":"Our Lord, and make us Muslims [in submission] to You and from our descendants a Muslim nation [in submission] to You. And show us our rites and accept our repentance. Indeed, You are the Accepting of repentance, the Merciful.","ref":{"ar":"سورة البقرة · الآية 128","fr":"Al-Baqara · 2:128","en":"Al-Baqara · 2:128"}},{"type":"ayah","ar":"وَأَنفِقُوا۟ فِى سَبِيلِ ٱللَّهِ وَلَا تُلْقُوا۟ بِأَيْدِيكُمْ إِلَى ٱلتَّهْلُكَةِ وَأَحْسِنُوٓا۟ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُحْسِنِينَ","fr":"Et dépensez dans le sentier d'Allah. Et ne vous jetez pas par vos propres mains dans la destruction. Et faites le bien. Car Allah aime les bienfaisants.","en":"And spend in the way of Allah and do not throw [yourselves] with your [own] hands into destruction [by refraining]. And do good; indeed, Allah loves the doers of good.","ref":{"ar":"سورة البقرة · الآية 195","fr":"Al-Baqara · 2:195","en":"Al-Baqara · 2:195"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱدْخُلُوا۟ فِى ٱلسِّلْمِ كَآفَّةًۭ وَلَا تَتَّبِعُوا۟ خُطُوَٰتِ ٱلشَّيْطَٰنِ إِنَّهُۥ لَكُمْ عَدُوٌّۭ مُّبِينٌۭ","fr":"O les croyants! Entrez en plein dans l'Islam, et ne suivez point les pas du diable, car il est certes pour vous un ennemi déclaré.","en":"O you who have believed, enter into Islam completely [and perfectly] and do not follow the footsteps of Satan. Indeed, he is to you a clear enemy.","ref":{"ar":"سورة البقرة · الآية 208","fr":"Al-Baqara · 2:208","en":"Al-Baqara · 2:208"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَاجَرُوا۟ وَجَٰهَدُوا۟ فِى سَبِيلِ ٱللَّهِ أُو۟لَٰٓئِكَ يَرْجُونَ رَحْمَتَ ٱللَّهِ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ","fr":"Certes, ceux qui ont cru, émigré et lutté dans le sentier d'Allah, ceux-là espèrent la miséricorde d'Allah. Et Allah est Pardonneur et Miséricordieux.","en":"Indeed, those who have believed and those who have emigrated and fought in the cause of Allah - those expect the mercy of Allah. And Allah is Forgiving and Merciful.","ref":{"ar":"سورة البقرة · الآية 218","fr":"Al-Baqara · 2:218","en":"Al-Baqara · 2:218"}},{"type":"ayah","ar":"مَّثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ كَمَثَلِ حَبَّةٍ أَنۢبَتَتْ سَبْعَ سَنَابِلَ فِى كُلِّ سُنۢبُلَةٍۢ مِّا۟ئَةُ حَبَّةٍۢ وَٱللَّهُ يُضَٰعِفُ لِمَن يَشَآءُ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ","fr":"Ceux qui dépensent leurs biens dans le sentier d'Allah ressemblent à un grain d'où naissent sept épis, à cent grains l'épi. Car Allah multiplie la récompense à qui Il veut et la grâce d'Allah est immense, et Il est Omniscient.","en":"The example of those who spend their wealth in the way of Allah is like a seed [of grain] which grows seven spikes; in each spike is a hundred grains. And Allah multiplies [His reward] for whom He wills. And Allah is all-Encompassing and Knowing.","ref":{"ar":"سورة البقرة · الآية 261","fr":"Al-Baqara · 2:261","en":"Al-Baqara · 2:261"}},{"type":"ayah","ar":"ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ ثُمَّ لَا يُتْبِعُونَ مَآ أَنفَقُوا۟ مَنًّۭا وَلَآ أَذًۭى لَّهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","fr":"Ceux qui dépensent leurs biens dans le sentier d'Allah sans faire suivre leurs largesses ni d'un rappel ni d'un tort, auront leur récompense auprès de leur Seigneur. Nulle crainte pour eux, et ils ne seront point affligés.","en":"Those who spend their wealth in the way of Allah and then do not follow up what they have spent with reminders [of it] or [other] injury will have their reward with their Lord, and there will be no fear concerning them, nor will they grieve.","ref":{"ar":"سورة البقرة · الآية 262","fr":"Al-Baqara · 2:262","en":"Al-Baqara · 2:262"}},{"type":"ayah","ar":"ٱلشَّيْطَٰنُ يَعِدُكُمُ ٱلْفَقْرَ وَيَأْمُرُكُم بِٱلْفَحْشَآءِ وَٱللَّهُ يَعِدُكُم مَّغْفِرَةًۭ مِّنْهُ وَفَضْلًۭا وَٱللَّهُ وَٰسِعٌ عَلِيمٌۭ","fr":"Le Diable vous fait craindre l'indigence et vous commande des actions honteuses; tandis qu'Allah vous promet pardon et faveur venant de Lui. La grâce d'Allah est immense et Il est Omniscient.","en":"Satan threatens you with poverty and orders you to immorality, while Allah promises you forgiveness from Him and bounty. And Allah is all-Encompassing and Knowing.","ref":{"ar":"سورة البقرة · الآية 268","fr":"Al-Baqara · 2:268","en":"Al-Baqara · 2:268"}},{"type":"ayah","ar":"إِن تُبْدُوا۟ ٱلصَّدَقَٰتِ فَنِعِمَّا هِىَ وَإِن تُخْفُوهَا وَتُؤْتُوهَا ٱلْفُقَرَآءَ فَهُوَ خَيْرٌۭ لَّكُمْ وَيُكَفِّرُ عَنكُم مِّن سَيِّـَٔاتِكُمْ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ","fr":"Si vous donnez ouvertement vos aumônes, c'est bien; c'est mieux encore, pour vous, si vous êtes discrets avec elles et vous les donniez aux indigents. Allah effacera une partie de vos méfaits. Allah est Parfaitement Connaisseur de ce que vous faites.","en":"If you disclose your charitable expenditures, they are good; but if you conceal them and give them to the poor, it is better for you, and He will remove from you some of your misdeeds [thereby]. And Allah, with what you do, is [fully] Acquainted.","ref":{"ar":"سورة البقرة · الآية 271","fr":"Al-Baqara · 2:271","en":"Al-Baqara · 2:271"}},{"type":"ayah","ar":"يَمْحَقُ ٱللَّهُ ٱلرِّبَوٰا۟ وَيُرْبِى ٱلصَّدَقَٰتِ وَٱللَّهُ لَا يُحِبُّ كُلَّ كَفَّارٍ أَثِيمٍ","fr":"Allah anéantit l'intérêt usuraire et fait fructifier les aumônes. Et Allah n'aime pas le mécréant pécheur.","en":"Allah destroys interest and gives increase for charities. And Allah does not like every sinning disbeliever.","ref":{"ar":"سورة البقرة · الآية 276","fr":"Al-Baqara · 2:276","en":"Al-Baqara · 2:276"}},{"type":"ayah","ar":"وَٱتَّقُوا۟ يَوْمًۭا تُرْجَعُونَ فِيهِ إِلَى ٱللَّهِ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍۢ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ","fr":"Et craignez le jour où vous serez ramenés vers Allah. Alors chaque âme sera pleinement rétribuée de ce qu'elle aura acquis. Et ils ne seront point lésés.","en":"And fear a Day when you will be returned to Allah. Then every soul will be compensated for what it earned, and they will not be treated unjustly.","ref":{"ar":"سورة البقرة · الآية 281","fr":"Al-Baqara · 2:281","en":"Al-Baqara · 2:281"}},{"type":"ayah","ar":"لِّلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ وَإِن تُبْدُوا۟ مَا فِىٓ أَنفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُم بِهِ ٱللَّهُ فَيَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ","fr":"C'est à Allah qu'appartient tout ce qui est dans les cieux et sur la terre. Que vous manifestiez ce qui est en vous ou que vous le cachiez, Allah vous en demandera compte. Puis Il pardonnera à qui Il veut, et châtiera qui Il veut. Et Allah est Omnipotent.","en":"To Allah belongs whatever is in the heavens and whatever is in the earth. Whether you show what is within yourselves or conceal it, Allah will bring you to account for it. Then He will forgive whom He wills and punish whom He wills, and Allah is over all things competent.","ref":{"ar":"سورة البقرة · الآية 284","fr":"Al-Baqara · 2:284","en":"Al-Baqara · 2:284"}},{"type":"ayah","ar":"شَهِدَ ٱللَّهُ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا هُوَ وَٱلْمَلَٰٓئِكَةُ وَأُو۟لُوا۟ ٱلْعِلْمِ قَآئِمًۢا بِٱلْقِسْطِ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ","fr":"Allah atteste, et aussi les Anges et les doués de science, qu'il n'y a point de divinité à part Lui, le Mainteneur de la justice. Point de divinité à part Lui, le Puissant, le Sage!","en":"Allah witnesses that there is no deity except Him, and [so do] the angels and those of knowledge - [that He is] maintaining [creation] in justice. There is no deity except Him, the Exalted in Might, the Wise.","ref":{"ar":"سورة آل عمران · الآية 18","fr":"Aal-i-Imraan · 3:18","en":"Aal-i-Imraan · 3:18"}},{"type":"ayah","ar":"قُلْ إِن تُخْفُوا۟ مَا فِى صُدُورِكُمْ أَوْ تُبْدُوهُ يَعْلَمْهُ ٱللَّهُ وَيَعْلَمُ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ","fr":"Dis: «Que vous cachiez ce qui est dans vos poitrines ou bien vous le divulguiez, Allah le sait. Il connaît tout ce qui est dans les cieux et sur la terre. Et Allah est Omnipotent.","en":"Say, \"Whether you conceal what is in your breasts or reveal it, Allah knows it. And He knows that which is in the heavens and that which is on the earth. And Allah is over all things competent.","ref":{"ar":"سورة آل عمران · الآية 29","fr":"Aal-i-Imraan · 3:29","en":"Aal-i-Imraan · 3:29"}},{"type":"ayah","ar":"بَلَىٰ مَنْ أَوْفَىٰ بِعَهْدِهِۦ وَٱتَّقَىٰ فَإِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَّقِينَ","fr":"Au contraire, quiconque remplit sa promesse et craint Allah... Allah aime les pieux.","en":"But yes, whoever fulfills his commitment and fears Allah - then indeed, Allah loves those who fear Him.","ref":{"ar":"سورة آل عمران · الآية 76","fr":"Aal-i-Imraan · 3:76","en":"Aal-i-Imraan · 3:76"}},{"type":"ayah","ar":"وَمَن يَبْتَغِ غَيْرَ ٱلْإِسْلَٰمِ دِينًۭا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِى ٱلْءَاخِرَةِ مِنَ ٱلْخَٰسِرِينَ","fr":"Et quiconque désire une religion autre que l'Islam, ne sera point agréé, et il sera, dans l'au-delà, parmi les perdants.","en":"And whoever desires other than Islam as religion - never will it be accepted from him, and he, in the Hereafter, will be among the losers.","ref":{"ar":"سورة آل عمران · الآية 85","fr":"Aal-i-Imraan · 3:85","en":"Aal-i-Imraan · 3:85"}},{"type":"ayah","ar":"وَأَطِيعُوا۟ ٱللَّهَ وَٱلرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ","fr":"Et obéissez à Allah et au Messager afin qu'il vous soit fait miséricorde!","en":"And obey Allah and the Messenger that you may obtain mercy.","ref":{"ar":"سورة آل عمران · الآية 132","fr":"Aal-i-Imraan · 3:132","en":"Aal-i-Imraan · 3:132"}},{"type":"ayah","ar":"أَمْ حَسِبْتُمْ أَن تَدْخُلُوا۟ ٱلْجَنَّةَ وَلَمَّا يَعْلَمِ ٱللَّهُ ٱلَّذِينَ جَٰهَدُوا۟ مِنكُمْ وَيَعْلَمَ ٱلصَّٰبِرِينَ","fr":"Comptez-vous entrer au Paradis sans qu'Allah ne distingue parmi vous ceux qui luttent et qui sont endurants?","en":"Or do you think that you will enter Paradise while Allah has not yet made evident those of you who fight in His cause and made evident those who are steadfast?","ref":{"ar":"سورة آل عمران · الآية 142","fr":"Aal-i-Imraan · 3:142","en":"Aal-i-Imraan · 3:142"}},{"type":"ayah","ar":"وَمَا كَانَ لِنَفْسٍ أَن تَمُوتَ إِلَّا بِإِذْنِ ٱللَّهِ كِتَٰبًۭا مُّؤَجَّلًۭا وَمَن يُرِدْ ثَوَابَ ٱلدُّنْيَا نُؤْتِهِۦ مِنْهَا وَمَن يُرِدْ ثَوَابَ ٱلْءَاخِرَةِ نُؤْتِهِۦ مِنْهَا وَسَنَجْزِى ٱلشَّٰكِرِينَ","fr":"Personne ne peut mourir que par la permission d'Allah, et au moment prédéterminé. Quiconque veut la récompense d'ici-bas, Nous lui en donnons. Quiconque veut la récompense de l'au-delà, Nous lui en donnons, et Nous récompenserons bientôt les reconnaissants.","en":"And it is not [possible] for one to die except by permission of Allah at a decree determined. And whoever desires the reward of this world - We will give him thereof; and whoever desires the reward of the Hereafter - We will give him thereof. And we will reward the grateful.","ref":{"ar":"سورة آل عمران · الآية 145","fr":"Aal-i-Imraan · 3:145","en":"Aal-i-Imraan · 3:145"}},{"type":"ayah","ar":"وَلِلَّهِ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ","fr":"A Allah appartient le royaume des cieux et de la terre. Et Allah est Omnipotent.","en":"And to Allah belongs the dominion of the heavens and the earth, and Allah is over all things competent.","ref":{"ar":"سورة آل عمران · الآية 189","fr":"Aal-i-Imraan · 3:189","en":"Aal-i-Imraan · 3:189"}},{"type":"ayah","ar":"رَّبَّنَآ إِنَّنَا سَمِعْنَا مُنَادِيًۭا يُنَادِى لِلْإِيمَٰنِ أَنْ ءَامِنُوا۟ بِرَبِّكُمْ فَـَٔامَنَّا رَبَّنَا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّـَٔاتِنَا وَتَوَفَّنَا مَعَ ٱلْأَبْرَارِ","fr":"Seigneur! Nous avons entendu l'appel de celui qui a appelé ainsi à la foi: «Croyez en votre Seigneur» et dès lors nous avons cru. Seigneur, pardonne-nous nos péchés, efface de nous nos méfaits, et place nous, à notre mort, avec les gens de bien.","en":"Our Lord, indeed we have heard a caller calling to faith, [saying], 'Believe in your Lord,' and we have believed. Our Lord, so forgive us our sins and remove from us our misdeeds and cause us to die with the righteous.","ref":{"ar":"سورة آل عمران · الآية 193","fr":"Aal-i-Imraan · 3:193","en":"Aal-i-Imraan · 3:193"}},{"type":"ayah","ar":"وَٱللَّهُ يُرِيدُ أَن يَتُوبَ عَلَيْكُمْ وَيُرِيدُ ٱلَّذِينَ يَتَّبِعُونَ ٱلشَّهَوَٰتِ أَن تَمِيلُوا۟ مَيْلًا عَظِيمًۭا","fr":"Et Allah veut accueillir votre repentir. Mais ceux qui suivent les passions veulent que vous vous incliniez grandement (vers l'erreur comme ils le font).","en":"Allah wants to accept your repentance, but those who follow [their] passions want you to digress [into] a great deviation.","ref":{"ar":"سورة النساء · الآية 27","fr":"An-Nisaa · 4:27","en":"An-Nisaa · 4:27"}},{"type":"ayah","ar":"إِنَّ ٱللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا۟ ٱلْأَمَٰنَٰتِ إِلَىٰٓ أَهْلِهَا وَإِذَا حَكَمْتُم بَيْنَ ٱلنَّاسِ أَن تَحْكُمُوا۟ بِٱلْعَدْلِ إِنَّ ٱللَّهَ نِعِمَّا يَعِظُكُم بِهِۦٓ إِنَّ ٱللَّهَ كَانَ سَمِيعًۢا بَصِيرًۭا","fr":"Certes, Allah vous commande de rendre les dépôts à leurs ayants-droit, et quand vous jugez entre des gens, de juger avec équité. Quelle bonne exhortation qu'Allah vous fait! Allah est, en vérité, Celui qui entend et qui voit tout.","en":"Indeed, Allah commands you to render trusts to whom they are due and when you judge between people to judge with justice. Excellent is that which Allah instructs you. Indeed, Allah is ever Hearing and Seeing.","ref":{"ar":"سورة النساء · الآية 58","fr":"An-Nisaa · 4:58","en":"An-Nisaa · 4:58"}},{"type":"ayah","ar":"وَمَن يُطِعِ ٱللَّهَ وَٱلرَّسُولَ فَأُو۟لَٰٓئِكَ مَعَ ٱلَّذِينَ أَنْعَمَ ٱللَّهُ عَلَيْهِم مِّنَ ٱلنَّبِيِّۦنَ وَٱلصِّدِّيقِينَ وَٱلشُّهَدَآءِ وَٱلصَّٰلِحِينَ وَحَسُنَ أُو۟لَٰٓئِكَ رَفِيقًۭا","fr":"Quiconque obéit à Allah et au Messager... ceux-là seront avec ceux qu'Allah a comblés de Ses bienfaits: les prophètes, les véridiques, les martyrs, et les vertueux. Et quels bons compagnons que ceux-là!","en":"And whoever obeys Allah and the Messenger - those will be with the ones upon whom Allah has bestowed favor of the prophets, the steadfast affirmers of truth, the martyrs and the righteous. And excellent are those as companions.","ref":{"ar":"سورة النساء · الآية 69","fr":"An-Nisaa · 4:69","en":"An-Nisaa · 4:69"}},{"type":"ayah","ar":"لَّا خَيْرَ فِى كَثِيرٍۢ مِّن نَّجْوَىٰهُمْ إِلَّا مَنْ أَمَرَ بِصَدَقَةٍ أَوْ مَعْرُوفٍ أَوْ إِصْلَٰحٍۭ بَيْنَ ٱلنَّاسِ وَمَن يَفْعَلْ ذَٰلِكَ ٱبْتِغَآءَ مَرْضَاتِ ٱللَّهِ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًۭا","fr":"Il n'y a rien de bon dans la plus grande partie de leurs conversations secrètes, sauf si l'un d'eux ordonne une charité, une bonne action, ou une conciliation entre les gens. Et quiconque le fait, cherchant l'agrément d'Allah, à celui-là Nous donnerons bientôt une récompense énorme.","en":"No good is there in much of their private conversation, except for those who enjoin charity or that which is right or conciliation between people. And whoever does that seeking means to the approval of Allah - then We are going to give him a great reward.","ref":{"ar":"سورة النساء · الآية 114","fr":"An-Nisaa · 4:114","en":"An-Nisaa · 4:114"}},{"type":"ayah","ar":"وَمَن يَعْمَلْ مِنَ ٱلصَّٰلِحَٰتِ مِن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌۭ فَأُو۟لَٰٓئِكَ يَدْخُلُونَ ٱلْجَنَّةَ وَلَا يُظْلَمُونَ نَقِيرًۭا","fr":"Et quiconque, homme ou femme, fait de bonnes œuvres, tout en étant croyant... les voilà ceux qui entreront au Paradis; et on ne leur fera aucune injustice, fût-ce d'un creux de noyau de datte.","en":"And whoever does righteous deeds, whether male or female, while being a believer - those will enter Paradise and will not be wronged, [even as much as] the speck on a date seed.","ref":{"ar":"سورة النساء · الآية 124","fr":"An-Nisaa · 4:124","en":"An-Nisaa · 4:124"}},{"type":"ayah","ar":"وَعَدَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُم مَّغْفِرَةٌۭ وَأَجْرٌ عَظِيمٌۭ","fr":"Allah a promis à ceux qui croient et font de bonnes œuvres qu'il y aura pour eux un pardon et une énorme récompense.","en":"Allah has promised those who believe and do righteous deeds [that] for them there is forgiveness and great reward.","ref":{"ar":"سورة المائدة · الآية 9","fr":"Al-Maaida · 5:9","en":"Al-Maaida · 5:9"}},{"type":"ayah","ar":"ٱلَّذِينَ ءَامَنُوا۟ وَلَمْ يَلْبِسُوٓا۟ إِيمَٰنَهُم بِظُلْمٍ أُو۟لَٰٓئِكَ لَهُمُ ٱلْأَمْنُ وَهُم مُّهْتَدُونَ","fr":"Ceux qui ont cru et n'ont point troublé la pureté de leur foi par quelqu'inéquité (association), ceux-là ont la sécurité; et ce sont eux les bien-guidés».","en":"They who believe and do not mix their belief with injustice - those will have security, and they are [rightly] guided.","ref":{"ar":"سورة الأنعام · الآية 82","fr":"Al-An'aam · 6:82","en":"Al-An'aam · 6:82"}},{"type":"ayah","ar":"ذَٰلِكُمُ ٱللَّهُ رَبُّكُمْ لَآ إِلَٰهَ إِلَّا هُوَ خَٰلِقُ كُلِّ شَىْءٍۢ فَٱعْبُدُوهُ وَهُوَ عَلَىٰ كُلِّ شَىْءٍۢ وَكِيلٌۭ","fr":"Voilà Allah, votre Seigneur! Il n'y a de divinité que Lui, Créateur de tout. Adorez-Le donc. C'est Lui qui a charge de tout.","en":"That is Allah, your Lord; there is no deity except Him, the Creator of all things, so worship Him. And He is Disposer of all things.","ref":{"ar":"سورة الأنعام · الآية 102","fr":"Al-An'aam · 6:102","en":"Al-An'aam · 6:102"}},{"type":"ayah","ar":"وَذَرُوا۟ ظَٰهِرَ ٱلْإِثْمِ وَبَاطِنَهُۥٓ إِنَّ ٱلَّذِينَ يَكْسِبُونَ ٱلْإِثْمَ سَيُجْزَوْنَ بِمَا كَانُوا۟ يَقْتَرِفُونَ","fr":"Evitez le péché apparent ou caché, (car) ceux qui acquièrent le péché seront rétribués selon ce qu'ils auront commis.","en":"And leave what is apparent of sin and what is concealed thereof. Indeed, those who earn [blame for] sin will be recompensed for that which they used to commit.","ref":{"ar":"سورة الأنعام · الآية 120","fr":"Al-An'aam · 6:120","en":"Al-An'aam · 6:120"}},{"type":"ayah","ar":"وَلَوْ أَنَّ أَهْلَ ٱلْقُرَىٰٓ ءَامَنُوا۟ وَٱتَّقَوْا۟ لَفَتَحْنَا عَلَيْهِم بَرَكَٰتٍۢ مِّنَ ٱلسَّمَآءِ وَٱلْأَرْضِ وَلَٰكِن كَذَّبُوا۟ فَأَخَذْنَٰهُم بِمَا كَانُوا۟ يَكْسِبُونَ","fr":"Si les habitants des cités avaient cru et avaient été pieux, Nous leur aurions certainement accordé des bénédictions du ciel et de la terre. Mais ils ont démenti et Nous les avons donc saisis, pour ce qu'ils avaient acquis.","en":"And if only the people of the cities had believed and feared Allah, We would have opened upon them blessings from the heaven and the earth; but they denied [the messengers], so We seized them for what they were earning.\"","ref":{"ar":"سورة الأعراف · الآية 96","fr":"Al-A'raaf · 7:96","en":"Al-A'raaf · 7:96"}},{"type":"ayah","ar":"قَالَ مُوسَىٰ لِقَوْمِهِ ٱسْتَعِينُوا۟ بِٱللَّهِ وَٱصْبِرُوٓا۟ إِنَّ ٱلْأَرْضَ لِلَّهِ يُورِثُهَا مَن يَشَآءُ مِنْ عِبَادِهِۦ وَٱلْعَٰقِبَةُ لِلْمُتَّقِينَ","fr":"Moïse dit à son peuple: «Demandez aide auprès d'Allah et soyez patients, car la terre appartient à Allah. Il en fait héritier qui Il veut parmi Ses serviteurs. Et la fin (heureuse) sera aux pieux».","en":"Said Moses to his people, \"Seek help through Allah and be patient. Indeed, the earth belongs to Allah. He causes to inherit it whom He wills of His servants. And the [best] outcome is for the righteous.\"","ref":{"ar":"سورة الأعراف · الآية 128","fr":"Al-A'raaf · 7:128","en":"Al-A'raaf · 7:128"}},{"type":"ayah","ar":"قَالَ رَبِّ ٱغْفِرْ لِى وَلِأَخِى وَأَدْخِلْنَا فِى رَحْمَتِكَ وَأَنتَ أَرْحَمُ ٱلرَّٰحِمِينَ","fr":"Et (Moïse) dit: «O mon Seigneur, pardonne à moi et à mon frère et fais-nous entrer en Ta miséricorde, car Tu es Le plus Miséricordieux des miséricordieux».","en":"[Moses] said, \"My Lord, forgive me and my brother and admit us into Your mercy, for You are the most merciful of the merciful.\"","ref":{"ar":"سورة الأعراف · الآية 151","fr":"Al-A'raaf · 7:151","en":"Al-A'raaf · 7:151"}},{"type":"ayah","ar":"وَٱذْكُر رَّبَّكَ فِى نَفْسِكَ تَضَرُّعًۭا وَخِيفَةًۭ وَدُونَ ٱلْجَهْرِ مِنَ ٱلْقَوْلِ بِٱلْغُدُوِّ وَٱلْءَاصَالِ وَلَا تَكُن مِّنَ ٱلْغَٰفِلِينَ","fr":"Et invoque ton Seigneur en toi-même, en humilité et crainte, à mi-voix, le matin et le soir, et ne sois pas du nombre des insouciants.","en":"And remember your Lord within yourself in humility and in fear without being apparent in speech - in the mornings and the evenings. And do not be among the heedless.","ref":{"ar":"سورة الأعراف · الآية 205","fr":"Al-A'raaf · 7:205","en":"Al-A'raaf · 7:205"}},{"type":"ayah","ar":"وَٱللَّهُ يَدْعُوٓا۟ إِلَىٰ دَارِ ٱلسَّلَٰمِ وَيَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ","fr":"Allah appelle à la demeure de la paix et guide qui Il veut vers un droit chemin.","en":"And Allah invites to the Home of Peace and guides whom He wills to a straight path","ref":{"ar":"سورة يونس · الآية 25","fr":"Yunus · 10:25","en":"Yunus · 10:25"}},{"type":"ayah","ar":"لِّلَّذِينَ أَحْسَنُوا۟ ٱلْحُسْنَىٰ وَزِيَادَةٌۭ وَلَا يَرْهَقُ وُجُوهَهُمْ قَتَرٌۭ وَلَا ذِلَّةٌ أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلْجَنَّةِ هُمْ فِيهَا خَٰلِدُونَ","fr":"A ceux qui agissent en bien est réservée la meilleure (récompense) et même davantage. Nulle fumée noircissante, nul avilissement ne couvriront leurs visages. Ceux-là sont les gens du Paradis, où ils demeureront éternellement.","en":"For them who have done good is the best [reward] and extra. No darkness will cover their faces, nor humiliation. Those are companions of Paradise; they will abide therein eternally","ref":{"ar":"سورة يونس · الآية 26","fr":"Yunus · 10:26","en":"Yunus · 10:26"}},{"type":"ayah","ar":"وَإِن يَمْسَسْكَ ٱللَّهُ بِضُرٍّۢ فَلَا كَاشِفَ لَهُۥٓ إِلَّا هُوَ وَإِن يُرِدْكَ بِخَيْرٍۢ فَلَا رَآدَّ لِفَضْلِهِۦ يُصِيبُ بِهِۦ مَن يَشَآءُ مِنْ عِبَادِهِۦ وَهُوَ ٱلْغَفُورُ ٱلرَّحِيمُ","fr":"Et si Allah fait qu'un mal te touche, nul ne peut l'écarter en dehors de Lui. Et s'Il te veut un bien, nul ne peut repousser Sa grâce. Il en gratifie qui Il veut parmi Ses serviteurs. Et c'est Lui le Pardonneur, le Miséricordieux.","en":"And if Allah should touch you with adversity, there is no remover of it except Him; and if He intends for you good, then there is no repeller of His bounty. He causes it to reach whom He wills of His servants. And He is the Forgiving, the Merciful","ref":{"ar":"سورة يونس · الآية 107","fr":"Yunus · 10:107","en":"Yunus · 10:107"}},{"type":"ayah","ar":"وَيَٰقَوْمِ ٱسْتَغْفِرُوا۟ رَبَّكُمْ ثُمَّ تُوبُوٓا۟ إِلَيْهِ يُرْسِلِ ٱلسَّمَآءَ عَلَيْكُم مِّدْرَارًۭا وَيَزِدْكُمْ قُوَّةً إِلَىٰ قُوَّتِكُمْ وَلَا تَتَوَلَّوْا۟ مُجْرِمِينَ","fr":"O mon peuple, implorez le pardon de votre Seigneur et repentez-vous à Lui pour qu'Il envoie sur vous du ciel des pluies abondantes et qu'Il ajoute force à votre force. Et ne vous détournez pas [de Lui] en devenant coupables».","en":"And O my people, ask forgiveness of your Lord and then repent to Him. He will send [rain from] the sky upon you in showers and increase you in strength [added] to your strength. And do not turn away, [being] criminals.\"","ref":{"ar":"سورة هود · الآية 52","fr":"Hud · 11:52","en":"Hud · 11:52"}},{"type":"ayah","ar":"إِنِّى تَوَكَّلْتُ عَلَى ٱللَّهِ رَبِّى وَرَبِّكُم مَّا مِن دَآبَّةٍ إِلَّا هُوَ ءَاخِذٌۢ بِنَاصِيَتِهَآ إِنَّ رَبِّى عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ","fr":"Je place ma confiance en Allah, mon Seigneur et le vôtre. Il n'y a pas d'être vivant qu'Il ne tienne par son toupet. Mon Seigneur, certes, est sur un droit chemin.","en":"Indeed, I have relied upon Allah, my Lord and your Lord. There is no creature but that He holds its forelock. Indeed, my Lord is on a path [that is] straight.\"","ref":{"ar":"سورة هود · الآية 56","fr":"Hud · 11:56","en":"Hud · 11:56"}},{"type":"ayah","ar":"وَلِلَّهِ غَيْبُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَإِلَيْهِ يُرْجَعُ ٱلْأَمْرُ كُلُّهُۥ فَٱعْبُدْهُ وَتَوَكَّلْ عَلَيْهِ وَمَا رَبُّكَ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ","fr":"A Allah appartient l'Inconnaissable des cieux et de la terre, et c'est à Lui que revient l'ordre tout entier. Adore-Le donc et place ta confiance en Lui. Ton Seigneur n'est pas inattentif à ce que vous faites.","en":"And to Allah belong the unseen [aspects] of the heavens and the earth and to Him will be returned the matter, all of it, so worship Him and rely upon Him. And your Lord is not unaware of that which you do.","ref":{"ar":"سورة هود · الآية 123","fr":"Hud · 11:123","en":"Hud · 11:123"}},{"type":"ayah","ar":"رَبِّ قَدْ ءَاتَيْتَنِى مِنَ ٱلْمُلْكِ وَعَلَّمْتَنِى مِن تَأْوِيلِ ٱلْأَحَادِيثِ فَاطِرَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ أَنتَ وَلِىِّۦ فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ تَوَفَّنِى مُسْلِمًۭا وَأَلْحِقْنِى بِٱلصَّٰلِحِينَ","fr":"O mon Seigneur, Tu m'as donné du pouvoir et m'as enseigné l'interprétation des rêves. [C'est Toi Le] Créateur des cieux et de la terre, Tu es mon patron, ici-bas et dans l'au-delà. Fais-moi mourir en parfaite soumission et fais moi rejoindre les vertueux.","en":"My Lord, You have given me [something] of sovereignty and taught me of the interpretation of dreams. Creator of the heavens and earth, You are my protector in this world and in the Hereafter. Cause me to die a Muslim and join me with the righteous.\"","ref":{"ar":"سورة يوسف · الآية 101","fr":"Yusuf · 12:101","en":"Yusuf · 12:101"}},{"type":"ayah","ar":"قُلْ هَٰذِهِۦ سَبِيلِىٓ أَدْعُوٓا۟ إِلَى ٱللَّهِ عَلَىٰ بَصِيرَةٍ أَنَا۠ وَمَنِ ٱتَّبَعَنِى وَسُبْحَٰنَ ٱللَّهِ وَمَآ أَنَا۠ مِنَ ٱلْمُشْرِكِينَ","fr":"Dis: «Voici ma voie, j'appelle les gens à [la religion] d'Allah, moi et ceux qui me suivent, nous basant sur une preuve évidente. Gloire à Allah! Et je ne suis point du nombre des associateurs.","en":"Say, \"This is my way; I invite to Allah with insight, I and those who follow me. And exalted is Allah; and I am not of those who associate others with Him.\"","ref":{"ar":"سورة يوسف · الآية 108","fr":"Yusuf · 12:108","en":"Yusuf · 12:108"}},{"type":"ayah","ar":"ٱللَّهُ يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ وَيَقْدِرُ وَفَرِحُوا۟ بِٱلْحَيَوٰةِ ٱلدُّنْيَا وَمَا ٱلْحَيَوٰةُ ٱلدُّنْيَا فِى ٱلْءَاخِرَةِ إِلَّا مَتَٰعٌۭ","fr":"Allah étend largement Ses dons ou [les] restreint à qui Il veut. Ils se réjouissent de la vie sur terre, mais la vie d'ici-bas ne paraîtra que comme une jouissance éphémère en comparaison de l'au-delà.","en":"Allah extends provision for whom He wills and restricts [it]. And they rejoice in the worldly life, while the worldly life is not, compared to the Hereafter, except [brief] enjoyment.","ref":{"ar":"سورة الرعد · الآية 26","fr":"Ar-Ra'd · 13:26","en":"Ar-Ra'd · 13:26"}},{"type":"ayah","ar":"يُثَبِّتُ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ بِٱلْقَوْلِ ٱلثَّابِتِ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَفِى ٱلْءَاخِرَةِ وَيُضِلُّ ٱللَّهُ ٱلظَّٰلِمِينَ وَيَفْعَلُ ٱللَّهُ مَا يَشَآءُ","fr":"Allah affermit les croyants par une parole ferme, dans la vie présente et dans l'au-delà. Tandis qu'Il égare les injustes. Et Allah fait ce qu'Il veut.","en":"Allah keeps firm those who believe, with the firm word, in worldly life and in the Hereafter. And Allah sends astray the wrongdoers. And Allah does what He wills.","ref":{"ar":"سورة إبراهيم · الآية 27","fr":"Ibrahim · 14:27","en":"Ibrahim · 14:27"}},{"type":"ayah","ar":"قُل لِّعِبَادِىَ ٱلَّذِينَ ءَامَنُوا۟ يُقِيمُوا۟ ٱلصَّلَوٰةَ وَيُنفِقُوا۟ مِمَّا رَزَقْنَٰهُمْ سِرًّۭا وَعَلَانِيَةًۭ مِّن قَبْلِ أَن يَأْتِىَ يَوْمٌۭ لَّا بَيْعٌۭ فِيهِ وَلَا خِلَٰلٌ","fr":"Dis à Mes serviteurs qui ont cru, qu'ils accomplissent la Salât et qu'ils dépensent [dans le bien] en secret et en public de ce que Nous leur avons attribué, avant que vienne le jour où il n'y a ni rachat ni amitié.","en":"[O Muhammad], tell My servants who have believed to establish prayer and spend from what We have provided them, secretly and publicly, before a Day comes in which there will be no exchange, nor any friendships.","ref":{"ar":"سورة إبراهيم · الآية 31","fr":"Ibrahim · 14:31","en":"Ibrahim · 14:31"}},{"type":"ayah","ar":"وَٱللَّهُ أَخْرَجَكُم مِّنۢ بُطُونِ أُمَّهَٰتِكُمْ لَا تَعْلَمُونَ شَيْـًۭٔا وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَٰرَ وَٱلْأَفْـِٔدَةَ لَعَلَّكُمْ تَشْكُرُونَ","fr":"Et Allah vous a fait sortir des ventres de vos mères, dénués de tout savoir, et vous a donné l'ouïe, les yeux et les cœurs (l'intelligence), afin que vous; soyez reconnaissants.","en":"And Allah has extracted you from the wombs of your mothers not knowing a thing, and He made for you hearing and vision and intellect that perhaps you would be grateful.","ref":{"ar":"سورة النحل · الآية 78","fr":"An-Nahl · 16:78","en":"An-Nahl · 16:78"}},{"type":"ayah","ar":"وَأَوْفُوا۟ بِعَهْدِ ٱللَّهِ إِذَا عَٰهَدتُّمْ وَلَا تَنقُضُوا۟ ٱلْأَيْمَٰنَ بَعْدَ تَوْكِيدِهَا وَقَدْ جَعَلْتُمُ ٱللَّهَ عَلَيْكُمْ كَفِيلًا إِنَّ ٱللَّهَ يَعْلَمُ مَا تَفْعَلُونَ","fr":"Soyez fidèles au pacte d'Allah après l'avoir contracté et ne violez pas vos serments après les avoir solennellement prêtés et avoir pris Allah comme garant [de votre bonne foi]. Vraiment Allah sait ce que vous faites!","en":"And fulfill the covenant of Allah when you have taken it, [O believers], and do not break oaths after their confirmation while you have made Allah, over you, a witness. Indeed, Allah knows what you do.","ref":{"ar":"سورة النحل · الآية 91","fr":"An-Nahl · 16:91","en":"An-Nahl · 16:91"}},{"type":"ayah","ar":"فَإِذَا قَرَأْتَ ٱلْقُرْءَانَ فَٱسْتَعِذْ بِٱللَّهِ مِنَ ٱلشَّيْطَٰنِ ٱلرَّجِيمِ","fr":"Lorsque tu lis le Coran, demande la protection d'Allah contre le Diable banni.","en":"So when you recite the Qur'an, [first] seek refuge in Allah from Satan, the expelled [from His mercy].","ref":{"ar":"سورة النحل · الآية 98","fr":"An-Nahl · 16:98","en":"An-Nahl · 16:98"}},{"type":"ayah","ar":"رَّبُّكُمْ أَعْلَمُ بِمَا فِى نُفُوسِكُمْ إِن تَكُونُوا۟ صَٰلِحِينَ فَإِنَّهُۥ كَانَ لِلْأَوَّٰبِينَ غَفُورًۭا","fr":"Votre Seigneur connaît mieux ce qu'il y a dans vos âmes. Si vous êtes bons, Il est certes Pardonneur pour ceux qui Lui reviennent se repentant.","en":"Your Lord is most knowing of what is within yourselves. If you should be righteous [in intention] - then indeed He is ever, to the often returning [to Him], Forgiving.","ref":{"ar":"سورة الإسراء · الآية 25","fr":"Al-Israa · 17:25","en":"Al-Israa · 17:25"}},{"type":"ayah","ar":"وَءَاتِ ذَا ٱلْقُرْبَىٰ حَقَّهُۥ وَٱلْمِسْكِينَ وَٱبْنَ ٱلسَّبِيلِ وَلَا تُبَذِّرْ تَبْذِيرًا","fr":"«Et donne au proche parent ce qui lui est dû ainsi qu'au pauvre et au voyageur (en détresse). Et ne gaspille pas indûment,","en":"And give the relative his right, and [also] the poor and the traveler, and do not spend wastefully.","ref":{"ar":"سورة الإسراء · الآية 26","fr":"Al-Israa · 17:26","en":"Al-Israa · 17:26"}},{"type":"ayah","ar":"وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ ٱلْبَسْطِ فَتَقْعُدَ مَلُومًۭا مَّحْسُورًا","fr":"Ne porte pas ta main enchaînée à ton cou [par avarice], et ne l'étend pas non plus trop largement, sinon tu te trouveras blâmé et chagriné.","en":"And do not make your hand [as] chained to your neck or extend it completely and [thereby] become blamed and insolvent.","ref":{"ar":"سورة الإسراء · الآية 29","fr":"Al-Israa · 17:29","en":"Al-Israa · 17:29"}},{"type":"ayah","ar":"وَلَا تَقْرَبُوا۟ مَالَ ٱلْيَتِيمِ إِلَّا بِٱلَّتِى هِىَ أَحْسَنُ حَتَّىٰ يَبْلُغَ أَشُدَّهُۥ وَأَوْفُوا۟ بِٱلْعَهْدِ إِنَّ ٱلْعَهْدَ كَانَ مَسْـُٔولًۭا","fr":"Et n'approchez les biens de l'orphelin que de la façon la meilleure, jusqu'à ce qu'il atteigne sa majorité. Et remplissez l'engagement, car on sera interrogé au sujet des engagements.","en":"And do not approach the property of an orphan, except in the way that is best, until he reaches maturity. And fulfill [every] commitment. Indeed, the commitment is ever [that about which one will be] questioned.","ref":{"ar":"سورة الإسراء · الآية 34","fr":"Al-Israa · 17:34","en":"Al-Israa · 17:34"}},{"type":"ayah","ar":"وَأَوْفُوا۟ ٱلْكَيْلَ إِذَا كِلْتُمْ وَزِنُوا۟ بِٱلْقِسْطَاسِ ٱلْمُسْتَقِيمِ ذَٰلِكَ خَيْرٌۭ وَأَحْسَنُ تَأْوِيلًۭا","fr":"Et donnez la pleine mesure quand vous mesurez, et pesez avec une balance exacte. C'est mieux [pour vous] et le résultat en sera meilleur.","en":"And give full measure when you measure, and weigh with an even balance. That is the best [way] and best in result.","ref":{"ar":"سورة الإسراء · الآية 35","fr":"Al-Israa · 17:35","en":"Al-Israa · 17:35"}},{"type":"ayah","ar":"تُسَبِّحُ لَهُ ٱلسَّمَٰوَٰتُ ٱلسَّبْعُ وَٱلْأَرْضُ وَمَن فِيهِنَّ وَإِن مِّن شَىْءٍ إِلَّا يُسَبِّحُ بِحَمْدِهِۦ وَلَٰكِن لَّا تَفْقَهُونَ تَسْبِيحَهُمْ إِنَّهُۥ كَانَ حَلِيمًا غَفُورًۭا","fr":"Les sept cieux et la terre et ceux qui s'y trouvent, célèbrent Sa gloire. Et il n'existe rien qui ne célèbre Sa gloire et Ses louanges. Mais vous ne comprenez pas leur façon de Le glorifier. Certes c'est Lui qui est Indulgent et Pardonneur.","en":"The seven heavens and the earth and whatever is in them exalt Him. And there is not a thing except that it exalts [Allah] by His praise, but you do not understand their [way of] exalting. Indeed, He is ever Forbearing and Forgiving.","ref":{"ar":"سورة الإسراء · الآية 44","fr":"Al-Israa · 17:44","en":"Al-Israa · 17:44"}},{"type":"ayah","ar":"وَمِنَ ٱلَّيْلِ فَتَهَجَّدْ بِهِۦ نَافِلَةًۭ لَّكَ عَسَىٰٓ أَن يَبْعَثَكَ رَبُّكَ مَقَامًۭا مَّحْمُودًۭا","fr":"Et de la nuit consacre une partie [avant l'aube] pour des Salât surérogatoires: afin que ton Seigneur te ressuscite en une position de gloire.","en":"And from [part of] the night, pray with it as additional [worship] for you; it is expected that your Lord will resurrect you to a praised station.","ref":{"ar":"سورة الإسراء · الآية 79","fr":"Al-Israa · 17:79","en":"Al-Israa · 17:79"}},{"type":"ayah","ar":"وَقُلِ ٱلْحَمْدُ لِلَّهِ ٱلَّذِى لَمْ يَتَّخِذْ وَلَدًۭا وَلَمْ يَكُن لَّهُۥ شَرِيكٌۭ فِى ٱلْمُلْكِ وَلَمْ يَكُن لَّهُۥ وَلِىٌّۭ مِّنَ ٱلذُّلِّ وَكَبِّرْهُ تَكْبِيرًۢا","fr":"Et dis: «Louange à Allah qui ne S'est jamais attribué d'enfant, qui n'a point d'associé en la royauté et qui n'a jamais eu de protecteur de l'humiliation». Et proclame hautement Sa grandeur.","en":"And say, \"Praise to Allah, who has not taken a son and has had no partner in [His] dominion and has no [need of a] protector out of weakness; and glorify Him with [great] glorification.\"","ref":{"ar":"سورة الإسراء · الآية 111","fr":"Al-Israa · 17:111","en":"Al-Israa · 17:111"}},{"type":"ayah","ar":"قُل لَّوْ كَانَ ٱلْبَحْرُ مِدَادًۭا لِّكَلِمَٰتِ رَبِّى لَنَفِدَ ٱلْبَحْرُ قَبْلَ أَن تَنفَدَ كَلِمَٰتُ رَبِّى وَلَوْ جِئْنَا بِمِثْلِهِۦ مَدَدًۭا","fr":"Dis: «Si la mer était une encre [pour écrire] les paroles de mon Seigneur, certes la mer s'épuiserait avant que ne soient épuisées les paroles de mon Seigneur, quand même Nous lui apporterions son équivalent comme renfort.»","en":"Say, \"If the sea were ink for [writing] the words of my Lord, the sea would be exhausted before the words of my Lord were exhausted, even if We brought the like of it as a supplement.\"","ref":{"ar":"سورة الكهف · الآية 109","fr":"Al-Kahf · 18:109","en":"Al-Kahf · 18:109"}},{"type":"ayah","ar":"قُلْ إِنَّمَآ أَنَا۠ بَشَرٌۭ مِّثْلُكُمْ يُوحَىٰٓ إِلَىَّ أَنَّمَآ إِلَٰهُكُمْ إِلَٰهٌۭ وَٰحِدٌۭ فَمَن كَانَ يَرْجُوا۟ لِقَآءَ رَبِّهِۦ فَلْيَعْمَلْ عَمَلًۭا صَٰلِحًۭا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِۦٓ أَحَدًۢا","fr":"Dis: «Je suis en fait un être humain comme vous. Il m'a été révélé que votre Dieu est un Dieu unique! Quiconque, donc, espère rencontrer son Seigneur, qu'il fasse de bonnes actions et qu'il n'associe dans son adoration aucun autre à son Seigneur».","en":"Say, \"I am only a man like you, to whom has been revealed that your god is one God. So whoever would hope for the meeting with his Lord - let him do righteous work and not associate in the worship of his Lord anyone.\"","ref":{"ar":"سورة الكهف · الآية 110","fr":"Al-Kahf · 18:110","en":"Al-Kahf · 18:110"}},{"type":"ayah","ar":"رَّبُّ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا فَٱعْبُدْهُ وَٱصْطَبِرْ لِعِبَٰدَتِهِۦ هَلْ تَعْلَمُ لَهُۥ سَمِيًّۭا","fr":"Il est le Seigneur des cieux et de la terre et de tout ce qui est entre eux. Adore-Le donc, et sois constant dans Son adoration. Lui connais-tu un homonyme?»","en":"Lord of the heavens and the earth and whatever is between them - so worship Him and have patience for His worship. Do you know of any similarity to Him?\"","ref":{"ar":"سورة مريم · الآية 65","fr":"Maryam · 19:65","en":"Maryam · 19:65"}},{"type":"ayah","ar":"وَيَزِيدُ ٱللَّهُ ٱلَّذِينَ ٱهْتَدَوْا۟ هُدًۭى وَٱلْبَٰقِيَٰتُ ٱلصَّٰلِحَٰتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًۭا وَخَيْرٌۭ مَّرَدًّا","fr":"Allah accroît la rectitude de ceux qui suivent le bon chemin, et les bonnes œuvres durables méritent auprès de ton Seigneur une meilleure récompense et une meilleure destination.","en":"And Allah increases those who were guided, in guidance, and the enduring good deeds are better to your Lord for reward and better for recourse.","ref":{"ar":"سورة مريم · الآية 76","fr":"Maryam · 19:76","en":"Maryam · 19:76"}},{"type":"ayah","ar":"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ لَهُ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ","fr":"Allah! Point de divinité que Lui! Il possède les noms les plus beaux.","en":"Allah - there is no deity except Him. To Him belong the best names.","ref":{"ar":"سورة طه · الآية 8","fr":"Taa-Haa · 20:8","en":"Taa-Haa · 20:8"}},{"type":"ayah","ar":"وَمَنْ أَعْرَضَ عَن ذِكْرِى فَإِنَّ لَهُۥ مَعِيشَةًۭ ضَنكًۭا وَنَحْشُرُهُۥ يَوْمَ ٱلْقِيَٰمَةِ أَعْمَىٰ","fr":"Et quiconque se détourne de Mon Rappel, mènera certes, une vie pleine de gêne, et le Jour de la Résurrection Nous l'amènerons aveugle au rassemblement».","en":"And whoever turns away from My remembrance - indeed, he will have a depressed life, and We will gather him on the Day of Resurrection blind.\"","ref":{"ar":"سورة طه · الآية 124","fr":"Taa-Haa · 20:124","en":"Taa-Haa · 20:124"}},{"type":"ayah","ar":"فَٱصْبِرْ عَلَىٰ مَا يَقُولُونَ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ ٱلشَّمْسِ وَقَبْلَ غُرُوبِهَا وَمِنْ ءَانَآئِ ٱلَّيْلِ فَسَبِّحْ وَأَطْرَافَ ٱلنَّهَارِ لَعَلَّكَ تَرْضَىٰ","fr":"Supporte patiemment ce qu'ils disent et célèbre Sa louange, avant le lever du soleil, avant son coucher et pendant la nuit; et exalte Sa Gloire aux extrémités du jour. Peut-être auras-tu satisfaction:","en":"So be patient over what they say and exalt [Allah] with praise of your Lord before the rising of the sun and before its setting; and during periods of the night [exalt Him] and at the ends of the day, that you may be satisfied.","ref":{"ar":"سورة طه · الآية 130","fr":"Taa-Haa · 20:130","en":"Taa-Haa · 20:130"}},{"type":"ayah","ar":"وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِۦٓ أَزْوَٰجًۭا مِّنْهُمْ زَهْرَةَ ٱلْحَيَوٰةِ ٱلدُّنْيَا لِنَفْتِنَهُمْ فِيهِ وَرِزْقُ رَبِّكَ خَيْرٌۭ وَأَبْقَىٰ","fr":"Et ne tends point les yeux vers ce dont Nous avons donné jouissance temporaire à certains groupes d'entre eux, comme décor de la vie présente, afin de les éprouver par cela. Ce qu'Allah fournit (au Paradis) est meilleur et plus durable.","en":"And do not extend your eyes toward that by which We have given enjoyment to [some] categories of them, [its being but] the splendor of worldly life by which We test them. And the provision of your Lord is better and more enduring.","ref":{"ar":"سورة طه · الآية 131","fr":"Taa-Haa · 20:131","en":"Taa-Haa · 20:131"}},{"type":"ayah","ar":"وَنَضَعُ ٱلْمَوَٰزِينَ ٱلْقِسْطَ لِيَوْمِ ٱلْقِيَٰمَةِ فَلَا تُظْلَمُ نَفْسٌۭ شَيْـًۭٔا وَإِن كَانَ مِثْقَالَ حَبَّةٍۢ مِّنْ خَرْدَلٍ أَتَيْنَا بِهَا وَكَفَىٰ بِنَا حَٰسِبِينَ","fr":"Au Jour de la Résurrection, Nous placerons les balances exactes. Nulle âme ne sera lésée en rien, fût-ce du poids d'un grain de moutarde que Nous ferons venir. Nous suffisons largement pour dresser les comptes.","en":"And We place the scales of justice for the Day of Resurrection, so no soul will be treated unjustly at all. And if there is [even] the weight of a mustard seed, We will bring it forth. And sufficient are We as accountant.","ref":{"ar":"سورة الأنبياء · الآية 47","fr":"Al-Anbiyaa · 21:47","en":"Al-Anbiyaa · 21:47"}},{"type":"ayah","ar":"ٱدْفَعْ بِٱلَّتِى هِىَ أَحْسَنُ ٱلسَّيِّئَةَ نَحْنُ أَعْلَمُ بِمَا يَصِفُونَ","fr":"Repousse le mal par ce qui est meilleur. Nous savons très bien ce qu'ils décrivent.","en":"Repel, by [means of] what is best, [their] evil. We are most knowing of what they describe.","ref":{"ar":"سورة المؤمنون · الآية 96","fr":"Al-Muminoon · 23:96","en":"Al-Muminoon · 23:96"}},{"type":"ayah","ar":"وَقُل رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَٰتِ ٱلشَّيَٰطِينِ","fr":"Et dis: «Seigneur, je cherche Ta protection, contre les incitations des diables.","en":"And say, \"My Lord, I seek refuge in You from the incitements of the devils,","ref":{"ar":"سورة المؤمنون · الآية 97","fr":"Al-Muminoon · 23:97","en":"Al-Muminoon · 23:97"}},{"type":"ayah","ar":"وَمَن تَابَ وَعَمِلَ صَٰلِحًۭا فَإِنَّهُۥ يَتُوبُ إِلَى ٱللَّهِ مَتَابًۭا","fr":"et quiconque se repent et accomplit une bonne œuvre c'est vers Allah qu'aboutira son retour.","en":"And he who repents and does righteousness does indeed turn to Allah with [accepted] repentance.","ref":{"ar":"سورة الفرقان · الآية 71","fr":"Al-Furqaan · 25:71","en":"Al-Furqaan · 25:71"}},{"type":"ayah","ar":"وَٱجْعَل لِّى لِسَانَ صِدْقٍۢ فِى ٱلْءَاخِرِينَ","fr":"fais que j'aie une mention honorable sur les langues de la postérité;","en":"And grant me a reputation of honor among later generations.","ref":{"ar":"سورة الشعراء · الآية 84","fr":"Ash-Shu'araa · 26:84","en":"Ash-Shu'araa · 26:84"}},{"type":"ayah","ar":"وَٱجْعَلْنِى مِن وَرَثَةِ جَنَّةِ ٱلنَّعِيمِ","fr":"et fais de moi l'un des héritiers du Jardin des délices.","en":"And place me among the inheritors of the Garden of Pleasure.","ref":{"ar":"سورة الشعراء · الآية 85","fr":"Ash-Shu'araa · 26:85","en":"Ash-Shu'araa · 26:85"}},{"type":"ayah","ar":"وَلَا تُخْزِنِى يَوْمَ يُبْعَثُونَ","fr":"et ne me couvre pas d'ignominie, le jour où l'on sera ressuscité,","en":"And do not disgrace me on the Day they are [all] resurrected -","ref":{"ar":"سورة الشعراء · الآية 87","fr":"Ash-Shu'araa · 26:87","en":"Ash-Shu'araa · 26:87"}},{"type":"ayah","ar":"قُلِ ٱلْحَمْدُ لِلَّهِ وَسَلَٰمٌ عَلَىٰ عِبَادِهِ ٱلَّذِينَ ٱصْطَفَىٰٓ ءَآللَّهُ خَيْرٌ أَمَّا يُشْرِكُونَ","fr":"Dis: «Louange à Allah et paix sur Ses serviteurs qu'Il a élus!» Lequel est meilleur: Allah ou bien ce qu'ils Lui associent?","en":"Say, [O Muhammad], \"Praise be to Allah, and peace upon His servants whom He has chosen. Is Allah better or what they associate with Him?\"","ref":{"ar":"سورة النمل · الآية 59","fr":"An-Naml · 27:59","en":"An-Naml · 27:59"}},{"type":"ayah","ar":"وَهُوَ ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ لَهُ ٱلْحَمْدُ فِى ٱلْأُولَىٰ وَٱلْءَاخِرَةِ وَلَهُ ٱلْحُكْمُ وَإِلَيْهِ تُرْجَعُونَ","fr":"C'est lui Allah. Pas de divinité à part Lui. A Lui la louange ici-bas comme dans l'au-delà. A Lui appartient le jugement. Et vers Lui vous serez ramenés.","en":"And He is Allah; there is no deity except Him. To Him is [due all] praise in the first [life] and the Hereafter. And His is the [final] decision, and to Him you will be returned.","ref":{"ar":"سورة القصص · الآية 70","fr":"Al-Qasas · 28:70","en":"Al-Qasas · 28:70"}},{"type":"ayah","ar":"وَٱبْتَغِ فِيمَآ ءَاتَىٰكَ ٱللَّهُ ٱلدَّارَ ٱلْءَاخِرَةَ وَلَا تَنسَ نَصِيبَكَ مِنَ ٱلدُّنْيَا وَأَحْسِن كَمَآ أَحْسَنَ ٱللَّهُ إِلَيْكَ وَلَا تَبْغِ ٱلْفَسَادَ فِى ٱلْأَرْضِ إِنَّ ٱللَّهَ لَا يُحِبُّ ٱلْمُفْسِدِينَ","fr":"Et recherche à travers ce qu'Allah t'a donné, la Demeure dernière. Et n'oublie pas ta part en cette vie. Et sois bienfaisant comme Allah a été bienfaisant envers toi. Et ne recherche pas la corruption sur terre. Car Allah n'aime point les corrupteurs».","en":"But seek, through that which Allah has given you, the home of the Hereafter; and [yet], do not forget your share of the world. And do good as Allah has done good to you. And desire not corruption in the land. Indeed, Allah does not like corrupters.\"","ref":{"ar":"سورة القصص · الآية 77","fr":"Al-Qasas · 28:77","en":"Al-Qasas · 28:77"}},{"type":"ayah","ar":"وَلَا تَدْعُ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ لَآ إِلَٰهَ إِلَّا هُوَ كُلُّ شَىْءٍ هَالِكٌ إِلَّا وَجْهَهُۥ لَهُ ٱلْحُكْمُ وَإِلَيْهِ تُرْجَعُونَ","fr":"Et n'invoque nulle autre divinité avec Allah. Point de divinité à part Lui. Tout doit périr, sauf Son Visage. A Lui appartient le jugement; et vers Lui vous serez ramenés.","en":"And do not invoke with Allah another deity. There is no deity except Him. Everything will be destroyed except His Face. His is the judgement, and to Him you will be returned.","ref":{"ar":"سورة القصص · الآية 88","fr":"Al-Qasas · 28:88","en":"Al-Qasas · 28:88"}},{"type":"ayah","ar":"ٱتْلُ مَآ أُوحِىَ إِلَيْكَ مِنَ ٱلْكِتَٰبِ وَأَقِمِ ٱلصَّلَوٰةَ إِنَّ ٱلصَّلَوٰةَ تَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ وَلَذِكْرُ ٱللَّهِ أَكْبَرُ وَٱللَّهُ يَعْلَمُ مَا تَصْنَعُونَ","fr":"Récite ce qui t'est révélé du Livre et accomplis la Salât. En vérité la Salât préserve de la turpitude et du blâmable. Le rappel d'Allah est certes ce qu'il y a de plus grand. Et Allah sait ce que vous faites.","en":"Recite, [O Muhammad], what has been revealed to you of the Book and establish prayer. Indeed, prayer prohibits immorality and wrongdoing, and the remembrance of Allah is greater. And Allah knows that which you do.","ref":{"ar":"سورة العنكبوت · الآية 45","fr":"Al-Ankaboot · 29:45","en":"Al-Ankaboot · 29:45"}},{"type":"ayah","ar":"وَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَنُبَوِّئَنَّهُم مِّنَ ٱلْجَنَّةِ غُرَفًۭا تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَا نِعْمَ أَجْرُ ٱلْعَٰمِلِينَ","fr":"Et quant à ceux qui croient et accomplissent de bonnes œuvres, Nous les installerons certes à l'étage dans le Paradis sous lequel coulent les ruisseaux, pour y demeurer éternellement. Quelle belle récompense que celle de ceux qui font le bien,","en":"And those who have believed and done righteous deeds - We will surely assign to them of Paradise [elevated] chambers beneath which rivers flow, wherein they abide eternally. Excellent is the reward of the [righteous] workers","ref":{"ar":"سورة العنكبوت · الآية 58","fr":"Al-Ankaboot · 29:58","en":"Al-Ankaboot · 29:58"}},{"type":"ayah","ar":"وَكَأَيِّن مِّن دَآبَّةٍۢ لَّا تَحْمِلُ رِزْقَهَا ٱللَّهُ يَرْزُقُهَا وَإِيَّاكُمْ وَهُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ","fr":"Que de bêtes ne se chargent point de leur propre nourriture! C'est Allah qui les nourrit ainsi que vous. Et c'est Lui l'Audient, l'Omniscient.","en":"And how many a creature carries not its [own] provision. Allah provides for it and for you. And He is the Hearing, the Knowing.","ref":{"ar":"سورة العنكبوت · الآية 60","fr":"Al-Ankaboot · 29:60","en":"Al-Ankaboot · 29:60"}},{"type":"ayah","ar":"فَسُبْحَٰنَ ٱللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ","fr":"Glorifiez Allah donc, soir et matin!","en":"So exalted is Allah when you reach the evening and when you reach the morning.","ref":{"ar":"سورة الروم · الآية 17","fr":"Ar-Room · 30:17","en":"Ar-Room · 30:17"}},{"type":"ayah","ar":"وَمِنْ ءَايَٰتِهِۦ خَلْقُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَٰفُ أَلْسِنَتِكُمْ وَأَلْوَٰنِكُمْ إِنَّ فِى ذَٰلِكَ لَءَايَٰتٍۢ لِّلْعَٰلِمِينَ","fr":"Et parmi Ses signes la création des cieux et de la terre et la variété de vos idiomes et de vos couleurs. Il y a en cela des preuves pour les savants.","en":"And of His signs is the creation of the heavens and the earth and the diversity of your languages and your colors. Indeed in that are signs for those of knowledge.","ref":{"ar":"سورة الروم · الآية 22","fr":"Ar-Room · 30:22","en":"Ar-Room · 30:22"}},{"type":"ayah","ar":"فَأَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًۭا فِطْرَتَ ٱللَّهِ ٱلَّتِى فَطَرَ ٱلنَّاسَ عَلَيْهَا لَا تَبْدِيلَ لِخَلْقِ ٱللَّهِ ذَٰلِكَ ٱلدِّينُ ٱلْقَيِّمُ وَلَٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَعْلَمُونَ","fr":"Dirige tout ton être vers la religion exclusivement [pour Allah], telle est la nature qu'Allah a originellement donnée aux hommes - pas de changement à la création d'Allah -. Voilà la religion de droiture; mais la plupart des gens ne savent pas.","en":"So direct your face toward the religion, inclining to truth. [Adhere to] the fitrah of Allah upon which He has created [all] people. No change should there be in the creation of Allah. That is the correct religion, but most of the people do not know.","ref":{"ar":"سورة الروم · الآية 30","fr":"Ar-Room · 30:30","en":"Ar-Room · 30:30"}},{"type":"ayah","ar":"وَوَصَّيْنَا ٱلْإِنسَٰنَ بِوَٰلِدَيْهِ حَمَلَتْهُ أُمُّهُۥ وَهْنًا عَلَىٰ وَهْنٍۢ وَفِصَٰلُهُۥ فِى عَامَيْنِ أَنِ ٱشْكُرْ لِى وَلِوَٰلِدَيْكَ إِلَىَّ ٱلْمَصِيرُ","fr":"Nous avons commandé à l'homme [la bienfaisance envers] ses père et mère; sa mère l'a porté [subissant pour lui] peine sur peine: son sevrage a lieu à deux ans. «Sois reconnaissant envers Moi ainsi qu'envers tes parents. Vers Moi est la destination.","en":"And We have enjoined upon man [care] for his parents. His mother carried him, [increasing her] in weakness upon weakness, and his weaning is in two years. Be grateful to Me and to your parents; to Me is the [final] destination.","ref":{"ar":"سورة لقمان · الآية 14","fr":"Luqman · 31:14","en":"Luqman · 31:14"}},{"type":"ayah","ar":"إِنَّ ٱللَّهَ عِندَهُۥ عِلْمُ ٱلسَّاعَةِ وَيُنَزِّلُ ٱلْغَيْثَ وَيَعْلَمُ مَا فِى ٱلْأَرْحَامِ وَمَا تَدْرِى نَفْسٌۭ مَّاذَا تَكْسِبُ غَدًۭا وَمَا تَدْرِى نَفْسٌۢ بِأَىِّ أَرْضٍۢ تَمُوتُ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٌۢ","fr":"La connaissance de l'Heure est auprès d'Allah; et c'est Lui qui fait tomber la pluie salvatrice; et Il sait ce qu'il y a dans les matrices. Et personne ne sait ce qu'il acquerra demain, et personne ne sait dans quelle terre il mourra. Certes, Allah est Omniscient et Parfaitement Connaisseur.","en":"Indeed, Allah [alone] has knowledge of the Hour and sends down the rain and knows what is in the wombs. And no soul perceives what it will earn tomorrow, and no soul perceives in what land it will die. Indeed, Allah is Knowing and Acquainted.","ref":{"ar":"سورة لقمان · الآية 34","fr":"Luqman · 31:34","en":"Luqman · 31:34"}},{"type":"ayah","ar":"هُوَ ٱلَّذِى يُصَلِّى عَلَيْكُمْ وَمَلَٰٓئِكَتُهُۥ لِيُخْرِجَكُم مِّنَ ٱلظُّلُمَٰتِ إِلَى ٱلنُّورِ وَكَانَ بِٱلْمُؤْمِنِينَ رَحِيمًۭا","fr":"C'est lui qui prie sur vous, - ainsi que Ses Anges -, afin qu'Il vous fasse sortir des ténèbres à la lumière; et Il est Miséricordieux envers les croyants.","en":"It is He who confers blessing upon you, and His angels [ask Him to do so] that He may bring you out from darknesses into the light. And ever is He, to the believers, Merciful.","ref":{"ar":"سورة الأحزاب · الآية 43","fr":"Al-Ahzaab · 33:43","en":"Al-Ahzaab · 33:43"}},{"type":"ayah","ar":"قُلْ إِنَّ رَبِّى يَبْسُطُ ٱلرِّزْقَ لِمَن يَشَآءُ مِنْ عِبَادِهِۦ وَيَقْدِرُ لَهُۥ وَمَآ أَنفَقْتُم مِّن شَىْءٍۢ فَهُوَ يُخْلِفُهُۥ وَهُوَ خَيْرُ ٱلرَّٰزِقِينَ","fr":"Dis: «Mon Seigneur dispense avec largesse ou restreint Ses dons à qui Il veut parmi ses serviteurs. Et toute dépense que vous faites [dans le bien], Il la remplace, et c'est Lui le Meilleur des donateurs».","en":"Say, \"Indeed, my Lord extends provision for whom He wills of His servants and restricts [it] for him. But whatever thing you spend [in His cause] - He will compensate it; and He is the best of providers.\"","ref":{"ar":"سورة سبإ · الآية 39","fr":"Saba · 34:39","en":"Saba · 34:39"}},{"type":"ayah","ar":"مَّا يَفْتَحِ ٱللَّهُ لِلنَّاسِ مِن رَّحْمَةٍۢ فَلَا مُمْسِكَ لَهَا وَمَا يُمْسِكْ فَلَا مُرْسِلَ لَهُۥ مِنۢ بَعْدِهِۦ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ","fr":"Ce qu'Allah accorde en miséricorde aux gens, il n'est personne à pouvoir le retenir. Et ce qu'Il retient, il n'est personne à le relâcher après Lui. Et c'est Lui le Puissant, le Sage.","en":"Whatever Allah grants to people of mercy - none can withhold it; and whatever He withholds - none can release it thereafter. And He is the Exalted in Might, the Wise.","ref":{"ar":"سورة فاطر · الآية 2","fr":"Faatir · 35:2","en":"Faatir · 35:2"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ يَتْلُونَ كِتَٰبَ ٱللَّهِ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَأَنفَقُوا۟ مِمَّا رَزَقْنَٰهُمْ سِرًّۭا وَعَلَانِيَةًۭ يَرْجُونَ تِجَٰرَةًۭ لَّن تَبُورَ","fr":"Ceux qui récitent le Livre d'Allah, accomplissent la Salât, et dépensent, en secret et en public de ce que Nous leur avons attribué, espèrent ainsi faire un commerce qui ne périra jamais,","en":"Indeed, those who recite the Book of Allah and establish prayer and spend [in His cause] out of what We have provided them, secretly and publicly, [can] expect a profit that will never perish -","ref":{"ar":"سورة فاطر · الآية 29","fr":"Faatir · 35:29","en":"Faatir · 35:29"}},{"type":"ayah","ar":"فَسُبْحَٰنَ ٱلَّذِى بِيَدِهِۦ مَلَكُوتُ كُلِّ شَىْءٍۢ وَإِلَيْهِ تُرْجَعُونَ","fr":"Louange donc, à Celui qui détient en Sa main la royauté sur toute chose! Et c'est vers Lui que vous serez ramenés.","en":"So exalted is He in whose hand is the realm of all things, and to Him you will be returned.","ref":{"ar":"سورة يس · الآية 83","fr":"Yaseen · 36:83","en":"Yaseen · 36:83"}},{"type":"ayah","ar":"كِتَٰبٌ أَنزَلْنَٰهُ إِلَيْكَ مُبَٰرَكٌۭ لِّيَدَّبَّرُوٓا۟ ءَايَٰتِهِۦ وَلِيَتَذَكَّرَ أُو۟لُوا۟ ٱلْأَلْبَٰبِ","fr":"[Voici] un Livre béni que Nous avons fait descendre vers toi, afin qu'ils méditent sur ses versets et que les doués d'intelligence réfléchissent!","en":"[This is] a blessed Book which We have revealed to you, [O Muhammad], that they might reflect upon its verses and that those of understanding would be reminded.","ref":{"ar":"سورة ص · الآية 29","fr":"Saad · 38:29","en":"Saad · 38:29"}},{"type":"ayah","ar":"يَعْلَمُ خَآئِنَةَ ٱلْأَعْيُنِ وَمَا تُخْفِى ٱلصُّدُورُ","fr":"Il (Allah) connaît la trahison des yeux, tout comme ce que les poitrines cachent.","en":"He knows that which deceives the eyes and what the breasts conceal.","ref":{"ar":"سورة غافر · الآية 19","fr":"Ghafir · 40:19","en":"Ghafir · 40:19"}},{"type":"ayah","ar":"إِنَّا لَنَنصُرُ رُسُلَنَا وَٱلَّذِينَ ءَامَنُوا۟ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَيَوْمَ يَقُومُ ٱلْأَشْهَٰدُ","fr":"Nous secourrons, certes, Nos Messagers et ceux qui croient, dans la vie présente tout comme au jour où les témoins [les Anges gardiens] se dresseront (le Jour du Jugement),","en":"Indeed, We will support Our messengers and those who believe during the life of this world and on the Day when the witnesses will stand -","ref":{"ar":"سورة غافر · الآية 51","fr":"Ghafir · 40:51","en":"Ghafir · 40:51"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۢ","fr":"Ceux qui croient et accomplissent de bonnes œuvres auront une énorme récompense jamais interrompue.","en":"Indeed, those who believe and do righteous deeds - for them is a reward uninterrupted.","ref":{"ar":"سورة فصلت · الآية 8","fr":"Fussilat · 41:8","en":"Fussilat · 41:8"}},{"type":"ayah","ar":"وَهُوَ ٱلَّذِى يُنَزِّلُ ٱلْغَيْثَ مِنۢ بَعْدِ مَا قَنَطُوا۟ وَيَنشُرُ رَحْمَتَهُۥ وَهُوَ ٱلْوَلِىُّ ٱلْحَمِيدُ","fr":"Et c'est Lui qui fait descendre la pluie après qu'on en a désespéré, et répand Sa miséricorde. Et c'est Lui le Maître, le Digne de louange.","en":"And it is He who sends down the rain after they had despaired and spreads His mercy. And He is the Protector, the Praiseworthy.","ref":{"ar":"سورة الشورى · الآية 28","fr":"Ash-Shura · 42:28","en":"Ash-Shura · 42:28"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن جَآءَكُمْ فَاسِقٌۢ بِنَبَإٍۢ فَتَبَيَّنُوٓا۟ أَن تُصِيبُوا۟ قَوْمًۢا بِجَهَٰلَةٍۢ فَتُصْبِحُوا۟ عَلَىٰ مَا فَعَلْتُمْ نَٰدِمِينَ","fr":"O vous qui avez cru! Si un pervers vous apporte une nouvelle, voyez bien clair [de crainte] que par inadvertance vous ne portiez atteinte à des gens et que vous ne regrettiez par la suite ce que vous avez fait.","en":"O you who have believed, if there comes to you a disobedient one with information, investigate, lest you harm a people out of ignorance and become, over what you have done, regretful.","ref":{"ar":"سورة الحجرات · الآية 6","fr":"Al-Hujuraat · 49:6","en":"Al-Hujuraat · 49:6"}},{"type":"ayah","ar":"وَفِىٓ أَنفُسِكُمْ أَفَلَا تُبْصِرُونَ","fr":"ainsi qu'en vous-mêmes. N'observez-vous donc pas?","en":"And in yourselves. Then will you not see?","ref":{"ar":"سورة الذاريات · الآية 21","fr":"Adh-Dhaariyat · 51:21","en":"Adh-Dhaariyat · 51:21"}},{"type":"ayah","ar":"وَفِى ٱلسَّمَآءِ رِزْقُكُمْ وَمَا تُوعَدُونَ","fr":"Et il y a dans le ciel votre subsistance et ce qui vous a été promis.","en":"And in the heaven is your provision and whatever you are promised.","ref":{"ar":"سورة الذاريات · الآية 22","fr":"Adh-Dhaariyat · 51:22","en":"Adh-Dhaariyat · 51:22"}},{"type":"ayah","ar":"وَمِنَ ٱلَّيْلِ فَسَبِّحْهُ وَإِدْبَٰرَ ٱلنُّجُومِ","fr":"Glorifie-Le une partie de la nuit et au déclin des étoiles.","en":"And in a part of the night exalt Him and after [the setting of] the stars.","ref":{"ar":"سورة الطور · الآية 49","fr":"At-Tur · 52:49","en":"At-Tur · 52:49"}},{"type":"ayah","ar":"إِنَّا كُلَّ شَىْءٍ خَلَقْنَٰهُ بِقَدَرٍۢ","fr":"Nous avons créé toute chose avec mesure,","en":"Indeed, all things We created with predestination.","ref":{"ar":"سورة القمر · الآية 49","fr":"Al-Qamar · 54:49","en":"Al-Qamar · 54:49"}},{"type":"ayah","ar":"لَهُۥ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ يُحْىِۦ وَيُمِيتُ وَهُوَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ","fr":"A Lui appartient la souveraineté des cieux et de la terre. Il fait vivre et il fait mourir, et Il est Omnipotent.","en":"His is the dominion of the heavens and earth. He gives life and causes death, and He is over all things competent.","ref":{"ar":"سورة الحديد · الآية 2","fr":"Al-Hadid · 57:2","en":"Al-Hadid · 57:2"}},{"type":"ayah","ar":"مَآ أَصَابَ مِن مُّصِيبَةٍۢ فِى ٱلْأَرْضِ وَلَا فِىٓ أَنفُسِكُمْ إِلَّا فِى كِتَٰبٍۢ مِّن قَبْلِ أَن نَّبْرَأَهَآ إِنَّ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٌۭ","fr":"Nul malheur n'atteint la terre ni vos personnes, qui ne soit enregistré dans un Livre avant que Nous ne l'ayons créé; et cela est certes facile à Allah,","en":"No disaster strikes upon the earth or among yourselves except that it is in a register before We bring it into being - indeed that, for Allah, is easy -","ref":{"ar":"سورة الحديد · الآية 22","fr":"Al-Hadid · 57:22","en":"Al-Hadid · 57:22"}},{"type":"ayah","ar":"وَٱلَّذِينَ جَآءُو مِنۢ بَعْدِهِمْ يَقُولُونَ رَبَّنَا ٱغْفِرْ لَنَا وَلِإِخْوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلْإِيمَٰنِ وَلَا تَجْعَلْ فِى قُلُوبِنَا غِلًّۭا لِّلَّذِينَ ءَامَنُوا۟ رَبَّنَآ إِنَّكَ رَءُوفٌۭ رَّحِيمٌ","fr":"Et [il appartient également] à ceux qui sont venus après eux en disant: «Seigneur, pardonne-nous, ainsi qu'à nos frères qui nous ont précédés dans la foi; et ne mets dans nos cœurs aucune rancœur pour ceux qui ont cru. Seigneur, Tu es Compatissant et Très Miséricordieux».","en":"And [there is a share for] those who came after them, saying, \"Our Lord, forgive us and our brothers who preceded us in faith and put not in our hearts [any] resentment toward those who have believed. Our Lord, indeed You are Kind and Merciful.\"","ref":{"ar":"سورة الحشر · الآية 10","fr":"Al-Hashr · 59:10","en":"Al-Hashr · 59:10"}},{"type":"ayah","ar":"هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَٰهَ إِلَّا هُوَ ٱلْمَلِكُ ٱلْقُدُّوسُ ٱلسَّلَٰمُ ٱلْمُؤْمِنُ ٱلْمُهَيْمِنُ ٱلْعَزِيزُ ٱلْجَبَّارُ ٱلْمُتَكَبِّرُ سُبْحَٰنَ ٱللَّهِ عَمَّا يُشْرِكُونَ","fr":"C'est Lui, Allah. Nulle divinité autre que Lui; Le Souverain, Le Pur, L'Apaisant, Le Rassurant, Le Prédominant, Le Tout Puissant, Le Contraignant, L'Orgueilleux. Gloire à Allah! Il transcende ce qu'ils Lui associent.","en":"He is Allah, other than whom there is no deity, the Sovereign, the Pure, the Perfection, the Bestower of Faith, the Overseer, the Exalted in Might, the Compeller, the Superior. Exalted is Allah above whatever they associate with Him.","ref":{"ar":"سورة الحشر · الآية 23","fr":"Al-Hashr · 59:23","en":"Al-Hashr · 59:23"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نُودِىَ لِلصَّلَوٰةِ مِن يَوْمِ ٱلْجُمُعَةِ فَٱسْعَوْا۟ إِلَىٰ ذِكْرِ ٱللَّهِ وَذَرُوا۟ ٱلْبَيْعَ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ","fr":"O vous qui avez cru! Quand on appelle à la Salât du jour du Vendredi, accourez à l'invocation d'Allah et laissez tout négoce. Cela est bien meilleur pour vous, si vous saviez!","en":"O you who have believed, when [the adhan] is called for the prayer on the day of Jumu'ah [Friday], then proceed to the remembrance of Allah and leave trade. That is better for you, if you only knew.","ref":{"ar":"سورة الجمعة · الآية 9","fr":"Al-Jumu'a · 62:9","en":"Al-Jumu'a · 62:9"}},{"type":"ayah","ar":"وَأَنفِقُوا۟ مِن مَّا رَزَقْنَٰكُم مِّن قَبْلِ أَن يَأْتِىَ أَحَدَكُمُ ٱلْمَوْتُ فَيَقُولَ رَبِّ لَوْلَآ أَخَّرْتَنِىٓ إِلَىٰٓ أَجَلٍۢ قَرِيبٍۢ فَأَصَّدَّقَ وَأَكُن مِّنَ ٱلصَّٰلِحِينَ","fr":"Et dépensez de ce que Nous vous avons octroyé avant que la mort ne vienne à l'un de vous et qu'il dise alors: «Seigneur! si seulement Tu m'accordais un court délai: je ferais l'aumône et serais parmi les gens de bien».","en":"And spend [in the way of Allah] from what We have provided you before death approa
