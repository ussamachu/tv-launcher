ger d’Allah ﷺ partait en voyage, il disait : « Ô Allah, Tu es le Compagnon pendant le voyage et Celui qui veille sur la famille ; ô Allah, je cherche refuge auprès de Toi contre les difficultés du voyage, contre le malheur au retour et contre la tristesse de voir ce qui arrive à ma famille et à mes biens. Ô Allah, rends ce voyage court pour nous et facilite-le-nous. »","en":"Narrated AbuHurayrah: When the Messenger of Allah (ﷺ) proceeded on journey, he would say: O Allah, Thou art the Companion in the journey, and the One Who looks after the family; O Allah, I seek refuge in Thee from the difficulty of travelling, finding harm when I return, and unhappiness in what I see coming to my family and property. O Allah, make the length of his journey short for us, and the journey easy for us","ref":{"ar":"رواه أبي داود 2598","fr":"Abû Dâwûd 2598","en":"Abu Dawud 2598"}},{"type":"hadith","ar":"إن العبد ليتكلم بالكلمة من رضوان الله","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Un serviteur (d’Allah) peut dire une parole qui plaît à Allah sans y accorder d’importance, et grâce à cela, Allah l’élèvera en degrés. Un serviteur (d’Allah) peut aussi prononcer une parole (sans y faire attention) qui déplaît à Allah, et à cause de cela, il sera jeté en Enfer. »","en":"Narrated Abu Huraira:The Prophet; said, \"A slave (of Allah) may utter a word which pleases Allah without giving it much importance, and because of that Allah will raise him to degrees (of reward): a slave (of Allah) may utter a word (carelessly) which displeases Allah without thinking of its gravity and because of that he will be thrown into the Hell-Fire","ref":{"ar":"رواه البخاري 6478","fr":"al-Bukhârî 6478","en":"Bukhari 6478"}},{"type":"hadith","ar":"إنا لله وإنا إليه راجعون اللهم أجرني في مصيبتي","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Quand l’un d’entre vous dit Amin et que les anges au ciel disent aussi Amin, et que les deux coïncident, tous ses péchés passés sont pardonnés. »","en":"Abu Harare reported:The Messenger of Allah (ﷺ) said: When anyone amongst you utters Amin and the angels In the heaven also utter Amin and (the Amin) of the one synchronises with (that of) the other, all his previous sins are pardoned","ref":{"ar":"رواه مسلم 918","fr":"Muslim 918","en":"Muslim 918"}},{"type":"hadith","ar":"من أقال مسلما أقاله الله عثرته","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Prophète ﷺ a dit : « Si quelqu’un annule une vente avec un musulman, Allah annulera sa faute le Jour de la Résurrection. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: If anyone rescinds a sale with a Muslim, Allah will cancel his slip, on the Day of Resurrection","ref":{"ar":"رواه أبي داود 3460","fr":"Abû Dâwûd 3460","en":"Abu Dawud 3460"}},{"type":"hadith","ar":"من يضمن لي ما بين لحييه وما بين رجليه أضمن له الجنة","fr":"Rapporté par Sahl bin Sa`d : Le Messager d'Allah (ﷺ) a dit : « Celui qui peut garantir la préservation de ce qu’il y a entre ses deux mâchoires et de ce qu’il y a entre ses deux jambes (c’est-à-dire sa langue et ses parties intimes), je lui garantis le Paradis. »","en":"Narrated Sahl bin Sa`d:Allah's Messenger (ﷺ) said, \"Whoever can guarantee (the chastity of) what is between his two jaw-bones and what is between his two legs (i.e. his tongue and his private parts), I guarantee Paradise for him","ref":{"ar":"رواه البخاري 6474","fr":"al-Bukhârî 6474","en":"Bukhari 6474"}},{"type":"hadith","ar":"لقد رأيت رجلا يتقلب في الجنة في شجرة قطعها من ظهر الطريق","fr":"Rapporté par Abu Ishaq : J’ai vu un homme demander à Aswad b. Yazid, qui enseignait le Coran à la mosquée : « Comment récites-tu le verset (fahal min muddakir) ? Est-ce que le mot muddakir se lit avec un (d) ou un (dh) ? » Aswad répondit : « C’est avec un (d). J’ai entendu Abdullah b. Mas'ud dire qu’il avait entendu le Messager d’Allah ﷺ le réciter avec un (d). »","en":"Abu Ishaq reported:I saw a man asking Aswad b. Yazid who taught the Qur'an in the mosque: How do you recite the verse (fahal min muddakir) whether (the word muddakir) Is with (d) or (dh)? He (Aswad) said: It was with (d). I heard Abdullah b. Mas'ud saying that he had heard the Messenger of Allah (ﷺ) reciting (muddakir) with (d)","ref":{"ar":"رواه مسلم 1914","fr":"Muslim 1914","en":"Muslim 1914"}},{"type":"hadith","ar":"اللهم إني أعوذ بك من المأثم والمغرم","fr":"Rapporté par Aisha, la mère des croyants رضي الله عنها : Le Messager d’Allah ﷺ faisait cette invocation pendant la prière : « Ô Allah, je cherche refuge auprès de Toi contre le châtiment de la tombe ; je cherche refuge auprès de Toi contre l’épreuve de l’Antéchrist ; je cherche refuge auprès de Toi contre les épreuves de la vie et de la mort ; ô Allah, je cherche refuge auprès de Toi contre le péché et la dette. » Quelqu’un lui a dit : « Tu demandes souvent la protection contre la dette ! » Il a répondu : « Quand un homme est endetté, il parle et ment, il promet et ne tient pas parole. »","en":"Narrated Aisha, Ummul Mu'minin: The Messenger of Allah (ﷺ) used to make supplication during the prayer saying: \"O Allah, I seek refuge in Thee from the punishment of the grave; I seek refuge in Thee from the trial of the Antichrist; I seek refuge in Thee from the trial of life and the trial of death; O Allah, I seek refuge in Thee from sin and debt.\" Someone said to him: How often you seek refuge from debt! He replied: When a man is in debt, he talks and tells lies, makes promises and breaks them","ref":{"ar":"رواه أبي داود 880","fr":"Abû Dâwûd 880","en":"Abu Dawud 880"}},{"type":"hadith","ar":"إن أبغض الرجال إلى الله الألد الخصم","fr":"Rapporté par `Aisha : Le Prophète (ﷺ) a dit : « La personne la plus détestée par Allah est celle qui se dispute le plus. »","en":"Narrated `Aisha:The Prophet (ﷺ) said, \"The most hated person in the sight of Allah is the most quarrelsome person","ref":{"ar":"رواه البخاري 2457","fr":"al-Bukhârî 2457","en":"Bukhari 2457"}},{"type":"hadith","ar":"من غدا إلى المسجد أو راح أعد الله له في الجنة نزلا","fr":"Rapporté par Al-Aawad et Hammam : Aïcha رضي الله عنها a dit : « Je grattais la (goutte de) sperme sur le vêtement du Messager d’Allah ﷺ. »","en":"Al-Aawad and Hammam reported A'isha as saying:I used to scrape off the (drop of) semen from the garment of the Messenger of Allah (ﷺ)","ref":{"ar":"رواه مسلم 669","fr":"Muslim 669","en":"Muslim 669"}},{"type":"hadith","ar":"يا معشر من آمن بلسانه ولم يدخل الإيمان قلبه لا تغتابوا المسلمين","fr":"Rapporté par Abu Barzah al-Aslami : Le Prophète ﷺ a dit : « Ô vous qui affirmez la foi avec la langue alors que la foi n’est pas entrée dans vos cœurs, ne médisez pas des musulmans et ne cherchez pas leurs défauts. Car si quelqu’un cherche leurs défauts, Allah cherchera les siens, et si Allah cherche les défauts de quelqu’un, Il l’exposera jusque dans sa propre maison. »","en":"Narrated AbuBarzah al-Aslami: The Prophet (ﷺ) said: O community of people, who believed by their tongue, and belief did not enter their hearts, do not back-bite Muslims, and do not search for their faults, for if anyone searches for their faults, Allah will search for his fault, and if Allah searches for the fault of anyone, He disgraces him in his house","ref":{"ar":"رواه أبي داود 4880","fr":"Abû Dâwûd 4880","en":"Abu Dawud 4880"}},{"type":"hadith","ar":"أربع من كن فيه كان منافقا خالصا","fr":"Rapporté par 'Abdullah bin 'Amr : Le Prophète (ﷺ) a dit : Celui qui possède ces quatre caractéristiques est un hypocrite pur, et celui qui en possède une a une caractéristique d'hypocrisie jusqu'à ce qu'il l'abandonne : 1. Quand on lui confie quelque chose, il trahit. 2. Quand il parle, il ment. 3. Quand il fait un pacte, il le trahit. 4. Quand il se dispute, il se comporte de façon grossière, mauvaise et insultante","en":"Narrated 'Abdullah bin 'Amr: The Prophet (ﷺ) said, \"Whoever has the following four (characteristics) will be a pure hypocrite and whoever has one of the following four characteristics will have one characteristic of hypocrisy unless and until he gives it up. 1. Whenever he is entrusted, he betrays. 2. Whenever he speaks, he tells a lie. 3. Whenever he makes a covenant, he proves treacherous. 4. Whenever he quarrels, he behaves in a very imprudent, evil and insulting manner","ref":{"ar":"رواه البخاري 34","fr":"al-Bukhârî 34","en":"Bukhari 34"}},{"type":"hadith","ar":"من بنى مسجدا لله بنى الله له في الجنة مثله","fr":"Rapporté par A'mash, selon la même chaîne de transmetteurs : Le même hadith a été rapporté, à l’exception de ces mots : « Vous ne serez parmi les hommes (le Jour de la Résurrection) que comme un poil blanc sur le corps d’un bœuf noir, ou comme un poil noir sur le corps d’un bœuf blanc. » Il n’a pas mentionné : une bande sur la patte d’un âne","en":"The same hadith has been narrated from A'mash on the authority of the same chain of transmitters with the exception of these words:You would be no more among men (on the Day of Resurrection) but like a white hair on (the body of) a black ox, or like a black hair on (the body of) a white ox, and he made no mention of: a strip on the foreleg of an ass","ref":{"ar":"رواه مسلم 533","fr":"Muslim 533","en":"Muslim 533"}},{"type":"hadith","ar":"الخالة بمنزلة الأم","fr":"Rapporté par Ali ibn Abu Talib رضي الله عنه : Quand nous sommes sortis de La Mecque, la fille de Hamzah nous a suivis en pleurant : « Mon oncle ! » Ali l’a prise et l’a tenue par la main. (S’adressant à Fatimah, il dit :) « Prends la fille de ton oncle. » Elle l’a alors prise. Le narrateur a ensuite transmis la suite du récit. Ja'far a dit : « C’est la fille de mon oncle paternel. Sa tante maternelle est mon épouse. » Le Prophète ﷺ a statué en faveur de sa tante maternelle et a dit : « La tante maternelle est comme une mère. »","en":"Narrated Ali ibn AbuTalib: When we came out from Mecca, Hamzah's daughter pursued us crying: My uncle. Ali lifted her and took her by the hand. (Addressing Fatimah he said:) Take your uncle's daughter. She then lifted her. The narrator then transmitted the rest of the tradition. Ja'far said: She is my uncle's daughter. Her maternal aunt is my wife. The Prophet (ﷺ) decided in favour of her maternal aunt, and said: The maternal aunt is like mother","ref":{"ar":"رواه أبي داود 2280","fr":"Abû Dâwûd 2280","en":"Abu Dawud 2280"}},{"type":"hadith","ar":"تطعم الطعام وتقرأ السلام على من عرفت ومن لم تعرف","fr":"Rapporté par 'Abdullah bin 'Amr : Une personne a demandé au Messager d'Allah (ﷺ) : Quelles actions ou qualités de l'islam sont bonnes ? Il a répondu : Donner à manger (aux pauvres) et saluer ceux que tu connais comme ceux que tu ne connais pas","en":"Narrated 'Abdullah bin 'Amr: A person asked Allah's Messenger (ﷺ), \"What (sort of) deeds in or (what qualities of) Islam are good?\" He replied, \"To feed (the poor) and greet those whom you know and those whom you don't know","ref":{"ar":"رواه البخاري 28","fr":"al-Bukhârî 28","en":"Bukhari 28"}},{"type":"hadith","ar":"إن الله يرضى لكم ثلاثا","fr":"Rapporté par Abdullah b. ‘Amr : On m’a rapporté que le Messager d’Allah ﷺ avait dit : « La prière accomplie assis compte pour la moitié de la prière. » Je suis allé le voir ﷺ et je l’ai trouvé en train de prier assis. J’ai posé ma main sur sa tête. Il a dit : « Ô Abdullah b. ‘Amr, qu’as-tu ? » J’ai dit : « Messager d’Allah, on m’a rapporté que tu as dit : “La prière d’un homme assis compte pour la moitié de la prière”, alors que tu pries assis. » Il a répondu : « Oui, c’est vrai, mais je ne suis pas comme n’importe lequel d’entre vous. »","en":"Abdullah b. 'Amr reported:It was narrated to me that the Messenger of Allah (ﷺ) had said: The prayer observed by a person sitting is half of the prayer. I came to him (ﷺ) and found him praying in a sitting position. I placed my hand on his head. He said: O 'Abdullah b. 'Amr, what is the matter with you? I said: Messenger of Allah, it has been narrated to me that you said: The prayer of a man in a sitting position is half of the prayer, whereas you are observing prayer sitting. He (the Holy Prophet) said: Yes, it is so, but I am not like anyone amongst you","ref":{"ar":"رواه مسلم 1715","fr":"Muslim 1715","en":"Muslim 1715"}},{"type":"hadith","ar":"لا تصاحب إلا مؤمنا ولا يأكل طعامك إلا تقي","fr":"Rapporté par Abu Sa‘id al-Khudri رضي الله عنه : Le Prophète ﷺ a dit : « Ne fréquente que des croyants, et ne laisse manger à ta table qu’un homme pieux. »","en":"Narrated AbuSa'id al-Khudri: The Prophet (ﷺ) said: Associate only with a believer, and let only a God-fearing man eat your meals","ref":{"ar":"رواه أبي داود 4832","fr":"Abû Dâwûd 4832","en":"Abu Dawud 4832"}},{"type":"hadith","ar":"إن الله ليملي للظالم حتى إذا أخذه لم يفلته","fr":"Rapporté par Abû Mûsâ : Le Messager d’Allah ﷺ a dit : « Allah accorde un délai au tyran, mais lorsqu’Il le saisit, Il ne le relâche pas. » Puis il récita : {Tel est le châtiment de ton Seigneur lorsqu’Il saisit les cités alors qu’elles sont injustes. Son châtiment est certes douloureux et sévère}","en":"Narrated Abu Musa:Allah's Messenger (ﷺ) said, \"Allah gives respite to the oppressor, but when He takes him over, He never releases him.\" Then he recited:-- \"Such is the seizure of your Lord when He seizes (population of) towns in the midst of their wrong: Painful indeed, and severe is His seizure","ref":{"ar":"رواه البخاري 4686","fr":"al-Bukhârî 4686","en":"Bukhari 4686"}},{"type":"hadith","ar":"من عاد مريضا لم يزل في خرفة الجنة","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit (comme dans le hadith précédent), mais avec cette différence : « Ne vous imposez que ce que vous avez la force de supporter. »","en":"Abu Huraira (Allah be pleased with him) reported Allah's Apostle (ﷺ) as saying (the words as said in the previous hadith) but with this alteration (of words):\" Take upon yourselves (the burden of the deeds) for which you have the strength to bear","ref":{"ar":"رواه مسلم 2568","fr":"Muslim 2568","en":"Muslim 2568"}},{"type":"hadith","ar":"من قام بعشر آيات لم يكتب من الغافلين","fr":"Rapporté par Abdullah ibn Amr ibn al-‘As رضي الله عنه : Le Prophète ﷺ a dit : « Celui qui prie la nuit en récitant régulièrement dix versets ne sera pas compté parmi les insouciants ; celui qui prie la nuit et récite cent versets sera compté parmi ceux qui obéissent à Allah ; et celui qui prie la nuit en récitant mille versets sera compté parmi ceux qui reçoivent une grande récompense. » Abu Dawud a dit : Le nom de Ibn Hujairah al-Asghar est ‘Abd Allah b. ‘Abd al-Rahman b. Hujairah","en":"Narrated Abdullah ibn Amr ibn al-'As: The Prophet (ﷺ) said: If anyone prays at night reciting regularly ten verses, he will not be recorded among the negligent; if anyone prays at night and recites a hundred verses, he will be recorded among those who are obedient to Allah; and if anyone prays at night reciting one thousand verses, he will be recorded among those who receive huge rewards. Abu Dawud said: The name of Ibn Hujairah al-Asghar is 'Abd Allah b. 'Abd al-Rahman b. Hujairah","ref":{"ar":"رواه أبي داود 1398","fr":"Abû Dâwûd 1398","en":"Abu Dawud 1398"}},{"type":"hadith","ar":"اتق دعوة المظلوم فإنها ليس بينها وبين الله حجاب","fr":"Rapporté par Ibn ‘Abbas : Le Prophète (ﷺ) a envoyé Mu‘adh au Yémen et a dit : « Prends garde à l’invocation de l’opprimé, car il n’y a pas de voile entre elle et Allah. »","en":"Narrated Ibn `Abbas:The Prophet (ﷺ) sent Mu`adh to Yemen and said, \"Be afraid, from the curse of the oppressed as there is no screen between his invocation and Allah","ref":{"ar":"رواه البخاري 2448","fr":"al-Bukhârî 2448","en":"Bukhari 2448"}},{"type":"hadith","ar":"من سن في الإسلام سنة حسنة","fr":"Rapporté par Abu al-Malik avec la même chaîne de transmetteurs","en":"This hadith his been narrated by 'Abu al-Malik with the same chain of transmitters","ref":{"ar":"رواه مسلم 1017","fr":"Muslim 1017","en":"Muslim 1017"}},{"type":"hadith","ar":"من خرج من بيته متطهرا إلى صلاة مكتوبة فأجره كأجر الحاج المحرم","fr":"Rapporté par Abu Umamah رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Celui qui sort de chez lui après avoir fait ses ablutions pour accomplir la prière obligatoire en groupe à la mosquée, aura une récompense comme celle de celui qui part en pèlerinage après avoir mis l’ihram. Celui qui sort pour prier la prière du matin (duha) et fait l’effort pour cela, aura la récompense de celui qui fait la ‘umrah. Et une prière suivie d’une autre prière, sans paroles inutiles entre les deux, sera inscrite dans Illiyyun. »","en":"Narrated AbuUmamah: The Messenger of Allah (ﷺ) said: If anyone goes out from his house after performing ablution for saying the prescribed prayer in congregation (in the mosque), his reward will be like that of one who goes for hajj pilgrimage after wearing ihram (robe worn by the hajj pilgrims). And he who goes out to say the mid-morning (duha) prayer, and takes the trouble for this purpose, will take the reward like that of a person who performs umrah. And a prayer followed by a prayer with no worldly talk during the gap between them will be recorded in Illiyyun","ref":{"ar":"رواه أبي داود 558","fr":"Abû Dâwûd 558","en":"Abu Dawud 558"}},{"type":"hadith","ar":"لا يأمن جاره بوائقه","fr":"Rapporté par Abu Shuraih : Le Prophète (ﷺ) a dit : « Par Allah, il ne croit pas ! Par Allah, il ne croit pas ! Par Allah, il ne croit pas ! » On lui a demandé : « Qui donc, ô Messager d’Allah (ﷺ) ? » Il a répondu : « Celui dont le voisin n’est pas à l’abri de son mal. »","en":"Narrated Abu Shuraih:The Prophet (ﷺ) said, \"By Allah, he does not believe! By Allah, he does not believe! By Allah, he does not believe!\" It was said, \"Who is that, O Allah's Messenger (ﷺ)?\" He said, \"That person whose neighbor does not feel safe from his evil","ref":{"ar":"رواه البخاري 6016","fr":"al-Bukhârî 6016","en":"Bukhari 6016"}},{"type":"hadith","ar":"من دعا إلى هدى كان له من الأجر مثل أجور من تبعه","fr":"Rapporté par Abu Sa'id al-Khudri رضي الله عنه : Le Messager d’Allah ﷺ a interdit de jeûner deux jours : le jour du Fitr et le jour du Sacrifice (Aïd al-Adha)","en":"Abu Sa'id al-Khudri (Allah be pleased with him) reported that the Messenger of Allah (ﷺ) forbade to observe fast on two days the day of Fitr and the day of Sacrifice ('Id-ul-Adha)","ref":{"ar":"رواه مسلم 2674","fr":"Muslim 2674","en":"Muslim 2674"}},{"type":"hadith","ar":"أستغفر الله الذي لا إله إلا هو الحي القيوم وأتوب إليه","fr":"Rapporté par Zayd, le serviteur du Prophète : Le Prophète ﷺ a dit : « Si quelqu’un dit : “Je demande pardon à Allah, il n’y a pas de divinité en dehors de Lui, le Vivant, l’Éternel, et je me repens à Lui”, il sera pardonné, même s’il a fui lors d’une bataille. »","en":"Narrated Zayd, the client of the Prophet: The Prophet (ﷺ) said: If anyone says: \"I ask pardon of Allah than Whom there is no deity, the Living, the eternal, and I turn to Him in repentance,\" he will be pardoned, even if he has fled in time of battle","ref":{"ar":"رواه أبي داود 1517","fr":"Abû Dâwûd 1517","en":"Abu Dawud 1517"}},{"type":"hadith","ar":"يتبع الميت ثلاثة","fr":"Rapporté par Anas bin Malik : Le Messager d’Allah (ﷺ) a dit : « Quand un défunt est porté vers sa tombe, trois choses le suivent, puis deux repartent et une seule reste avec lui : sa famille, ses biens et ses actions l’accompagnent ; sa famille et ses biens repartent, mais ses actions restent avec lui. »","en":"Narrated Anas bin Malik:Allah's Messenger (ﷺ) said, \"When carried to his grave, a dead person is followed by three, two of which return (after his burial) and one remains with him: his relative, his property, and his deeds follow him; relatives and his property go back while his deeds remain with him","ref":{"ar":"رواه البخاري 6514","fr":"al-Bukhârî 6514","en":"Bukhari 6514"}},{"type":"hadith","ar":"من قال حين يصبح وحين يمسي سبحان الله وبحمده مائة مرة","fr":"Rapporté par Aïsha رضي الله عنها : Le Messager d’Allah ﷺ a dit : « Si quelqu’un meurt alors qu’il devait encore des jours de jeûne, son héritier doit jeûner à sa place. »","en":"A'isha (Allah be pleased with her) reported Allah's Messenger (ﷺ) as saying:If anyone dies in a state (that he had to complete) some fasts, his heir must fast on his behalf","ref":{"ar":"رواه مسلم 2692","fr":"Muslim 2692","en":"Muslim 2692"}},{"type":"hadith","ar":"رب اغفر لي وتب علي إنك أنت التواب الرحيم","fr":"Rapporté par Abdullah ibn Umar : Nous avons compté que le Messager d’Allah ﷺ disait cent fois lors d’une réunion : « Mon Seigneur, pardonne-moi et accorde-moi Ton pardon ; Tu es Celui qui pardonne et qui efface les fautes. »","en":"Narrated Abdullah ibn Umar: We counted that the Messenger of Allah (ﷺ) would say a hundred times during a meeting: \"My Lord, forgive me and pardon me; Thou art the Pardoning and forgiving One","ref":{"ar":"رواه أبي داود 1516","fr":"Abû Dâwûd 1516","en":"Abu Dawud 1516"}},{"type":"hadith","ar":"إن الله لا يقبض العلم انتزاعا","fr":"Rapporté par `Abdullah bin `Amr bin Al-`As : J’ai entendu le Messager d’Allah (ﷺ) dire : « Allah ne retire pas la science en l’enlevant des cœurs des gens, mais Il la retire en faisant mourir les savants religieux. Quand il n’en restera plus, les gens prendront pour chefs des ignorants qui, consultés, donneront des avis sans connaissance. Ils s’égareront et égareront les autres. »","en":"Narrated `Abdullah bin `Amr bin Al-`As:I heard Allah's Messenger (ﷺ) saying, \"Allah does not take away the knowledge, by taking it away from (the hearts of) the people, but takes it away by the death of the religious learned men till when none of the (religious learned men) remains, people will take as their leaders ignorant persons who when consulted will give their verdict without knowledge. So they will go astray and will lead the people astray","ref":{"ar":"رواه البخاري 100","fr":"al-Bukhârî 100","en":"Bukhari 100"}},{"type":"hadith","ar":"إن الله أوحى إلي أن تواضعوا حتى لا يفخر أحد على أحد","fr":"Rapporté par Aïcha : Le Messager d’Allah ﷺ a dit : « Cinq animaux nuisibles et dangereux doivent être tués même dans l’enceinte du Haram : le rat, le scorpion, le corbeau, le milan et le chien féroce. »","en":"A'isha reported Allah's Mdssenger (ﷺ) having said this:Five are the vicious and harmful things which should be killed even within the precincts of Haram: rat, scorpion, crow. kite and voracious dog","ref":{"ar":"رواه مسلم 2865","fr":"Muslim 2865","en":"Muslim 2865"}},{"type":"hadith","ar":"الله الله ربي لا أشرك به شيئا","fr":"Rapporté par Asma’ bint Umays : Le Messager d’Allah ﷺ m’a dit : « Veux-tu que je t’enseigne des paroles à dire en cas de détresse ? (Les voici :) “Allah, Allah est mon Seigneur, je n’associe rien à Lui.” » Abu Dawud a dit : Le narrateur Hilal était un affranchi de ‘Umar b. ‘Abd al-Aziz. Le nom de Ja’far, un des rapporteurs, est ‘Abd Allah b. Ja’far","en":"Narrated Asma' daughter of Umays: The Messenger of Allah (ﷺ) said to me: May I not teach you phrases which you utter in distress? (These are:) \"Allah , Allah is my Lord, I do not associate anything as partner with Him.\" Abu Dawud said: The narrator Hilal is a client of 'Umar b. 'Abd al-Aziz. The name of Ja'far, a narrator, is 'Abd Allah b. Ja'far","ref":{"ar":"رواه أبي داود 1525","fr":"Abû Dâwûd 1525","en":"Abu Dawud 1525"}},{"type":"hadith","ar":"تعاهدوا القرآن","fr":"Rapporté par Abu Musa : Le Prophète (ﷺ) a dit : « Attache-toi au Coran, car par Celui qui tient mon âme dans Sa main, il s’échappe encore plus vite qu’un chameau détaché de sa corde. »","en":"Narrated Abu Musa:The Prophet (ﷺ) said, \"Commit yourself to the Qur'an, for by Him in whose Hand is my soul, it is surely more prone to break away than a camel in its bind","ref":{"ar":"رواه البخاري 5033","fr":"al-Bukhârî 5033","en":"Bukhari 5033"}},{"type":"hadith","ar":"من استطاع منكم الباءة فليتزوج","fr":"Rapporté par Alqama : Alors que je marchais avec Abdullah à Mina, Uthman le rencontra. Il s’arrêta et commença à lui parler. Uthman lui dit : « Abou Abd al-Rahman, ne devrions-nous pas te marier à une jeune fille qui te rappellerait un peu ta jeunesse passée ? » Il répondit : « Si tu le dis, le Messager d’Allah ﷺ a dit : “Ô jeunes gens, que celui d’entre vous qui en a les moyens se marie, car cela aide à détourner le regard et à préserver la chasteté. Mais celui qui n’en a pas les moyens doit jeûner, car cela aide à maîtriser le désir.” »","en":"Alqama reported:While I was walking with 'Abdullah at Mina, 'Uthman happened to meet him. He stopped there and began to talk with him. Uthman said to him: Abu 'Abd al-Rahman, should we not marry you to a young girl who may recall to you some of the past of your bygone days; thereupon he said: If you say so, Allah's Messenger (ﷺ) said: 0 young men, those among you who can support a wife should marry, for it restrains eyes from casting (evil glances). and preserves one from immorality; but those who cannot should devote themselves to fasting for it is a means of controlling sexual desire","ref":{"ar":"رواه مسلم 3398","fr":"Muslim 3398","en":"Muslim 3398"}},{"type":"hadith","ar":"اللهم إني أعوذ بك من شر سمعي ومن شر بصري ومن شر لساني ومن شر قلبي","fr":"Rapporté par Shakl ibn Humayd : J’ai dit : « Ô Messager d’Allah, apprends-moi une invocation. » Il a dit : « Dis : “Ô Allah, je cherche protection auprès de Toi contre le mal de ce que j’entends, contre le mal de ce que je vois, contre le mal de ce que je dis, contre le mal de ce que je pense, et contre le mal de ma passion.” »","en":"Narrated Shakl ibn Humayd: I said: Messenger of Allah, teach me a supplication. He said: Say: \"O Allah, I seek refuge in Thee from the evil of what I hear, from the evil of what I see, from the evil of what I speak, from the evil of what I think, and from the evil of my semen\" (i.e. sexual passion)","ref":{"ar":"رواه أبي داود 1551","fr":"Abû Dâwûd 1551","en":"Abu Dawud 1551"}},{"type":"hadith","ar":"ليس منا من لم يتغن بالقرآن","fr":"Rapporté par Abu Salama : Abu Huraira a dit : « Le Messager d’Allah (ﷺ) a dit : “Celui qui ne récite pas le Coran d’une belle voix ne fait pas partie des nôtres.” Et d’autres ont ajouté : (cela signifie) de le réciter à voix haute. »","en":"Narrated Abu Salama:Abu Huraira said, \"Allah's Messenger (ﷺ) said, 'Whoever does not recite Qur'an in a nice voice is not from us,' and others said extra,\" (that means) to recite it aloud","ref":{"ar":"رواه البخاري 7527","fr":"al-Bukhârî 7527","en":"Bukhari 7527"}},{"type":"hadith","ar":"إن الله كتب الحسنات والسيئات","fr":"Rapporté par Abu Malik رضي الله عنه, d’après son père : Il a entendu le Prophète ﷺ dire : « Celui qui croit en l’unicité d’Allah… » puis il a rapporté ce qui a été mentionné précédemment","en":"Abu Malik narrated on the authority of his father that he heard the Apostle (ﷺ) say:He who held belief in the unity of Allah, and then narrated what has been stated above","ref":{"ar":"رواه مسلم 131","fr":"Muslim 131","en":"Muslim 131"}},{"type":"hadith","ar":"اللهم إني أعوذ بك من البرص والجنون والجذام ومن سيئ الأسقام","fr":"Rapporté par Anas ibn Malik : Le Prophète ﷺ disait : « Ô Allah, je cherche protection auprès de Toi contre la lèpre, la folie, l’éléphantiasis et les mauvaises maladies. »","en":"Narrated Anas ibn Malik: The Prophet (ﷺ) used to say: \"O Allah, I seek refuge in Thee from leprosy, madness, elephantiasis, and evil diseases","ref":{"ar":"رواه أبي داود 1554","fr":"Abû Dâwûd 1554","en":"Abu Dawud 1554"}},{"type":"hadith","ar":"إنها لتعدل ثلث القرآن","fr":"Rapporté par Abu Sa`id Al-Khudri : Un homme a entendu un autre homme réciter la sourate Al-Ikhlas (Le Monothéisme pur) : « Dis : Il est Allah, l’Unique » (112), et il la répétait. Le lendemain matin, il est venu raconter toute l’histoire au Messager d’Allah (ﷺ), comme s’il trouvait que la récitation de cette sourate n’était pas suffisante. À cela, le Messager d’Allah (ﷺ) a dit : « Par Celui qui détient mon âme dans Sa main ! Cette sourate (la n°112) équivaut au tiers du Coran. »","en":"Narrated Abu Sa`id Al-Khudri:A man heard another man reciting: Surat-ul-Ikhlas (The Unity) 'Say: He is Allah, the One (112) and he was repeating it. The next morning he came to Allah's Messenger (ﷺ) and mentioned the whole story to him as if he regarded the recitation of that Sura as insufficient On that, Allah's Messenger (ﷺ) said, \"By Him in Whose Hand my soul is! That (Sura No. 112) equals one-third of the Qur'an","ref":{"ar":"رواه البخاري 6643","fr":"al-Bukhârî 6643","en":"Bukhari 6643"}},{"type":"hadith","ar":"يصبح على كل سلامى من أحدكم صدقة","fr":"Rapporté par Hisham d’après son père, d’après Aïcha رضي الله عنها : Lorsque le Prophète ﷺ faisait le grand lavage après un rapport sexuel, il se lavait d’abord les paumes des mains trois fois, puis tout le reste du hadith est rapporté comme selon Abu Mu’awiya, mais il n’est pas fait mention du lavage des pieds","en":"Hisham narrated it from his father, who narrated it on the authority of 'A'isha that when the Apostle (ﷺ) took a bath because of sexual inter-course, he first washed the palms of his hands three times, and then the whole hadith was transmitted like that based on the authority of Abu Mu'awyia, but no mention is made of the washing of feet","ref":{"ar":"رواه مسلم 720","fr":"Muslim 720","en":"Muslim 720"}},{"type":"hadith","ar":"اللهم إني أعوذ بك من الجوع فإنه بئس الضجيع","fr":"Rapporté par Abu Hurayrah رضي الله عنه : Le Messager d’Allah ﷺ disait : « Ô Allah, je cherche refuge auprès de Toi contre la faim, car c’est un mauvais compagnon, et je cherche refuge auprès de Toi contre la trahison, car c’est un vilain défaut caché. »","en":"Narrated AbuHurayrah: The Messenger of Allah (ﷺ) used to say: \"O Allah, I seek refuge in Thee from hunger, for it is an evil bed-fellow; and I seek refuge in Thee from treachery, for it is an evil hidden trait","ref":{"ar":"رواه أبي داود 1547","fr":"Abû Dâwûd 1547","en":"Abu Dawud 1547"}},{"type":"hadith","ar":"من قرأ بالآيتين من آخر سورة البقرة في ليلة كفتاه","fr":"Rapporté par Abu Mas'ud : Le Prophète (ﷺ) a dit : « Si quelqu’un récite les deux derniers versets de la sourate Al-Baqara la nuit, cela lui suffira. »","en":"Narrated Abu Mas'ud: The Prophet (ﷺ) said, \"If somebody recited the last two Verses of Surat Al-Baqara at night, that will be sufficient for him","ref":{"ar":"رواه البخاري 5009","fr":"al-Bukhârî 5009","en":"Bukhari 5009"}},{"type":"hadith","ar":"الصلوات الخمس والجمعة إلى الجمعة ورمضان إلى رمضان مكفرات ما بينهن إذا اجتنب الكبائر","fr":"Rapporté par Abu Hurayra رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Allah n’envoie pas une bénédiction du ciel sans qu’au matin un groupe d’hommes ne la nie (comme venant d’Allah). Allah fait tomber la pluie, mais ils disent : “C’est telle ou telle étoile (qui en est la cause).” »","en":"It is reported on the authority of Abu Huraira that the Messenger of Allah (may peace and blessing be upon him) observed:Allah does not shower His blessings from the heaven that in the morning a group of men disbelieve it (to be a blessing from Allah). Allah sends down rain, but they (the disbelievers) say: Such and such star (is responsible for that)","ref":{"ar":"رواه مسلم 233","fr":"Muslim 233","en":"Muslim 233"}},{"type":"hadith","ar":"اللهم قني عذابك يوم تبعث عبادك","fr":"Rapporté par Hafsah (la mère des croyants) رضي الله عنها : Lorsque le Messager d’Allah ﷺ voulait dormir, il mettait sa main droite sous sa joue et disait trois fois : « Ô Allah, protège-moi de Ton châtiment le jour où Tu ressusciteras Tes serviteurs. »","en":"Narrated Hafsah, Ummul Mu'minin: When the Messenger of Allah (ﷺ) wanted to go to sleep, he put his right hand under his cheek and would then say three times: O Allah, guard me from Thy punishment on the day when Thou raisest up Thy servants","ref":{"ar":"رواه أبي داود 5045","fr":"Abû Dâwûd 5045","en":"Abu Dawud 5045"}},{"type":"hadith","ar":"ينزل ربنا تبارك وتعالى كل ليلة إلى السماء الدنيا","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Notre Seigneur, le Béni, le Suprême, descend chaque nuit au ciel le plus proche de nous quand il ne reste qu’un tiers de la nuit, et Il dit : “Y a-t-il quelqu’un qui M’invoque pour que Je lui réponde ? Y a-t-il quelqu’un qui Me demande pour que Je lui accorde sa demande ? Y a-t-il quelqu’un qui cherche Mon pardon pour que Je lui pardonne ?” »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Our Lord, the Blessed, the Superior, comes every night down on the nearest Heaven to us when the last third of the night remains, saying: \"Is there anyone to invoke Me, so that I may respond to invocation? Is there anyone to ask Me, so that I may grant him his request? Is there anyone seeking My forgiveness, so that I may forgive him?","ref":{"ar":"رواه البخاري 1145","fr":"al-Bukhârî 1145","en":"Bukhari 1145"}},{"type":"hadith","ar":"سبق المفردون","fr":"Rapporté par Aïsha رضي الله عنها : Le Prophète ﷺ a interdit de jeûner deux jours : le jour du Fitr et le jour de l’Adha","en":"A'isha (Allah be pleased with her) said that the Prophet (ﷺ) forbade to observe fast on two days-the day of Fitr and the day of Adha","ref":{"ar":"رواه مسلم 2676","fr":"Muslim 2676","en":"Muslim 2676"}},{"type":"hadith","ar":"أن أضل أو أضل أو أزل أو أزل أو أظلم أو أظلم أو أجهل أو يجهل علي","fr":"Rapporté par Umm Salamah, la mère des croyants رضي الله عنها : Le Messager d’Allah ﷺ ne sortait jamais de ma maison sans lever les yeux vers le ciel et dire : « Ô Allah ! Je cherche refuge auprès de Toi de m’égarer ou d’être égaré, de glisser ou d’être entraîné à glisser, de commettre une injustice ou d’en subir une, de faire du mal ou d’en subir. »","en":"Narrated Umm Salamah, Ummul Mu'minin: The Messenger of Allah (ﷺ) never went out of my house without raising his eye to the sky and saying: \"O Allah! I seek refuge in Thee lest I stray or be led astray, or slip or made to slip, or cause injustice, or suffer injustice, or do wrong, or have wrong done to me","ref":{"ar":"رواه أبي داود 5094","fr":"Abû Dâwûd 5094","en":"Abu Dawud 5094"}},{"type":"hadith","ar":"لولا أن أشق على أمتي لأمرتهم بالسواك","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Si je n’avais pas peur que cela soit difficile pour mes fidèles, je leur aurais ordonné d’utiliser le siwak (comme une obligation, pour se nettoyer les dents). »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Were I not afraid that it would be hard on my followers, I would order them to use the siwak (as obligatory, for cleaning the teeth)","ref":{"ar":"رواه البخاري 7240","fr":"al-Bukhârî 7240","en":"Bukhari 7240"}},{"type":"hadith","ar":"من رضي بالله ربا وبالإسلام دينا وبمحمد نبيا وجبت له الجنة","fr":"Rapporté par Qatada رضي الله عنه : Ce hadith a été transmis par Qatada avec la même chaîne de transmetteurs. Mais Shu'ba (un des rapporteurs) a dit : « À la fin de la sourate al-Kahf », tandis que Hammam a dit : « Au début de la sourate al-Kahf. »","en":"This hadith has been transmitted by Qatada with the same chain of transmitters. But Shu'ba (one of the narrators) said:At the end of Surah al-Kahf, but Hammam said: At the beginning of Surah al-Kahf","ref":{"ar":"رواه مسلم 1884","fr":"Muslim 1884","en":"Muslim 1884"}},{"type":"hadith","ar":"اللهم بارك لأمتي في بكورها","fr":"Rapporté par Sakhr al-Ghamidi : Le Prophète ﷺ a dit : « Ô Allah, accorde Ta bénédiction à ma communauté dans leurs débuts de journée. » Lorsqu’il envoyait un groupe ou une armée, il les faisait partir au début de la journée. Sakhr était commerçant, et il envoyait ses marchandises tôt le matin ; il est ainsi devenu riche et a eu beaucoup de biens. Abu Dawud a précisé : Il s’agit de Sakhr ibn Wada’ah","en":"Narrated Sakhr al-Ghamidi: The Prophet (ﷺ) said: \"O Allah, bless my people in their early mornings.\" When he sent out a detachment or an army, he sent them at the beginning of the day. Sakhr was a merchant, and he would send off his merchandise at the beginning of the day; and he became rich and had much wealth. Abu Dawud said: He is Sakhr b. Wada'ah","ref":{"ar":"رواه أبي داود 2606","fr":"Abû Dâwûd 2606","en":"Abu Dawud 2606"}},{"type":"hadith","ar":"له الملك وله الحمد وهو على كل شيء قدير في يوم مائة مرة","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Celui qui dit : “La ilaha illal-lah wahdahu la sharika lahu, lahu-l-mulk wa lahul-hamd wa huwa 'ala kulli shai'in qadir” cent fois, recevra la même récompense que s’il avait affranchi dix esclaves ; cent bonnes actions seront inscrites pour lui, et cent péchés seront effacés de son compte. Cette parole sera pour lui une protection contre Satan jusqu’au soir, et personne ne pourra faire une meilleure action, sauf celui qui en fait plus que lui. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said,\" Whoever says: \"La ilaha illal-lah wahdahu la sharika lahu, lahu-l-mulk wa lahul- hamd wa huwa 'ala kulli shai'in qadir,\" one hundred times will get the same reward as given for manumitting ten slaves; and one hundred good deeds will be written in his accounts, and one hundred sins will be deducted from his accounts, and it (his saying) will be a shield for him from Satan on that day till night, and nobody will be able to do a better deed except the one who does more than he","ref":{"ar":"رواه البخاري 6403","fr":"al-Bukhârî 6403","en":"Bukhari 6403"}},{"type":"hadith","ar":"أنا أغنى الشركاء عن الشرك","fr":"Rapporté par Hafsa رضي الله عنها : J’ai dit : « Ô Messager d’Allah, pourquoi n’es-tu pas sorti de l’ihram ? » Le reste du hadith est identique","en":"Hafsa (Allah be pleased with her) reported:I said: Messenger of Allah what is the matter with you that you have not put off Ihram? The rest of the hadith is the same","ref":{"ar":"رواه مسلم 2985","fr":"Muslim 2985","en":"Muslim 2985"}},{"type":"hadith","ar":"اللهم باعد بيني وبين خطاياي كما باعدت بين المشرق والمغرب","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ gardait le silence entre le takbir et la récitation du Coran. Je lui ai donc demandé, pour qui je donnerais mon père et ma mère en rançon : « Que dis-tu pendant ce moment de silence entre le takbir et la récitation ? » Il a répondu qu’il disait : « Ô Allah, purifie-moi de mes péchés comme un vêtement blanc est purifié de la saleté. Ô Allah, lave mes fautes avec de la neige, de l’eau et de la grêle. »","en":"Abu Hurairah said:The Messenger of Allah (ﷺ) kept silence between the takbir and the recitation of Qur’an. So I asked him, for whom I would give my father and mother as ransom: What do you say during you period of silence between the takbir and the recitation? He replied (that he said): O Allah, purify me from sins as a white garment is purified from filth. O Allah, wash away my sings with snow, water and hail","ref":{"ar":"رواه أبي داود 781","fr":"Abû Dâwûd 781","en":"Abu Dawud 781"}},{"type":"hadith","ar":"يستجاب لأحدكم ما لم يعجل","fr":"Rapporté par Abu Huraira : Le Messager d'Allah (ﷺ) a dit : « L'invocation de chacun d'entre vous est exaucée (par Allah) tant qu'il ne se montre pas impatient en disant : “J'ai invoqué Allah mais ma demande n'a pas été exaucée.” »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The invocation of anyone of you is granted (by Allah) if he does not show impatience (by saying, \"I invoked Allah but my request has not been granted)","ref":{"ar":"رواه البخاري 6340","fr":"al-Bukhârî 6340","en":"Bukhari 6340"}},{"type":"hadith","ar":"يا عبادي إني حرمت الظلم على نفسي وجعلته بينكم محرما فلا تظالموا","fr":"Rapporté par Aïcha رضي الله عنها : Le Messager d’Allah ﷺ embrassait ses épouses alors qu’il jeûnait ; et il maîtrisait ses désirs mieux que vous tous","en":"A'isha (Allah be pleased with her) reported:The Messenger of Allah (ﷺ) used to kiss (his wives) while fasting; and he had the greatest control over his desire (as compared with you)","ref":{"ar":"رواه مسلم 2577","fr":"Muslim 2577","en":"Muslim 2577"}},{"type":"hadith","ar":"اللهم اغفر لحينا وميتنا","fr":"Rapporté par Abu Huraira رضي الله عنه : Lorsque le Messager d’Allah ﷺ priait sur une personne décédée, il disait : « Ô Allah, pardonne à ceux d’entre nous qui sont vivants et à ceux qui sont morts, à ceux qui sont présents et à ceux qui sont absents, à nos jeunes et à nos anciens, à nos hommes et à nos femmes. Ô Allah, accorde la foi à celui d’entre nous à qui Tu donnes la vie, et fais mourir dans l’islam celui d’entre nous que Tu fais mourir. Ô Allah, ne nous prive pas de la récompense de la foi et ne nous égare pas après sa mort. »","en":"Narrated AbuHurayrah: When the Messenger of Allah (ﷺ) prayed over a dead person, he said: O Allah, forgive those of us who are living and those of us who are dead, those of us who are present and those of us who are absent, our young and our old, our male and our female. O Allah, to whomsoever of us Thou givest life grant him life as a believer, and whomsoever of us Thou takest in death take him in death as a follower of Islam. O Allah, do not withhold from us the reward (of faith) and do not lead us astray after his death","ref":{"ar":"رواه أبي داود 3201","fr":"Abû Dâwûd 3201","en":"Abu Dawud 3201"}},{"type":"hadith","ar":"اللهم إني أعوذ بك من الهم والحزن","fr":"Rapporté par Anas bin Malik : Le Prophète (ﷺ) disait : « Ô Allah ! Je cherche protection auprès de Toi contre l’inquiétude et la tristesse, contre l’incapacité et la paresse, contre la lâcheté et l’avarice, contre le poids des dettes et contre le fait d’être dominé par d’autres hommes. »","en":"Narrated Anas bin Malik:The Prophet (ﷺ) used to say, \"O Allah! I seek refuge with You from worry and grief, from incapacity and laziness, from cowardice and miserliness, from being heavily in debt and from being overpowered by (other) men.\" (See Hadith No)","ref":{"ar":"رواه البخاري 6369","fr":"al-Bukhârî 6369","en":"Bukhari 6369"}},{"type":"hadith","ar":"يقول ابن آدم مالي مالي","fr":"Rapporté par Shu’ba avec la même chaîne de rapporteurs","en":"This hadith has been narrated by Shu'ba with the same chain of transmitters","ref":{"ar":"رواه مسلم 2958","fr":"Muslim 2958","en":"Muslim 2958"}},{"type":"hadith","ar":"اللهم بارك لهم فيما رزقتهم واغفر لهم وارحمهم","fr":"Rapporté par ‘Abd Allah b. Busr des Banu Sulaim : Le Messager d’Allah ﷺ est venu chez mon père alors qu’il était son invité. Il lui a offert à manger et a apporté du hais. Ensuite, il a apporté une boisson, qu’il a bue, puis il l’a donnée à celui qui était à sa droite. Il a mangé des dattes sèches et a commencé à mettre les noyaux sur le dos de son annulaire et de son majeur. Lorsqu’il s’est levé, mon père s’est aussi levé et a tenu la bride de sa monture. Il a dit : « Invoque Allah pour moi. » Il a dit : « Ô Allah, bénis-les dans ce que Tu leur as donné et fais-leur miséricorde. »","en":"’Abd Allah b. Busr from Banu Sulaim said:The Messenger of Allah (ﷺ) came to my father and he was a guest with him. He offered food to him and brought hais. He then brought a drink which he drank and he gave it to the one on his right. He ate dried dates and began to put the kernels on the back of his ring finger and middle finger. When he got up, my father also got up, and held the rein of his mount. He said : Pray to Allah for me. He said : O Allah, bless them in what you provided them, and have mercy on them","ref":{"ar":"رواه أبي داود 3729","fr":"Abû Dâwûd 3729","en":"Abu Dawud 3729"}},{"type":"hadith","ar":"ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار","fr":"Rapporté par Anas : Le Prophète (ﷺ) avait l’habitude de dire : « Ô Allah ! Notre Seigneur ! Accorde-nous le bien dans cette vie, et le bien dans l’au-delà, et protège-nous du châtiment du Feu. »","en":"Narrated Anas:The Prophet (ﷺ) used to say, \"O Allah! Our Lord! Give us in this world that, which is good and in the Hereafter that, which is good and save us from the torment of the Fire","ref":{"ar":"رواه البخاري 4522","fr":"al-Bukhârî 4522","en":"Bukhari 4522"}},{"type":"hadith","ar":"يهرم ابن آدم وتشب منه اثنتان","fr":"Rapporté par Hammam b. Munabbih : Voici ce qu’Abu Huraira nous a transmis de Muhammad, le Messager d’Allah ﷺ, et il a rapporté certains ahadith dont celui-ci : Le Messager d’Allah ﷺ a dit : « Quand l’un d’entre vous dirige la prière, il doit la raccourcir, car il y a parmi eux des personnes âgées et des faibles. Mais quand il prie seul, il peut la prolonger comme il veut. »","en":"Hammam b. Munabbih reported:This is what Abu Huraira transmitted to us from Muhammad the Messenger of Allah (ﷺ), and he narrated (some) ahadith out of (these narrations and one of them is this): The Messenger of Allah (ﷺ) said: When any one of you stands to lead people In prayer, he should shorten it, for amongst them are the aged, and amongst them are the weak, but when he prays by himself, he may prolong his prayer as he likes","ref":{"ar":"رواه مسلم 1047","fr":"Muslim 1047","en":"Muslim 1047"}},{"type":"hadith","ar":"أفطر عندكم الصائمون وأكل طعامكم الأبرار","fr":"Rapporté par Anas ibn Malik رضي الله عنه : Le Prophète ﷺ vint rendre visite à Sa’d ibn Ubaydah, qui lui servit du pain et de l’huile d’olive, et il en mangea. Ensuite, le Prophète ﷺ dit : « Que les jeûneurs rompent leur jeûne avec toi, que les pieux mangent ta nourriture, et que les anges prient pour toi. »","en":"Narrated Anas ibn Malik: The Prophet (ﷺ) came to visit Sa'd ibn Ubaydah, and he brought bread and olive oil, and he ate (them). Them). Then the Prophet (ﷺ) said: May the fasting (men) break their fast with you, and the pious eat your food, and the angels pray for blessing on you","ref":{"ar":"رواه أبي داود 3854","fr":"Abû Dâwûd 3854","en":"Abu Dawud 3854"}},{"type":"hadith","ar":"إذا جاء رمضان فتحت أبواب الجنة","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Quand Ramadan commence, les portes du Paradis sont ouvertes. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"When Ramadan begins, the gates of Paradise are opened","ref":{"ar":"رواه البخاري 1898","fr":"al-Bukhârî 1898","en":"Bukhari 1898"}},{"type":"hadith","ar":"إذا مات الإنسان انقطع عنه عمله إلا من ثلاثة","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Quand une personne meurt, ses actions s’arrêtent, sauf pour trois choses : une aumône continue, un savoir dont les gens profitent, ou un enfant pieux qui prie pour lui (le défunt). »","en":"Abu Huraira (Allah be pleased with him) reported Allah's Messenger (ﷺ) as saying:When a man dies, his acts come to an end, but three, recurring charity, or knowledge (by which people) benefit, or a pious son, who prays for him (for the deceased)","ref":{"ar":"رواه مسلم 4223","fr":"Muslim 4223","en":"Muslim 4223"}},{"type":"hadith","ar":"ذهب الظمأ وابتلت العروق وثبت الأجر إن شاء الله","fr":"Marwan ibn Salim al-Muqaffa' a dit : J’ai vu Ibn Umar رضي الله عنه prendre sa barbe dans sa main et couper ce qui dépassait une poignée. Il (Ibn Umar) a dit que le Prophète ﷺ disait lorsqu’il rompait son jeûne : « La soif est partie, les veines sont humidifiées, et la récompense est assurée, si Allah le veut. »","en":"Marwan ibn Salim al-Muqaffa' said: I saw Ibn Umar holding his beard with his hand and cutting what exceeded the handful of it. He (Ibn Umar) said that the Prophet (ﷺ) said when he broke his fast: Thirst has gone, the arteries are moist, and the reward is sure, if Allah wills","ref":{"ar":"رواه أبي داود 2357","fr":"Abû Dâwûd 2357","en":"Abu Dawud 2357"}},{"type":"hadith","ar":"من لم يدع قول الزور والعمل به","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Celui qui ne renonce pas au mensonge et aux mauvaises actions, Allah n’a pas besoin qu’il abandonne sa nourriture et sa boisson (c’est-à-dire qu’Allah n’accepte pas son jeûne). »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"Whoever does not give up forged speech and evil actions, Allah is not in need of his leaving his food and drink (i.e. Allah will not accept his fasting)","ref":{"ar":"رواه البخاري 1903","fr":"al-Bukhârî 1903","en":"Bukhari 1903"}},{"type":"hadith","ar":"يا ابن آدم مرضت فلم تعدني","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a interdit à ses compagnons de jeûner sans interruption (Saum Wisal)","en":"Abu Huraira reported that the Messenger of Allah (ﷺ) forbade (his Companions) to observe Saum Wisal","ref":{"ar":"رواه مسلم 2569","fr":"Muslim 2569","en":"Muslim 2569"}},{"type":"hadith","ar":"بارك الله لك وبارك عليك وجمع بينكما في خير","fr":"Rapporté par Abu Huraira رضي الله عنه : Lorsque le Prophète ﷺ félicitait un homme pour son mariage, il disait : « Qu’Allah te bénisse, qu’Il te comble de Ses bénédictions, et qu’Il vous réunisse tous les deux dans le bien. »","en":"Narrated AbuHurayrah: When the Prophet (ﷺ) congratulated a man on his marriage, he said: May Allah bless for you, and may He bless on you, and combine both of you in good (works)","ref":{"ar":"رواه أبي داود 2130","fr":"Abû Dâwûd 2130","en":"Abu Dawud 2130"}},{"type":"hadith","ar":"لا يزال الناس بخير ما عجلوا الفطر","fr":"Rapporté par Sahl ibn Sa`d : Le Messager d’Allah ﷺ a dit : « Les gens resteront sur la bonne voie tant qu’ils se dépêcheront de rompre le jeûne. »","en":"Narrated Sahl bin Sa`d:Allah's Messenger (ﷺ) said, \"The people will remain on the right path as long as they hasten the breaking of the fast","ref":{"ar":"رواه البخاري 1957","fr":"al-Bukhârî 1957","en":"Bukhari 1957"}},{"type":"hadith","ar":"أعوذ بكلمات الله التامات من شر ما خلق لم يضره شيء حتى يرتحل من منزله ذلك","fr":"Rapporté par Abu Huraira et Abu Sa’id رضي الله عنهما : Le Messager d’Allah ﷺ a dit : « Allah, le Sublime et le Majestueux, a dit : “Le jeûne est exclusivement pour Moi et c’est Moi qui en donnerai la récompense.” Il y a deux moments de joie pour le jeûneur : il se réjouit lorsqu’il rompt son jeûne et il est heureux lorsqu’il rencontre Allah. Par Allah, dans la main de Qui est la vie de Muhammad, l’haleine du jeûneur est plus agréable pour Allah que le parfum du musc. »","en":"Abu Huraira and Abu Sa'id (Allah be pleased with both of them) reported Allah's Messenger (ﷺ) (as saying):Allah, the Exalted and Majestic, said: Fast (is exclusively) meant for Me and I would give its reward. There are two (occasions) of joy for the observer of fast. He feels joy when he breaks the fast and he is happy when he meets Allah. By Allah in Whose Hand is the life of Muhammad, the breath of the observer of fast is sweeter to Allah than the fragrance of musk","ref":{"ar":"رواه مسلم 2708","fr":"Muslim 2708","en":"Muslim 2708"}},{"type":"hadith","ar":"اللهم لك الحمد أنت كسوتنيه","fr":"Rapporté par Abu Sa’id al-Khudri رضي الله عنه : Quand le Messager d’Allah ﷺ mettait un vêtement neuf, il le nommait (turban ou chemise), puis disait : « Ô Allah, à Toi la louange ! Comme Tu m’as habillé de ce vêtement, je Te demande le bien de ce vêtement et le bien de ce pour quoi il a été fabriqué, et je cherche refuge auprès de Toi contre le mal de ce vêtement et le mal de ce pour quoi il a été fabriqué. » Abu Nadrah a dit : Quand l’un des compagnons du Prophète ﷺ mettait un vêtement neuf, on lui disait : « Puisse-tu l’user et qu’Allah t’en donne un autre à la place. »","en":"Narrated AbuSa'id al-Khudri: When the Messenger of Allah (ﷺ) put on a new garment he mentioned it by name, turban or shirt, and would then say: O Allah, praise be to Thee! as Thou hast clothed me with it, I ask Thee for its good and the good of that for which it was made, and I seek refuge in Thee from its evil and the evil of that for which it was made. Abu Nadrah said: When any of the Companions of the Prophet (ﷺ) put on a new garment, he was told: May you wear it out and may Allah give you another in its place","ref":{"ar":"رواه أبي داود 4020","fr":"Abû Dâwûd 4020","en":"Abu Dawud 4020"}},{"type":"hadith","ar":"من صام يوما في سبيل الله بعد الله وجهه عن النار سبعين خريفا","fr":"Rapporté par Abu Sa`id : J’ai entendu le Prophète (ﷺ) dire : « En vérité, quiconque jeûne un jour pour plaire à Allah, Allah éloignera son visage du feu (de l’Enfer) d’une distance équivalente à un voyage de soixante-dix ans. »","en":"Narrated Abu Sa`id:I heard the Prophet (ﷺ) saying, \"Indeed, anyone who fasts for one day for Allah's Pleasure, Allah will keep his face away from the (Hell) fire for (a distance covered by a journey of) seventy years","ref":{"ar":"رواه البخاري 2840","fr":"al-Bukhârî 2840","en":"Bukhari 2840"}},{"type":"hadith","ar":"من سبح الله في دبر كل صلاة ثلاثا وثلاثين","fr":"Rapporté par Abu Huraira رضي الله عنه : Cinq actes relèvent de la fitra : la circoncision, le rasage des poils pubiens, la coupe des ongles, l’épilation des aisselles et la taille de la moustache","en":"Abu Huraira reported:Five are the acts quite akin to the Fitra, or five are the acts of Fitra: circumcision, shaving the pubes, cutting the nails, plucking the hair under the armpits and clipping the moustache","ref":{"ar":"رواه مسلم 597","fr":"Muslim 597","en":"Muslim 597"}},{"type":"hadith","ar":"بيت لا تمر فيه جياع أهله","fr":"Rapporté par Aisha رضي الله عنها : Le Prophète ﷺ a dit : « Une famille qui n’a pas de dattes connaîtra la faim. »","en":"’A’ishah reported the Prophet(ﷺ) as saying:A family which has no dates will be hungry","ref":{"ar":"رواه أبي داود 3831","fr":"Abû Dâwûd 3831","en":"Abu Dawud 3831"}},{"type":"hadith","ar":"ما من يوم يصبح العباد فيه إلا ملكان ينزلان","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Chaque jour, deux anges descendent du ciel. L’un d’eux dit : ‘Ô Allah ! Donne une compensation à celui qui dépense dans Ta cause’, et l’autre dit : ‘Ô Allah ! Détruis tout avare.’ »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"Every day two angels come down from Heaven and one of them says, 'O Allah! Compensate every person who spends in Your Cause,' and the other (angel) says, 'O Allah! Destroy every miser","ref":{"ar":"رواه البخاري 1442","fr":"al-Bukhârî 1442","en":"Bukhari 1442"}},{"type":"hadith","ar":"اللهم لا مانع لما أعطيت ولا معطي لما منعت ولا ينفع ذا الجد منك الجد","fr":"Rapporté par Abu Sa’id al-Khudri رضي الله عنه : Quand le Messager d’Allah ﷺ relevait la tête après l’inclinaison, il disait : « Ô Allah ! notre Seigneur, à Toi la louange qui remplirait tous les cieux et la terre, et tout ce qui Te plairait en plus de cela. Ô Toi qui es digne de louange et de gloire, Tu es le plus digne de ce qu’un serviteur peut dire, et nous sommes tous Tes serviteurs. Personne ne peut retenir ce que Tu donnes, ni donner ce que Tu retiens, et la richesse ne sert à rien face à Toi. »","en":"Abu Sa'id al-Khudri reported:When the Messenger of Allah (ﷺ) raised his head after bowing, he said: O Allah! our Lord, to Thee be the praise that would fill all the heavens and the earth, and all that it pleases Thee besides (them). O, thou art worthy of praise and glory, most worthy of what a servant says, and we all are Thy servants, no one can withhold what Thou givest or give what Thou withholdest, and riches cannot avail a wealthy person against Thee","ref":{"ar":"رواه مسلم 1071","fr":"Muslim 1071","en":"Muslim 1071"}},{"type":"hadith","ar":"البسوا من ثيابكم البياض فإنها من خير ثيابكم","fr":"Rapporté par Abdullah ibn Abbas رضي الله عنه : Le Prophète ﷺ a dit : « Portez vos vêtements blancs, car ce sont parmi vos meilleurs vêtements, et enveloppez vos morts dedans. Parmi les meilleurs collyres que vous utilisez, il y a l’antimoine (ithmid) : il clarifie la vue et fait pousser les cils. »","en":"Narrated Abdullah ibn Abbas: The Prophet (ﷺ) said: Wear your white garments, for they are among your best garments, and shroud your dead in them. Among the best types of collyrium you use is antimony (ithmid): it clears the vision and makes the hair sprout","ref":{"ar":"رواه أبي داود 3878","fr":"Abû Dâwûd 3878","en":"Abu Dawud 3878"}},{"type":"hadith","ar":"أنفق يا ابن آدم أنفق عليك","fr":"Rapporté par Abu Huraira : Le Messager d'Allah (ﷺ) a dit : « Allah a dit : Ô fils d’Adam ! Dépense, et Je dépenserai pour toi. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Allah said, 'O son of Adam! Spend, and I shall spend on you","ref":{"ar":"رواه البخاري 5352","fr":"al-Bukhârî 5352","en":"Bukhari 5352"}},{"type":"hadith","ar":"اللهم اهدني وسددني","fr":"Rapporté par Abu Bishr : Ce hadith a été rapporté avec la même chaîne de transmetteurs, avec une légère différence dans les mots, et il a ajouté : « Durant tout un mois depuis qu’il est arrivé à Médine. »","en":"This hadith has been narrated on the authority of Abu Bishr with the same chain of transmitters (with a slight variation of words and these are), that he (the narrator) said:\" During any month continuously since he came to Medina","ref":{"ar":"رواه مسلم 2725","fr":"Muslim 2725","en":"Muslim 2725"}},{"type":"hadith","ar":"من كان له شعر فليكرمه","fr":"Rapporté par Abu Hurayrah رضي الله عنه : Le Prophète ﷺ a dit : « Celui qui a des cheveux doit en prendre soin. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: He who has hair should honour it","ref":{"ar":"رواه أبي داود 4163","fr":"Abû Dâwûd 4163","en":"Abu Dawud 4163"}},{"type":"hadith","ar":"الساعي على الأرملة والمسكين كالمجاهد في سبيل الله","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Celui qui prend soin d’une veuve ou d’une personne pauvre est comme un combattant qui lutte pour la cause d’Allah, ou comme celui qui prie toute la nuit et jeûne toute la journée. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"The one who looks after a widow or a poor person is like a Mujahid (warrior) who fights for Allah's Cause, or like him who performs prayers all the night and fasts all the day","ref":{"ar":"رواه البخاري 5353","fr":"al-Bukhârî 5353","en":"Bukhari 5353"}},{"type":"hadith","ar":"اللهم مصرف القلوب صرف قلوبنا على طاعتك","fr":"Ce hadith a été rapporté par Zuhri avec la même chaîne de transmetteurs, qui a entendu l’Envoyé d’Allah ﷺ dire un jour semblable : « Je jeûne aujourd’hui, donc celui qui veut jeûner, qu’il le fasse. » Mais il n’a pas mentionné le reste du hadith","en":"This hadith has been narrated on the authority of Zuhri with the same chain of transmitters that be heard Allah's Apostle (ﷺ) as saying on a similar day:I am fasting today, so he who wishes to observe fast should do so; but he did not make mention of the rest of the hadith","ref":{"ar":"رواه مسلم 2655","fr":"Muslim 2655","en":"Muslim 2655"}},{"type":"hadith","ar":"ما من شيء أثقل في الميزان من حسن الخلق","fr":"Rapporté par Abud Darda’ رضي الله عنه : Le Prophète ﷺ a dit : « Rien n’est plus lourd dans la balance du croyant au Jour de la Résurrection que le bon caractère. » Abu al-Walid a dit : J’ai entendu ‘Ata al-Kaikharani dire : Abu Dawud a dit : Son nom est ‘Ata b. Ya‘qub. C’est l’oncle maternel d’Ibrahim b. Nafi’. On l’appelle Kaikharani ou Kukharani","en":"Narrated AbudDarda': The Prophet (ﷺ) said: There is nothing heavier than good character put in the scale of a believer on the Day of Resurrection. Abu al-Walid said: I heard 'Ata al-Kaikharani say: Abu Dawud said: His name is 'Ata b. Ya'qub. He is the maternal uncle of Ibrahim b. Nafi'. He is called Kaikharani or Kukharani","ref":{"ar":"رواه أبي داود 4799","fr":"Abû Dâwûd 4799","en":"Abu Dawud 4799"}},{"type":"hadith","ar":"أنا وكافل اليتيم في الجنة هكذا","fr":"Rapporté par Sahl : Le Messager d’Allah (ﷺ) a dit : « Moi et celui qui prend soin d’un orphelin, nous serons comme cela au Paradis », en montrant son majeur et son index et en les séparant légèrement","en":"Narrated Sahl:Allah's Messenger (ﷺ) said, \"I and the one who looks after an orphan will be like this in Paradise,\" showing his middle and index fingers and separating them","ref":{"ar":"رواه البخاري 5304","fr":"al-Bukhârî 5304","en":"Bukhari 5304"}},{"type":"hadith","ar":"اللهم إني أعوذ بك من شر ما عملت ومن شر ما لم أعمل","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Si quelqu’un oublie qu’il jeûne et mange ou boit, qu’il termine son jeûne, car c’est Allah seul qui l’a nourri et abreuvé. »","en":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:If anyone forgets that he is fasting and eats or drinks he should complete his fast, for it is only Allah Who has fed him and given him drink","ref":{"ar":"رواه مسلم 2716","fr":"Muslim 2716","en":"Muslim 2716"}},{"type":"hadith","ar":"أسأل الله العظيم رب العرش العظيم أن يشفيك","fr":"Rapporté par Abdullah ibn Abbas رضي الله عنه : Le Prophète ﷺ a dit : « Si quelqu’un rend visite à un malade dont l’heure de la mort n’est pas encore venue et dit sept fois en sa présence : “Je demande à Allah, le Tout-Puissant, Seigneur du Trône immense, de te guérir”, Allah le guérira de cette maladie. »","en":"Narrated Abdullah ibn Abbas: The Prophet (ﷺ) said: If anyone visits a sick whose time (of death) has not come, and says with him seven times: I ask Allah, the Mighty, the Lord of the mighty Throne, to cure you, Allah will cure him from that disease","ref":{"ar":"رواه أبي داود 3106","fr":"Abû Dâwûd 3106","en":"Abu Dawud 3106"}},{"type":"hadith","ar":"لا تحقرن جارة لجارتها ولو فرسن شاة","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Ô femmes musulmanes ! Aucune d’entre vous ne doit mépriser le cadeau offert par sa voisine, même s’il ne s’agit que des pieds d’un mouton (la partie sans chair des pattes). »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"O Muslim women! None of you should look down upon the gift sent by her female neighbor even if it were the trotters of the sheep (fleshless part of legs)","ref":{"ar":"رواه البخاري 2566","fr":"al-Bukhârî 2566","en":"Bukhari 2566"}},{"type":"hadith","ar":"الرحم معلقة بالعرش","fr":"Rapporté par Sahl b. Sa’d رضي الله عنه : Un hadith similaire a été transmis par Sahl b. Sa’d","en":"A hadith like this has been transmitted by Sahl b. Sa'd","ref":{"ar":"رواه مسلم 2555","fr":"Muslim 2555","en":"Muslim 2555"}},{"type":"hadith","ar":"استغفروا لأخيكم وسلوا له التثبيت فإنه الآن يسأل","fr":"Rapporté par Uthman ibn Affan رضي الله عنه : Chaque fois que le Prophète ﷺ avait terminé d’enterrer un mort, il restait près de lui (c’est-à-dire de sa tombe) et disait : « Demandez pardon pour votre frère et demandez pour lui la fermeté, car il va maintenant être interrogé. »","en":"Narrated Uthman ibn Affan: Whenever the Prophet (ﷺ) became free from burying the dead, he used to stay at him (i.e. his grave) and say: Seek forgiveness for your brother, and beg steadfastness for him, for he will be questioned now. Abu Dawud said: The full name of the narrator Buhair is Buhair b. Raisan","ref":{"ar":"رواه أبي داود 3221","fr":"Abû Dâwûd 3221","en":"Abu Dawud 3221"}},{"type":"hadith","ar":"كلكم راع وكلكم مسئول عن رعيته","fr":"Rapporté par Ibn `Umar : Le Prophète (ﷺ) a dit : « Chacun de vous est un gardien et est responsable de ce dont il a la charge. Le dirigeant est un gardien, l’homme est gardien de sa famille, la femme est gardienne de la maison de son mari et de ses enfants ; ainsi, chacun de vous est un gardien et responsable de ce dont il a la charge. »","en":"Narrated Ibn `Umar:The Prophet (ﷺ) said, \"All of you are guardians and are responsible for your wards. The ruler is a guardian and the man is a guardian of his family; the lady is a guardian and is responsible for her husband's house and his offspring; and so all of you are guardians and are responsible for your wards","ref":{"ar":"رواه البخاري 5200","fr":"al-Bukhârî 5200","en":"Bukhari 5200"}},{"type":"hadith","ar":"إن من أبر البر صلة الرجل أهل ود أبيه","fr":"Rapporté par Zayd b. Thabit رضي الله عنه : Il a dit : « Nous avons pris le repas avant l’aube avec le Messager d’Allah ﷺ. Ensuite, nous nous sommes levés pour la prière. J’ai demandé : “Combien de temps s’est écoulé entre les deux (le repas du sahur et la prière) ?” Il a répondu : “Le temps de réciter cinquante versets.” »","en":"Zaid b. Thabit (Allah be pleased with him) said:We took meal shortly before dawn along with the Messenger of Allah (ﷺ). We then stood up for prayer. I said: How much span of time was there between the two (acts, i. e. taking of Sahri and observing of prayer)? He said (a span of reciting) fifty verses","ref":{"ar":"رواه مسلم 2552","fr":"Muslim 2552","en":"Muslim 2552"}},{"type":"hadith","ar":"نعم سحور المؤمن التمر","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Prophète ﷺ a dit : « Quel bon repas que celui des croyants, composé de dattes, juste avant l’aube ! »","en":"Narrated Abu Hurairah:The Prophet (ﷺ) as saying: How good is the believers meal of dates shortly before dawn","ref":{"ar":"رواه أبي داود 2345","fr":"Abû Dâwûd 2345","en":"Abu Dawud 2345"}},{"type":"hadith","ar":"تنكح المرأة لأربع","fr":"Rapporté par Abou Hourayra : Le Prophète (ﷺ) a dit : « On épouse une femme pour quatre raisons : sa richesse, sa famille, sa beauté et sa religion. Choisis la femme pieuse, sinon tu seras perdant. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"A woman is married for four things, i.e., her wealth, her family status, her beauty and her religion. So you should marry the religious woman (otherwise) you will be a losers","ref":{"ar":"رواه البخاري 5090","fr":"al-Bukhârî 5090","en":"Bukhari 5090"}},{"type":"hadith","ar":"أتدرون ما المفلس","fr":"Rapporté par Urwa ibn Zubair : Aïcha, la Mère des croyants رضي الله عنها, lui a appris que le Messager d’Allah ﷺ l’a embrassée alors qu’il jeûnait","en":"Urwa b. Zubair narrated that 'A'isha the Mother of the Believers (Allah be pleased with her) informed him that the Messenger of Allah (ﷺ) kissed her while fasting","ref":{"ar":"رواه مسلم 2581","fr":"Muslim 2581","en":"Muslim 2581"}},{"type":"hadith","ar":"لا يحل لرجل أن يفرق بين اثنين إلا بإذنهما","fr":"Rapporté par Abdullah ibn Amr ibn al-‘As رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Il n’est pas permis de séparer deux personnes sans leur accord. »","en":"Narrated Abdullah ibn Amr ibn al-'As: The Messenger of Allah (ﷺ) said: It is not lawful for a man to separate two persons except with their permission","ref":{"ar":"رواه أبي داود 4845","fr":"Abû Dâwûd 4845","en":"Abu Dawud 4845"}},{"type":"hadith","ar":"يسلم الصغير على الكبير والمار على القاعد والقليل على الكثير","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Le plus jeune doit saluer le plus âgé, celui qui passe doit saluer celui qui est assis, et le petit groupe doit saluer le grand groupe. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"The young should greet the old, the passer by should greet the sitting one, and the small group of persons should greet the large group of persons","ref":{"ar":"رواه البخاري 6231","fr":"al-Bukhârî 6231","en":"Bukhari 6231"}},{"type":"hadith","ar":"والذي نفسي بيده لو لم تذنبوا لذهب الله بكم","fr":"Rapporté par Ghailan b. Jarir avec la même chaîne de transmetteurs, mais avec une différence : il n’est fait mention que du lundi et non du jeudi","en":"This hadith has been narrated by Ghailan b. Jarir with the same chain of transmitters, but with one variation, that there has been made mention of Monday and not of Thursday","ref":{"ar":"رواه مسلم 2749","fr":"Muslim 2749","en":"Muslim 2749"}},{"type":"hadith","ar":"خير المجالس أوسعها","fr":"Rapporté par Abu Sa‘id al-Khudri : J’ai entendu le Messager d’Allah ﷺ dire : « Les meilleurs endroits où s’asseoir sont ceux qui offrent le plus d’espace. » Abu Dawud a précisé : Le nom de ‘Abd al-Rahman b. Abi ‘Amr est ‘Abd al-Rahman b. ‘Amr b. Abi ‘Umrat al-Ansari","en":"Narrated AbuSa'id al-Khudri: I heard the Messenger of Allah (ﷺ) as saying: The best places to sit are those which provide most room. Abu Dawud said: The name of 'Abd al-Rahman b. Abi 'Amr is 'Abd al-Rahman b. 'Amr b. Abi 'Umrat al-Ansari","ref":{"ar":"رواه أبي داود 4820","fr":"Abû Dâwûd 4820","en":"Abu Dawud 4820"}},{"type":"hadith","ar":"إذا عطس أحدكم فليقل الحمد لله","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Si l’un d’entre vous éternue, il doit dire : “Al-Hamduli l-lah” (Louange à Allah), et son frère musulman ou son compagnon doit lui répondre : “Yar-hamuka-l-lah” (Qu’Allah te fasse miséricorde). Quand ce dernier dit : “Yar-hamuka-l-lah”, le premier doit répondre : “Yahdikumul-lah wa Yuslih balakum” (Qu’Allah vous guide et améliore votre situation). »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \" If anyone of you sneezes, he should say 'Al-Hamduli l-lah' (Praise be to Allah), and his (Muslim) brother or companion should say to him, 'Yar-hamuka-l-lah' (May Allah bestow his Mercy on you). When the latter says 'Yar-hamuka-llah\", the former should say, 'Yahdikumul-lah wa Yuslih balakum' (May Allah give you guidance and improve your condition)","ref":{"ar":"رواه البخاري 6224","fr":"al-Bukhârî 6224","en":"Bukhari 6224"}},{"type":"hadith","ar":"من نام عن حزبه أو عن شيء منه فقرأه فيما بين صلاة الفجر وصلاة الظهر كتب له كأنما قرأه من الليل","fr":"Rapporté par ‘Ubaid b. Umair رضي الله عنه : On a rapporté à ‘Aïsha رضي الله عنها qu’Abdullah b. ‘Amr ordonnait aux femmes de défaire leurs tresses pour le bain. Elle a dit : « C’est étrange qu’Ibn ‘Amr ordonne cela aux femmes ; pourquoi ne leur demande-t-il pas aussi de se raser la tête ? Moi et le Messager d’Allah ﷺ avons pris un bain dans le même récipient. Je n’ai rien fait d’autre que de verser trois poignées d’eau sur ma tête. »","en":"Ubaid b. Umair reported:It was conveyed to 'A'isha that 'Abdullah b. 'Amr ordered the women to undo the (plaits) of hair on their heads. She said: How strange it is for Ibn 'Amr that he orders the women to undo the plaits of their head while taking a bath; why does he not order them to shave their beads? I and the Messenger of Allah (ﷺ) took bath from one vessel. I did no more than this that I poured three handfuls of water over my head","ref":{"ar":"رواه مسلم 747","fr":"Muslim 747","en":"Muslim 747"}},{"type":"hadith","ar":"ما من قوم يقومون من مجلس لا يذكرون الله فيه إلا قاموا عن مثل جيفة حمار","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Prophète ﷺ a dit : « Les gens qui quittent une assemblée où ils n’ont pas évoqué Allah, c’est comme s’ils se levaient d’une charogne d’âne, et cela leur causera du regret. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: People who get up from an assembly in which they did not remember Allah will be just as if they had got up from an ass's corpse, and it will be a cause of grief to them","ref":{"ar":"رواه أبي داود 4855","fr":"Abû Dâwûd 4855","en":"Abu Dawud 4855"}},{"type":"hadith","ar":"ما عاب النبي صلى الله عليه وسلم طعاما قط","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) n'a jamais critiqué un plat (auquel il était invité) : il mangeait s'il aimait, et il laissait s'il n'aimait pas","en":"Narrated Abu Huraira:The Prophet (ﷺ) never criticized any food (he was invited to) but he used to eat if he liked the food, and leave it if he disliked it","ref":{"ar":"رواه البخاري 5409","fr":"al-Bukhârî 5409","en":"Bukhari 5409"}},{"type":"hadith","ar":"من نسي وهو صائم فأكل أو شرب فليتم صومه","fr":"Rapporté par Umar b. Abu Salama : J’ai vu le Messager d’Allah ﷺ prier avec un seul vêtement dont les extrémités se croisaient. ‘Isa b. Hammad a ajouté : « qu’il posait sur ses épaules »","en":"Umar b. Abu Salama reported:I saw the Messenger of Allah (ﷺ) praying in a single garment with its ends crossing each other. 'Isa b. Hammad added:\" placing on his shoulders","ref":{"ar":"رواه مسلم 1155","fr":"Muslim 1155","en":"Muslim 1155"}},{"type":"hadith","ar":"من قعد مقعدا لم يذكر الله فيه كانت عليه من الله ترة","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Prophète ﷺ a dit : « Si quelqu’un s’assoit à un endroit sans se souvenir d’Allah, il sera privé d’un bienfait de la part d’Allah ; et s’il s’allonge à un endroit sans se souvenir d’Allah, il sera aussi privé d’un bienfait de la part d’Allah. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: If anyone sits at a place where he does not remember Allah, deprivation will descend on him from Allah; and if he lies at a place where he does not remember Allah, deprivation will descend on him from Allah","ref":{"ar":"رواه أبي داود 4856","fr":"Abû Dâwûd 4856","en":"Abu Dawud 4856"}},{"type":"hadith","ar":"لا يقيم الرجل الرجل من مجلسه","fr":"Rapporté par Ibn `Umar : Le Prophète (ﷺ) a dit : « Un homme ne doit pas demander à un autre de se lever de sa place (dans une assemblée) pour s’y asseoir. »","en":"Narrated Ibn `Umar:The Prophet (ﷺ) said, \"A man should not make another man get up from his (the latter's) seat (in a gathering) in order to sit there","ref":{"ar":"رواه البخاري 6269","fr":"al-Bukhârî 6269","en":"Bukhari 6269"}},{"type":"hadith","ar":"من تطهر في بيته ثم مشى إلى بيت من بيوت الله","fr":"Rapporté selon al-Zuhri avec la même chaîne de transmetteurs : « Le Prophète ﷺ a demandé de l’eau et l’a aspergée dessus. »","en":"This hadith has also been narrated from al-Zuhri with the same chain of narrators. (but for the words):\" He (the Holy Prophet) sent for water and sprinkled it over","ref":{"ar":"رواه مسلم 666","fr":"Muslim 666","en":"Muslim 666"}},{"type":"hadith","ar":"ألا أخبركم بأفضل من درجة الصيام والصلاة والصدقة","fr":"Rapporté par Abud Darda’ رضي الله عنه : Le Prophète ﷺ a dit : « Voulez-vous que je vous informe de ce qui a plus de valeur que le jeûne, la prière et l’aumône ? » Les gens répondirent : « Oui, ô Messager d’Allah ! » Il dit : « C’est de réconcilier les gens entre eux. La discorde est ce qui rase (c’est-à-dire détruit). »","en":"Narrated AbudDarda': The Prophet (ﷺ) said: Shall I not inform you of something more excellent in degree than fasting, prayer and almsgiving (sadaqah)? The people replied: Yes, Prophet of Allah! He said: It is putting things right between people, spoiling them is the shaver (destructive)","ref":{"ar":"رواه أبي داود 4919","fr":"Abû Dâwûd 4919","en":"Abu Dawud 4919"}},{"type":"hadith","ar":"لا يرحم الله من لا يرحم الناس","fr":"Rapporté par Jarir bin `Abdullah : Le Messager d’Allah (ﷺ) a dit : « Allah ne fera pas miséricorde à ceux qui ne sont pas miséricordieux envers les gens. »","en":"Narrated Jarir bin `Abdullah:Allah's Messenger (ﷺ) said, \"Allah will not be merciful to those who are not merciful to mankind","ref":{"ar":"رواه البخاري 7376","fr":"al-Bukhârî 7376","en":"Bukhari 7376"}},{"type":"hadith","ar":"إن في الليل لساعة لا يوافقها رجل مسلم يسأل الله خيرا من أمر الدنيا والآخرة إلا أعطاه إياه","fr":"Rapporté par une autre chaîne de transmetteurs : Umm Habiba bint Jahsh est venue voir le Messager d’Allah ﷺ alors qu’elle avait des saignements hors menstruation depuis sept ans, et le reste du hadith est rapporté comme celui de ‘Amr b. al-Harith jusqu’aux mots : « La couleur du sang est apparue dans l’eau. » Rien d’autre n’a été rapporté","en":"This hadith has been thus reported by another chain of transmitters:Umm Habiba b. Jahsh came to the Messenger of Allah (ﷺ) and she had been a mustahada for seven years, and the rest of the hadith was narrated like that of 'Amr b. al-Harith up to the words:\" There came the redness of the blood over water.\" and nothing was narrated beyond it","ref":{"ar":"رواه مسلم 757","fr":"Muslim 757","en":"Muslim 757"}},{"type":"hadith","ar":"لا يحل لمسلم أن يروع مسلما","fr":"Rapporté par AbdurRahman ibn AbuLayla : Les compagnons du Prophète ﷺ nous ont raconté qu’ils voyageaient avec lui. L’un d’eux s’est endormi, et un autre a pris la corde qu’il avait avec lui, ce qui l’a effrayé. Le Prophète ﷺ a dit : « Il n’est pas permis à un musulman d’effrayer un autre musulman. »","en":"Narrated AbdurRahman ibn AbuLayla: The Companions of the Prophet (ﷺ) told us that they were travelling with the Prophet (ﷺ). A man of them slept, and one of them went to the rope which he had with him. He took it, by which he was frightened. The Prophet (ﷺ) said: It is not lawful for a Muslim that he frightens a Muslim","ref":{"ar":"رواه أبي داود 5004","fr":"Abû Dâwûd 5004","en":"Abu Dawud 5004"}},{"type":"hadith","ar":"لا عدوى ولا طيرة ويعجبني الفأل","fr":"Rapporté par Anas : Le Prophète (ﷺ) a dit : « Il n’y a pas de ‘Adwa (aucune maladie contagieuse ne se transmet sans la permission d’Allah), ni de Tiyara, mais j’aime le bon Fal, c’est-à-dire le bon mot. »","en":"Narrated Anas:The Prophet (ﷺ) said, \"No 'Adwa (no contagious disease is conveyed to others without Allah's permission), nor Tiyara, but I like the good Fal, i.e., the good word","ref":{"ar":"رواه البخاري 5756","fr":"al-Bukhârî 5756","en":"Bukhari 5756"}},{"type":"hadith","ar":"قسمت الصلاة بيني وبين عبدي نصفين","fr":"Rapporté par Jabir b. 'Abdullah رضي الله عنه : J’ai entendu le Messager d’Allah ﷺ dire : « Une partie de ma communauté ne cessera de lutter pour la Vérité et restera victorieuse jusqu’au Jour de la Résurrection. » Il a dit : « Jésus, fils de Marie, descendra alors, et leur chef (des musulmans) l’invitera à diriger la prière, mais il dira : “Non, certains d’entre vous sont les chefs des autres.” C’est un honneur qu’Allah accorde à cette communauté. »","en":"Jabir b. 'Abdullah reported:I heard the Messenger of Allah (ﷺ) say: A section of my people will not cease fighting for the Truth and will prevail till the Day of Resurrection. He said: Jesus son of Mary would then descend and their (Muslims') commander would invite him to come and lead them in prayer, but he would say: No, some amongst you are commanders over some (amongst you). This is the honour from Allah for this Ummah","ref":{"ar":"رواه مسلم 395","fr":"Muslim 395","en":"Muslim 395"}},{"type":"hadith","ar":"لا يأخذن أحدكم متاع أخيه لاعبا ولا جادا","fr":"Rapporté par Abdullah ibn as-Sa'ib ibn Yazid : Le Messager d’Allah ﷺ a dit : « Aucun de vous ne doit prendre le bien de son frère, ni pour plaisanter, ni sérieusement. » Le rapporteur Sulayman a précisé : « Que ce soit pour s’amuser ou sérieusement. » Si quelqu’un prend le bâton de son frère, il doit le lui rendre","en":"Narrated Abdullah ibn as-Sa'ib ibn Yazid: The Messenger of Allah (ﷺ) said: None of you should take the property of his brother in amusement (i.e. jest), nor in earnest. The narrator Sulayman said: Out of amusement and out of earnest. If anyone takes the staff of his brother, he should return it. The transmitter Ibn Bashshar did not say \"Ibn Yazid, and he said: The Messenger of Allah (ﷺ) said","ref":{"ar":"رواه أبي داود 5003","fr":"Abû Dâwûd 5003","en":"Abu Dawud 5003"}},{"type":"hadith","ar":"ما أكل أحد طعاما قط خيرا من أن يأكل من عمل يده","fr":"Rapporté par Al-Miqdam : Le Prophète (ﷺ) a dit : « Personne n’a jamais mangé de meilleure nourriture que celle qu’il a gagnée par le travail de ses propres mains. Le Prophète d’Allah, David, vivait du fruit de son travail manuel. »","en":"Narrated Al-Miqdam:The Prophet (ﷺ) said, \"Nobody has ever eaten a better meal than that which one has earned by working with one's own hands. The Prophet of Allah, David (ﷺ) used to eat from the earnings of his manual labor","ref":{"ar":"رواه البخاري 2072","fr":"al-Bukhârî 2072","en":"Bukhari 2072"}},{"type":"hadith","ar":"من حفظ عشر آيات من أول سورة الكهف عصم من الدجال","fr":"Rapporté par Ibn Abbas : Le Messager d’Allah ﷺ est passé près d’une chèvre morte qui avait été donnée en aumône à la servante affranchie de Maymouna. Il a dit : « Pourquoi n’ont-ils pas pris sa peau ? Ils auraient pu la tanner et l’utiliser. »","en":"Ibn Abbas reported:The Messenger of Allah (ﷺ) happened to pass by a goat thrown (away) which had been in fact given to the freed slave-girl of Maimuna as charity. Upon this the Messenger of Allah (way peace he upon him) said: Why did they not get its skin? They had better tan it and make use of it","ref":{"ar":"رواه مسلم 809","fr":"Muslim 809","en":"Muslim 809"}},{"type":"hadith","ar":"الأحد الصمد الذي لم يلد ولم يولد ولم يكن له كفوا أحد","fr":"Rapporté par Buraydah ibn al-Hasib رضي الله عنه : Le Messager d’Allah ﷺ a entendu un homme dire : « Ô Allah, je Te demande, j’atteste qu’il n’y a de dieu que Toi, l’Unique, Celui vers qui les hommes se tournent, Qui n’a pas engendré et n’a pas été engendré, et à Qui nul n’est égal. » Le Prophète ﷺ a dit : « Tu as invoqué Allah avec Son Nom Suprême ; quand on Le prie avec ce nom, Il donne, et quand on L’invoque par ce nom, Il répond. »","en":"Narrated Buraydah ibn al-Hasib: The Messenger of Allah (ﷺ) heard a man saying: O Allah, I ask Thee, I bear witness that there is no god but Thou, the One, He to Whom men repair, Who has not begotten, and has not been begotten, and to Whom no one is equal, and he said: You have supplicated Allah using His Greatest Name, when asked with this name He gi
