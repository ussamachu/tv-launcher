ves, and when supplicated by this name he answers","ref":{"ar":"رواه أبي داود 1493","fr":"Abû Dâwûd 1493","en":"Abu Dawud 1493"}},{"type":"hadith","ar":"لأن يأخذ أحدكم حبله","fr":"Rapporté par Abou Hourayra : Le Messager d’Allah (ﷺ) a dit : Par Celui dans la Main de Qui est ma vie, il vaut mieux pour l’un de vous de prendre une corde, de couper du bois (dans la forêt), de le porter sur son dos et de le vendre (pour gagner sa vie), plutôt que de demander quelque chose à quelqu’un, qui peut lui donner ou non","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"By Him in Whose Hand my life is, it is better for anyone of you to take a rope and cut the wood (from the forest) and carry it over his back and sell it (as a means of earning his living) rather than to ask a person for something and that person may give him or not","ref":{"ar":"رواه البخاري 1470","fr":"al-Bukhârî 1470","en":"Bukhari 1470"}},{"type":"hadith","ar":"ما من مسلم يتوضأ فيحسن وضوءه ثم يقوم فيصلي ركعتين مقبل عليهما بقلبه ووجهه إلا وجبت له الجنة","fr":"Rapporté par Ibn Abbas رضي الله عنه : Il y eut une forte pluie du vivant du Prophète ﷺ. Le Prophète ﷺ a alors dit : « Certains se sont réveillés reconnaissants, d’autres ingrats envers Allah. Ceux qui ont été reconnaissants ont dit : “C’est une bénédiction d’Allah”, et ceux qui ont été ingrats ont dit : “Telle constellation avait raison.” » C’est à ce sujet que ce verset a été révélé : « Je jure par le coucher des étoiles… » jusqu’à la fin, « et vous niez votre subsistance. »","en":"It is reported on the authority of Ibn 'Abbas that there was (once) a downpour during the life of the Apostle (may peace and blessings be upon him Upon this the Apostle (may peace and blessings be upon him) observed:Some people entered the morning with gratitude and some with ingratitude (to Allah). Those who entered with gratitude said: This is the blessing of Allah, and those who entered with ingratitude said: Such and such asterism was right. It was upon this that the verse was revealed: I swear by the setting of the stars to the end and make your provision that you should disbelieve it","ref":{"ar":"رواه مسلم 234","fr":"Muslim 234","en":"Muslim 234"}},{"type":"hadith","ar":"ما من مسلم يبيت على ذكر طاهرا فيتعار من الليل فيسأل الله خيرا من الدنيا والآخرة إلا أعطاه إياه","fr":"Rapporté par Mu’adh ibn Jabal : Le Prophète ﷺ a dit : « Si un musulman s’endort en se souvenant d’Allah, en état de pureté, puis se réveille effrayé pendant la nuit et demande à Allah un bien de ce monde ou de l’au-delà, Allah le lui accorde sûrement. » Thabit al-Bunani a dit : AbuZabyah est venu nous rendre visite et nous a transmis ce hadith de Mu’adh ibn Jabal, du Prophète ﷺ. Thabit a ajouté : Untel a dit : « J’ai essayé de prononcer ces invocations en me réveillant, mais je n’y suis pas arrivé. »","en":"Narrated Mu'adh ibn Jabal: The Prophet (ﷺ) said: If a Muslim sleeps while remembering Allah, in the state of purification, is alarmed while asleep at night, and asks Allah for good in this world and in the Hereafter. He surely gives it to him. Thabit al-Bunani said: AbuZabyah came to visit us and he transmitted this tradition to us from Mu'adh ibn Jabal from the Prophet (ﷺ). Thabit said: So and so said: I tried my best to utter these (prayers) when I got up, but I could not do","ref":{"ar":"رواه أبي داود 5042","fr":"Abû Dâwûd 5042","en":"Abu Dawud 5042"}},{"type":"hadith","ar":"البيعان بالخيار ما لم يتفرقا","fr":"Rapporté par Ibn `Umar : Le Messager d'Allah (ﷺ) a dit : « Le vendeur et l'acheteur ont le choix d'annuler ou de confirmer la transaction tant qu'ils ne se sont pas séparés, ou si l'un d'eux dit à l'autre : “Décide (c'est-à-dire annule ou confirme la vente maintenant).” » Peut-être a-t-il dit : « Ou si c'est une vente optionnelle. » Ibn `Umar, Shuraih, Ash-Shu`bi, Tawus, Ata et Ibn Abu Mulaika sont d'accord sur ce jugement","en":"Narrated Ibn `Umar:Allah's Messenger (ﷺ) said, \"The seller and the buyer have the option of canceling or confirming the deal unless they separate, or one of them says to the other, 'Choose (i.e. decide to cancel or confirm the bargain now).\" Perhaps he said, 'Or if it is an optional sale.' \" Ibn `Umar, Shuraih, Ash-Shu`bi, Tawus, Ata, and Ibn Abu Mulaika agree upon this judgment","ref":{"ar":"رواه البخاري 2109","fr":"al-Bukhârî 2109","en":"Bukhari 2109"}},{"type":"hadith","ar":"ثنتي عشرة ركعة تطوعا غير فريضة إلا بنى الله له بيتا في الجنة","fr":"Rapporté par Abu Salama b. ‘Abd al-Rahman : Je suis allé avec le frère de lait d’Aïcha رضي الله عنها chez elle et il a demandé comment le Prophète ﷺ faisait le grand lavage après un rapport sexuel. Elle a fait venir un récipient équivalent à un Sa’ et elle a fait le grand lavage, alors qu’un rideau nous séparait d’elle. Elle a versé de l’eau sur sa tête trois fois. Abu Salama a dit : Les épouses du Prophète ﷺ attachaient leurs cheveux et ils arrivaient jusqu’aux oreilles (et ne descendaient pas plus bas)","en":"Abu Salamab. 'Abd al-Rahman reported:I along with the foster brother of 'A'isha went to her and he asked about the bath of the Apostle (ﷺ) because of sexual intercourse. She called for a vessel equal to a Sa' and she took a bath. and there was a curtain between us and her. She poured water on her head thrice and he (Abu Salama) said: The wives of the Apostle (ﷺ) collectedhair on their heads and these lopped up to ears (and did rot go beyond that)","ref":{"ar":"رواه مسلم 728","fr":"Muslim 728","en":"Muslim 728"}},{"type":"hadith","ar":"ثم نم على خاتمتها فإنها براءة من الشرك","fr":"Farwah ibn Nawfal a rapporté de son père que le Prophète ﷺ a dit à Nawfal (son père) : « Récite la sourate “Dis : Ô vous les mécréants !”, puis endors-toi à la fin de sa récitation, car elle est une déclaration de rejet du polythéisme. »","en":"Farwah b. Nawfal quoted his father as saying that the Prophet (ﷺ) said to Nawfal (his father):Recite (the Surah) 'Say, O you disbelievers!' and then go to sleep at its end, for it is a declaration of freedom from polytheism","ref":{"ar":"رواه أبي داود 5055","fr":"Abû Dâwûd 5055","en":"Abu Dawud 5055"}},{"type":"hadith","ar":"من أخذ أموال الناس يريد أداءها أدى الله عنه","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Celui qui prend l’argent des gens avec l’intention de le rembourser, Allah le remboursera pour lui, et celui qui le prend pour le gaspiller, alors Allah le détruira. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"Whoever takes the money of the people with the intention of repaying it, Allah will repay it on his behalf, and whoever takes it in order to spoil it, then Allah will spoil him","ref":{"ar":"رواه البخاري 2387","fr":"al-Bukhârî 2387","en":"Bukhari 2387"}},{"type":"hadith","ar":"الاستئذان ثلاث فإن أذن لك وإلا فارجع","fr":"Rapporté par Hisham b. ‘Urwa, d’après son père : On mentionna à ‘Aïcha la parole d’Ibn ‘Umar : « Le défunt serait puni à cause des lamentations de sa famille sur lui. » Elle dit : « Qu’Allah fasse miséricorde à Abu ‘Abd al-Rahman (le surnom d’Ibn ‘Umar), il a entendu quelque chose mais ne l’a pas bien retenu. En réalité, le cercueil d’un Juif passa devant le Messager d’Allah ﷺ alors que sa famille se lamentait sur lui. Il dit alors : “Vous pleurez et il est en train d’être puni.” »","en":"Hisham b. 'Urwa narrated on the authority of his father that the saying of Ibn 'Umar, viz.\" The dead would be punished because of the lamentation of his family over him\" was mentioned to 'A'isha. Upon this she said:May Allah have mercy upon Abu 'Abd al-Rahman (the kunya of Ibn 'Umar) that he heard something but could not retain it (well). (The fact is) that the bier of a Jew passed before the Messenger of Allah (ﷺ) and (the members of his family) were waiting over him. Upon this he said: You are wailing and he is being punished","ref":{"ar":"رواه مسلم 2153","fr":"Muslim 2153","en":"Muslim 2153"}},{"type":"hadith","ar":"أعيذكما بكلمات الله التامة من كل شيطان وهامة ومن كل عين لامة","fr":"Rapporté par Ibn ‘Abbas : Le Prophète ﷺ avait l’habitude de demander la protection d’Allah pour al-Hasan et al-Husayn en disant : « Je cherche protection pour vous deux auprès des paroles parfaites d’Allah contre tout démon, toute bête nuisible et contre le mauvais œil. » Puis il disait : « Votre père cherchait protection auprès d’Allah par ces mots pour Ismaïl et Ishaq. »","en":"Ibn ‘abbas said :The Prophet (May peace be upon him) used to seek refuge in Allah for al-Hasan and al-husain, saying ; I seek refuge for both of you in the perfect words of Allah from every devil and every poisonous thing and from the evil eye which influences. He would then say; your father sought refuge in Allah by them for Ismail and Ishaq. Abu Dawud said; this is a proof of the fact that the Quran is not created","ref":{"ar":"رواه أبي داود 4737","fr":"Abû Dâwûd 4737","en":"Abu Dawud 4737"}},{"type":"hadith","ar":"إذا سمعتم بالطاعون بأرض فلا تدخلوها","fr":"Rapporté par Saud : Le Prophète (ﷺ) a dit : « Si vous entendez parler d'une épidémie de peste dans une région, n'y entrez pas ; mais si la peste se déclare dans un endroit où vous vous trouvez, ne quittez pas cet endroit. »","en":"Narrated Saud:The Prophet (ﷺ) said, \"If you hear of an outbreak of plague in a land, do not enter it; but if the plague breaks out in a place while you are in it, do not leave that place","ref":{"ar":"رواه البخاري 5728","fr":"al-Bukhârî 5728","en":"Bukhari 5728"}},{"type":"hadith","ar":"إذا أكل أحدكم فليأكل بيمينه وإذا شرب فليشرب بيمينه","fr":"Rapporté par Ibn ‘Umar رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Quand l’un de vous veut manger, qu’il mange avec sa main droite. Et quand il veut boire, qu’il boive avec sa main droite, car le diable mange et boit avec sa main gauche. »","en":"Ibn 'Umar reported Allah's Messenger (ﷺ) as saying:When any one of you intends to eat (meal), he should eat with his right hand. and when he (intends) to drink he should drink with his right hand, for the Satan eats with his left hand and drinks with his left hand","ref":{"ar":"رواه مسلم 5265","fr":"Muslim 5265","en":"Muslim 5265"}},{"type":"hadith","ar":"اللهم اهدني فيمن هديت وعافني فيمن عافيت","fr":"Rapporté par Al-Hasan ibn Ali : Le Messager d’Allah ﷺ m’a appris des paroles à dire pendant le witr. (La version d’Ibn Jawwas précise : Je les dis dans l’invocation du witr.) Elles étaient : « Ô Allah, guide-moi parmi ceux que Tu as guidés, accorde-moi la sécurité parmi ceux à qui Tu l’as accordée, prends-moi sous Ta protection parmi ceux que Tu protèges, bénis ce que Tu m’as donné, protège-moi du mal de ce que Tu as décrété, car c’est Toi qui décrètes, et rien n’est décrété contre Toi. Celui que Tu protèges n’est jamais humilié. Béni et Exalté sois-Tu, notre Seigneur. »","en":"Narrated Al-Hasan ibn Ali: The Messenger of Allah (ﷺ) taught me some words that I say during the witr. (The version of Ibn Jawwas has: I say them in the supplication of the witr.) They were: \"O Allah, guide me among those Thou hast guided, grant me security among those Thou hast granted security, take me into Thy charge among those Thou hast taken into Thy charge, bless me in what Thou hast given, guard me from the evil of what Thou hast decreed, for Thou dost decree, and nothing is decreed for Thee. He whom Thou befriendest is not humbled. Blessed and Exalted art Thou, our Lord","ref":{"ar":"رواه أبي داود 1425","fr":"Abû Dâwûd 1425","en":"Abu Dawud 1425"}},{"type":"hadith","ar":"الحبة السوداء شفاء من كل داء إلا السام","fr":"Rapporté par Abu Huraira : J’ai entendu le Messager d’Allah (ﷺ) dire : « Il y a un remède dans le cumin noir pour toutes les maladies sauf la mort. »","en":"Narrated Abu Huraira:I heard Allah's Messenger (ﷺ) saying, \"There is healing in black cumin for all diseases except death","ref":{"ar":"رواه البخاري 5688","fr":"al-Bukhârî 5688","en":"Bukhari 5688"}},{"type":"hadith","ar":"من يدخل الجنة ينعم لا يبأس","fr":"Rapporté par Aishah رضي الله عنها : Je vois encore la brillance du parfum à l’endroit où les cheveux étaient séparés sur la tête du Messager d’Allah ﷺ alors qu’il était en état d’ihram","en":"A'isha (Allah be pleased with her) said:I still seem to see the glistening of the perfume where the hair was parted on Allah's Messeinger's (ﷺ) head while he was in the state of Ihram","ref":{"ar":"رواه مسلم 2836","fr":"Muslim 2836","en":"Muslim 2836"}},{"type":"hadith","ar":"من تصبح كل يوم سبع تمرات عجوة","fr":"Rapporté par Sa`d : Le Messager d’Allah (ﷺ) a dit : « Celui qui mange sept dattes ‘Ajwa chaque matin ne sera pas touché par le poison ou la magie le jour où il les mange. »","en":"Narrated Sa`d:Allah's Messenger (ﷺ) said, \"He who eats seven 'Ajwa dates every morning, will not be affected by poison or magic on the day he eats them","ref":{"ar":"رواه البخاري 5445","fr":"al-Bukhârî 5445","en":"Bukhari 5445"}},{"type":"hadith","ar":"لتؤدن الحقوق إلى أهلها يوم القيامة","fr":"Un hadith similaire a été rapporté par Yahya ibn Abu Kathir avec la même chaîne de transmetteurs","en":"A hadith like this has been narrated by Yahya b. Abu Kathir with the same chain of transmitters","ref":{"ar":"رواه مسلم 2582","fr":"Muslim 2582","en":"Muslim 2582"}},{"type":"hadith","ar":"الجنة أقرب إلى أحدكم من شراك نعله","fr":"Rapporté par `Abdullah : Le Prophète (ﷺ) a dit : « Le Paradis est plus proche de chacun de vous que la lanière de sa chaussure, et il en est de même pour le Feu (de l’Enfer). »","en":"Narrated `Abdullah:The Prophet (ﷺ) said, \"Paradise is nearer to any of you than the Shirak (leather strap) of his shoe, and so is the (Hell) Fire","ref":{"ar":"رواه البخاري 6488","fr":"al-Bukhârî 6488","en":"Bukhari 6488"}},{"type":"hadith","ar":"اللهم افتح لي أبواب رحمتك","fr":"Rapporté par Abu Usaid : Le Messager d’Allah ﷺ a dit : « Quand l’un d’entre vous entre dans la mosquée, qu’il dise : “Ô Allah ! ouvre-moi les portes de Ta miséricorde.” Et quand il en sort, qu’il dise : “Ô Allah ! je Te demande Ta grâce.” » (Imam Muslim a dit : J’ai entendu Yahya dire : J’ai copié ce hadith de la compilation de Sulaiman b. Bilal)","en":"Abu Usaid reported that the Messenger of Allah (ﷺ) said:When any one of you enters the mosque, he should say:\" O Allah! open for me the doors of Thy mercy\" ; and when he steps out he should say: 'O Allah! I beg of Thee Thy Grace.\" (Imam Muslim said: I heard Yahya saying: I transcribed this hadith from the compilation of Sulaiman b. Bilal)","ref":{"ar":"رواه مسلم 1652","fr":"Muslim 1652","en":"Muslim 1652"}},{"type":"hadith","ar":"إن في الجنة لشجرة يسير الراكب في ظلها مائة عام","fr":"Rapporté par Sahl bin Sa'd : Le Messager d’Allah (ﷺ) a dit : « Au Paradis, il y a un arbre si grand qu’un cavalier pourrait voyager cent ans sous son ombre sans en sortir. »","en":"Narrated Sahl bin Sa'd: Allah's Messenger (ﷺ) said, \"In Paradise there is a tree so big that in its shade a rider may travel for one hundred years without being able to cross it","ref":{"ar":"رواه البخاري 6552","fr":"al-Bukhârî 6552","en":"Bukhari 6552"}},{"type":"hadith","ar":"تلك عاجل بشرى المؤمن","fr":"Rapporté par Abdullah ibn ‘Umar رضي الله عنهما : (Les Arabes) d’avant l’Islam jeûnaient le jour de ‘Ashura, et le Messager d’Allah ﷺ aussi, ainsi que les musulmans, avant que le jeûne du Ramadan ne devienne obligatoire. Mais quand cela est devenu obligatoire, le Messager d’Allah ﷺ a dit : « ‘Ashura est un des jours d’Allah ; que celui qui veut jeûner le fasse, et que celui qui ne veut pas s’en abstienne. »","en":"Abdullah b. 'Umar (Allah be pleased with them) reported that (the Arabs of) pre-Islamic days used to observe fast on the day of Ashura and the Messenger of Allah (ﷺ) observed it and the Muslims too (observed it) before fasting in Ramadan became obligatory. But when it became obligatory, the Messenger of Allah (ﷺ) said:'Ashura is one of the days of Allah, so he who wished should observe fast and he who wished otherwise should abandon it","ref":{"ar":"رواه مسلم 2642","fr":"Muslim 2642","en":"Muslim 2642"}},{"type":"hadith","ar":"موضع سوط في الجنة خير من الدنيا وما فيها","fr":"Rapporté par Sahl bin Sa`d Al-Saidi : Le Messager d’Allah ﷺ a dit : « Un endroit au Paradis de la taille d’un fouet vaut mieux que tout ce monde et ce qu’il contient. »","en":"Narrated Sahl bin Sa`d Al-Saidi:Allah's Messenger (ﷺ) said, \"A place in Paradise equal to the size of a lash is better than the whole world and whatever is in it","ref":{"ar":"رواه البخاري 3250","fr":"al-Bukhârî 3250","en":"Bukhari 3250"}},{"type":"hadith","ar":"لكل داء دواء فإذا أصيب دواء الداء برأ بإذن الله","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ annonça aux gens la mort du Négus le jour même de son décès. Il les fit sortir vers le lieu de prière et dirigea la prière funéraire avec quatre takbirs","en":"Abu Huraira reported that the Messenger of Allah (ﷺ) gave the people news of the death of Negus on the day he died, and he took them out to the place of prayer and observed four takbirs","ref":{"ar":"رواه مسلم 2204","fr":"Muslim 2204","en":"Muslim 2204"}},{"type":"hadith","ar":"كل أمتي يدخلون الجنة إلا من أبى","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Tous mes compagnons entreront au Paradis sauf ceux qui refusent. » Ils ont demandé : « Ô Messager d’Allah (ﷺ), qui refusera ? » Il a répondu : « Celui qui m’obéit entrera au Paradis, et celui qui me désobéit est celui qui refuse d’y entrer. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"All my followers will enter Paradise except those who refuse.\" They said, \"O Allah's Messenger (ﷺ)! Who will refuse?\" He said, \"Whoever obeys me will enter Paradise, and whoever disobeys me is the one who refuses (to enter it)","ref":{"ar":"رواه البخاري 7280","fr":"al-Bukhârî 7280","en":"Bukhari 7280"}},{"type":"hadith","ar":"فإني رسول الله إليك بأن الله قد أحبك كما أحببته فيه","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Abstenez-vous du jeûne continu (Saum Wisal). » Ses compagnons ont dit : « Messager d’Allah, mais toi tu observes le jeûne continu. » Il a répondu : « Vous n’êtes pas comme moi dans ce domaine, car je passe la nuit dans un état où mon Seigneur me nourrit et m’abreuve. Faites des actions que vous pouvez supporter. »","en":"Abu Huraira (Allah be pleased with him) reported Allah's Messenger (ﷺ) as saying:Abstain from Saum-Wisal. They (his Companions) said: Messenger of Allah, but you observe Saum Wisal. Upon this he said: You are not like me in this matter, for I spend my night (in a state) that my Lord feeds me and provides me drink Devote yourselves to the deeds (the burden of which) you can bear","ref":{"ar":"رواه مسلم 2567","fr":"Muslim 2567","en":"Muslim 2567"}},{"type":"hadith","ar":"أسعد الناس بشفاعتي يوم القيامة من قال لا إله إلا الله خالصا من قلبه","fr":"Rapporté par Abu Huraira : J’ai dit : « Ô Messager d’Allah (ﷺ) ! Qui sera la personne la plus chanceuse à bénéficier de ton intercession le Jour de la Résurrection ? » Le Messager d’Allah (ﷺ) a dit : Ô Abu Huraira ! « Je pensais que personne ne me poserait cette question avant toi, car je connais ton désir d’apprendre les hadiths. La personne la plus chanceuse à bénéficier de mon intercession le Jour de la Résurrection sera celle qui aura dit sincèrement du fond du cœur : “Nul n’a le droit d’être adoré sauf Allah.” »","en":"Narrated Abu Huraira:I said: \"O Allah's Messenger (ﷺ)! Who will be the luckiest person, who will gain your intercession on the Day of Resurrection?\" Allah's Messenger (ﷺ) said: \"O Abu Huraira! I have thought that none will ask me about it before you as I know your longing for the (learning of) Hadiths. The luckiest person who will have my intercession on the Day of Resurrection will be the one who said sincerely from the bottom of his heart \"None has the right to be worshipped but Allah","ref":{"ar":"رواه البخاري 99","fr":"al-Bukhârî 99","en":"Bukhari 99"}},{"type":"hadith","ar":"فزوروا القبور فإنها تذكر الموت","fr":"Rapporté par Anas b. Malik رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Complétez les rangs, car je vous vois même derrière mon dos. »","en":"Anas b. Malik reported:The Messenger of Allah (ﷺ) said: Complete the rows, for I can see you behind my back","ref":{"ar":"رواه مسلم 976","fr":"Muslim 976","en":"Muslim 976"}},{"type":"hadith","ar":"إن رحمتي غلبت غضبي","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Quand Allah a terminé la création, Il a écrit dans Son Livre qui est auprès de Lui sur le Trône : ‘Ma Miséricorde l’emporte sur Ma colère.’ »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"When Allah completed the creation, He wrote in His Book which is with Him on His Throne, \"My Mercy overpowers My Anger","ref":{"ar":"رواه البخاري 3194","fr":"al-Bukhârî 3194","en":"Bukhari 3194"}},{"type":"hadith","ar":"اللهم اجعل رزق آل محمد قوتا","fr":"Rapporté par Anas : Le Messager d’Allah ﷺ entendait les pleurs d’un enfant en compagnie de sa mère pendant la prière, et il récitait alors une sourate courte ou brève","en":"Anas reported:The Messenger of Allah (ﷺ) would listen to the crying of a lad in the company of his mother, in prayer, and he would recite a short surah or a small surah","ref":{"ar":"رواه مسلم 1055","fr":"Muslim 1055","en":"Muslim 1055"}},{"type":"hadith","ar":"جعل الله الرحمة مائة جزء","fr":"Rapporté par Abu Huraira : J’ai entendu le Messager d’Allah (ﷺ) dire : « Allah a partagé la miséricorde en cent parties. Il en a gardé quatre-vingt-dix-neuf auprès de Lui et a fait descendre une seule partie sur la terre. Grâce à cette unique part, les créatures sont compatissantes entre elles, au point que la jument soulève son sabot pour ne pas blesser son petit. »","en":"Narrated Abu Huraira:I heard Allah's Messenger (ﷺ) saying, Allah divided Mercy into one hundred parts. He kept ninety nine parts with Him and sent down one part to the earth, and because of that, its one single part, His Creations are merciful to each other, so that even the mare lifts up its hoofs away from its baby animal, lest it should trample on it","ref":{"ar":"رواه البخاري 6000","fr":"al-Bukhârî 6000","en":"Bukhari 6000"}},{"type":"hadith","ar":"إن الله لا يظلم مؤمنا حسنة يعطى بها في الدنيا ويجزى بها في الآخرة","fr":"Rapporté par Abu Zubair : Il a entendu Jabir b. 'Abdullah رضي الله عنهما dire, lorsqu’on l’a interrogé sur les lieux pour entrer en état d’Ihram : « J’ai entendu (et il a alors rapporté directement, je pense, du Messager d’Allah ﷺ). »","en":"Abu Zubair reported that he heard Jabir b. 'Abdullah (Allah be pleased with them) saying that as he was asked about (the places for entering upon the) state of ihram, he said:I heard (and he then carried the narration directly, I think to) the Messenger of Allah (ﷺ)","ref":{"ar":"رواه مسلم 2808","fr":"Muslim 2808","en":"Muslim 2808"}},{"type":"hadith","ar":"إذا أحب الله العبد نادى جبريل","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Si Allah aime une personne, Il appelle Gabriel en disant : ‘Allah aime untel ; ô Gabriel, aime-le.’ Gabriel l’aimera alors et annoncera aux habitants du ciel : ‘Allah aime untel, alors aimez-le aussi’, et tous les habitants du ciel l’aimeront, puis il recevra l’acceptation des gens sur la terre. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"If Allah loves a person, He calls Gabriel saying, 'Allah loves so and-so; O Gabriel! Love him.' Gabriel would love him and make an announcement amongst the inhabitants of the Heaven. 'Allah loves so-and-so, therefore you should love him also,' and so all the inhabitants of the Heaven would love him, and then he is granted the pleasure of the people on the earth","ref":{"ar":"رواه البخاري 3209","fr":"al-Bukhârî 3209","en":"Bukhari 3209"}},{"type":"hadith","ar":"لا يصبر على لأوائها وشدتها أحد إلا كنت له شهيدا أو شفيعا يوم القيامة","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Celui qui accomplit une rak‘a de la prière de l’après-midi avant le coucher du soleil a bien accompli la prière entière, et celui qui accomplit une rak‘a de la prière du matin avant le lever du soleil a bien accompli la prière entière. »","en":"Abu Huraira reported:The Messenger of Allah (ﷺ) said: He who finds (gets) a rak'ah of the afternoon (prayer) before the setting of the sun, he in fact gets (the full prayer), and he who gets a rak'ah of the morning (prayer) before the rising of the sun he in fact gets (the full prayer)","ref":{"ar":"رواه مسلم 1377","fr":"Muslim 1377","en":"Muslim 1377"}},{"type":"hadith","ar":"من يرد الله به خيرا يصب منه","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Si Allah veut du bien à quelqu’un, Il l’éprouve par des difficultés. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"If Allah wants to do good to somebody, He afflicts him with trials","ref":{"ar":"رواه البخاري 5645","fr":"al-Bukhârî 5645","en":"Bukhari 5645"}},{"type":"hadith","ar":"إن الله لم يبعثني معنتا ولا متعنتا ولكن بعثني معلما ميسرا","fr":"Rapporté par Ibn 'Umar رضي الله عنه : Le Messager d’Allah ﷺ a dit : « La prière en groupe est vingt-sept fois supérieure à la prière faite seul. »","en":"Ibn 'Umar reported Allah's Apostle (ﷺ) as saying:The prayer of a person in congregation is twenty-seven times in excess to the prayer said alone","ref":{"ar":"رواه مسلم 1478","fr":"Muslim 1478","en":"Muslim 1478"}},{"type":"hadith","ar":"إذا مرض العبد أو سافر كتب له مثل ما كان يعمل مقيما صحيحا","fr":"Rapporté par Ibrahim Abu Isma`il As-Saksaki : J’ai entendu Abu Burda, qui voyageait avec Yazid bin Abi Kabsha. Yazid avait l’habitude de jeûner en voyage. Abu Burda lui a dit : « J’ai entendu plusieurs fois Abu Musa dire que le Messager d’Allah a dit : Quand un serviteur tombe malade ou voyage, il reçoit la même récompense que pour les bonnes actions qu’il faisait chez lui en bonne santé. »","en":"Narrated Ibrahim Abu Isma`il As-Saksaki:I heard Abu Burda who accompanied Yazid bin Abi Kabsha on a journey. Yazid used to observe fasting on journeys. Abu Burda said to him, \"I heard Abu Musa several times saying that Allah's Apostle said, 'When a slave falls ill or travels, then he will get reward similar to that he gets for good deeds practiced at home when in good health","ref":{"ar":"رواه البخاري 2996","fr":"al-Bukhârî 2996","en":"Bukhari 2996"}},{"type":"hadith","ar":"من مات من أمتك لا يشرك بالله شيئا دخل الجنة","fr":"Rapporté par Abu Dharr : J’ai entendu le Prophète ﷺ dire : « Gabriel est venu à moi et m’a annoncé : “Celui de ta communauté qui meurt sans rien associer à Allah entrera au Paradis.” » J’ai demandé : « Même s’il a commis l’adultère et le vol ? » Il a répondu : « Oui, même s’il a commis l’adultère et le vol. »","en":"I heard Abu Dharr narrating it from the Apostle (ﷺ) that he observed:Gabriel came to me and gave me the tidings: Verily he who died amongst your Ummah without associating anything with Allah would enter Paradise. I (the narrator) said: Even if he committed adultery and theft. He (the Holy Prophet) said: (Yes), even if he committed adultery and theft","ref":{"ar":"رواه مسلم 272","fr":"Muslim 272","en":"Muslim 272"}},{"type":"hadith","ar":"إنما الصبر عند الصدمة الأولى","fr":"Rapporté par Anas bin Malik : Le Prophète (ﷺ) est passé près d’une femme qui pleurait à côté d’une tombe. Il lui a dit de craindre Allah et d’être patiente. Elle lui a répondu : « Va-t’en, tu n’as pas été touché par un malheur comme le mien. » Elle ne l’avait pas reconnu. Ensuite, on lui a dit que c’était le Prophète (ﷺ). Elle est alors allée à la maison du Prophète (ﷺ) et n’a trouvé aucun garde. Elle lui a dit : « Je ne t’avais pas reconnu. » Il a dit : « La vraie patience, c’est au premier choc du malheur. »","en":"Narrated Anas bin Malik:The Prophet (ﷺ) passed by a woman who was weeping beside a grave. He told her to fear Allah and be patient. She said to him, \"Go away, for you have not been afflicted with a calamity like mine.\" And she did not recognize him. Then she was informed that he was the Prophet (ﷺ) . so she went to the house of the Prophet (ﷺ) and there she did not find any guard. Then she said to him, \"I did not recognize you.\" He said, \"Verily, the patience is at the first stroke of a calamity","ref":{"ar":"رواه البخاري 1283","fr":"al-Bukhârî 1283","en":"Bukhari 1283"}},{"type":"hadith","ar":"لقنوا موتاكم لا إله إلا الله","fr":"Rapporté par Abu Sa'id al-Khudri : Le Messager d’Allah ﷺ a dit : « Recommandez à ceux d’entre vous qui sont en train de mourir de dire : “Il n’y a de dieu qu’Allah.” »","en":"Abu Sa'id al-Khudri reported Allah's Messenger (ﷺ) as saying:Exhort to recite\" There is no god but Allah\" to those of you who are dying","ref":{"ar":"رواه مسلم 2123","fr":"Muslim 2123","en":"Muslim 2123"}},{"type":"hadith","ar":"لا حسد إلا في اثنتين","fr":"Rapporté par le père de Salim : Le Prophète (ﷺ) a dit : « Il ne faut envier que deux personnes : un homme à qui Allah a donné la connaissance du Coran et qui le récite pendant la nuit et le jour ; et un homme à qui Allah a donné des richesses et qui les dépense (pour Allah) pendant la nuit et le jour. »","en":"Narrated Salim's father:The Prophet (ﷺ) said, \"Not to wish to be the like of except the like of two (persons): a man whom Allah has given the knowledge of the Qur'an and he recites it during the hours of the night and the hours of the day; and a man whom Allah has given wealth and he spends it (in Allah's Cause) during the hours of the night and during the hours of the day","ref":{"ar":"رواه البخاري 7529","fr":"al-Bukhârî 7529","en":"Bukhari 7529"}},{"type":"hadith","ar":"يغفر للشهيد كل ذنب إلا الدين","fr":"Rapporté par Abu Darda' رضي الله عنه : Le Messager d’Allah ﷺ a dit : « L’un d’entre vous est-il incapable de réciter un tiers du Coran en une nuit ? » Les Compagnons ont demandé : « Comment pourrait-on réciter un tiers du Coran en une nuit ? » Le Prophète ﷺ a répondu : « “Dis : Il est Allah, Unique” (sourate 112) équivaut à un tiers du Coran. »","en":"Abu Darda' reported Allah's Apostle (ﷺ) as saying:Is any one of you incapable of reciting a third of the Qur'an in a night? They (the Companions) asked: How could one recite a third of the Qur'an (in a night)? Upon this he (the Holy Prophet) said: \"'Say: He is Allah, One' (Qur'an. cxii) is equivalent to a third of the Qur'an","ref":{"ar":"رواه مسلم 1886","fr":"Muslim 1886","en":"Muslim 1886"}},{"type":"hadith","ar":"ما من مسلم يغرس غرسا أو يزرع زرعا","fr":"Rapporté par Anas bin Malik : Le Messager d’Allah (ﷺ) a dit : « Aucun musulman ne plante un arbre ou ne sème des graines, et qu’un oiseau, une personne ou un animal en mange, sans que cela ne soit compté pour lui comme une aumône. »","en":"Narrated Anas bin Malik:Allah's Messenger (ﷺ) said, \"There is none amongst the Muslims who plants a tree or sows seeds, and then a bird, or a person or an animal eats from it, but is regarded as a charitable gift for him","ref":{"ar":"رواه البخاري 2320","fr":"al-Bukhârî 2320","en":"Bukhari 2320"}},{"type":"hadith","ar":"أعظمها أجرا الذي أنفقته على أهلك","fr":"Rapporté par Ibn Umar رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Ne privez pas les femmes de leur part dans les mosquées quand elles vous demandent la permission. » Bilal dit : « Par Allah, nous allons sûrement les en empêcher. » Abdullah répondit : « Je dis que le Messager d’Allah ﷺ l’a dit, et toi, tu dis : “Nous allons sûrement les en empêcher !” »","en":"Ibn Umar reported:The Messenger of Allah (ﷺ) said: Do not deprive women of their share of the mosques, when they seek permission from you. Bilal said: By Allah, we would certainly prevent them. 'Abdullah said: I say that the Messenger of Allah (ﷺ) said it and you say: We would certainly prevent them","ref":{"ar":"رواه مسلم 995","fr":"Muslim 995","en":"Muslim 995"}},{"type":"hadith","ar":"الفطرة خمس","fr":"Rapporté par Abou Hourayra : Le Messager d’Allah ﷺ a dit : « Cinq pratiques relèvent de la fitra — ou : cinq font partie de la fitra — : la circoncision, le rasage des poils du pubis, l’épilation des aisselles, la coupe des ongles et la taille de la moustache. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Five "ar":"لا طاعة في معصية الله إنما الطاعة في المعروف","fr":"Rapporté par Ibn Umar رضي الله عنه : Ce hadith a été rapporté du Messager d’Allah ﷺ, mais dans la version transmise par Moussa ibn Uqba, il est ajouté : « Quand celui qui a mémorisé le Coran (ou qui le connaît bien) se lève pour prier et le récite jour et nuit, il reste frais dans sa mémoire, mais s’il ne se lève pas pour prier et ne le récite pas, il l’oublie. »","en":"This hadith has been narrated by Ibn 'Umar from the Messenger of Allah (ﷺ), but in the hadith transmited by Musa b. 'Uqba, this addition is made:\" When one who had committed the Qur'an to memory (or who is familiar with it) gets up (for night prayer) and recites it night and day, it remains fresh in his mind, but if he does not get up (for prayer and thus does not recite it) he forgets it","ref":{"ar":"رواه مسلم 1840","fr":"Muslim 1840","en":"Muslim 1840"}},{"type":"hadith","ar":"لا تشد الرحال إلا إلى ثلاثة مساجد","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Ne partez en voyage que pour trois mosquées : la Mosquée sacrée (Al-Masjid Al-Haram), la mosquée du Messager d’Allah (ﷺ) et la mosquée Al-Aqsa (la mosquée de Jérusalem). »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"Do not set out on a journey except for three Mosques i.e. Al-Masjid-Al-Haram, the Mosque of Allah's Messenger (ﷺ) , and the Mosque of Al-Aqsa, (Mosque of Jerusalem)","ref":{"ar":"رواه البخاري 1189","fr":"al-Bukhârî 1189","en":"Bukhari 1189"}},{"type":"hadith","ar":"فاستمع وأنصت غفر له ما بينه وبين الجمعة","fr":"Rapporté par Abu Huraira : Le Messager d’Allah ﷺ a dit : « Quand le muezzin appelle à la prière, Satan s’enfuit rapidement. »","en":"Abu Huraira reported:The Messenger of Allah (ﷺ) said: When the Mu'adhdhin calls to prayer, Satan runs back vehemently","ref":{"ar":"رواه مسلم 857","fr":"Muslim 857","en":"Muslim 857"}},{"type":"hadith","ar":"ما بين بيتي ومنبري روضة من رياض الجنة","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Entre ma maison et ma chaire, il y a un jardin parmi les jardins du Paradis, et ma chaire est sur mon bassin (c’est-à-dire Al-Kawthar). »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"Between my house and my pulpit there is a garden of the gardens of Paradise, and my pulpit is on my fountain tank (i.e. Al-Kauthar)","ref":{"ar":"رواه البخاري 1196","fr":"al-Bukhârî 1196","en":"Bukhari 1196"}},{"type":"hadith","ar":"فلا تأتوها تسعون وأتوها تمشون وعليكم السكينة","fr":"Rapporté par Abu Huraira : J’ai entendu le Messager d’Allah ﷺ dire : « Quand l’Iqama est prononcé pour la prière, ne courez pas, mais allez-y calmement, et priez ce à quoi vous arrivez à temps, puis complétez ce que vous avez manqué. »","en":"Abu Huraira reported:I heard the Messenger of Allah (ﷺ) saying: When the Iqama has been pronounced for prayer, do not go running to it, but go walking in tranquillity and pray what you are in time for, and complete what you have missed","ref":{"ar":"رواه مسلم 1359","fr":"Muslim 1359","en":"Muslim 1359"}},{"type":"hadith","ar":"إن الإيمان ليأرز إلى المدينة","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « En vérité, la foi revient et retourne à Médine comme un serpent retourne dans son trou (quand il est en danger). »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Verily, Belief returns and goes back to Medina as a snake returns and goes back to its hole (when in danger)","ref":{"ar":"رواه البخاري 1876","fr":"al-Bukhârî 1876","en":"Bukhari 1876"}},{"type":"hadith","ar":"لن يلج النار أحد صلى قبل طلوع الشمس وقبل غروبها","fr":"Rapporté par Ibn Mughira d’après son père : Le Messager d’Allah ﷺ a essuyé sur ses chaussettes, sur le devant de sa tête et sur son turban","en":"Ibn Mughira narrated it from his father:The Apostle of Allah (ﷺ) wiped over his socks and over his forehead and over his turban","ref":{"ar":"رواه مسلم 634","fr":"Muslim 634","en":"Muslim 634"}},{"type":"hadith","ar":"إياكم والجلوس على الطرقات","fr":"Rapporté par Abu Sa`id Al-Khudri : Le Prophète (ﷺ) a dit : « Attention ! Évitez de vous asseoir sur les routes. » Les gens ont dit : « On ne peut pas faire autrement, ce sont nos lieux de discussion. » Le Prophète (ﷺ) a dit : « Si vous devez vous asseoir là, alors respectez les droits de la route. » Ils ont demandé : « Quels sont ces droits ? » Il a répondu : « Baisser le regard (devant ce qu’il est interdit de regarder), ne pas nuire aux gens, rendre le salut, recommander le bien et interdire le mal. »","en":"Narrated Abu Sa`id Al-Khudri:The Prophet (ﷺ) said, \"Beware! Avoid sitting on the roads (ways).\" The people said, \"There is no way out of it as these are our sitting places where we have talks.\" The Prophet (ﷺ) said, \"If you must sit there, then observe the rights of the way.\" They asked, \"What are the rights of the way?\" He said, \"They are the lowering of your gazes (on seeing what is illegal to look at), refraining from harming people, returning greetings, advocating good and forbidding evil","ref":{"ar":"رواه البخاري 2465","fr":"al-Bukhârî 2465","en":"Bukhari 2465"}},{"type":"hadith","ar":"من أكل ثوما أو بصلا فليعتزلنا","fr":"Rapporté par Jabir : Le Messager d’Allah ﷺ a dit : « Celui qui mange de l’ail ou de l’oignon doit rester loin de nous ou de notre mosquée, et rester chez lui. » On lui a apporté une marmite contenant des légumes cuits. Il a senti une mauvaise odeur et a demandé ce qu’il y avait dedans. On l’a informé des légumes cuits. Il a dit : « Donnez-la à tel Compagnon. » Quand celui-ci l’a vue, il n’a pas voulu en manger non plus. Le Prophète ﷺ a alors dit : « Vous pouvez en manger, mais moi je parle avec quelqu’un avec qui vous ne parlez pas. »","en":"Jabir reported:The Messenger of Allah (ﷺ) said: He who eats garlic or onion should remain away from us or from our mosque and stay in his house. A kettle was brought to him which had (cooked) vegetables in it, He smelt (offensive) odour in it. On asking he was informed of the vegetables (cooked in it). He said: Take it to such and such Companion. When he saw it, he also disliked eating it. (Upon this). he (the Holy Prophet) said: You may eat it, for I converse wkh one with whom you do not converse","ref":{"ar":"رواه مسلم 1254","fr":"Muslim 1254","en":"Muslim 1254"}},{"type":"hadith","ar":"العين حق","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Le mauvais œil existe vraiment », et il a interdit le tatouage","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The evil eye is a fact,\" and he forbade tattooing","ref":{"ar":"رواه البخاري 5944","fr":"al-Bukhârî 5944","en":"Bukhari 5944"}},{"type":"hadith","ar":"من تاب قبل أن تطلع الشمس من مغربها تاب الله عليه","fr":"Rapporté par Abu Huraira رضي الله عنه : Lorsque l’un d’entre vous se lève le matin en état de jeûne, il ne doit ni tenir de propos obscènes ni agir avec ignorance. Et si quelqu’un l’insulte ou cherche à se disputer avec lui, qu’il dise : « Je jeûne, je jeûne. »","en":"Abu Huraira (Allah be pleased with him) reported:When any one of you gets up in the morning in the state of fasting, he should neither use obscene language nor do any act of ignorance. And if anyone slanders him or quarrels with him, he should say:\" I am fasting, I am fasting","ref":{"ar":"رواه مسلم 2703","fr":"Muslim 2703","en":"Muslim 2703"}}],"generatedAt":"2026-10-24T16:48:49.798Z"}; /* آيات وأحاديث يومية مدمجة — تعمل دون اتصال بالإنترنت */

function hijriParts(dv){ /* dv = منتصف ليل UTC؛ إرجاع {y,m,d} عبر تقويم أم القرى */
  try{
    const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
    const o={}; f.formatToParts(dv).forEach(p=>{
      if(p.type==='year')o.y=+String(p.value).replace(/\D/g,'');
      else if(p.type==='month')o.m=+p.value; else if(p.type==='day')o.d=+p.value;
    });
    return o.y?o:null;
  }catch(e){ return null; }
}
/* محرك المناسبات: مسح ≤400 يوماً، أعداد الأيام عبر تواريخ المدن (Date.UTC)، تطبيق hijriOffset */
function ssOccasions(){
  const n=cityNow();
  const key=n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate();
  if(!ssOccCache||ssOccDay!==key){
    ssOccDay=key;
    const base=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
    const HI=[];
    let today=null;
    try{
      for(let i=0;i<=400;i++){
        const h=hijriParts(new Date(base+i*86400000));
        HI.push(h); if(i===0) today=h;
      }
    }catch(e){ return {month:null,dayX:null,fitrDays:null,list:[]}; }
    const off=Math.max(-2,Math.min(2,parseInt(STATE.hijriOffset,10)||0));
    const nowAdj=hijriParts(new Date(base+off*86400000))||today; /* التاريخ الهجري المعدَّل لليوم */
    const list=[];
    OCC_TABLE.forEach(o=>{
      if(!STATE.ssOcc||!STATE.ssOcc[o.k]) return;
      for(let i=0;i<=400;i++){
        const h=HI[i]; if(!h) continue;
        if(h.d===o.d&&h.m===o.m){
          const days=i+off; /* الإزاحة الهجرية تحرك كل المناسبات +off يوماً */
          if(days>=0&&days<=400) list.push({k:o.k,days:days});
          break;
        }
      }
    });
    list.sort((a,b)=>a.days-b.days);
    let fitrDays=null;
    for(let i=0;i<=400;i++){
      const h=HI[i]; if(!h) continue;
      if(h.d===1&&h.m===10){ fitrDays=Math.max(0,i+off); break; }
    }
    ssOccCache={ month:nowAdj?nowAdj.m:null, dayX:nowAdj?nowAdj.d:null, fitrDays:fitrDays, list:list };
  }
  return ssOccCache;
}
function ssDaysPhrase(n){

    if(n===2) return 'بعد يومين';

  return L==='fr'?('dans '+toLatin(n)+' jours'):('in '+toLatin(n)+' days');

    const nx=o.list[1];
    sb.textContent=nx?(t('occThen')+' '+t('occasions',nx.k)+' '+ssDaysPhrase(nx.days)):'';
  }
}

/* الآية/الحديث اليومي — فهرس = يوم السنة بالتوقيت المحلي للمدينة */
function dayOfYear(d){
  return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,1))/86400000)+1;
}
function ssSetDailySizes(sz){
  const card=document.getElementById('sv-daily'); if(!card) return;
  card.style.fontSize='';
  const q=id=>document.getElementById(id);
  const main=q('sv-daily-main'), tr1=q('sv-daily-tr1'), sub=q('sv-daily-sub'), tr2=q('sv-daily-tr2'), ti=q('sv-daily-title'), src=q('sv-daily-src');
  const small=Math.max(20,sz*0.7);
  main.style.fontSize=sz+'px';
  [tr1,sub,tr2].forEach(el=>{ if(el) el.style.fontSize=Math.round(small*2)/2+'px'; });
  ti.style.fontSize=Math.max(20,Math.round(sz*0.72))+'px';
  src.style.fontSize=Math.max(18,Math.round(sz*0.6))+'px';
}
function ssFillDaily(){
  const card=document.getElementById('sv-daily'); if(!card) return;
  const L=STATE.lang, isAr=L==='ar', mode=STATE.ssDailyMode||'both';
  const doy=dayOfYear(cityNow());
  const ay=DAILY.ayah[(doy-1)%DAILY.ayah.length], hd=DAILY.hadith[(doy-1)%DAILY.hadith.length];
  const ti=document.getElementById('sv-daily-title'), main=document.getElementById('sv-daily-main'),
        tr1=document.getElementById('sv-daily-tr1'), sep=document.getElementById('sv-daily-sep'),
        sub=document.getElementById('sv-daily-sub'), tr2=document.getElementById('sv-daily-tr2'),
        src=document.getElementById('sv-daily-src');
  [tr1,sep,sub,tr2].forEach(el=>{ el.hidden=true; el.textContent=''; });
  main.style.fontSize=''; /* أعد الارتداد إلى المقاس من CSS قبل الحجم التلقائي */
  const pick=it=>isAr?it.ar:it[L];
  if(mode==='both'){
    ti.textContent=t('dailyTitleBoth');
    main.textContent='«'+ay.ar+'»';
    if(!isAr){ tr1.hidden=false; tr1.textContent=pick(ay); }
    sub.hidden=false; sub.textContent='«'+hd.ar+'»';
    if(!isAr){ tr2.hidden=false; tr2.textContent=pick(hd); }
    sep.hidden=false;
    src.textContent=ay.ref[L]+'  · '+hd.ref[L];
  }else{
    const it=(mode==='hadith')?hd:ay;
    ti.textContent=t(mode==='hadith'?'dailyTitleHadith':'dailyTitleAyah');
    main.textContent='«'+it.ar+'»';
    if(!isAr){ tr1.hidden=false; tr1.textContent=pick(it); }
    src.textContent=it.ref[L];
  }
  /* ملاءمة تلقائية 34px ← 20px: محتوى لا يتجاوز ارتفاع المنطقة الوسطى، والآية ≤ 7 أسطر، دون أي اقتطاع */
  const mid=document.querySelector('.sv-mid');
  const maxH=Math.max(220,(mid?mid.clientHeight:600)-30);
  let sz=34;
  for(let s=34;s>=20;s-=2){
    ssSetDailySizes(s);
    sz=s;
    const lines=main.clientHeight/(s*1.68);
    if(card.scrollHeight<=maxH&&lines<=7) break;
  }
  ssSetDailySizes(sz);
  let guard=0;
  while(card.scrollHeight>maxH&&guard<4){
    guard++;
    if(!tr2.hidden){ tr2.hidden=true; continue; }
    if(!sub.hidden){ sub.hidden=true; sep.hidden=true; continue; }
    if(!tr1.hidden){ tr1.hidden=true; continue; }
    break;
  }
}

/* خلفية شاشة التوقف: تناوب كل 10/30/60 دقيقة مع تلاشٍ متقاطع ~1.5s وتحميل مسبق */
function svHomeWall(){
  if(STATE.wallpaperCustom&&customWallURL) return customWallURL;
  return wallURLFor(STATE.wallpaperId||BUILTIN_WALLPAPERS[0].id);
}
function svPool(){
  const p=BUILTIN_WALLPAPERS.map(w=>wallURLFor(w.id));
  if(customWallURL) p.push(customWallURL);
  return p.filter(u=>u&&!svFailedBgs.has(u));
}
function svSetBg(url,fade){
  const a=document.getElementById('sv-bg-a'), b=document.getElementById('sv-bg-b');
  if(!a||!b||!url) return;
  const curEl=svBgIsA?a:b, nxtEl=svBgIsA?b:a;
  if(fade===false){
    curEl.style.backgroundImage="url('"+url+"')"; curEl.classList.add('on');
    nxtEl.style.backgroundImage=''; nxtEl.classList.remove('on');
    return;
  }
  nxtEl.style.backgroundImage="url('"+url+"')";
  void nxtEl.offsetWidth; /* reflow قبل التلاشي */
  nxtEl.classList.add('on'); curEl.classList.remove('on');
  svBgIsA=!svBgIsA;
}
function svNextBg(fade){
  const pool=svPool(); if(!pool.length) return; /* فشل الصور = تدرج داكن، بلا خطأ */
  const url=pool[svBgIdx%pool.length]; svBgIdx=(svBgIdx+1)%pool.length;
  svLastRotate=Date.now();
  const img=new Image(); /* تحميل مسبق قبل العرض */
  img.onload=()=>svSetBg(url,fade);
  img.onerror=()=>{ svFailedBgs.add(url); svBgIdx=svBgIdx; svLastRotate=Date.now(); };
  img.src=url;
}

/* خفض الإضاءة ليلاً: من العشاء إلى الفجر (بمواقيت الصلاة) — قابل للتعطيل */
function ssApplyNight(){
  const ov=document.getElementById('screensaver-overlay'); if(!ov) return;
  let night=true;
  if(STATE.ssNightDim===false) night=false;
  if(night){
    try{
      const n=cityNow(), h=n.getHours()+n.getMinutes()/60;
      let a=21.5,b=4.5; /* بديل عند غياب المواقيت */
      if(prayerTimings){
        if(prayerTimings.Isha) a=+prayerTimings.Isha.substring(0,2)+(+prayerTimings.Isha.substring(3,5))/60;
        if(prayerTimings.Fajr) b=+prayerTimings.Fajr.substring(0,2)+(+prayerTimings.Fajr.substring(3,5))/60;
      }
      night=(h>=a||h<b);
    }catch(e){}
  }
  ov.classList.toggle('nightdim',night);
}

/* أجزاء الشاشة */
function ssFast(){ /* كل ثانية: الساعة + العد التنازلي للصلاة */
  if(!ssActive) return;
  const L=STATE.lang, now=cityNow();
  let h=now.getHours(); const m=pad2(now.getMinutes());
  const am=document.getElementById('sv-ampm');
  if(STATE.clockFormat===12){ am.style.display=''; am.textContent=h>=12?(L==='ar'?'م':'PM'):(L==='ar'?'ص':'AM'); h=h%12||12; }
  else am.style.display='none';
  document.getElementById('sv-clock').textContent=pad2(h)+':'+m;
  const nx=APP_DATA.next;
  if(nx){
    if(svNextKey!==nx.k){
      svNextKey=nx.k;
      document.getElementById('sv-prayer-name').textContent=t('prayers',nx.k);
      document.getElementById('sv-prayer-time').textContent=toLatin(fmtHM(nx.time));
    }
    const rem=Math.max(0,nx.rem|0);
    document.getElementById('sv-prayer-rem').textContent=t('inTime')+' '+toLatin(pad2(Math.floor(rem/3600))+':'+pad2(Math.floor(rem%3600/60))+':'+pad2(rem%60));
  }
}
function ssSlow(){ /* كل 30 ثانية: التواريخ، الطقس، المناسبات، الخلفية، الليل، إزاحة التصدع */
  if(!ssActive) return;
  svSlowCount++;
  const now=cityNow(), L=STATE.lang;
  const dayKey=now.toDateString();
  if(svPrevDay!==dayKey){ svPrevDay=dayKey; ssFillDaily(); ssApplyNight(); }
  /* التواريخ */
  const loc=L==='ar'?'ar-MA-u-nu-latn':(L==='fr'?'fr-FR':'en-US');
  document.getElementById('sv-greg').textContent=toLatin(now.toLocaleDateString(loc,{weekday:'long',year:'numeric',month:'long',day:'numeric'}));
  let hij='';
  try{
    const hb=cityNow(); hb.setDate(hb.getDate()+(parseInt(STATE.hijriOffset,10)||0));
    hij=toLatin(hb.toLocaleDateString('ar-u-ca-islamic-umalqura-nu-latn',{year:'numeric',month:'long',day:'numeric'}))
        .replace(/[\s\u00A0]*(هـ|AH)\s*$/i,'').trim()+' '+(L==='ar'?'هـ':'AH');
  }catch(e){}
  document.getElementById('sv-hijri').textContent=hij||'--';
  /* بتوقيت المدينة فقط عندما تختلف منطقتها عن منطقة الجهاز */
  let devTz=null; try{ devTz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){}
  const ctz=STATE.city.tz, showTz=!!(ctz&&ctz!=='auto'&&ctz!==devTz);
  document.getElementById('sv-by-city').textContent=showTz?(t('byCity')+' '+STATE.city.name):'';
  document.getElementById('sv-cityrow').style.visibility=showTz?'visible':'hidden';
  /* الطقس من APP_DATA */
  const w=APP_DATA.weather;
  if(w){
    document.getElementById('sv-wtemp').textContent=tempFmt(w.temp);
    document.getElementById('sv-wcond').textContent=wDesc(w.code)+' • '+(w.isDay?t('weather','day'):t('weather','night'));
    document.getElementById('sv-wcity').textContent=STATE.city.name+(STATE.city.country?' • '+STATE.city.country:'');
    document.getElementById('sv-whl').textContent=t('high')+' '+tempFmt(w.hi)+'  '+t('low')+' '+tempFmt(w.lo);
    const wk=w.code+(w.isDay?'d':'n');
    if(svWkey!==wk){ svWkey=wk; document.getElementById('sv-wicon').innerHTML=createWeatherSVG(w.code,w.isDay); }
  }else{
    document.getElementById('sv-wtemp').textContent='--';
    document.getElementById('sv-wcond').textContent='--';
    document.getElementById('sv-wcity').textContent=STATE.city.name+(STATE.city.country?' • '+STATE.city.country:'');
    document.getElementById('sv-whl').textContent='';
    document.getElementById('sv-wicon').innerHTML='';
  }
  const wup=document.getElementById('sv-wupdated');
  if(w&&w.fetchedAt&&Date.now()-w.fetchedAt>7200000){
    const fd=new Date(w.fetchedAt);
    wup.textContent=t('lastUpdated').replace('{t}',toLatin(pad2(fd.getHours())+':'+pad2(fd.getMinutes())));
  }else wup.textContent='';
  ssFillOcc();
  ssApplyNight();
  /* تناوب الخلفية حسب الإعداد */
  if(ssBgInterval()>0 && Date.now()-svLastRotate>=ssBgInterval()*60000) svNextBg(true);
  /* إزاحة التصِّدق كل ~3 دقائق (±8px) */
  if(svSlowCount%6===0){
    const bx=(Math.random()*16-8).toFixed(1), by=(Math.random()*16-8).toFixed(1);
    const g=document.querySelector('.sv-grid'); if(g) g.style.transform='translate('+bx+'px,'+by+'px)';
  }
}
function fillScreensaver(){ ssFast(); ssSlow(); }

async function ssWakeLock(on){
  if(on){
    try{ if('wakeLock' in navigator){ wakeLockSentinel=await navigator.wakeLock.request('screen'); wakeLockSentinel.addEventListener('release',()=>{wakeLockSentinel=null}); } }catch(e){}
    try{ if(window.AndroidTV&&window.AndroidTV.keepScreenOn) window.AndroidTV.keepScreenOn(true); }catch(e){}
  }else{
    try{ if(wakeLockSentinel){ await wakeLockSentinel.release(); wakeLockSentinel=null; } }catch(e){}
    try{ if(window.AndroidTV&&window.AndroidTV.keepScreenOn) window.AndroidTV.keepScreenOn(false); }catch(e){}
  }
}
function ssBlocked(){ /* لا بدء أثناء الإعدادات/الدولاب أو بالغش في خانة البحث */
  const st=document.getElementById('settings-modal'), dr=document.getElementById('all-apps-drawer');
  if(st&&st.classList.contains('open')) return true;
  if(dr&&dr.classList.contains('open')) return true;
  const si=document.getElementById('city-search-input');
  if(!si) return false;
  if(document.activeElement===si||(si.contains&&si.contains(document.activeElement))) return true;
  try{ return !!si.matches(':hover'); }catch(e){ return false; }
}
function showScreensaver(){
  if(ssActive) return;
  if(ssBlocked()){ clearTimeout(idleTimer); idleTimer=setTimeout(showScreensaver,30000); return; }
  ssActive=true; clearTimeout(idleTimer); idleTimer=null;
  svNextKey=''; svWkey='';
  const o=document.getElementById('screensaver-overlay');
  o.classList.add('show'); o.setAttribute('aria-hidden','false');
  if(ssBgInterval()===0) svSetBg(svHomeWall(),false); /* نفس خلفية الشاشة الرئيسية */
  else if(!svBgStarted){ svBgStarted=true; svNextBg(false); }
  fillScreensaver();
  ssWakeLock(true);
  if(ssTickFast) clearInterval(ssTickFast);
  if(ssTickSlow) clearInterval(ssTickSlow);
  ssTickFast=setInterval(ssFast,1000);
  ssTickSlow=setInterval(ssSlow,30000);
}
function hideScreensaver(){
  ssActive=false;
  const o=document.getElementById('screensaver-overlay');
  o.classList.remove('show'); o.setAttribute('aria-hidden','true');
  if(ssTickFast){ clearInterval(ssTickFast); ssTickFast=null; }
  if(ssTickSlow){ clearInterval(ssTickSlow); ssTickSlow=null; }
  ssWakeLock(false);
  resetIdleTimer();
}
function resetIdleTimer(){
  clearTimeout(idleTimer);
  if(ssActive) return;
  const mins=Math.max(1,parseInt(STATE.screensaverDelay,10)||3);
  idleTimer=setTimeout(showScreensaver,mins*60*1000);
}
['mousemove','mousedown','keydown','pointerdown','touchstart','wheel'].forEach(ev=>addEventListener(ev,resetIdleTimer,{passive:true}));
/* أي زر أثناء شاشة التوقف = إخفاء ناعم + ابتلاع الضغطة */
document.addEventListener('keydown',function(e){ if(!ssActive) return; e.preventDefault(); e.stopPropagation(); hideScreensaver(); },true);
document.addEventListener('pointerdown',function(e){ if(!ssActive) return; e.preventDefault(); e.stopPropagation(); hideScreensaver(); },true);
/* عند عودة الصفحة للمنصب: ينعش فوراً (تغيير اليوم/الاتصال) */
document.addEventListener('visibilitychange',function(){
  if(document.hidden||!ssActive) return;
  svPrevDay='';
  fillScreensaver();
});

/* ═══ 18. D-PAD NAVIGATION ═══ */
let dpadFocused=null;
function dpadSetFocus(el){
  if(!el) return;
  if(dpadFocused) dpadFocused.classList.remove('dpad-active');
  dpadFocused=el; el.classList.add('dpad-active');
  setDockLabel(el);
  try{ el.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(e){}
}
function getFocusables(scope){
  return Array.from((scope||document).querySelectorAll('.dpad-focusable')).filter(el=>{
    const r=el.getBoundingClientRect(); return r.width>0&&r.height>0;
  });
}
function findNearest(cur,dir,list){
  const c=cur.getBoundingClientRect(), cx=c.left+c.width/2, cy=c.top+c.height/2;
  let best=null,bs=Infinity;
  for(const el of list){
    if(el===cur) continue;
    const r=el.getBoundingClientRect(), dx=r.left+r.width/2-cx, dy=r.top+r.height/2-cy;
    const ok=(dir==='right'&&dx>4)||(dir==='left'&&dx<-4)||(dir==='down'&&dy>4)||(dir==='up'&&dy<-4);
    if(!ok) continue;
    const horiz=dir==='left'||dir==='right';
    const score=(horiz?Math.abs(dx):Math.abs(dy))+(horiz?Math.abs(dy):Math.abs(dx))*2.2;
    if(score<bs){bs=score;best=el;}
  }
  return best;
}
function isOkKey(e){
  const k=e.key;
  return k==='Enter'||k==='Select'||k==='Center'||e.keyCode===23||e.keyCode===66;
}
let dpadPressTimer=null, dpadPressLong=false, dpadLongPressTarget=null;
document.addEventListener('keydown',e=>{
  const k=e.key, act=document.activeElement, typing=act&&act.tagName==='INPUT';
  const sm=document.getElementById('settings-modal'), dr=document.getElementById('all-apps-drawer');
  if(k==='Escape'||k==='GoBack'||(k==='Backspace'&&!typing)){
    if(sm.classList.contains('open')){ e.preventDefault(); closeSettings(); }
    else if(dr.classList.contains('open')){ e.preventDefault(); closeAllAppsDrawer(); }
    return;
  }
  /* زر القائمة على درج التطبيقات = تبديل المفضلة */
  if(k==='ContextMenu'||e.keyCode===93){
    if(dr.classList.contains('open')&&dpadFocused&&dpadFocused.classList&&dpadFocused.classList.contains('dapp')&&dpadFocused.dataset.favId){
      e.preventDefault(); toggleFav(dpadFocused.dataset.favId);
    }
    return;
  }
  if(isOkKey(e)){
    if(typing){ e.preventDefault(); clearTimeout(searchTimer); searchCity(true); act.blur(); return; }
    if(dpadFocused){
      e.preventDefault();
      /* عنصر تطبيق في الدرج: ضغط مطول 600ms = تبديل المفضلة، ضغط قصير = تشغيل */
      if(dpadFocused.classList&&dpadFocused.classList.contains('dapp')&&dpadFocused.dataset.favId){
        if(e.repeat) return;
        dpadPressLong=false;
        clearTimeout(dpadPressTimer);
        dpadPressTimer=setTimeout(function(){
          dpadPressTimer=null;
          if(dpadLongPressTarget!=null){ dpadPressLong=true; toggleFav(dpadLongPressTarget); }
        },600);
        dpadLongPressTarget=dpadFocused.dataset.favId;
        return;
      }
      if(dpadFocused.tagName==='INPUT') dpadFocused.focus(); else dpadFocused.click();
    }
    return;
  }
  const dir={ArrowRight:'right',ArrowLeft:'left',ArrowDown:'down',ArrowUp:'up'}[k];
  if(!dir) return;
  /* أثناء الكتابة في حقل البحث: لا نُخرج التركيز إلا بالسهم الأسفل؛ الأسهم المغرب تبقى للكتابة */
  if(typing&&dir!=='down') return;
  e.preventDefault(); if(typing) act.blur();
  const scope=sm.classList.contains('open')?sm:(dr.classList.contains('open')?dr:null);
  const list=getFocusables(scope).filter(el=>scope||(!sm.contains(el)&&!dr.contains(el)));
  if(!list.length) return;
  if(!dpadFocused||!list.includes(dpadFocused)){ dpadSetFocus(list[0]); return; }
  const n=findNearest(dpadFocused,dir,list); if(n) dpadSetFocus(n);
});
document.addEventListener('keyup',e=>{
  if(!isOkKey(e)) return;
  if(dpadPressTimer){
    clearTimeout(dpadPressTimer); dpadPressTimer=null;
    /* ضغطة قصيرة قبل الـ 600ms = تشغيل عادي */
    if(!dpadPressLong&&dpadFocused&&dpadFocused.classList&&dpadFocused.classList.contains('dapp')) dpadFocused.click();
  }
  dpadLongPressTarget=null;
  dpadPressLong=false;
});

/* ═══ 19. BOOT ═══ */
syncInstalledApps();        /* ← التطبيقات الحقيقية قبل أي render */
hydrateIcons();
buildPrayerGrid();
document.getElementById('header-city-name').textContent=STATE.city.name;
if(!STATE.showPrayer) document.getElementById('prayer-card').style.display='none';
if(!STATE.showWeather) document.getElementById('weather-card').style.display='none';
applyI18n();
initWallpaper();
resetIdleTimer();
loadPrayers();
loadWeather();
setTimeout(()=>{ const f=document.querySelector('#dock .tile'); if(f) dpadSetFocus(f); },300);
</script>
