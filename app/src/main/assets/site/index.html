"en":"And [mention] the man of the fish, when he went off in anger and thought that We would not decree [anything] upon him. And he called out within the darknesses, \"There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.\"","ref":{"ar":"سورة الأنبياء · الآية 87","fr":"Al-Anbiyaa · 21:87","en":"Al-Anbiyaa · 21:87"}},{"type":"ayah","ar":"وَقُل رَّبِّ ٱغْفِرْ وَٱرْحَمْ وَأَنتَ خَيْرُ ٱلرَّٰحِمِينَ","fr":"Et dis: «Seigneur, pardonne et fais miséricorde. C'est Toi le Meilleur des miséricordieux».","en":"And, [O Muhammad], say, \"My Lord, forgive and have mercy, and You are the best of the merciful.\"","ref":{"ar":"سورة المؤمنون · الآية 118","fr":"Al-Muminoon · 23:118","en":"Al-Muminoon · 23:118"}},{"type":"ayah","ar":"وَتَوَكَّلْ عَلَى ٱلْحَىِّ ٱلَّذِى لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِۦ وَكَفَىٰ بِهِۦ بِذُنُوبِ عِبَادِهِۦ خَبِيرًا","fr":"Et place ta confiance en Le Vivant qui ne meurt jamais. Et par Sa louange, glorifie-Le. Il suffit comme Parfait Connaisseur des péchés de Ses serviteurs.","en":"And rely upon the Ever-Living who does not die, and exalt [Allah] with His praise. And sufficient is He to be, with the sins of His servants, Acquainted -","ref":{"ar":"سورة الفرقان · الآية 58","fr":"Al-Furqaan · 25:58","en":"Al-Furqaan · 25:58"}},{"type":"ayah","ar":"وَعِبَادُ ٱلرَّحْمَٰنِ ٱلَّذِينَ يَمْشُونَ عَلَى ٱلْأَرْضِ هَوْنًۭا وَإِذَا خَاطَبَهُمُ ٱلْجَٰهِلُونَ قَالُوا۟ سَلَٰمًۭا","fr":"Les serviteurs du Tout Miséricordieux sont ceux qui marchent humblement sur terre, qui, lorsque les ignorants s'adressent à eux, disent: «Paix»,","en":"And the servants of the Most Merciful are those who walk upon the earth easily, and when the ignorant address them [harshly], they say [words of] peace,","ref":{"ar":"سورة الفرقان · الآية 63","fr":"Al-Furqaan · 25:63","en":"Al-Furqaan · 25:63"}},{"type":"ayah","ar":"وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ","fr":"et quand je suis malade, c'est Lui qui me guérit,","en":"And when I am ill, it is He who cures me","ref":{"ar":"سورة الشعراء · الآية 80","fr":"Ash-Shu'araa · 26:80","en":"Ash-Shu'araa · 26:80"}},{"type":"ayah","ar":"رَبِّ هَبْ لِى حُكْمًۭا وَأَلْحِقْنِى بِٱلصَّٰلِحِينَ","fr":"Seigneur, accorde-moi sagesse (et savoir) et fais-moi rejoindre les gens de bien;","en":"[And he said], \"My Lord, grant me authority and join me with the righteous.","ref":{"ar":"سورة الشعراء · الآية 83","fr":"Ash-Shu'araa · 26:83","en":"Ash-Shu'araa · 26:83"}},{"type":"ayah","ar":"أَمَّن يُجِيبُ ٱلْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ ٱلسُّوٓءَ وَيَجْعَلُكُمْ خُلَفَآءَ ٱلْأَرْضِ أَءِلَٰهٌۭ مَّعَ ٱللَّهِ قَلِيلًۭا مَّا تَذَكَّرُونَ","fr":"N'est-ce pas Lui qui répond à l'angoissé quand il L'invoque, et qui enlève le mal, et qui vous fait succéder sur la terre, génération après génération, - Y a-t-il donc une divinité avec Allah? C'est rare que vous vous rappeliez!","en":"Is He [not best] who responds to the desperate one when he calls upon Him and removes evil and makes you inheritors of the earth? Is there a deity with Allah? Little do you remember.","ref":{"ar":"سورة النمل · الآية 62","fr":"An-Naml · 27:62","en":"An-Naml · 27:62"}},{"type":"ayah","ar":"وَمِنْ ءَايَٰتِهِۦٓ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَٰجًۭا لِّتَسْكُنُوٓا۟ إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةًۭ وَرَحْمَةً إِنَّ فِى ذَٰلِكَ لَءَايَٰتٍۢ لِّقَوْمٍۢ يَتَفَكَّرُونَ","fr":"Et parmi Ses signes Il a créé de vous, pour vous, des épouses pour que vous viviez en tranquillité avec elles et Il a mis entre vous de l'affection et de la bonté. Il y a en cela des preuves pour des gens qui réfléchissent.","en":"And of His signs is that He created for you from yourselves mates that you may find tranquillity in them; and He placed between you affection and mercy. Indeed in that are signs for a people who give thought.","ref":{"ar":"سورة الروم · الآية 21","fr":"Ar-Room · 30:21","en":"Ar-Room · 30:21"}},{"type":"ayah","ar":"يَٰبُنَىَّ أَقِمِ ٱلصَّلَوٰةَ وَأْمُرْ بِٱلْمَعْرُوفِ وَٱنْهَ عَنِ ٱلْمُنكَرِ وَٱصْبِرْ عَلَىٰ مَآ أَصَابَكَ إِنَّ ذَٰلِكَ مِنْ عَزْمِ ٱلْأُمُورِ","fr":"O mon enfant accomplis la Salât, commande le convenable, interdis le blâmable et endure ce qui t'arrive avec patience. Telle est la résolution à prendre dans toute entreprise!","en":"O my son, establish prayer, enjoin what is right, forbid what is wrong, and be patient over what befalls you. Indeed, [all] that is of the matters [requiring] determination.","ref":{"ar":"سورة لقمان · الآية 17","fr":"Luqman · 31:17","en":"Luqman · 31:17"}},{"type":"ayah","ar":"وَتَوَكَّلْ عَلَى ٱللَّهِ وَكَفَىٰ بِٱللَّهِ وَكِيلًۭا","fr":"Et place ta confiance en Allah. Allah te suffit comme protecteur.","en":"And rely upon Allah; and sufficient is Allah as Disposer of affairs.","ref":{"ar":"سورة الأحزاب · الآية 3","fr":"Al-Ahzaab · 33:3","en":"Al-Ahzaab · 33:3"}},{"type":"ayah","ar":"إِنَّ ٱللَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِىِّ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ صَلُّوا۟ عَلَيْهِ وَسَلِّمُوا۟ تَسْلِيمًا","fr":"Certes, Allah et Ses Anges prient sur le Prophète; ô vous qui croyez priez sur lui et adressez [lui] vos salutations.","en":"Indeed, Allah confers blessing upon the Prophet, and His angels [ask Him to do so]. O you who have believed, ask [Allah to confer] blessing upon him and ask [Allah to grant him] peace.","ref":{"ar":"سورة الأحزاب · الآية 56","fr":"Al-Ahzaab · 33:56","en":"Al-Ahzaab · 33:56"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَقُولُوا۟ قَوْلًۭا سَدِيدًۭا","fr":"O vous qui croyez! Craignez Allah et parlez avec droiture,","en":"O you who have believed, fear Allah and speak words of appropriate justice.","ref":{"ar":"سورة الأحزاب · الآية 70","fr":"Al-Ahzaab · 33:70","en":"Al-Ahzaab · 33:70"}},{"type":"ayah","ar":"وَقَالُوا۟ ٱلْحَمْدُ لِلَّهِ ٱلَّذِىٓ أَذْهَبَ عَنَّا ٱلْحَزَنَ إِنَّ رَبَّنَا لَغَفُورٌۭ شَكُورٌ","fr":"Et ils diront: «Louange à Allah qui a écarté de nous l'affliction. Notre Seigneur est certes Pardonneur et Reconnaissant.","en":"And they will say, \"Praise to Allah, who has removed from us [all] sorrow. Indeed, our Lord is Forgiving and Appreciative -","ref":{"ar":"سورة فاطر · الآية 34","fr":"Faatir · 35:34","en":"Faatir · 35:34"}},{"type":"ayah","ar":"قُلْ يَٰعِبَادِ ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ رَبَّكُمْ لِلَّذِينَ أَحْسَنُوا۟ فِى هَٰذِهِ ٱلدُّنْيَا حَسَنَةٌۭ وَأَرْضُ ٱللَّهِ وَٰسِعَةٌ إِنَّمَا يُوَفَّى ٱلصَّٰبِرُونَ أَجْرَهُم بِغَيْرِ حِسَابٍۢ","fr":"Dis: «O Mes serviteurs qui avez cru! Craignez votre Seigneur». Ceux qui ici-bas font le bien, auront une bonne [récompense]. La terre d'Allah est vaste et les endurants auront leur pleine récompense sans compter.","en":"Say, \"O My servants who have believed, fear your Lord. For those who do good in this world is good, and the earth of Allah is spacious. Indeed, the patient will be given their reward without account.\"","ref":{"ar":"سورة الزمر · الآية 10","fr":"Az-Zumar · 39:10","en":"Az-Zumar · 39:10"}},{"type":"ayah","ar":"أَلَيْسَ ٱللَّهُ بِكَافٍ عَبْدَهُۥ وَيُخَوِّفُونَكَ بِٱلَّذِينَ مِن دُونِهِۦ وَمَن يُضْلِلِ ٱللَّهُ فَمَا لَهُۥ مِنْ هَادٍۢ","fr":"Allah ne suffit-Il pas à Son esclave [comme soutien]? Et ils te font peur avec ce qui est en dehors de Lui. Et quiconque Allah égare n'a point de guide.","en":"Is not Allah sufficient for His Servant [Prophet Muhammad]? And [yet], they threaten you with those [they worship] other than Him. And whoever Allah leaves astray - for him there is no guide.","ref":{"ar":"سورة الزمر · الآية 36","fr":"Az-Zumar · 39:36","en":"Az-Zumar · 39:36"}},{"type":"ayah","ar":"فَسَتَذْكُرُونَ مَآ أَقُولُ لَكُمْ وَأُفَوِّضُ أَمْرِىٓ إِلَى ٱللَّهِ إِنَّ ٱللَّهَ بَصِيرٌۢ بِٱلْعِبَادِ","fr":"Bientôt vous vous rappellerez ce que je vous dis; et je confie mon sort à Allah. Allah est, certes, Clairvoyant sur les serviteurs.","en":"And you will remember what I [now] say to you, and I entrust my affair to Allah. Indeed, Allah is Seeing of [His] servants.\"","ref":{"ar":"سورة غافر · الآية 44","fr":"Ghafir · 40:44","en":"Ghafir · 40:44"}},{"type":"ayah","ar":"فَٱصْبِرْ إِنَّ وَعْدَ ٱللَّهِ حَقٌّۭ وَٱسْتَغْفِرْ لِذَنۢبِكَ وَسَبِّحْ بِحَمْدِ رَبِّكَ بِٱلْعَشِىِّ وَٱلْإِبْكَٰرِ","fr":"Endure donc, car la promesse d'Allah est vérité, implore le pardon pour ton péché et célèbre la gloire et la louange de ton Seigneur, soir et matin.","en":"So be patient, [O Muhammad]. Indeed, the promise of Allah is truth. And ask forgiveness for your sin and exalt [Allah] with praise of your Lord in the evening and the morning.","ref":{"ar":"سورة غافر · الآية 55","fr":"Ghafir · 40:55","en":"Ghafir · 40:55"}},{"type":"ayah","ar":"وَلَا تَسْتَوِى ٱلْحَسَنَةُ وَلَا ٱلسَّيِّئَةُ ٱدْفَعْ بِٱلَّتِى هِىَ أَحْسَنُ فَإِذَا ٱلَّذِى بَيْنَكَ وَبَيْنَهُۥ عَدَٰوَةٌۭ كَأَنَّهُۥ وَلِىٌّ حَمِيمٌۭ","fr":"La bonne action et la mauvaise ne sont pas pareilles. Repousse (le mal) par ce qui est meilleur; et voilà que celui avec qui tu avais une animosité devient tel un ami chaleureux.","en":"And not equal are the good deed and the bad. Repel [evil] by that [deed] which is better; and thereupon the one whom between you and him is enmity [will become] as though he was a devoted friend.","ref":{"ar":"سورة فصلت · الآية 34","fr":"Fussilat · 41:34","en":"Fussilat · 41:34"}},{"type":"ayah","ar":"ٱللَّهُ لَطِيفٌۢ بِعِبَادِهِۦ يَرْزُقُ مَن يَشَآءُ وَهُوَ ٱلْقَوِىُّ ٱلْعَزِيزُ","fr":"Allah est doux envers Ses serviteurs. Il attribue [Ses biens] à qui Il veut. Et c'est Lui le Fort, le Puissant.","en":"Allah is Subtle with His servants; He gives provisions to whom He wills. And He is the Powerful, the Exalted in Might.","ref":{"ar":"سورة الشورى · الآية 19","fr":"Ash-Shura · 42:19","en":"Ash-Shura · 42:19"}},{"type":"ayah","ar":"وَلَمَن صَبَرَ وَغَفَرَ إِنَّ ذَٰلِكَ لَمِنْ عَزْمِ ٱلْأُمُورِ","fr":"Et celui qui endure et pardonne, cela en vérité, fait partie des bonnes dispositions et de la résolution dans les affaires.","en":"And whoever is patient and forgives - indeed, that is of the matters [requiring] determination.","ref":{"ar":"سورة الشورى · الآية 43","fr":"Ash-Shura · 42:43","en":"Ash-Shura · 42:43"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن تَنصُرُوا۟ ٱللَّهَ يَنصُرْكُمْ وَيُثَبِّتْ أَقْدَامَكُمْ","fr":"O vous qui croyez! si vous faites triompher (la cause d') Allah, Il vous fera triompher et raffermira vos pas.","en":"O you who have believed, if you support Allah, He will support you and plant firmly your feet.","ref":{"ar":"سورة محمد · الآية 7","fr":"Muhammad · 47:7","en":"Muhammad · 47:7"}},{"type":"ayah","ar":"إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌۭ فَأَصْلِحُوا۟ بَيْنَ أَخَوَيْكُمْ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُرْحَمُونَ","fr":"Les croyants ne sont que des frères. Etablissez la concorde entre vos frères, et craignez Allah, afin qu'on vous fasse miséricorde.","en":"The believers are but brothers, so make settlement between your brothers. And fear Allah that you may receive mercy.","ref":{"ar":"سورة الحجرات · الآية 10","fr":"Al-Hujuraat · 49:10","en":"Al-Hujuraat · 49:10"}},{"type":"ayah","ar":"وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ","fr":"Je n'ai créé les djinns et les hommes que pour qu'ils M'adorent.","en":"And I did not create the jinn and mankind except to worship Me.","ref":{"ar":"سورة الذاريات · الآية 56","fr":"Adh-Dhaariyat · 51:56","en":"Adh-Dhaariyat · 51:56"}},{"type":"ayah","ar":"وَٱصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا وَسَبِّحْ بِحَمْدِ رَبِّكَ حِينَ تَقُومُ","fr":"Et supporte patiemment la décision de ton Seigneur. Car en vérité, tu es sous Nos yeux. Et célèbre la gloire de ton Seigneur quand tu te lèves;","en":"And be patient, [O Muhammad], for the decision of your Lord, for indeed, you are in Our eyes. And exalt [Allah] with praise of your Lord when you arise.","ref":{"ar":"سورة الطور · الآية 48","fr":"At-Tur · 52:48","en":"At-Tur · 52:48"}},{"type":"ayah","ar":"وَأَن لَّيْسَ لِلْإِنسَٰنِ إِلَّا مَا سَعَىٰ","fr":"et qu'en vérité, l'homme n'obtient que [le fruit] de ses efforts;","en":"And that there is not for man except that [good] for which he strives","ref":{"ar":"سورة النجم · الآية 39","fr":"An-Najm · 53:39","en":"An-Najm · 53:39"}},{"type":"ayah","ar":"وَلَقَدْ يَسَّرْنَا ٱلْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍۢ","fr":"En effet, Nous avons rendu le Coran facile pour la méditation. Y a-t-il quelqu'un pour réfléchir?","en":"And We have certainly made the Qur'an easy for remembrance, so is there any who will remember?","ref":{"ar":"سورة القمر · الآية 17","fr":"Al-Qamar · 54:17","en":"Al-Qamar · 54:17"}},{"type":"ayah","ar":"وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو ٱلْجَلَٰلِ وَٱلْإِكْرَامِ","fr":"[Seule] subsistera La Face [Wajh] de ton Seigneur, plein de majesté et de noblesse.","en":"And there will remain the Face of your Lord, Owner of Majesty and Honor.","ref":{"ar":"سورة الرحمن · الآية 27","fr":"Ar-Rahmaan · 55:27","en":"Ar-Rahmaan · 55:27"}},{"type":"ayah","ar":"هَلْ جَزَآءُ ٱلْإِحْسَٰنِ إِلَّا ٱلْإِحْسَٰنُ","fr":"Y a-t-il d'autre récompense pour le bien, que le bien?","en":"Is the reward for good [anything] but good?","ref":{"ar":"سورة الرحمن · الآية 60","fr":"Ar-Rahmaan · 55:60","en":"Ar-Rahmaan · 55:60"}},{"type":"ayah","ar":"هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَٰهَ إِلَّا هُوَ عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ هُوَ ٱلرَّحْمَٰنُ ٱلرَّحِيمُ","fr":"C'est Lui Allah. Nulle divinité autre que Lui, le Connaisseur de l'Invisible tout comme du visible. C'est Lui, le Tout Miséricordieux, le Très Miséricordieux.","en":"He is Allah, other than whom there is no deity, Knower of the unseen and the witnessed. He is the Entirely Merciful, the Especially Merciful.","ref":{"ar":"سورة الحشر · الآية 22","fr":"Al-Hashr · 59:22","en":"Al-Hashr · 59:22"}},{"type":"ayah","ar":"مَآ أَصَابَ مِن مُّصِيبَةٍ إِلَّا بِإِذْنِ ٱللَّهِ وَمَن يُؤْمِنۢ بِٱللَّهِ يَهْدِ قَلْبَهُۥ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌۭ","fr":"Nul malheur n'atteint [l'homme] que par la permission d'Allah. Et quiconque croit en Allah, [Allah] guide son cœur. Allah est Omniscient.","en":"No disaster strikes except by permission of Allah. And whoever believes in Allah - He will guide his heart. And Allah is Knowing of all things.","ref":{"ar":"سورة التغابن · الآية 11","fr":"At-Taghaabun · 64:11","en":"At-Taghaabun · 64:11"}},{"type":"ayah","ar":"ٱلَّذِى خَلَقَ ٱلْمَوْتَ وَٱلْحَيَوٰةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًۭا وَهُوَ ٱلْعَزِيزُ ٱلْغَفُورُ","fr":"Celui qui a créé la mort et la vie afin de vous éprouver (et de savoir) qui de vous est le meilleur en œuvre, et c'est Lui le Puissant, le Pardonneur.","en":"[He] who created death and life to test you [as to] which of you is best in deed - and He is the Exalted in Might, the Forgiving -","ref":{"ar":"سورة الملك · الآية 2","fr":"Al-Mulk · 67:2","en":"Al-Mulk · 67:2"}},{"type":"ayah","ar":"فَقُلْتُ ٱسْتَغْفِرُوا۟ رَبَّكُمْ إِنَّهُۥ كَانَ غَفَّارًۭا","fr":"J'ai donc dit: «Implorez le pardon de votre Seigneur, car Il est grand Pardonneur,","en":"And said, 'Ask forgiveness of your Lord. Indeed, He is ever a Perpetual Forgiver.","ref":{"ar":"سورة نوح · الآية 10","fr":"Nooh · 71:10","en":"Nooh · 71:10"}},{"type":"ayah","ar":"وَٱذْكُرِ ٱسْمَ رَبِّكَ وَتَبَتَّلْ إِلَيْهِ تَبْتِيلًۭا","fr":"Et rappelle-toi le nom de ton Seigneur et consacre-toi totalement à Lui,","en":"And remember the name of your Lord and devote yourself to Him with [complete] devotion.","ref":{"ar":"سورة المزمل · الآية 8","fr":"Al-Muzzammil · 73:8","en":"Al-Muzzammil · 73:8"}},{"type":"ayah","ar":"إِنَّمَا نُطْعِمُكُمْ لِوَجْهِ ٱللَّهِ لَا نُرِيدُ مِنكُمْ جَزَآءًۭ وَلَا شُكُورًا","fr":"(disant): «C'est pour le visage d'Allah que nous vous nourrissons: nous ne voulons de vous ni récompense ni gratitude.","en":"[Saying], \"We feed you only for the countenance of Allah. We wish not from you reward or gratitude.","ref":{"ar":"سورة الإنسان · الآية 9","fr":"Al-Insaan · 76:9","en":"Al-Insaan · 76:9"}},{"type":"ayah","ar":"قَدْ أَفْلَحَ مَن تَزَكَّىٰ","fr":"Réussit, certes, celui qui se purifie,","en":"He has certainly succeeded who purifies himself","ref":{"ar":"سورة الأعلى · الآية 14","fr":"Al-A'laa · 87:14","en":"Al-A'laa · 87:14"}},{"type":"ayah","ar":"وَٱلْءَاخِرَةُ خَيْرٌۭ وَأَبْقَىٰٓ","fr":"alors que l'au-delà est meilleur et plus durable.","en":"While the Hereafter is better and more enduring.","ref":{"ar":"سورة الأعلى · الآية 17","fr":"Al-A'laa · 87:17","en":"Al-A'laa · 87:17"}},{"type":"ayah","ar":"يَٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ","fr":"«O toi, âme apaisée,","en":"[To the righteous it will be said], \"O reassured soul,","ref":{"ar":"سورة الفجر · الآية 27","fr":"Al-Fajr · 89:27","en":"Al-Fajr · 89:27"}},{"type":"ayah","ar":"ٱرْجِعِىٓ إِلَىٰ رَبِّكِ رَاضِيَةًۭ مَّرْضِيَّةًۭ","fr":"retourne vers ton Seigneur, satisfaite et agréée;","en":"Return to your Lord, well-pleased and pleasing [to Him],","ref":{"ar":"سورة الفجر · الآية 28","fr":"Al-Fajr · 89:28","en":"Al-Fajr · 89:28"}},{"type":"ayah","ar":"مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","fr":"Ton Seigneur ne t'a ni abandonné, ni détesté.","en":"Your Lord has not taken leave of you, [O Muhammad], nor has He detested [you].","ref":{"ar":"سورة الضحى · الآية 3","fr":"Ad-Dhuhaa · 93:3","en":"Ad-Dhuhaa · 93:3"}},{"type":"ayah","ar":"وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ","fr":"Et quant au bienfait de ton Seigneur, proclame-le.","en":"But as for the favor of your Lord, report [it].","ref":{"ar":"سورة الضحى · الآية 11","fr":"Ad-Dhuhaa · 93:11","en":"Ad-Dhuhaa · 93:11"}},{"type":"ayah","ar":"فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","fr":"A côté de la difficulté est, certes, une facilité!","en":"For indeed, with hardship [will be] ease.","ref":{"ar":"سورة الشرح · الآية 5","fr":"Ash-Sharh · 94:5","en":"Ash-Sharh · 94:5"}},{"type":"ayah","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ","fr":"Lis, au nom de ton Seigneur qui a créé,","en":"Recite in the name of your Lord who created -","ref":{"ar":"سورة العلق · الآية 1","fr":"Al-Alaq · 96:1","en":"Al-Alaq · 96:1"}},{"type":"ayah","ar":"فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًۭا يَرَهُۥ","fr":"Quiconque fait un bien fût-ce du poids d'un atome, le verra,","en":"So whoever does an atom's weight of good will see it,","ref":{"ar":"سورة الزلزلة · الآية 7","fr":"Az-Zalzala · 99:7","en":"Az-Zalzala · 99:7"}},{"type":"ayah","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ إِنَّآ أَعْطَيْنَٰكَ ٱلْكَوْثَرَ","fr":"Nous t'avons certes, accordé l'Abondance.","en":"Indeed, We have granted you, [O Muhammad], al-Kawthar.","ref":{"ar":"سورة الكوثر · الآية 1","fr":"Al-Kawthar · 108:1","en":"Al-Kawthar · 108:1"}},{"type":"ayah","ar":"فَسَبِّحْ بِحَمْدِ رَبِّكَ وَٱسْتَغْفِرْهُ إِنَّهُۥ كَانَ تَوَّابًۢا","fr":"alors, par la louange, célèbre la gloire de ton Seigneur et implore Son pardon. Car c'est Lui le grand Accueillant au repentir.","en":"Then exalt [Him] with praise of your Lord and ask forgiveness of Him. Indeed, He is ever Accepting of repentance.","ref":{"ar":"سورة النصر · الآية 3","fr":"An-Nasr · 110:3","en":"An-Nasr · 110:3"}},{"type":"ayah","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ","fr":"Dis: «Il est Allah, Unique.","en":"Say, \"He is Allah, [who is] One,","ref":{"ar":"سورة الإخلاص · الآية 1","fr":"Al-Ikhlaas · 112:1","en":"Al-Ikhlaas · 112:1"}},{"type":"ayah","ar":"ذَٰلِكَ ٱلْكِتَٰبُ لَا رَيْبَ فِيهِ هُدًۭى لِّلْمُتَّقِينَ","fr":"C'est le Livre au sujet duquel il n'y a aucun doute, c'est un guide pour les pieux,","en":"This is the Book about which there is no doubt, a guidance for those conscious of Allah -","ref":{"ar":"سورة البقرة · الآية 2","fr":"Al-Baqara · 2:2","en":"Al-Baqara · 2:2"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلنَّاسُ ٱعْبُدُوا۟ رَبَّكُمُ ٱلَّذِى خَلَقَكُمْ وَٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","fr":"O hommes! Adorez votre Seigneur, qui vous a créés vous et ceux qui vous ont précédés. Ainsi atteindriez-vous à la piété.","en":"O mankind, worship your Lord, who created you and those before you, that you may become righteous -","ref":{"ar":"سورة البقرة · الآية 21","fr":"Al-Baqara · 2:21","en":"Al-Baqara · 2:21"}},{"type":"ayah","ar":"بَلَىٰ مَنْ أَسْلَمَ وَجْهَهُۥ لِلَّهِ وَهُوَ مُحْسِنٌۭ فَلَهُۥٓ أَجْرُهُۥ عِندَ رَبِّهِۦ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","fr":"Non, mais quiconque soumet à Allah son être tout en faisant le bien, aura sa rétribution auprès de son Seigneur. Pour eux, nulle crainte, et ils ne seront point attristés.","en":"Yes [on the contrary], whoever submits his face in Islam to Allah while being a doer of good will have his reward with his Lord. And no fear will there be concerning them, nor will they grieve.","ref":{"ar":"سورة البقرة · الآية 112","fr":"Al-Baqara · 2:112","en":"Al-Baqara · 2:112"}},{"type":"ayah","ar":"وَإِذْ يَرْفَعُ إِبْرَٰهِۦمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَٰعِيلُ رَبَّنَا تَقَبَّلْ مِنَّآ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ","fr":"Et quand Abraham et Ismaël élevaient les assises de la Maison: «O notre Seigneur, accepte ceci de notre part! Car c'est Toi l'Audient, l'Omniscient.","en":"And [mention] when Abraham was raising the foundations of the House and [with him] Ishmael, [saying], \"Our Lord, accept [this] from us. Indeed You are the Hearing, the Knowing.","ref":{"ar":"سورة البقرة · الآية 127","fr":"Al-Baqara · 2:127","en":"Al-Baqara · 2:127"}},{"type":"ayah","ar":"وَلِكُلٍّۢ وِجْهَةٌ هُوَ مُوَلِّيهَا فَٱسْتَبِقُوا۟ ٱلْخَيْرَٰتِ أَيْنَ مَا تَكُونُوا۟ يَأْتِ بِكُمُ ٱللَّهُ جَمِيعًا إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ","fr":"A chacun une orientation vers laquelle il se tourne. Rivalisez donc dans les bonnes œuvres. Où que vous soyez, Allah vous ramènera tous vers Lui, car Allah est, certes Omnipotent.","en":"For each [religious following] is a direction toward which it faces. So race to [all that is] good. Wherever you may be, Allah will bring you forth [for judgement] all together. Indeed, Allah is over all things competent.","ref":{"ar":"سورة البقرة · الآية 148","fr":"Al-Baqara · 2:148","en":"Al-Baqara · 2:148"}},{"type":"ayah","ar":"وَلَنَبْلُوَنَّكُم بِشَىْءٍۢ مِّنَ ٱلْخَوْفِ وَٱلْجُوعِ وَنَقْصٍۢ مِّنَ ٱلْأَمْوَٰلِ وَٱلْأَنفُسِ وَٱلثَّمَرَٰتِ وَبَشِّرِ ٱلصَّٰبِرِينَ","fr":"Très certainement, Nous vous éprouverons par un peu de peur, de faim et de diminution de biens, de personnes et de fruits. Et fais la bonne annonce aux endurants,","en":"And We will surely test you with something of fear and hunger and a loss of wealth and lives and fruits, but give good tidings to the patient,","ref":{"ar":"سورة البقرة · الآية 155","fr":"Al-Baqara · 2:155","en":"Al-Baqara · 2:155"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","fr":"O les croyants! On vous a prescrit aS-Siyâm comme on l'a prescrit à ceux d'avant vous, ainsi atteindrez-vous la piété,","en":"O you who have believed, decreed upon you is fasting as it was decreed upon those before you that you may become righteous -","ref":{"ar":"سورة البقرة · الآية 183","fr":"Al-Baqara · 2:183","en":"Al-Baqara · 2:183"}},{"type":"ayah","ar":"حَٰفِظُوا۟ عَلَى ٱلصَّلَوَٰتِ وَٱلصَّلَوٰةِ ٱلْوُسْطَىٰ وَقُومُوا۟ لِلَّهِ قَٰنِتِينَ","fr":"Soyez assidus aux Salâts et surtout la Salât médiane; et tenez-vous debout devant Allah, avec humilité.","en":"Maintain with care the [obligatory] prayers and [in particular] the middle prayer and stand before Allah, devoutly obedient.","ref":{"ar":"سورة البقرة · الآية 238","fr":"Al-Baqara · 2:238","en":"Al-Baqara · 2:238"}},{"type":"ayah","ar":"مَّن ذَا ٱلَّذِى يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًۭا فَيُضَٰعِفَهُۥ لَهُۥٓ أَضْعَافًۭا كَثِيرَةًۭ وَٱللَّهُ يَقْبِضُ وَيَبْص ُطُ وَإِلَيْهِ تُرْجَعُونَ","fr":"Quiconque prête à Allah de bonne grâce, Il le lui rendra multiplié plusieurs fois. Allah restreint ou étend (Ses faveurs.) Et c'est à Lui que vous retournerez.","en":"Who is it that would loan Allah a goodly loan so He may multiply it for him many times over? And it is Allah who withholds and grants abundance, and to Him you will be returned.","ref":{"ar":"سورة البقرة · الآية 245","fr":"Al-Baqara · 2:245","en":"Al-Baqara · 2:245"}},{"type":"ayah","ar":"قَوْلٌۭ مَّعْرُوفٌۭ وَمَغْفِرَةٌ خَيْرٌۭ مِّن صَدَقَةٍۢ يَتْبَعُهَآ أَذًۭى وَٱللَّهُ غَنِىٌّ حَلِيمٌۭ","fr":"Une parole agréable et un pardon valent mieux qu'une aumône suivie d'un tort. Allah n'a besoin de rien, et Il est Indulgent.","en":"Kind speech and forgiveness are better than charity followed by injury. And Allah is Free of need and Forbearing.","ref":{"ar":"سورة البقرة · الآية 263","fr":"Al-Baqara · 2:263","en":"Al-Baqara · 2:263"}},{"type":"ayah","ar":"ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُم بِٱلَّيْلِ وَٱلنَّهَارِ سِرًّۭا وَعَلَانِيَةًۭ فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","fr":"Ceux qui, de nuit et de jour, en secret et ouvertement, dépensent leurs biens (dans les bonnes œuvres), ont leur salaire auprès de leur Seigneur. Ils n'ont rien à craindre et ils ne seront point affligés.","en":"Those who spend their wealth [in Allah 's way] by night and by day, secretly and publicly - they will have their reward with their Lord. And no fear will there be concerning them, nor will they grieve.","ref":{"ar":"سورة البقرة · الآية 274","fr":"Al-Baqara · 2:274","en":"Al-Baqara · 2:274"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَءَاتَوُا۟ ٱلزَّكَوٰةَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ","fr":"Ceux qui ont la foi, ont fait de bonnes œuvres, accompli la Salât et acquitté la Zakât auront certes leur récompense auprès de leur Seigneur. Pas de crainte pour eux, et ils ne seront point affligés.","en":"Indeed, those who believe and do righteous deeds and establish prayer and give zakah will have their reward with their Lord, and there will be no fear concerning them, nor will they grieve.","ref":{"ar":"سورة البقرة · الآية 277","fr":"Al-Baqara · 2:277","en":"Al-Baqara · 2:277"}},{"type":"ayah","ar":"وَإِن كَانَ ذُو عُسْرَةٍۢ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍۢ وَأَن تَصَدَّقُوا۟ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ","fr":"A celui qui est dans la gêne, accordez un sursis jusqu'à ce qu'il soit dans l'aisance. Mais il est mieux pour vous de faire remise de la dette par charité! Si vous saviez!","en":"And if someone is in hardship, then [let there be] postponement until [a time of] ease. But if you give [from your right as] charity, then it is better for you, if you only knew.","ref":{"ar":"سورة البقرة · الآية 280","fr":"Al-Baqara · 2:280","en":"Al-Baqara · 2:280"}},{"type":"ayah","ar":"رَبَّنَآ إِنَّكَ جَامِعُ ٱلنَّاسِ لِيَوْمٍۢ لَّا رَيْبَ فِيهِ إِنَّ ٱللَّهَ لَا يُخْلِفُ ٱلْمِيعَادَ","fr":"Seigneur! C'est Toi qui rassembleras les gens, un jour - en quoi il n'y a point de doute - Allah, vraiment, ne manque jamais à Sa promesse.»","en":"Our Lord, surely You will gather the people for a Day about which there is no doubt. Indeed, Allah does not fail in His promise.\"","ref":{"ar":"سورة آل عمران · الآية 9","fr":"Aal-i-Imraan · 3:9","en":"Aal-i-Imraan · 3:9"}},{"type":"ayah","ar":"ٱلَّذِينَ يَقُولُونَ رَبَّنَآ إِنَّنَآ ءَامَنَّا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ ٱلنَّارِ","fr":"qui disent: «O notre Seigneur, nous avons la foi; pardonne-nous donc nos péchés, et protège-nous du châtiment du Feu»,","en":"Those who say, \"Our Lord, indeed we have believed, so forgive us our sins and protect us from the punishment of the Fire,\"","ref":{"ar":"سورة آل عمران · الآية 16","fr":"Aal-i-Imraan · 3:16","en":"Aal-i-Imraan · 3:16"}},{"type":"ayah","ar":"قُلِ ٱللَّهُمَّ مَٰلِكَ ٱلْمُلْكِ تُؤْتِى ٱلْمُلْكَ مَن تَشَآءُ وَتَنزِعُ ٱلْمُلْكَ مِمَّن تَشَآءُ وَتُعِزُّ مَن تَشَآءُ وَتُذِلُّ مَن تَشَآءُ بِيَدِكَ ٱلْخَيْرُ إِنَّكَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ","fr":"- Dis: «O Allah, Maître de l'autorité absolue. Tu donnes l'autorité à qui Tu veux, et Tu arraches l'autorité à qui Tu veux; et Tu donnes la puissance à qui Tu veux, et Tu humilies qui Tu veux. Le bien est en Ta main et Tu es Omnipotent.","en":"Say, \"O Allah, Owner of Sovereignty, You give sovereignty to whom You will and You take sovereignty away from whom You will. You honor whom You will and You humble whom You will. In Your hand is [all] good. Indeed, You are over all things competent.","ref":{"ar":"سورة آل عمران · الآية 26","fr":"Aal-i-Imraan · 3:26","en":"Aal-i-Imraan · 3:26"}},{"type":"ayah","ar":"هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُۥ قَالَ رَبِّ هَبْ لِى مِن لَّدُنكَ ذُرِّيَّةًۭ طَيِّبَةً إِنَّكَ سَمِيعُ ٱلدُّعَآءِ","fr":"Alors, Zacharie pria son Seigneur, et dit: «O mon Seigneur, donne-moi, venant de Toi, une excellente descendance. Car Tu es Celui qui entend bien la prière».","en":"At that, Zechariah called upon his Lord, saying, \"My Lord, grant me from Yourself a good offspring. Indeed, You are the Hearer of supplication.\"","ref":{"ar":"سورة آل عمران · الآية 38","fr":"Aal-i-Imraan · 3:38","en":"Aal-i-Imraan · 3:38"}},{"type":"ayah","ar":"رَبَّنَآ ءَامَنَّا بِمَآ أَنزَلْتَ وَٱتَّبَعْنَا ٱلرَّسُولَ فَٱكْتُبْنَا مَعَ ٱلشَّٰهِدِينَ","fr":"Seigneur! Nous avons cru à ce que Tu as fait descendre et suivi le messager. Inscris-nous donc parmi ceux qui témoignent».","en":"Our Lord, we have believed in what You revealed and have followed the messenger Jesus, so register us among the witnesses [to truth].\"","ref":{"ar":"سورة آل عمران · الآية 53","fr":"Aal-i-Imraan · 3:53","en":"Aal-i-Imraan · 3:53"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ حَقَّ تُقَاتِهِۦ وَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ","fr":"O les croyants! Craignez Allah comme Il doit être craint. Et ne mourez qu'en pleine soumission.","en":"O you who have believed, fear Allah as He should be feared and do not die except as Muslims [in submission to Him].","ref":{"ar":"سورة آل عمران · الآية 102","fr":"Aal-i-Imraan · 3:102","en":"Aal-i-Imraan · 3:102"}},{"type":"ayah","ar":"وَلْتَكُن مِّنكُمْ أُمَّةٌۭ يَدْعُونَ إِلَى ٱلْخَيْرِ وَيَأْمُرُونَ بِٱلْمَعْرُوفِ وَيَنْهَوْنَ عَنِ ٱلْمُنكَرِ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ","fr":"Que soit issue de vous une communauté qui appelle au bien, ordonne le convenable, et interdit le blâmable. Car ce seront eux qui réussiront.","en":"And let there be [arising] from you a nation inviting to [all that is] good, enjoining what is right and forbidding what is wrong, and those will be the successful.","ref":{"ar":"سورة آل عمران · الآية 104","fr":"Aal-i-Imraan · 3:104","en":"Aal-i-Imraan · 3:104"}},{"type":"ayah","ar":"وَسَارِعُوٓا۟ إِلَىٰ مَغْفِرَةٍۢ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا ٱلسَّمَٰوَٰتُ وَٱلْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ","fr":"Et concourez au pardon de votre Seigneur, et à un Jardin (paradis) large comme les cieux et la terre, préparé pour les pieux,","en":"And hasten to forgiveness from your Lord and a garden as wide as the heavens and earth, prepared for the righteous","ref":{"ar":"سورة آل عمران · الآية 133","fr":"Aal-i-Imraan · 3:133","en":"Aal-i-Imraan · 3:133"}},{"type":"ayah","ar":"وَٱلَّذِينَ إِذَا فَعَلُوا۟ فَٰحِشَةً أَوْ ظَلَمُوٓا۟ أَنفُسَهُمْ ذَكَرُوا۟ ٱللَّهَ فَٱسْتَغْفَرُوا۟ لِذُنُوبِهِمْ وَمَن يَغْفِرُ ٱلذُّنُوبَ إِلَّا ٱللَّهُ وَلَمْ يُصِرُّوا۟ عَلَىٰ مَا فَعَلُوا۟ وَهُمْ يَعْلَمُونَ","fr":"et pour ceux qui, s'ils ont commis quelque turpitude ou causé quelque préjudice à leurs propres âmes (en désobéissant à Allah), se souviennent d'Allah et demandent pardon pour leurs péchés - et qui est-ce qui pardonne les péchés sinon Allah? - et qui ne persistent pas sciemment dans le mal qu'ils ont fait.","en":"And those who, when they commit an immorality or wrong themselves [by transgression], remember Allah and seek forgiveness for their sins - and who can forgive sins except Allah? - and [who] do not persist in what they have done while they know.","ref":{"ar":"سورة آل عمران · الآية 135","fr":"Aal-i-Imraan · 3:135","en":"Aal-i-Imraan · 3:135"}},{"type":"ayah","ar":"وَمَا كَانَ قَوْلَهُمْ إِلَّآ أَن قَالُوا۟ رَبَّنَا ٱغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِىٓ أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ","fr":"Et ils n'eurent que cette parole: «Seigneur, pardonne-nous nos péchés ainsi que nos excès dans nos comportements, affermis nos pas et donne-nous la victoire sur les gens mécréants».","en":"And their words were not but that they said, \"Our Lord, forgive us our sins and the excess [committed] in our affairs and plant firmly our feet and give us victory over the disbelieving people.\"","ref":{"ar":"سورة آل عمران · الآية 147","fr":"Aal-i-Imraan · 3:147","en":"Aal-i-Imraan · 3:147"}},{"type":"ayah","ar":"إِن يَنصُرْكُمُ ٱللَّهُ فَلَا غَالِبَ لَكُمْ وَإِن يَخْذُلْكُمْ فَمَن ذَا ٱلَّذِى يَنصُرُكُم مِّنۢ بَعْدِهِۦ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ","fr":"Si Allah vous donne Son secours, nul ne peut vous vaincre. S'Il vous abandonne, qui donc après Lui vous donnera secours? C'est à Allah que les croyants doivent faire confiance.","en":"If Allah should aid you, no one can overcome you; but if He should forsake you, who is there that can aid you after Him? And upon Allah let the believers rely.","ref":{"ar":"سورة آل عمران · الآية 160","fr":"Aal-i-Imraan · 3:160","en":"Aal-i-Imraan · 3:160"}},{"type":"ayah","ar":"رَبَّنَا وَءَاتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ ٱلْقِيَٰمَةِ إِنَّكَ لَا تُخْلِفُ ٱلْمِيعَادَ","fr":"Seigneur! Donne-nous ce que Tu nous as promis par Tes messagers. Et ne nous couvre pas d'ignominie au Jour de la Résurrection. Car Toi, Tu ne manques pas à Ta promesse».","en":"Our Lord, and grant us what You promised us through Your messengers and do not disgrace us on the Day of Resurrection. Indeed, You do not fail in [Your] promise.\"","ref":{"ar":"سورة آل عمران · الآية 194","fr":"Aal-i-Imraan · 3:194","en":"Aal-i-Imraan · 3:194"}},{"type":"ayah","ar":"إِن تَجْتَنِبُوا۟ كَبَآئِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنكُمْ سَيِّـَٔاتِكُمْ وَنُدْخِلْكُم مُّدْخَلًۭا كَرِيمًۭا","fr":"Si vous évitez les grands péchés qui vous sont interdits, Nous effacerons vos méfaits de votre compte, et Nous vous ferons entrer dans un endroit honorable (le Paradis).","en":"If you avoid the major sins which you are forbidden, We will remove from you your lesser sins and admit you to a noble entrance [into Paradise].","ref":{"ar":"سورة النساء · الآية 31","fr":"An-Nisaa · 4:31","en":"An-Nisaa · 4:31"}},{"type":"ayah","ar":"إِنَّ ٱللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍۢ وَإِن تَكُ حَسَنَةًۭ يُضَٰعِفْهَا وَيُؤْتِ مِن لَّدُنْهُ أَجْرًا عَظِيمًۭا","fr":"Certes, Allah ne lèse (personne), fût-ce du poids d'un atome. S'il est une bonne action, Il la double, et accorde une grosse récompense de Sa part.","en":"Indeed, Allah does not do injustice, [even] as much as an atom's weight; while if there is a good deed, He multiplies it and gives from Himself a great reward.","ref":{"ar":"سورة النساء · الآية 40","fr":"An-Nisaa · 4:40","en":"An-Nisaa · 4:40"}},{"type":"ayah","ar":"مَّا يَفْعَلُ ٱللَّهُ بِعَذَابِكُمْ إِن شَكَرْتُمْ وَءَامَنتُمْ وَكَانَ ٱللَّهُ شَاكِرًا عَلِيمًۭا","fr":"Pourquoi Allah vous infligerait-Il un châtiment si vous êtes reconnaissants et croyants? Allah est Reconnaissant et Omniscient.","en":"What would Allah do with your punishment if you are grateful and believe? And ever is Allah Appreciative and Knowing.","ref":{"ar":"سورة النساء · الآية 147","fr":"An-Nisaa · 4:147","en":"An-Nisaa · 4:147"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَٱبْتَغُوٓا۟ إِلَيْهِ ٱلْوَسِيلَةَ وَجَٰهِدُوا۟ فِى سَبِيلِهِۦ لَعَلَّكُمْ تُفْلِحُونَ","fr":"O les croyants! Craignez Allah, cherchez le moyen de vous rapprocher de Lui et luttez pour Sa cause. Peut-être serez-vous de ceux qui réussissent!","en":"O you who have believed, fear Allah and seek the means [of nearness] to Him and strive in His cause that you may succeed.","ref":{"ar":"سورة المائدة · الآية 35","fr":"Al-Maaida · 5:35","en":"Al-Maaida · 5:35"}},{"type":"ayah","ar":"وَإِن يَمْسَسْكَ ٱللَّهُ بِضُرٍّۢ فَلَا كَاشِفَ لَهُۥٓ إِلَّا هُوَ وَإِن يَمْسَسْكَ بِخَيْرٍۢ فَهُوَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ","fr":"Et si Allah fait qu'un malheur te touche, nul autre que Lui ne peut l'enlever. Et s'Il fait qu'un bonheur te touche... c'est qu'Il est Omnipotent.","en":"And if Allah should touch you with adversity, there is no remover of it except Him. And if He touches you with good - then He is over all things competent.","ref":{"ar":"سورة الأنعام · الآية 17","fr":"Al-An'aam · 6:17","en":"Al-An'aam · 6:17"}},{"type":"ayah","ar":"وَمَا ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا لَعِبٌۭ وَلَهْوٌۭ وَلَلدَّارُ ٱلْءَاخِرَةُ خَيْرٌۭ لِّلَّذِينَ يَتَّقُونَ أَفَلَا تَعْقِلُونَ","fr":"La présente vie n'est que jeu et amusement. La demeure dans l'au-delà sera meilleure pour ceux qui sont pieux. Eh bien, ne comprenez-vous pas?","en":"And the worldly life is not but amusement and diversion; but the home of the Hereafter is best for those who fear Allah, so will you not reason?","ref":{"ar":"سورة الأنعام · الآية 32","fr":"Al-An'aam · 6:32","en":"Al-An'aam · 6:32"}},{"type":"ayah","ar":"لَّا تُدْرِكُهُ ٱلْأَبْصَٰرُ وَهُوَ يُدْرِكُ ٱلْأَبْصَٰرَ وَهُوَ ٱللَّطِيفُ ٱلْخَبِيرُ","fr":"Les regards ne peuvent l'atteindre, cependant qu'Il saisit tous les regards. Et Il est le Doux, le Parfaitement Connaisseur.","en":"Vision perceives Him not, but He perceives [all] vision; and He is the Subtle, the Acquainted.","ref":{"ar":"سورة الأنعام · الآية 103","fr":"Al-An'aam · 6:103","en":"Al-An'aam · 6:103"}},{"type":"ayah","ar":"مَن جَآءَ بِٱلْحَسَنَةِ فَلَهُۥ عَشْرُ أَمْثَالِهَا وَمَن جَآءَ بِٱلسَّيِّئَةِ فَلَا يُجْزَىٰٓ إِلَّا مِثْلَهَا وَهُمْ لَا يُظْلَمُونَ","fr":"Quiconque viendra avec le bien aura dix fois autant; et quiconque viendra avec le mal ne sera rétribué que par son équivalent. Et on ne leur fera aucune injustice.","en":"Whoever comes [on the Day of Judgement] with a good deed will have ten times the like thereof [to his credit], and whoever comes with an evil deed will not be recompensed except the like thereof; and they will not be wronged.","ref":{"ar":"سورة الأنعام · الآية 160","fr":"Al-An'aam · 6:160","en":"Al-An'aam · 6:160"}},{"type":"ayah","ar":"يَٰبَنِىٓ ءَادَمَ خُذُوا۟ زِينَتَكُمْ عِندَ كُلِّ مَسْجِدٍۢ وَكُلُوا۟ وَٱشْرَبُوا۟ وَلَا تُسْرِفُوٓا۟ إِنَّهُۥ لَا يُحِبُّ ٱلْمُسْرِفِينَ","fr":"O enfants d'Adam, dans chaque lieu de Salât portez votre parure (vos habits). Et mangez et buvez; et ne commettez pas d'excès, car Il [Allah] n'aime pas ceux qui commettent des excès.","en":"O children of Adam, take your adornment at every masjid, and eat and drink, but be not excessive. Indeed, He likes not those who commit excess.","ref":{"ar":"سورة الأعراف · الآية 31","fr":"Al-A'raaf · 7:31","en":"Al-A'raaf · 7:31"}},{"type":"ayah","ar":"ٱدْعُوا۟ رَبَّكُمْ تَضَرُّعًۭا وَخُفْيَةً إِنَّهُۥ لَا يُحِبُّ ٱلْمُعْتَدِينَ","fr":"Invoquez votre Seigneur en toute humilité et recueillement et avec discrétion. Certes, Il n'aime pas les transgresseurs.","en":"Call upon your Lord in humility and privately; indeed, He does not like transgressors.","ref":{"ar":"سورة الأعراف · الآية 55","fr":"Al-A'raaf · 7:55","en":"Al-A'raaf · 7:55"}},{"type":"ayah","ar":"وَلِلَّهِ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ فَٱدْعُوهُ بِهَا وَذَرُوا۟ ٱلَّذِينَ يُلْحِدُونَ فِىٓ أَسْمَٰٓئِهِۦ سَيُجْزَوْنَ مَا كَانُوا۟ يَعْمَلُونَ","fr":"C'est à Allah qu'appartiennent les noms les plus beaux. Invoquez-Le par ces noms et laissez ceux qui profanent Ses noms: ils seront rétribués pour ce qu'ils ont fait.","en":"And to Allah belong the best names, so invoke Him by them. And leave [the company of] those who practice deviation concerning His names. They will be recompensed for what they have been doing.","ref":{"ar":"سورة الأعراف · الآية 180","fr":"Al-A'raaf · 7:180","en":"Al-A'raaf · 7:180"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ ٱتَّقَوْا۟ إِذَا مَسَّهُمْ طَٰٓئِفٌۭ مِّنَ ٱلشَّيْطَٰنِ تَذَكَّرُوا۟ فَإِذَا هُم مُّبْصِرُونَ","fr":"Ceux qui pratiquent la piété, lorsqu'une suggestion du Diable les touche se rappellent [du châtiment d'Allah]: et les voilà devenus clairvoyants.","en":"Indeed, those who fear Allah - when an impulse touches them from Satan, they remember [Him] and at once they have insight.","ref":{"ar":"سورة الأعراف · الآية 201","fr":"Al-A'raaf · 7:201","en":"Al-A'raaf · 7:201"}},{"type":"ayah","ar":"وَإِذَا قُرِئَ ٱلْقُرْءَانُ فَٱسْتَمِعُوا۟ لَهُۥ وَأَنصِتُوا۟ لَعَلَّكُمْ تُرْحَمُونَ","fr":"Et quand on récite le Coran, prêtez-lui l'oreille attentivement et observez le silence, afin que vous obteniez la miséricorde (d'Allah).","en":"So when the Qur'an is recited, then listen to it and pay attention that you may receive mercy.","ref":{"ar":"سورة الأعراف · الآية 204","fr":"Al-A'raaf · 7:204","en":"Al-A'raaf · 7:204"}},{"type":"ayah","ar":"إِنَّمَا ٱلْمُؤْمِنُونَ ٱلَّذِينَ إِذَا ذُكِرَ ٱللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ ءَايَٰتُهُۥ زَادَتْهُمْ إِيمَٰنًۭا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ","fr":"Les vrais croyants sont ceux dont les cœurs frémissent quand on mentionne Allah. Et quand Ses versets leur sont récités, cela fait augmenter leur foi. Et ils placent leur confiance en leur Seigneur.","en":"The believers are only those who, when Allah is mentioned, their hearts become fearful, and when His verses are recited to them, it increases them in faith; and upon their Lord they rely -","ref":{"ar":"سورة الأنفال · الآية 2","fr":"Al-Anfaal · 8:2","en":"Al-Anfaal · 8:2"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن تَتَّقُوا۟ ٱللَّهَ يَجْعَل لَّكُمْ فُرْقَانًۭا وَيُكَفِّرْ عَنكُمْ سَيِّـَٔاتِكُمْ وَيَغْفِرْ لَكُمْ وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ","fr":"O vous qui croyez! Si vous craignez Allah, Il vous accordera la faculté de discerner (entre le bien et le mal), vous effacera vos méfaits et vous pardonnera. Et Allah est le Détenteur de l'énorme grâce.","en":"O you who have believed, if you fear Allah, He will grant you a criterion and will remove from you your misdeeds and forgive you. And Allah is the possessor of great bounty.","ref":{"ar":"سورة الأنفال · الآية 29","fr":"Al-Anfaal · 8:29","en":"Al-Anfaal · 8:29"}},{"type":"ayah","ar":"وَقُلِ ٱعْمَلُوا۟ فَسَيَرَى ٱللَّهُ عَمَلَكُمْ وَرَسُولُهُۥ وَٱلْمُؤْمِنُونَ وَسَتُرَدُّونَ إِلَىٰ عَٰلِمِ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَ","fr":"Et dis: «Oeuvrez, car Allah va voir votre œuvre, de même que Son messager et les croyants, et vous serez ramenés vers Celui qui connaît bien l'invisible et le visible. Alors Il vous informera de ce que vous faisiez».","en":"And say, \"Do [as you will], for Allah will see your deeds, and [so, will] His Messenger and the believers. And you will be returned to the Knower of the unseen and the witnessed, and He will inform you of what you used to do.\"","ref":{"ar":"سورة التوبة · الآية 105","fr":"At-Tawba · 9:105","en":"At-Tawba · 9:105"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَكُونُوا۟ مَعَ ٱلصَّٰدِقِينَ","fr":"O vous qui croyez! Craignez Allah et soyez avec les véridiques.","en":"O you who have believed, fear Allah and be with those who are true.","ref":{"ar":"سورة التوبة · الآية 119","fr":"At-Tawba · 9:119","en":"At-Tawba · 9:119"}},{"type":"ayah","ar":"لَقَدْ جَآءَكُمْ رَسُولٌۭ مِّنْ أَنفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُم بِٱلْمُؤْمِنِينَ رَءُوفٌۭ رَّحِيمٌۭ","fr":"Certes, un Messager pris parmi vous, est venu à vous, auquel pèsent lourd les difficultés que vous subissez, qui est plein de sollicitude pour vous, qui est compatissant et miséricordieux envers les croyants.","en":"There has certainly come to you a Messenger from among yourselves. Grievous to him is what you suffer; [he is] concerned over you and to the believers is kind and merciful.","ref":{"ar":"سورة التوبة · الآية 128","fr":"At-Tawba · 9:128","en":"At-Tawba · 9:128"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ يَهْدِيهِمْ رَبُّهُم بِإِيمَٰنِهِمْ تَجْرِى مِن تَحْتِهِمُ ٱلْأَنْهَٰرُ فِى جَنَّٰتِ ٱلنَّعِيمِ","fr":"Ceux qui croient et font de bonnes œuvres, leur Seigneur les guidera à cause de leur foi. A leurs pieds les ruisseaux couleront dans les Jardins des délices.","en":"Indeed, those who have believed and done righteous deeds - their Lord will guide them because of their faith. Beneath them rivers will flow in the Gardens of Pleasure","ref":{"ar":"سورة يونس · الآية 9","fr":"Yunus · 10:9","en":"Yunus · 10:9"}},{"type":"ayah","ar":"إِنَّ ٱللَّهَ لَا يَظْلِمُ ٱلنَّاسَ شَيْـًۭٔا وَلَٰكِنَّ ٱلنَّاسَ أَنفُسَهُمْ يَظْلِمُونَ","fr":"En vérité, Allah n'est point injuste à l'égard des gens, mais ce sont les gens qui font du tort à eux-mêmes.","en":"Indeed, Allah does not wrong the people at all, but it is the people who are wronging themselves.","ref":{"ar":"سورة يونس · الآية 44","fr":"Yunus · 10:44","en":"Yunus · 10:44"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلنَّاسُ قَدْ جَآءَتْكُم مَّوْعِظَةٌۭ مِّن رَّبِّكُمْ وَشِفَآءٌۭ لِّمَا فِى ٱلصُّدُورِ وَهُدًۭى وَرَحْمَةٌۭ لِّلْمُؤْمِنِينَ","fr":"O gens! Une exhortation vous est venue, de votre Seigneur, une guérison de ce qui est dans les poitrines, un guide et une miséricorde pour les croyants.","en":"O mankind, there has to come to you instruction from your Lord and healing for what is in the breasts and guidance and mercy for the believers.","ref":{"ar":"سورة يونس · الآية 57","fr":"Yunus · 10:57","en":"Yunus · 10:57"}},{"type":"ayah","ar":"قُلْ بِفَضْلِ ٱللَّهِ وَبِرَحْمَتِهِۦ فَبِذَٰلِكَ فَلْيَفْرَحُوا۟ هُوَ خَيْرٌۭ مِّمَّا يَجْمَعُونَ","fr":"Dis: «[Ceci provient] de la grâce d'Allah et de Sa miséricorde; Voilà de quoi ils devraient se réjouir. C'est bien mieux que tout ce qu'ils amassent».","en":"Say, \"In the bounty of Allah and in His mercy - in that let them rejoice; it is better than what they accumulate.\"","ref":{"ar":"سورة يونس · الآية 58","fr":"Yunus · 10:58","en":"Yunus · 10:58"}},{"type":"ayah","ar":"وَٱسْتَغْفِرُوا۟ رَبَّكُمْ ثُمَّ تُوبُوٓا۟ إِلَيْهِ إِنَّ رَبِّى رَحِيمٌۭ وَدُودٌۭ","fr":"Et implorez le pardon de votre Seigneur et repentez-vous à Lui. Mon Seigneur est vraiment Miséricordieux et plein d'amour».","en":"And ask forgiveness of your Lord and then repent to Him. Indeed, my Lord is Merciful and Affectionate.\"","ref":{"ar":"سورة هود · الآية 90","fr":"Hud · 11:90","en":"Hud · 11:90"}},{"type":"ayah","ar":"وَمَآ أُبَرِّئُ نَفْسِىٓ إِنَّ ٱلنَّفْسَ لَأَمَّارَةٌۢ بِٱلسُّوٓءِ إِلَّا مَا رَحِمَ رَبِّىٓ إِنَّ رَبِّى غَفُورٌۭ رَّحِيمٌۭ","fr":"Je ne m'innocente cependant pas, car l'âme est très incitatrice au mal, à moins que mon Seigneur, par miséricorde, [ne la préserve du péché]. Mon Seigneur est certes Pardonneur et très Miséricordieux».","en":"And I do not acquit myself. Indeed, the soul is a persistent enjoiner of evil, except those upon which my Lord has mercy. Indeed, my Lord is Forgiving and Merciful.\"","ref":{"ar":"سورة يوسف · الآية 53","fr":"Yusuf · 12:53","en":"Yusuf · 12:53"}},{"type":"ayah","ar":"قَالَ لَا تَثْرِيبَ عَلَيْكُمُ ٱلْيَوْمَ يَغْفِرُ ٱللَّهُ لَكُمْ وَهُوَ أَرْحَمُ ٱلرَّٰحِمِينَ","fr":"- Il dit: «Pas de récrimination contre vous aujourd'hui! Qu'Allah vous pardonne. C'est Lui Le plus Miséricordieux des miséricordieux.","en":"He said, \"No blame will there be upon you today. Allah will forgive you; and He is the most merciful of the merciful.\"","ref":{"ar":"سورة يوسف · الآية 92","fr":"Yusuf · 12:92","en":"Yusuf · 12:92"}},{"type":"ayah","ar":"ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ طُوبَىٰ لَهُمْ وَحُسْنُ مَـَٔابٍۢ","fr":"Ceux qui croient et font de bonnes œuvres, auront le plus grand bien et aussi le plus bon retour.","en":"Those who have believed and done righteous deeds - a good state is theirs and a good return.","ref":{"ar":"سورة الرعد · الآية 29","fr":"Ar-Ra'd · 13:29","en":"Ar-Ra'd · 13:29"}},{"type":"ayah","ar":"يَمْحُوا۟ ٱللَّهُ مَا يَشَآءُ وَيُثْبِتُ وَعِندَهُۥٓ أُمُّ ٱلْكِتَٰبِ","fr":"Allah efface ou confirme ce qu'Il veut et l'Ecriture primordiale est auprès de Lui.","en":"Allah eliminates what He wills or confirms, and with Him is the Mother of the Book.","ref":{"ar":"سورة الرعد · الآية 39","fr":"Ar-Ra'd · 13:39","en":"Ar-Ra'd · 13:39"}},{"type":"ayah","ar":"أَلَمْ تَرَ كَيْفَ ضَرَبَ ٱللَّهُ مَثَلًۭا كَلِمَةًۭ طَيِّبَةًۭ كَشَجَرَةٍۢ طَيِّبَةٍ أَصْلُهَا ثَابِتٌۭ وَفَرْعُهَا فِى ٱلسَّمَآءِ","fr":"N'as-tu pas vu comment Allah propose en parabole une bonne parole pareille à un bel arbre dont la racine est ferme et la ramure s'élançant dans le ciel?","en":"Have you not considered how Allah presents an example, [making] a good word like a good tree, whose root is firmly fixed and its branches [high] in the sky?","ref":{"ar":"سورة إبراهيم · الآية 24","fr":"Ibrahim · 14:24","en":"Ibrahim · 14:24"}},{"type":"ayah","ar":"وَءَاتَىٰكُم مِّن كُلِّ مَا سَأَلْتُمُوهُ وَإِن تَعُدُّوا۟ نِعْمَتَ ٱللَّهِ لَا تُحْصُوهَآ إِنَّ ٱلْإِنسَٰنَ لَظَلُومٌۭ كَفَّارٌۭ","fr":"Il vous a accordé de tout ce que vous Lui avez demandé. Et si vous comptiez les bienfaits d'Allah, vous ne sauriez les dénombrer. L'homme est vraiment très injuste, très ingrat.","en":"And He gave you from all you asked of Him. And if you should count the favor of Allah, you could not enumerate them. Indeed, mankind is [generally] most unjust and ungrateful.","ref":{"ar":"سورة إبراهيم · الآية 34","fr":"Ibrahim · 14:34","en":"Ibrahim · 14:34"}},{"type":"ayah","ar":"هَٰذَا بَلَٰغٌۭ لِّلنَّاسِ وَلِيُنذَرُوا۟ بِهِۦ وَلِيَعْلَمُوٓا۟ أَنَّمَا هُوَ إِلَٰهٌۭ وَٰحِدٌۭ وَلِيَذَّكَّرَ أُو۟لُوا۟ ٱلْأَلْبَٰبِ","fr":"Ceci est un message (le Coran) pour les gens afin qu'ils soient avertis, qu'ils sachent qu'Il n'est qu'un Dieu unique, et pour que les doués d'intelligence s'exhortent.","en":"This [Qur'an] is notification for the people that they may be warned thereby and that they may know that He is but one God and that those of understanding will be reminded.","ref":{"ar":"سورة إبراهيم · الآية 52","fr":"Ibrahim · 14:52","en":"Ibrahim · 14:52"}},{"type":"ayah","ar":"إِنَّا نَحْنُ نَزَّلْنَا ٱلذِّكْرَ وَإِنَّا لَهُۥ لَحَٰفِظُونَ","fr":"En vérité c'est Nous qui avons fait descendre le Coran, et c'est Nous qui en sommes gardien.","en":"Indeed, it is We who sent down the Qur'an and indeed, We will be its guardian.","ref":{"ar":"سورة الحجر · الآية 9","fr":"Al-Hijr · 15:9","en":"Al-Hijr · 15:9"}},{"type":"ayah","ar":"وَٱعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ ٱلْيَقِينُ","fr":"et adore ton Seigneur jusqu'à ce que te vienne la certitude (la mort).","en":"And worship your Lord until there comes to you the certainty (death).","ref":{"ar":"سورة الحجر · الآية 99","fr":"Al-Hijr · 15:99","en":"Al-Hijr · 15:99"}},{"type":"ayah","ar":"وَمَا بِكُم مِّن نِّعْمَةٍۢ فَمِنَ ٱللَّهِ ثُمَّ إِذَا مَسَّكُمُ ٱلضُّرُّ فَإِلَيْهِ تَجْـَٔرُونَ","fr":"Et tout ce que vous avez comme bienfait provient d'Allah. Puis quand le malheur vous touche, c'est Lui que vous implorez à haute voix.","en":"And whatever you have of favor - it is from Allah. Then when adversity touches you, to Him you cry for help.","ref":{"ar":"سورة النحل · الآية 53","fr":"An-Nahl · 16:53","en":"An-Nahl · 16:53"}},{"type":"ayah","ar":"مَا عِندَكُمْ يَنفَدُ وَمَا عِندَ ٱللَّهِ بَاقٍۢ وَلَنَجْزِيَنَّ ٱلَّذِينَ صَبَرُوٓا۟ أَجْرَهُم بِأَحْسَنِ مَا كَانُوا۟ يَعْمَلُونَ","fr":"Tout ce que vous possédez s'épuisera, tandis que ce qui est auprès d'Allah durera. Et Nous récompenserons ceux qui ont été constants en fonction du meilleur de ce qu'ils faisaient.","en":"Whatever you have will end, but what Allah has is lasting. And We will surely give those who were patient their reward according to the best of what they used to do.","ref":{"ar":"سورة النحل · الآية 96","fr":"An-Nahl · 16:96","en":"An-Nahl · 16:96"}},{"type":"ayah","ar":"فَكُلُوا۟ مِمَّا رَزَقَكُمُ ٱللَّهُ حَلَٰلًۭا طَيِّبًۭا وَٱشْكُرُوا۟ نِعْمَتَ ٱللَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ","fr":"Mangez donc de ce qu'Allah vous a attribué de licite et de bon. Et soyez reconnaissants pour les bienfaits d'Allah, si c'est Lui que vous adorez.","en":"Then eat of what Allah has provided for you [which is] lawful and good. And be grateful for the favor of Allah, if it is [indeed] Him that you worship.","ref":{"ar":"سورة النحل · الآية 114","fr":"An-Nahl · 16:114","en":"An-Nahl · 16:114"}},{"type":"ayah","ar":"ٱدْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِٱلْحِكْمَةِ وَٱلْمَوْعِظَةِ ٱلْحَسَنَةِ وَجَٰدِلْهُم بِٱلَّتِى هِىَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۦ وَهُوَ أَعْلَمُ بِٱلْمُهْتَدِينَ","fr":"Par la sagesse et la bonne exhortation appelle (les gens) au sentier de ton Seigneur. Et discute avec eux de la meilleure façon. Car c'est ton Seigneur qui connaît le mieux celui qui s'égare de Son sentier et c'est Lui qui connaît le mieux ceux qui sont bien guidés.","en":"Invite to the way of your Lord with wisdom and good instruction, and argue with them in a way that is best. Indeed, your Lord is most knowing of who has strayed from His way, and He is most knowing of who is [rightly] guided.","ref":{"ar":"سورة النحل · الآية 125","fr":"An-Nahl · 16:125","en":"An-Nahl · 16:125"}},{"type":"ayah","ar":"وَٱصْبِرْ وَمَا صَبْرُكَ إِلَّا بِٱللَّهِ وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُ فِى ضَيْقٍۢ مِّمَّا يَمْكُرُونَ","fr":"Endure! Ton endurance [ne viendra] qu'avec (l'aide) d'Allah. Ne t'afflige pas pour eux. Et ne sois pas angoissé à cause de leurs complots.","en":"And be patient, [O Muhammad], and your patience is not but through Allah. And do not grieve over them and do not be in distress over what they conspire.","ref":{"ar":"سورة النحل · الآية 127","fr":"An-Nahl · 16:127","en":"An-Nahl · 16:127"}},{"type":"ayah","ar":"إِنَّ هَٰذَا ٱلْقُرْءَانَ يَهْدِى لِلَّتِى هِىَ أَقْوَمُ وَيُبَشِّرُ ٱلْمُؤْمِنِينَ ٱلَّذِينَ يَعْمَلُونَ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمْ أَجْرًۭا كَبِيرًۭا","fr":"Certes, ce Coran guide vers ce qu'il y a de plus droit, et il annonce aux croyants qui font de bonnes œuvres qu'ils auront une grande récompense,","en":"Indeed, this Qur'an guides to that which is most suitable and gives good tidings to the believers who do righteous deeds that they will have a great reward.","ref":{"ar":"سورة الإسراء · الآية 9","fr":"Al-Israa · 17:9","en":"Al-Israa · 17:9"}},{"type":"ayah","ar":"وَمَنْ أَرَادَ ٱلْءَاخِرَةَ وَسَعَىٰ لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌۭ فَأُو۟لَٰٓئِكَ كَانَ سَعْيُهُم مَّشْكُورًۭا","fr":"Et ceux qui recherchent l'au-delà et fournissent les efforts qui y mènent, tout en étant croyants... alors l'effort de ceux-là sera reconnu.","en":"But whoever desires the Hereafter and exerts the effort due to it while he is a believer - it is those whose effort is ever appreciated [by Allah].","ref":{"ar":"سورة الإسراء · الآية 19","fr":"Al-Israa · 17:19","en":"Al-Israa · 17:19"}},{"type":"ayah","ar":"وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِۦ عِلْمٌ إِنَّ ٱلسَّمْعَ وَٱلْبَصَرَ وَٱلْفُؤَادَ كُلُّ أُو۟لَٰٓئِكَ كَانَ عَنْهُ مَسْـُٔولًۭا","fr":"Et ne poursuis pas ce dont tu n'as aucune connaissance. L'ouïe, la vue et le cœur: sur tout cela, en vérité, on sera interrogé.","en":"And do not pursue that of which you have no knowledge. Indeed, the hearing, the sight and the heart - about all those [one] will be questioned.","ref":{"ar":"سورة الإسراء · الآية 36","fr":"Al-Israa · 17:36","en":"Al-Israa · 17:36"}},{"type":"ayah","ar":"وَلَا تَمْشِ فِى ٱلْأَرْضِ مَرَحًا إِنَّكَ لَن تَخْرِقَ ٱلْأَرْضَ وَلَن تَبْلُغَ ٱلْجِبَالَ طُولًۭا","fr":"Et ne foule pas la terre avec orgueil: tu ne sauras jamais fendre la terre et tu ne pourras jamais atteindre la hauteur des montagnes!","en":"And do not walk upon the earth exultantly. Indeed, you will never tear the earth [apart], and you will never reach the mountains in height.","ref":{"ar":"سورة الإسراء · الآية 37","fr":"Al-Israa · 17:37","en":"Al-Israa · 17:37"}},{"type":"ayah","ar":"وَقُل لِّعِبَادِى يَقُولُوا۟ ٱلَّتِى هِىَ أَحْسَنُ إِنَّ ٱلشَّيْطَٰنَ يَنزَغُ بَيْنَهُمْ إِنَّ ٱلشَّيْطَٰنَ كَانَ لِلْإِنسَٰنِ عَدُوًّۭا مُّبِينًۭا","fr":"Et dis à Mes serviteurs d'exprimer les meilleures paroles, car le Diable sème la discorde parmi eux. Le Diable est certes, pour l'homme, un ennemi déclaré.","en":"And tell My servants to say that which is best. Indeed, Satan induces [dissension] among them. Indeed Satan is ever, to mankind, a clear enemy.","ref":{"ar":"سورة الإسراء · الآية 53","fr":"Al-Israa · 17:53","en":"Al-Israa · 17:53"}},{"type":"ayah","ar":"وَلَقَدْ كَرَّمْنَا بَنِىٓ ءَادَمَ وَحَمَلْنَٰهُمْ فِى ٱلْبَرِّ وَٱلْبَحْرِ وَرَزَقْنَٰهُم مِّنَ ٱلطَّيِّبَٰتِ وَفَضَّلْنَٰهُمْ عَلَىٰ كَثِيرٍۢ مِّمَّنْ خَلَقْنَا تَفْضِيلًۭا","fr":"Certes, Nous avons honoré les fils d'Adam. Nous les avons transportés sur terre et sur mer, leur avons attribué de bonnes choses comme nourriture, et Nous les avons nettement préférés à plusieurs de Nos créatures.","en":"And We have certainly honored the children of Adam and carried them on the land and sea and provided for them of the good things and preferred them over much of what We have created, with [definite] preference.","ref":{"ar":"سورة الإسراء · الآية 70","fr":"Al-Israa · 17:70","en":"Al-Israa · 17:70"}},{"type":"ayah","ar":"قُلْ كُلٌّۭ يَعْمَلُ عَلَىٰ شَاكِلَتِهِۦ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًۭا","fr":"Dis: «Chacun agit selon sa méthode, alors que votre Seigneur connaît mieux qui suit la meilleure voie».","en":"Say, \"Each works according to his manner, but your Lord is most knowing of who is best guided in way.\"","ref":{"ar":"سورة الإسراء · الآية 84","fr":"Al-Israa · 17:84","en":"Al-Israa · 17:84"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا","fr":"Ceux qui croient et font de bonnes œuvres... vraiment Nous ne laissons pas perdre la récompense de celui qui fait le bien.","en":"Indeed, those who have believed and done righteous deeds - indeed, We will not allow to be lost the reward of any who did well in deeds.","ref":{"ar":"سورة الكهف · الآية 30","fr":"Al-Kahf · 18:30","en":"Al-Kahf · 18:30"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ كَانَتْ لَهُمْ جَنَّٰتُ ٱلْفِرْدَوْسِ نُزُلًا","fr":"Ceux qui croient et font de bonnes œuvres auront pour résidence les Jardins du «Firdaws,» (Paradis),","en":"Indeed, those who have believed and done righteous deeds - they will have the Gardens of Paradise as a lodging,","ref":{"ar":"سورة الكهف · الآية 107","fr":"Al-Kahf · 18:107","en":"Al-Kahf · 18:107"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ سَيَجْعَلُ لَهُمُ ٱلرَّحْمَٰنُ وُدًّۭا","fr":"A ceux qui croient et font de bonnes œuvres, le Tout Miséricordieux accordera Son amour.","en":"Indeed, those who have believed and done righteous deeds - the Most Merciful will appoint for them affection.","ref":{"ar":"سورة مريم · الآية 96","fr":"Maryam · 19:96","en":"Maryam · 19:96"}},{"type":"ayah","ar":"مَآ أَنزَلْنَا عَلَيْكَ ٱلْقُرْءَانَ لِتَشْقَىٰٓ","fr":"Nous n'avons point fait descendre sur toi le Coran pour que tu sois malheureux,","en":"We have not sent down to you the Qur'an that you be distressed","ref":{"ar":"سورة طه · الآية 2","fr":"Taa-Haa · 20:2","en":"Taa-Haa · 20:2"}},{"type":"ayah","ar":"إِنَّنِىٓ أَنَا ٱللَّهُ لَآ إِلَٰهَ إِلَّآ أَنَا۠ فَٱعْبُدْنِى وَأَقِمِ ٱلصَّلَوٰةَ لِذِكْرِىٓ","fr":"Certes, c'est Moi Allah: point de divinité que Moi. Adore-Moi donc et accomplis la Salât pour te souvenir de Moi.","en":"Indeed, I am Allah. There is no deity except Me, so worship Me and establish prayer for My remembrance.","ref":{"ar":"سورة طه · الآية 14","fr":"Taa-Haa · 20:14","en":"Taa-Haa · 20:14"}},{"type":"ayah","ar":"وَإِنِّى لَغَفَّارٌۭ لِّمَن تَابَ وَءَامَنَ وَعَمِلَ صَٰلِحًۭا ثُمَّ ٱهْتَدَىٰ","fr":"Et je suis Grand Pardonneur à celui qui se repent, croit, fait bonne œuvre, puis se met sur le bon chemin».","en":"But indeed, I am the Perpetual Forgiver of whoever repents and believes and does righteousness and then continues in guidance.","ref":{"ar":"سورة طه · الآية 82","fr":"Taa-Haa · 20:82","en":"Taa-Haa · 20:82"}},{"type":"ayah","ar":"كُلُّ نَفْسٍۢ ذَآئِقَةُ ٱلْمَوْتِ وَنَبْلُوكُم بِٱلشَّرِّ وَٱلْخَيْرِ فِتْنَةًۭ وَإِلَيْنَا تُرْجَعُونَ","fr":"Toute âme doit goûter la mort. Nous vous éprouverons par le mal et par le bien [à titre] de tentation. Et c'est à Nous que vous serez ramenés.","en":"Every soul will taste death. And We test you with evil and with good as trial; and to Us you will be returned.","ref":{"ar":"سورة الأنبياء · الآية 35","fr":"Al-Anbiyaa · 21:35","en":"Al-Anbiyaa · 21:35"}},{"type":"ayah","ar":"وَمَآ أَرْسَلْنَٰكَ إِلَّا رَحْمَةًۭ لِّلْعَٰلَمِينَ","fr":"Et Nous ne t'avons envoyé qu'en miséricorde pour l'univers.","en":"And We have not sent you, [O Muhammad], except as a mercy to the worlds.","ref":{"ar":"سورة الأنبياء · الآية 107","fr":"Al-Anbiyaa · 21:107","en":"Al-Anbiyaa · 21:107"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱرْكَعُوا۟ وَٱسْجُدُوا۟ وَٱعْبُدُوا۟ رَبَّكُمْ وَٱفْعَلُوا۟ ٱلْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ","fr":"O vous qui croyez! Inclinez-vous, prosternez-vous, adorez votre Seigneur, et faites le bien. Peut-être réussirez vous!","en":"O you who have believed, bow and prostrate and worship your Lord and do good - that you may succeed.","ref":{"ar":"سورة الحج · الآية 77","fr":"Al-Hajj · 22:77","en":"Al-Hajj · 22:77"}},{"type":"ayah","ar":"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قَدْ أَفْلَحَ ٱلْمُؤْمِنُونَ","fr":"Bienheureux sont certes les croyants,","en":"Certainly will the believers have succeeded:","ref":{"ar":"سورة المؤمنون · الآية 1","fr":"Al-Muminoon · 23:1","en":"Al-Muminoon · 23:1"}},{"type":"ayah","ar":"ٱلَّذِينَ هُمْ فِى صَلَاتِهِمْ خَٰشِعُونَ","fr":"ceux qui sont humbles dans leur Salât,","en":"They who are during their prayer humbly submissive","ref":{"ar":"سورة المؤمنون · الآية 2","fr":"Al-Muminoon · 23:2","en":"Al-Muminoon · 23:2"}},{"type":"ayah","ar":"وَٱلَّذِينَ هُمْ عَنِ ٱللَّغْوِ مُعْرِضُونَ","fr":"qui se détournent des futilités,","en":"And they who turn away from ill speech","ref":{"ar":"سورة المؤمنون · الآية 3","fr":"Al-Muminoon · 23:3","en":"Al-Muminoon · 23:3"}},{"type":"ayah","ar":"أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَٰكُمْ عَبَثًۭا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ","fr":"Pensiez-vous que Nous vous avions créés sans but, et que vous ne seriez pas ramenés vers Nous?»","en":"Then did you think that We created you uselessly and that to Us you would not be returned?\"","ref":{"ar":"سورة المؤمنون · الآية 115","fr":"Al-Muminoon · 23:115","en":"Al-Muminoon · 23:115"}},{"type":"ayah","ar":"وَمَن يُطِعِ ٱللَّهَ وَرَسُولَهُۥ وَيَخْشَ ٱللَّهَ وَيَتَّقْهِ فَأُو۟لَٰٓئِكَ هُمُ ٱلْفَآئِزُونَ","fr":"Et quiconque obéit à Allah et à Son messager, et craint Allah et Le redoute... alors, voilà ceux qui récoltent le succès.","en":"And whoever obeys Allah and His Messenger and fears Allah and is conscious of Him - it is those who are the attainers.","ref":{"ar":"سورة النور · الآية 52","fr":"An-Noor · 24:52","en":"An-Noor · 24:52"}},{"type":"ayah","ar":"وَٱلَّذِينَ لَا يَشْهَدُونَ ٱلزُّورَ وَإِذَا مَرُّوا۟ بِٱللَّغْوِ مَرُّوا۟ كِرَامًۭا","fr":"Ceux qui ne donnent pas de faux témoignages; et qui, lorsqu'ils passent auprès d'une frivolité, s'en écartent noblement;","en":"And [they are] those who do not testify to falsehood, and when they pass near ill speech, they pass by with dignity.","ref":{"ar":"سورة الفرقان · الآية 72","fr":"Al-Furqaan · 25:72","en":"Al-Furqaan · 25:72"}},{"type":"ayah","ar":"أُو۟لَٰٓئِكَ يُجْزَوْنَ ٱلْغُرْفَةَ بِمَا صَبَرُوا۟ وَيُلَقَّوْنَ فِيهَا تَحِيَّةًۭ وَسَلَٰمًا","fr":"Ceux-là auront pour récompense un lieu élevé [du Paradis] à cause de leur endurance, et ils y seront accueillis avec le salut et la paix,","en":"Those will be awarded the Chamber for what they patiently endured, and they will be received therein with greetings and [words of] peace.","ref":{"ar":"سورة الفرقان · الآية 75","fr":"Al-Furqaan · 25:75","en":"Al-Furqaan · 25:75"}},{"type":"ayah","ar":"ٱلَّذِى خَلَقَنِى فَهُوَ يَهْدِينِ","fr":"qui m'a créé, et c'est Lui qui me guide;","en":"Who created me, and He [it is who] guides me.","ref":{"ar":"سورة الشعراء · الآية 78","fr":"Ash-Shu'araa · 26:78","en":"Ash-Shu'araa · 26:78"}},{"type":"ayah","ar":"وَٱلَّذِى هُوَ يُطْعِمُنِى وَيَسْقِينِ","fr":"et c'est Lui qui me nourrit et me donne à boire;","en":"And it is He who feeds me and gives me drink.","ref":{"ar":"سورة الشعراء · الآية 79","fr":"Ash-Shu'araa · 26:79","en":"Ash-Shu'araa · 26:79"}},{"type":"ayah","ar":"وَٱلَّذِىٓ أَطْمَعُ أَن يَغْفِرَ لِى خَطِيٓـَٔتِى يَوْمَ ٱلدِّينِ","fr":"et c'est de Lui que je convoite le pardon de mes fautes le Jour de la Rétribution.","en":"And who I aspire that He will forgive me my sin on the Day of Recompense.\"","ref":{"ar":"سورة الشعراء · الآية 82","fr":"Ash-Shu'araa · 26:82","en":"Ash-Shu'araa · 26:82"}},{"type":"ayah","ar":"يَوْمَ لَا يَنفَعُ مَالٌۭ وَلَا بَنُونَ","fr":"le jour où ni les biens, ni les enfants ne seront d'aucune utilité,","en":"The Day when there will not benefit [anyone] wealth or children","ref":{"ar":"سورة الشعراء · الآية 88","fr":"Ash-Shu'araa · 26:88","en":"Ash-Shu'araa · 26:88"}},{"type":"ayah","ar":"وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ","fr":"Et place ta confiance dans le Tout Puissant, le Très Miséricordieux,","en":"And rely upon the Exalted in Might, the Merciful,","ref":{"ar":"سورة الشعراء · الآية 217","fr":"Ash-Shu'araa · 26:217","en":"Ash-Shu'araa · 26:217"}},{"type":"ayah","ar":"إِنَّكَ لَا تَهْدِى مَنْ أَحْبَبْتَ وَلَٰكِنَّ ٱللَّهَ يَهْدِى مَن يَشَآءُ وَهُوَ أَعْلَمُ بِٱلْمُهْتَدِينَ","fr":"Tu [Muhammad] ne diriges pas celui que tu aimes: mais c'est Allah qui guide qui Il veut. Il connaît mieux cependant les bien-guidés.","en":"Indeed, [O Muhammad], you do not guide whom you like, but Allah guides whom He wills. And He is most knowing of the [rightly] guided.","ref":{"ar":"سورة القصص · الآية 56","fr":"Al-Qasas · 28:56","en":"Al-Qasas · 28:56"}},{"type":"ayah","ar":"وَمَآ أُوتِيتُم مِّن شَىْءٍۢ فَمَتَٰعُ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَزِينَتُهَا وَمَا عِندَ ٱللَّهِ خَيْرٌۭ وَأَبْقَىٰٓ أَفَلَا تَعْقِلُونَ","fr":"Tout ce qui vous a été donné est la jouissance éphémère de la vie ici-bas et sa parure, alors que ce qui est auprès d'Allah est meilleur et plus durable... Ne comprenez-vous donc pas?","en":"And whatever thing you [people] have been given - it is [only for] the enjoyment of worldly life and its adornment. And what is with Allah is better and more lasting; so will you not use reason?","ref":{"ar":"سورة القصص · الآية 60","fr":"Al-Qasas · 28:60","en":"Al-Qasas · 28:60"}},{"type":"ayah","ar":"تِلْكَ ٱلدَّارُ ٱلْءَاخِرَةُ نَجْعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوًّۭا فِى ٱلْأَرْضِ وَلَا فَسَادًۭا وَٱلْعَٰقِبَةُ لِلْمُتَّقِينَ","fr":"Cette Demeure dernière, Nous la réservons à ceux qui ne recherchent, ni à s'élever sur terre, ni à y semer la corruption. Cependant, l'heureuse fin appartient aux pieux.","en":"That home of the Hereafter We assign to those who do not desire exaltedness upon the earth or corruption. And the [best] outcome is for the righteous.","ref":{"ar":"سورة القصص · الآية 83","fr":"Al-Qasas · 28:83","en":"Al-Qasas · 28:83"}},{"type":"ayah","ar":"أَحَسِبَ ٱلنَّاسُ أَن يُتْرَكُوٓا۟ أَن يَقُولُوٓا۟ ءَامَنَّا وَهُمْ لَا يُفْتَنُونَ","fr":"Est-ce que les gens pensent qu'on les laissera dire: «Nous croyons!» sans les éprouver?","en":"Do the people think that they will be left to say, \"We believe\" and they will not be tried?","ref":{"ar":"سورة العنكبوت · الآية 2","fr":"Al-Ankaboot · 29:2","en":"Al-Ankaboot · 29:2"}},{"type":"ayah","ar":"وَمَن جَٰهَدَ فَإِنَّمَا يُجَٰهِدُ لِنَفْسِهِۦٓ إِنَّ ٱللَّهَ لَغَنِىٌّ عَنِ ٱلْعَٰلَمِينَ","fr":"Et quiconque lutte, ne lutte que pour lui-même, car Allah peut Se passer de tout l'univers.","en":"And whoever strives only strives for [the benefit of] himself. Indeed, Allah is free from need of the worlds.","ref":{"ar":"سورة العنكبوت · الآية 6","fr":"Al-Ankaboot · 29:6","en":"Al-Ankaboot · 29:6"}},{"type":"ayah","ar":"كُلُّ نَفْسٍۢ ذَآئِقَةُ ٱلْمَوْتِ ثُمَّ إِلَيْنَا تُرْجَعُونَ","fr":"Toute âme goûtera la mort. Ensuite c'est vers Nous que vous serez ramenés.","en":"Every soul will taste death. Then to Us will you be returned.","ref":{"ar":"سورة العنكبوت · الآية 57","fr":"Al-Ankaboot · 29:57","en":"Al-Ankaboot · 29:57"}},{"type":"ayah","ar":"وَمَا هَٰذِهِ ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا لَهْوٌۭ وَلَعِبٌۭ وَإِنَّ ٱلدَّارَ ٱلْءَاخِرَةَ لَهِىَ ٱلْحَيَوَانُ لَوْ كَانُوا۟ يَعْلَمُونَ","fr":"Cette vie d'ici-bas n'est qu'amusement et jeu. La Demeure de l'au-delà est assurément la vraie vie. S'ils savaient!","en":"And this worldly life is not but diversion and amusement. And indeed, the home of the Hereafter - that is the [eternal] life, if only they knew.","ref":{"ar":"سورة العنكبوت · الآية 64","fr":"Al-Ankaboot · 29:64","en":"Al-Ankaboot · 29:64"}},{"type":"ayah","ar":"فَٱصْبِرْ إِنَّ وَعْدَ ٱللَّهِ حَقٌّۭ وَلَا يَسْتَخِفَّنَّكَ ٱلَّذِينَ لَا يُوقِنُونَ","fr":"Sois donc patient, car la promesse d'Allah est vérité. Et que ceux qui ne croient pas fermement ne t'ébranlent pas!","en":"So be patient. Indeed, the promise of Allah is truth. And let them not disquiet you who are not certain [in faith].","ref":{"ar":"سورة الروم · الآية 60","fr":"Ar-Room · 30:60","en":"Ar-Room · 30:60"}},{"type":"ayah","ar":"وَإِذْ قَالَ لُقْمَٰنُ لِٱبْنِهِۦ وَهُوَ يَعِظُهُۥ يَٰبُنَىَّ لَا تُشْرِكْ بِٱللَّهِ إِنَّ ٱلشِّرْكَ لَظُلْمٌ عَظِيمٌۭ","fr":"Et lorsque Luqmân dit à son fils tout en l'exhortant: «O mon fils, ne donne pas d'associé à Allah, car l'association à [Allah] est vraiment une injustice énorme.»","en":"And [mention, O Muhammad], when Luqman said to his son while he was instructing him, \"O my son, do not associate [anything] with Allah. Indeed, association [with him] is great injustice.\"","ref":{"ar":"سورة لقمان · الآية 13","fr":"Luqman · 31:13","en":"Luqman · 31:13"}},{"type":"ayah","ar":"وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِى ٱلْأَرْضِ مَرَحًا إِنَّ ٱللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍۢ فَخُورٍۢ","fr":"Et ne détourne pas ton visage des hommes, et ne foule pas la terre avec arrogance: car Allah n'aime pas le présomptueux plein de gloriole.","en":"And do not turn your cheek [in contempt] toward people and do not walk through the earth exultantly. Indeed, Allah does not like everyone self-deluded and boastful.","ref":{"ar":"سورة لقمان · الآية 18","fr":"Luqman · 31:18","en":"Luqman · 31:18"}},{"type":"ayah","ar":"وَٱقْصِدْ فِى مَشْيِكَ وَٱغْضُضْ مِن صَوْتِكَ إِنَّ أَنكَرَ ٱلْأَصْوَٰتِ لَصَوْتُ ٱلْحَمِيرِ","fr":"Sois modeste dans ta démarche, et baisse ta voix, car la plus détestée des voix, c'est bien la voix des ânes».","en":"And be moderate in your pace and lower your voice; indeed, the most disagreeable of sounds is the voice of donkeys.\"","ref":{"ar":"سورة لقمان · الآية 19","fr":"Luqman · 31:19","en":"Luqman · 31:19"}},{"type":"ayah","ar":"وَمَن يُسْلِمْ وَجْهَهُۥٓ إِلَى ٱللَّهِ وَهُوَ مُحْسِنٌۭ فَقَدِ ٱسْتَمْسَكَ بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ وَإِلَى ٱللَّهِ عَٰقِبَةُ ٱلْأُمُورِ","fr":"Et quiconque soumet son être à Allah, tout en étant bienfaisant, s'accroche réellement à l'anse la plus ferme. La fin de toute chose appartient à Allah.","en":"And whoever submits his face to Allah while he is a doer of good - then he has grasped the most trustworthy handhold. And to Allah will be the outcome of [all] matters.","ref":{"ar":"سورة لقمان · الآية 22","fr":"Luqman · 31:22","en":"Luqman · 31:22"}},{"type":"ayah","ar":"لَّقَدْ كَانَ لَكُمْ فِى رَسُولِ ٱللَّهِ أُسْوَةٌ حَسَنَةٌۭ لِّمَن كَانَ يَرْجُوا۟ ٱللَّهَ وَٱلْيَوْمَ ٱلْءَاخِرَ وَذَكَرَ ٱللَّهَ كَثِيرًۭا","fr":"En effet, vous avez dans le Messager d'Allah un excellent modèle [à suivre], pour quiconque espère en Allah et au Jour dernier et invoque Allah fréquemment.","en":"There has certainly been for you in the Messenger of Allah an excellent pattern for anyone whose hope is in Allah and the Last Day and [who] remembers Allah often.","ref":{"ar":"سورة الأحزاب · الآية 21","fr":"Al-Ahzaab · 33:21","en":"Al-Ahzaab · 33:21"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلنَّاسُ إِنَّ وَعْدَ ٱللَّهِ حَقٌّۭ فَلَا تَغُرَّنَّكُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا وَلَا يَغُرَّنَّكُم بِٱللَّهِ ٱلْغَرُورُ","fr":"O hommes! La promesse d'Allah est vérité. Ne laissez pas la vie présente vous tromper, et que le grand trompeur (Satan) ne vous trompe pas à propos d'Allah!","en":"O mankind, indeed the promise of Allah is truth, so let not the worldly life delude you and be not deceived about Allah by the Deceiver.","ref":{"ar":"سورة فاطر · الآية 5","fr":"Faatir · 35:5","en":"Faatir · 35:5"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلنَّاسُ أَنتُمُ ٱلْفُقَرَآءُ إِلَى ٱللَّهِ وَٱللَّهُ هُوَ ٱلْغَنِىُّ ٱلْحَمِيدُ","fr":"O hommes, vous êtes les indigents ayant besoin d'Allah, et c'est Allah, Lui qui se dispense de tout et Il est Le Digne de louange.","en":"O mankind, you are those in need of Allah, while Allah is the Free of need, the Praiseworthy.","ref":{"ar":"سورة فاطر · الآية 15","fr":"Faatir · 35:15","en":"Faatir · 35:15"}},{"type":"ayah","ar":"سَلَٰمٌۭ قَوْلًۭا مِّن رَّبٍّۢ رَّحِيمٍۢ","fr":"«Salâm» [paix et salut]! Parole de la part d'un Seigneur Très Miséricordieux.","en":"[And] \"Peace,\" a word from a Merciful Lord.","ref":{"ar":"سورة يس · الآية 58","fr":"Yaseen · 36:58","en":"Yaseen · 36:58"}},{"type":"ayah","ar":"إِنَّمَآ أَمْرُهُۥٓ إِذَآ أَرَادَ شَيْـًٔا أَن يَقُولَ لَهُۥ كُن فَيَكُونُ","fr":"Quand Il veut une chose, Son commandement consiste à dire: «Sois», et c'est.","en":"His command is only when He intends a thing that He says to it, \"Be,\" and it is.","ref":{"ar":"سورة يس · الآية 82","fr":"Yaseen · 36:82","en":"Yaseen · 36:82"}},{"type":"ayah","ar":"سُبْحَٰنَ رَبِّكَ رَبِّ ٱلْعِزَّةِ عَمَّا يَصِفُونَ","fr":"Gloire à ton Seigneur, le Seigneur de la puissance. Il est au-dessus de ce qu'ils décrivent!","en":"Exalted is your Lord, the Lord of might, above what they describe.","ref":{"ar":"سورة الصافات · الآية 180","fr":"As-Saaffaat · 37:180","en":"As-Saaffaat · 37:180"}},{"type":"ayah","ar":"وَسَلَٰمٌ عَلَى ٱلْمُرْسَلِينَ","fr":"Et paix sur les Messagers,","en":"And peace upon the messengers.","ref":{"ar":"سورة الصافات · الآية 181","fr":"As-Saaffaat · 37:181","en":"As-Saaffaat · 37:181"}},{"type":"ayah","ar":"وَٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ","fr":"et louange à Allah, Seigneur de l'univers!","en":"And praise to Allah, Lord of the worlds.","ref":{"ar":"سورة الصافات · الآية 182","fr":"As-Saaffaat · 37:182","en":"As-Saaffaat · 37:182"}},{"type":"ayah","ar":"ٱلَّذِينَ يَسْتَمِعُونَ ٱلْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُۥٓ أُو۟لَٰٓئِكَ ٱلَّذِينَ هَدَىٰهُمُ ٱللَّهُ وَأُو۟لَٰٓئِكَ هُمْ أُو۟لُوا۟ ٱلْأَلْبَٰبِ","fr":"qui prêtent l'oreille à la Parole, puis suivent ce qu'elle contient de meilleur. Ce sont ceux-là qu'Allah a guidés et ce sont eux les doués d'intelligence!","en":"Who listen to speech and follow the best of it. Those are the ones Allah has guided, and those are people of understanding.","ref":{"ar":"سورة الزمر · الآية 18","fr":"Az-Zumar · 39:18","en":"Az-Zumar · 39:18"}},{"type":"ayah","ar":"وَأَنِيبُوٓا۟ إِلَىٰ رَبِّكُمْ وَأَسْلِمُوا۟ لَهُۥ مِن قَبْلِ أَن يَأْتِيَكُمُ ٱلْعَذَابُ ثُمَّ لَا تُنصَرُونَ","fr":"Et revenez repentant à votre Seigneur, et soumettez-vous à Lui, avant que ne vous vienne le châtiment et vous ne recevez alors aucun secours.","en":"And return [in repentance] to your Lord and submit to Him before the punishment comes upon you; then you will not be helped.","ref":{"ar":"سورة الزمر · الآية 54","fr":"Az-Zumar · 39:54","en":"Az-Zumar · 39:54"}},{"type":"ayah","ar":"يَٰقَوْمِ إِنَّمَا هَٰذِهِ ٱلْحَيَوٰةُ ٱلدُّنْيَا مَتَٰعٌۭ وَإِنَّ ٱلْءَاخِرَةَ هِىَ دَارُ ٱلْقَرَارِ","fr":"O mon peuple, cette vie n'est que jouissance temporaire, alors que l'au-delà est vraiment la demeure de la stabilité.","en":"O my people, this worldly life is only [temporary] enjoyment, and indeed, the Hereafter - that is the home of [permanent] settlement.","ref":{"ar":"سورة غافر · الآية 39","fr":"Ghafir · 40:39","en":"Ghafir · 40:39"}},{"type":"ayah","ar":"هُوَ ٱلْحَىُّ لَآ إِلَٰهَ إِلَّا هُوَ فَٱدْعُوهُ مُخْلِصِينَ لَهُ ٱلدِّينَ ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ","fr":"C'est Lui le Vivant. Point de divinité à part Lui. Appelez-Le donc, en Lui vouant un culte exclusif. Louange à Allah, Seigneur de l'univers!","en":"He is the Ever-Living; there is no deity except Him, so call upon Him, [being] sincere to Him in religion. [All] praise is [due] to Allah, Lord of the worlds.","ref":{"ar":"سورة غافر · الآية 65","fr":"Ghafir · 40:65","en":"Ghafir · 40:65"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ قَالُوا۟ رَبُّنَا ٱللَّهُ ثُمَّ ٱسْتَقَٰمُوا۟ تَتَنَزَّلُ عَلَيْهِمُ ٱلْمَلَٰٓئِكَةُ أَلَّا تَخَافُوا۟ وَلَا تَحْزَنُوا۟ وَأَبْشِرُوا۟ بِٱلْجَنَّةِ ٱلَّتِى كُنتُمْ تُوعَدُونَ","fr":"Ceux qui disent: «Notre Seigneur est Allah», et qui se tiennent dans le droit chemin, les Anges descendent sur eux. «N'ayez pas peur et ne soyez pas affligés; mais ayez la bonne nouvelle du Paradis qui vous était promis.","en":"Indeed, those who have said, \"Our Lord is Allah \" and then remained on a right course - the angels will descend upon them, [saying], \"Do not fear and do not grieve but receive good tidings of Paradise, which you were promised.","ref":{"ar":"سورة فصلت · الآية 30","fr":"Fussilat · 41:30","en":"Fussilat · 41:30"}},{"type":"ayah","ar":"وَمَنْ أَحْسَنُ قَوْلًۭا مِّمَّن دَعَآ إِلَى ٱللَّهِ وَعَمِلَ صَٰلِحًۭا وَقَالَ إِنَّنِى مِنَ ٱلْمُسْلِمِينَ","fr":"Et qui profère plus belles paroles que celui qui appelle à Allah, fait bonne œuvre et dit: «Je suis du nombre des Musulmans?»","en":"And who is better in speech than one who invites to Allah and does righteousness and says, \"Indeed, I am of the Muslims.\"","ref":{"ar":"سورة فصلت · الآية 33","fr":"Fussilat · 41:33","en":"Fussilat · 41:33"}},{"type":"ayah","ar":"مَّنْ عَمِلَ صَٰلِحًۭا فَلِنَفْسِهِۦ وَمَنْ أَسَآءَ فَعَلَيْهَا وَمَا رَبُّكَ بِظَلَّٰمٍۢ لِّلْعَبِيدِ","fr":"Quiconque fait une bonne œuvre, c'est pour son bien. Et quiconque fait le mal, il le fait à ses dépens. Ton Seigneur, cependant, n'est point injuste envers les serviteurs.","en":"Whoever does righteousness - it is for his [own] soul; and whoever does evil [does so] against it. And your Lord is not ever unjust to [His] servants.","ref":{"ar":"سورة فصلت · الآية 46","fr":"Fussilat · 41:46","en":"Fussilat · 41:46"}},{"type":"ayah","ar":"فَاطِرُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ جَعَلَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَٰجًۭا وَمِنَ ٱلْأَنْعَٰمِ أَزْوَٰجًۭا يَذْرَؤُكُمْ فِيهِ لَيْسَ كَمِثْلِهِۦ شَىْءٌۭ وَهُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ","fr":"...Créateur des cieux et de la terre. Il vous a donné des épouses [issues] de vous-mêmes et des bestiaux par couples; par ce moyen Il vous multiplie. Il n'y a rien qui Lui ressemble; et c'est Lui l'Audient, le Clairvoyant.","en":"[He is] Creator of the heavens and the earth. He has made for you from yourselves, mates, and among the cattle, mates; He multiplies you thereby. There is nothing like unto Him, and He is the Hearing, the Seeing.","ref":{"ar":"سورة الشورى · الآية 11","fr":"Ash-Shura · 42:11","en":"Ash-Shura · 42:11"}},{"type":"ayah","ar":"وَهُوَ ٱلَّذِى يَقْبَلُ ٱلتَّوْبَةَ عَنْ عِبَادِهِۦ وَيَعْفُوا۟ عَنِ ٱلسَّيِّـَٔاتِ وَيَعْلَمُ مَا تَفْعَلُونَ","fr":"Et c'est lui qui agrée de Ses serviteurs le repentir, pardonne les méfaits et sait ce que vous faites,","en":"And it is He who accepts repentance from his servants and pardons misdeeds, and He knows what you do.","ref":{"ar":"سورة الشورى · الآية 25","fr":"Ash-Shura · 42:25","en":"Ash-Shura · 42:25"}},{"type":"ayah","ar":"وَمَآ أَصَٰبَكُم مِّن مُّصِيبَةٍۢ فَبِمَا كَسَبَتْ أَيْدِيكُمْ وَيَعْفُوا۟ عَن كَثِيرٍۢ","fr":"Tout malheur qui vous atteint est dû à ce que vos mains ont acquis. Et Il pardonne beaucoup.","en":"And whatever strikes you of disaster - it is for what your hands have earned; but He pardons much.","ref":{"ar":"سورة الشورى · الآية 30","fr":"Ash-Shura · 42:30","en":"Ash-Shura · 42:30"}},{"type":"ayah","ar":"فَمَآ أُوتِيتُم مِّن شَىْءٍۢ فَمَتَٰعُ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَمَا عِندَ ٱللَّهِ خَيْرٌۭ وَأَبْقَىٰ لِلَّذِينَ ءَامَنُوا۟ وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ","fr":"Tout ce qui vous a été donné [comme bien] n'est que jouissance de la vie présente; mais ce qui est auprès d'Allah est meilleur et plus durable pour ceux qui ont cru et qui placent leur confiance en leur Seigneur,","en":"So whatever thing you have been given - it is but [for] enjoyment of the worldly life. But what is with Allah is better and more lasting for those who have believed and upon their Lord rely","ref":{"ar":"سورة الشورى · الآية 36","fr":"Ash-Shura · 42:36","en":"Ash-Shura
