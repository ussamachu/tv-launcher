The Messenger of Allah (ﷺ) at times got up in the morning in a state of junub on account of having a sexual intercourse (with his wives during night) but not due to sexual dreams in the month of Ramadan, and would observe fast","ref":{"ar":"رواه مسلم 2592","fr":"Muslim 2592","en":"Muslim 2592"}},{"type":"hadith","ar":"هي السبع المثاني والقرآن العظيم الذي أوتيته","fr":"Rapporté par Abu Sa’eed bin Mu’alla : Le Messager d’Allah (ﷺ) m’a dit : « Veux-tu que je t’enseigne la plus grande sourate du Coran avant que je quitte la mosquée ? » Puis le Prophète (ﷺ) s’est dirigé vers la sortie, alors je lui ai rappelé, et il a dit : « Al-hamdulillahi Rabbil-Alamin (Louange à Allah, Seigneur de l’univers). Ce sont les sept versets répétés, et c’est le Grand Coran qui m’a été donné. »","en":"It was narrated that Abu Sa'eed bin Mu'alla said:\"The Messenger of Allah(ﷺ) said to me: 'Shall I not teach you the greatest Surah in the QUran before I leave the masjid?' Then the Propeht(ﷺ) went to leave, so I reminded him, and he said: Al-hamdulillahi Rabbil-Alameen (All the praise is to Allah, the Lord of all that exists). It is the Seven Oft-Recited Verses, and it is the Grand Quran that has been given to me","ref":{"ar":"رواه ابن ماجه 3785","fr":"Ibn Mâjah 3785","en":"Ibn Majah 3785"}},{"type":"hadith","ar":"التؤدة في كل شيء إلا في عمل الآخرة","fr":"Rapporté par Sa’d : Le Prophète ﷺ a dit : « Il y a de l’hésitation dans toute chose, sauf dans les actions pour l’au-delà. »","en":"Narrated Sa'd: The Prophet (ﷺ) said: There is hesitation in everything except in the actions of the next world","ref":{"ar":"رواه أبي داود 4810","fr":"Abû Dâwûd 4810","en":"Abu Dawud 4810"}},{"type":"hadith","ar":"بلغوا عني ولو آية","fr":"Rapporté par `Abdullah bin `Amr : Le Prophète (ﷺ) a dit : « Transmettez (mes enseignements) aux gens, même s’il ne s’agit que d’une seule phrase, et racontez aux autres les histoires des Bani Israël (qui vous ont été enseignées), car il n’y a pas de mal à cela. Et celui qui ment intentionnellement à mon sujet aura sûrement sa place en Enfer. »","en":"Narrated `Abdullah bin `Amr:The Prophet (ﷺ) said, \"Convey (my teachings) to the people even if it were a single sentence, and tell others the stories of Bani Israel (which have been taught to you), for it is not sinful to do so. And whoever tells a lie on me intentionally, will surely take his place in the (Hell) Fire","ref":{"ar":"رواه البخاري 3461","fr":"al-Bukhârî 3461","en":"Bukhari 3461"}},{"type":"hadith","ar":"خير يوم طلعت عليه الشمس يوم الجمعة","fr":"Rapporté par Abu Sufyan d’après Jabir : Il a entendu le Messager d’Allah ﷺ dire : « Quand Satan entend l’appel à la prière, il s’enfuit à une distance équivalente à celle de Rauha. » Sulaiman a demandé ce qu’était Rauha. Il a répondu : « C’est à trente-six miles de Médine. »","en":"Abu Sufyan reported it on the authority of Jabir that he had heard the Messenger of Allah (ﷺ) say:When Satan hears the call to prayer, he runs away to a distance like that of Rauha. Sulaimin said: I asked him about Rauha. He replied: It is at a distance of thirty-six miles from Medina","ref":{"ar":"رواه مسلم 854","fr":"Muslim 854","en":"Muslim 854"}},{"type":"hadith","ar":"إن مما يلحق المؤمن من عمله وحسناته بعد موته","fr":"Rapporté par Abu Hurairah : Le Messager d’Allah ﷺ a dit : « Les récompenses des bonnes actions qui atteignent un croyant après sa mort sont : le savoir qu’il a enseigné et transmis, un fils pieux qu’il laisse derrière lui, un exemplaire du Coran qu’il lègue, une mosquée qu’il a construite, une maison qu’il a bâtie pour les voyageurs, un canal qu’il a creusé, ou une aumône qu’il a donnée de son vivant alors qu’il était en bonne santé. Ces actions continueront à lui profiter après sa mort. »","en":"It was narrated that Abu Hurairah said:\"The Messenger of Allah said: 'The rewards of the good deeds that will reach a believer after his death are: Knowledge which he taught and spread; a righteous son whom he leaves behind; a copy of the Qur'an that he leaves as a legacy; a mosque that he built; a house that he built for wayfarers; a canal that he dug; or charity that he gave during his lifetime when he was in good health. These deeds will reach him after his death","ref":{"ar":"رواه ابن ماجه 242","fr":"Ibn Mâjah 242","en":"Ibn Majah 242"}},{"type":"hadith","ar":"إن المؤمن ليدرك بحسن خلقه درجة الصائم القائم","fr":"Rapporté par Aïsha, la mère des croyants رضي الله عنها : Le Messager d’Allah ﷺ a dit : « Par son bon caractère, un croyant atteindra le degré de celui qui prie la nuit et jeûne le jour. »","en":"Narrated Aisha, Ummul Mu'minin: The Messenger of Allah (ﷺ) said: By his good character a believer will attain the degree of one who prays during the night and fasts during the day","ref":{"ar":"رواه أبي داود 4798","fr":"Abû Dâwûd 4798","en":"Abu Dawud 4798"}},{"type":"hadith","ar":"ليس الغنى عن كثرة العرض، ولكن الغنى غنى النفس","fr":"Rapporté par Abou Hourayra : Le Prophète (ﷺ) a dit : « La richesse ne se mesure pas par la quantité de biens possédés, mais la vraie richesse est celle du cœur satisfait. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"Wealth is not in having many possessions, but rather (true) wealth is feeling sufficiency in the soul","ref":{"ar":"رواه البخاري 6446","fr":"al-Bukhârî 6446","en":"Bukhari 6446"}},{"type":"hadith","ar":"لا يدخل الجنة نمام","fr":"Rapporté par Muhammad ibn Hatim d’après Abu Ayyub al-Ansari رضي الله عنه : (Hadith identique au précédent)","en":"This hadith is transmitted by Muhammad b. Hatim on the authority of Abu Ayyub Ansari","ref":{"ar":"رواه مسلم 105","fr":"Muslim 105","en":"Muslim 105"}},{"type":"hadith","ar":"الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة","fr":"Rapporté par Sahl bin Mu’adh bin Anas Al-Juhani, de la part de son père : Le Prophète (ﷺ) a dit : « Celui qui mange de la nourriture et dit : Al-hamdu lillahil-ladhi at’amani hadha wa razaqanihi min ghayri hawlin minni wa la quwwatin (Louange à Allah qui m’a donné ceci à manger et me l’a accordé sans aucune force ni pouvoir de ma part), ses péchés passés seront pardonnés. »","en":"It was narrated from Sahl bin Mu’adh bin Anas Al-Juhani, from his father, that the Prophet (ﷺ) said:“Whoever eats food and said: Al- hamdu lillahil-ladhi at’amani hadha wa razaqanihi min ghayri hawlin minni wa la quwwatin (Praise is to Allah Who has fed me this and provided it for me without any strength or power on my part), - his previous sins will be forgiven.”","ref":{"ar":"رواه ابن ماجه 3285","fr":"Ibn Mâjah 3285","en":"Ibn Majah 3285"}},{"type":"hadith","ar":"إن الهدي الصالح والسمت الصالح والاقتصاد جزء من خمسة وعشرين جزءا من النبوة","fr":"Rapporté par Abdullah ibn Abbas رضي الله عنه : Le Prophète ﷺ a dit : « La bonne conduite, la dignité dans le comportement et la modération représentent un vingt-cinquième de la Prophétie. »","en":"Narrated Abdullah ibn Abbas: The Prophet (ﷺ) said: Good way, dignified good bearing and moderation are the twenty-fifth part of Prophecy","ref":{"ar":"رواه أبي داود 4776","fr":"Abû Dâwûd 4776","en":"Abu Dawud 4776"}},{"type":"hadith","ar":"المرء مع من أحب","fr":"Rapporté par `Abdullah : Le Prophète (ﷺ) a dit : « Chacun sera avec ceux qu’il aime. »","en":"Narrated `Abdullah:The Prophet (ﷺ) said, \"Everyone will be with those whom he loves","ref":{"ar":"رواه البخاري 6168","fr":"al-Bukhârî 6168","en":"Bukhari 6168"}},{"type":"hadith","ar":"الماهر بالقرآن مع السفرة الكرام البررة","fr":"Rapporté par Ibn Abbas : Le Messager d’Allah ﷺ a bu du lait, puis il a demandé de l’eau, s’est rincé la bouche et a dit : « Il y a de la graisse dedans. »","en":"Ibn Abbas reported:The Apostle (ﷺ) took milk and then called for water and rinsed (his mouth) and said: It contains greasiness","ref":{"ar":"رواه مسلم 798","fr":"Muslim 798","en":"Muslim 798"}},{"type":"hadith","ar":"إن لكل دين خلقا وخلق الإسلام الحياء","fr":"Rapporté par Anas : Le Messager d’Allah (ﷺ) a dit : \"Chaque religion a une caractéristique qui lui est propre, et la caractéristique de l’islam est la pudeur","en":"It was narrated from Anas that the Messenger of Allah (ﷺ) said:“Every religion has its distinct characteristic, and the distinct characteristic of Islam is modesty.”","ref":{"ar":"رواه ابن ماجه 4181","fr":"Ibn Mâjah 4181","en":"Ibn Majah 4181"}},{"type":"hadith","ar":"من كان آخر كلامه لا إله إلا الله دخل الجنة","fr":"Rapporté par Mu’adh ibn Jabal رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Si les derniers mots de quelqu’un sont “Il n’y a de dieu qu’Allah”, il entrera au Paradis. »","en":"Narrated Mu’adh bin Jabal :The Messenger of Allah (ﷺ) as saying: If anyone's last words are \"There is no god but Allah\" he will enter Paradise","ref":{"ar":"رواه أبي داود 3116","fr":"Abû Dâwûd 3116","en":"Abu Dawud 3116"}},{"type":"hadith","ar":"إن الدين يسر","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « La religion est très facile et celui qui se complique trop la vie dans sa pratique religieuse ne pourra pas continuer ainsi. Donc, ne soyez pas extrêmes, essayez plutôt de vous rapprocher de la perfection et réjouissez-vous car vous serez récompensés ; et puisez de la force en adorant Allah le matin, l’après-midi et pendant les dernières heures de la nuit. »","en":"Narrated Abu Huraira: The Prophet (ﷺ) said, \"Religion is very easy and whoever overburdens himself in his religion will not be able to continue in that way. So you should not be extremists, but try to be near to perfection and receive the good tidings that you will be rewarded; and gain strength by worshipping in the mornings, the afternoons, and during the last hours of the nights.\" (See Fath-ul-Bari, Page 102, Vol)","ref":{"ar":"رواه البخاري 39","fr":"al-Bukhârî 39","en":"Bukhari 39"}},{"type":"hadith","ar":"مثل المؤمن الذي يقرأ القرآن مثل الأترجة","fr":"Rapporté par Abu Rafi’ : J’atteste que je faisais griller le foie de la chèvre pour le Messager d’Allah ﷺ, puis il priait sans faire d’ablutions","en":"Abu Rafi' reported:I testify that I used to roast the liver of the goat for the Messenger of Allah (may peace be tipcn him) and then he offered praver but did not perform ablution","ref":{"ar":"رواه مسلم 797","fr":"Muslim 797","en":"Muslim 797"}},{"type":"hadith","ar":"إن الله تجاوز عن أمتي الخطأ والنسيان وما استكرهوا عليه","fr":"Rapporté par Abu Dharr Al-Ghifari : Le Messager d'Allah (ﷺ) a dit : Allah a pardonné à ma communauté leurs erreurs, leurs oublis et ce qu'ils sont contraints de faire","en":"It was narrated from Abu Dharr Al-Ghifari that the Messenger of Allah (ﷺ) said:Allah has forgiven for me my nation their mistakes and forgetfulness, and what they are forced to do","ref":{"ar":"رواه ابن ماجه 2043","fr":"Ibn Mâjah 2043","en":"Ibn Majah 2043"}},{"type":"hadith","ar":"كفى بالمرء إثما أن يضيع من يقوت","fr":"Rapporté par Abd Allah ibn ‘Amr رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Il suffit comme péché pour un homme de négliger ceux dont il a la charge. »","en":"Abd Allah bin ‘Amr reported the Messenger of Allah (ﷺ) as saying :It is sufficient sin for a man that he neglects him whom he maintains","ref":{"ar":"رواه أبي داود 1692","fr":"Abû Dâwûd 1692","en":"Abu Dawud 1692"}},{"type":"hadith","ar":"إن الصدق يهدي إلى البر، وإن البر يهدي إلى الجنة","fr":"Rapporté par `Abdullah : Le Prophète (ﷺ) a dit : « La véracité mène à la droiture, et la droiture mène au Paradis. Un homme continue à dire la vérité jusqu’à devenir quelqu’un de véridique. Le mensonge mène à la perversité, et la perversité mène au Feu (de l’Enfer). Un homme continue à mentir jusqu’à être inscrit auprès d’Allah comme menteur. »","en":"Narrated `Abdullah:The Prophet (ﷺ) said, \"Truthfulness leads to righteousness, and righteousness leads to Paradise. And a man keeps on telling the truth until he becomes a truthful person. Falsehood leads to Al-Fajur (i.e. wickedness, evil-doing), and Al-Fajur (wickedness) leads to the (Hell) Fire, and a man may keep on telling lies till he is written before Allah, a liar","ref":{"ar":"رواه البخاري 6094","fr":"al-Bukhârî 6094","en":"Bukhari 6094"}},{"type":"hadith","ar":"لا تجعلوا بيوتكم مقابر","fr":"Rapporté par Ubayy ibn Ka’b, d’après le Messager d’Allah ﷺ : « Si quelqu’un a un rapport avec sa femme sans atteindre l’orgasme, il doit laver son sexe et faire les ablutions. »","en":"Ubayy ibn Ka'b narrated it from the Messenger of Allah (ﷺ) that he said:If a person has sexual intercourse with his wife, but does not experience orgasm, he should wash his organ and perform an ablution","ref":{"ar":"رواه مسلم 780","fr":"Muslim 780","en":"Muslim 780"}},{"type":"hadith","ar":"الحمد لله الذي عافاني مما ابتلاك به","fr":"Rapporté par Ibn ‘Umar : Le Messager d’Allah (ﷺ) a dit : « Celui qui croise par surprise une personne touchée par une épreuve et dit : Al-hamdu Lillahil-ladhi ‘afani mim-mabtalaka bihi, wa faddalani ‘ala kathirin mimman khalaqa tafdila (Louange à Allah qui m’a préservé de ce dont tu souffres et m’a favorisé par rapport à beaucoup de ceux qu’Il a créés), sera protégé de cette épreuve, quelle qu’elle soit. »","en":"It was narrated from Ibn ‘Umar that the Messenger of Allah (ﷺ) said:“Whoever unexpectedly comes across a person suffering a calamity, and says: Al-hamdu Lillahil-ladhi ‘afani mim-mabtalaka bihi, wa faddalani ‘ala kathirin mimman khalaqa tafdila (Praise is to Allah Who has kept me safe from that which has afflicted you and preferred me over many of those whom He has created), will be kept safe from that calamity, no matter what it is.’”","ref":{"ar":"رواه ابن ماجه 3892","fr":"Ibn Mâjah 3892","en":"Ibn Majah 3892"}},{"type":"hadith","ar":"أحب الأسماء إلى الله عبد الله وعبد الرحمن","fr":"Rapporté par Abu Wahb al-Jushami رضي الله عنه : Le Prophète ﷺ a dit : « Appelez-vous par les noms des Prophètes. Les noms les plus aimés d’Allah sont Abdullah et AbdurRahman, les plus véridiques sont Harith et Hammam, et les pires sont Harb et Murrah. »","en":"Narrated AbuWahb al-Jushami: The Prophet (ﷺ) said: Call yourselves by the names of the Prophets. The names dearest to Allah are Abdullah and AbdurRahman, the truest are Harith and Hammam, and the worst are Harb and Murrah","ref":{"ar":"رواه أبي داود 4950","fr":"Abû Dâwûd 4950","en":"Abu Dawud 4950"}},{"type":"hadith","ar":"آية المنافق ثلاث: إذا حدث كذب، وإذا وعد أخلف، وإذا اؤتمن خان","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Les signes de l’hypocrite sont au nombre de trois : quand il parle, il ment ; quand il promet, il ne tient pas sa promesse ; et quand on lui confie quelque chose, il trahit. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The signs of a hypocrite are three: Whenever he speaks, he tells a lie; and whenever he promises, he breaks his promise; and whenever he is entrusted, he betrays (proves to be dishonest)","ref":{"ar":"رواه البخاري 6095","fr":"al-Bukhârî 6095","en":"Bukhari 6095"}},{"type":"hadith","ar":"الصلاة على وقتها","fr":"Rapporté par Abu ‘Amr Shaibani رضي الله عنه : En désignant la maison d’Abdullah, il a dit : « Le propriétaire de cette maison m’a dit qu’il a demandé au Messager d’Allah ﷺ : “Quelle action Allah aime-t-Il le plus ?” Le Prophète ﷺ a répondu : “La prière à son heure.” J’ai dit : “Et ensuite ?” Il a répondu : “La bonté envers les parents.” J’ai dit : “Et ensuite ?” Il a répondu : “Le jihad dans le chemin d’Allah.” Abdullah a dit : “Voilà ce que le Prophète m’a dit. Si j’avais posé plus de questions, il m’aurait donné d’autres réponses.” »","en":"It was heard from Abu 'Amr Shaibani that, pointing towards the house of Abdullah, he said:The owner of this house told me that he asked the Messenger of Allah (ﷺ): Which of the deeds are liked by Allah? He (the Holy Prophet) observed: Prayer at its proper time. I (again) said: What next? He replied: Then goodness to the parents. I (again) said: What then? He replied: Then Jihad in the cause of Allah. He ('Abdullah) said: This is what I was told (by the Holy Prophet). Had I questioned further, he would have made additions for me","ref":{"ar":"رواه مسلم 254","fr":"Muslim 254","en":"Muslim 254"}},{"type":"hadith","ar":"يا ابن آدم تفرغ لعبادتي أملأ صدرك غنى","fr":"Rapporté par (Abu) Khalid Al-Walibi d’après Abu Hurairah, et il (l’un des rapporteurs) a dit : « Je ne sais que cela a été attribué au Prophète (ﷺ) » – « Allah dit : “Ô fils d’Adam, consacre-toi à Mon adoration, Je remplirai ton cœur de satisfaction et Je prendrai soin de ta pauvreté ; mais si tu ne fais pas cela, Je remplirai ton cœur de préoccupations mondaines et Je ne prendrai pas soin de ta pauvreté.” »","en":"(Abu) Khalid Al-Walibi narrated from Abu Hurairah and he (one of the narrators) said:“I do not know except that he attributed it to the Prophet (ﷺ)” – “Allah says: ‘O son of Adam, devote yourself to My worship, and I will fill your heart with contentment and take care of your poverty; but if you do not do that, then I will fill your heart with worldly concerns and will not take care of your poverty.’”","ref":{"ar":"رواه ابن ماجه 4107","fr":"Ibn Mâjah 4107","en":"Ibn Majah 4107"}},{"type":"hadith","ar":"أفضل الجهاد كلمة عدل عند سلطان جائر","fr":"Rapporté par Abu Sa’id al-Khudri رضي الله عنه : Le Prophète ﷺ a dit : « Le meilleur combat (jihad) sur le chemin d’Allah, c’est de dire une parole de justice devant un dirigeant injuste. »","en":"Narrated AbuSa'id al-Khudri: The Prophet (ﷺ) said: The best fighting (jihad) in the path of Allah is (to speak) a word of justice to an oppressive ruler","ref":{"ar":"رواه أبي داود 4344","fr":"Abû Dâwûd 4344","en":"Abu Dawud 4344"}},{"type":"hadith","ar":"ما زال جبريل يوصيني بالجار حتى ظننت أنه سيورثه","fr":"Rapporté par Ibn `Umar : Le Messager d’Allah a dit : « Gabriel n’a pas arrêté de me recommander de bien traiter les voisins, avec bonté et respect, au point que j’ai cru qu’il allait me demander de les inclure parmi mes héritiers. »","en":"Narrates Ibn `Umar:Allah's Apostle said, Gabriel kept on recommending me about treating the neighbors in a kind and polite manner, so much so that I thought that he would order (me) to make them (my) heirs","ref":{"ar":"رواه البخاري 6015","fr":"al-Bukhârî 6015","en":"Bukhari 6015"}},{"type":"hadith","ar":"من صلى الصبح فهو في ذمة الله","fr":"Rapporté par Hammam ibn Munabbih : Parmi les hadiths rapportés par Abu Huraira du Messager d’Allah ﷺ, il y a celui-ci : Le Messager d’Allah ﷺ a dit : « Vous ne devez pas uriner dans une eau stagnante, qui ne coule pas, puis vous y laver. »","en":"Hammam b. Munabbih said:Of the ahadith narrated to us by Abfi Huraira from Muhammad the Messenger of Allah (ﷺ) one is this: The Messenger or Allah (ﷺ) said: You should not urinate in standing water, that is not flowing, then wash in it","ref":{"ar":"رواه مسلم 657","fr":"Muslim 657","en":"Muslim 657"}},{"type":"hadith","ar":"ما من جرعة أعظم أجرا عند الله من جرعة غيظ كظمها عبد ابتغاء وجه الله","fr":"Rapporté par Ibn ‘Umar : Le Messager d’Allah (ﷺ) a dit : \"Il n’y a pas de gorgée plus récompensée auprès d’Allah qu’une gorgée de colère qu’un homme retient, cherchant ainsi la Face d’Allah","en":"It was narrated from Ibn ‘Umar that the Messenger of Allah (ﷺ) said:“There is no gulp that brings greater reward with Allah than a gulp of anger that a man swallows (suppresses), seeking thereby the Face of Allah.”","ref":{"ar":"رواه ابن ماجه 4189","fr":"Ibn Mâjah 4189","en":"Ibn Majah 4189"}},{"type":"hadith","ar":"ما من أيام العمل الصالح فيها أحب إلى الله من هذه الأيام","fr":"Rapporté par Ibn ‘Abbas رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Il n’y a pas de jours où Allah aime plus les bonnes actions que ces jours-là, c’est-à-dire les dix premiers jours de Dhu al-Hijjah. » Les Compagnons ont demandé : « Ô Messager d’Allah, même pas le combat dans le chemin d’Allah (jihad) ? » Il a répondu : « Même pas le combat dans le chemin d’Allah, sauf pour un homme qui part avec sa vie et ses biens et ne revient avec rien. »","en":"Narrated Ibn 'Abbas:The Messenger of Allah (ﷺ) as saying: There is no virtue more to the liking of Allah in any day than in these days, that is, the first ten days of Dhu al-Hijjah. They (the Companions) asked: Messenger of Allah, not even the struggle in the path of Allah (Jihad) ? He said: (Yes), not even the struggle in the path of Allah, except a man who goes out (in the path of Allah) with his life and property, and does not return with any of them","ref":{"ar":"رواه أبي داود 2438","fr":"Abû Dâwûd 2438","en":"Abu Dawud 2438"}},{"type":"hadith","ar":"اليد العليا خير من اليد السفلى","fr":"Rapporté par Hakim bin Hizam : Le Prophète (ﷺ) a dit : « La main qui donne est meilleure que celle qui reçoit (c'est-à-dire que celui qui donne l'aumône est meilleur que celui qui la reçoit). On doit commencer par donner à sa famille. Et la meilleure aumône est celle donnée par une personne riche (après avoir satisfait ses besoins). Et celui qui s'abstient de demander aux autres, Allah lui donnera et le rendra indépendant. »","en":"Narrated Hakim bin Hizam:The Prophet (ﷺ) said, \"The upper hand is better than the lower hand (i.e. he who gives in charity is better than him who takes it). One should start giving first to his dependents. And the best object of charity is that which is given by a wealthy person (from the money which is left after his expenses). And whoever abstains from asking others for some financial help, Allah will give him and save him from asking others, Allah will make him self-sufficient","ref":{"ar":"رواه البخاري 1427","fr":"al-Bukhârî 1427","en":"Bukhari 1427"}},{"type":"hadith","ar":"من صلى العشاء في جماعة فكأنما قام نصف الليل","fr":"Rapporté par Abu Huraira : Le Messager d’Allah ﷺ a dit : « Aucun de vous ne doit uriner dans une eau qui ne coule pas, puis s’y laver. »","en":"Abu Huraira reported:the Messenger of Allah (ﷺ) said: None amongst you should urinate in standing water, and then wash in it","ref":{"ar":"رواه مسلم 656","fr":"Muslim 656","en":"Muslim 656"}},{"type":"hadith","ar":"من كان له ثلاث بنات فصبر عليهن","fr":"Rapporté par Uqbah bin Amir : J’ai entendu le Messager d’Allah (ﷺ) dire : « Celui qui a trois filles, qui fait preuve de patience envers elles, les nourrit, leur donne à boire et les habille avec ses biens, elles seront pour lui une protection contre le Feu le Jour de la Résurrection. »","en":"Uqbah bin Amir said, I heard the Messenger of Allah(ﷺ) say:\"Whoever has three daughters and is patient towards them, and feeds them, gives them to drink, and clothes them from his wealth; they will be a shield for him from the Fire on the Day of Resurrection","ref":{"ar":"رواه ابن ماجه 3669","fr":"Ibn Mâjah 3669","en":"Ibn Majah 3669"}},{"type":"hadith","ar":"اللهم رب هذه الدعوة التامة والصلاة القائمة","fr":"Rapporté par Jabir b. ‘Abd Allah : Le Messager d’Allah ﷺ a dit : « Si quelqu’un dit en entendant l’appel à la prière : “Ô Allah, Seigneur de cet appel parfait et de la prière qui va être accomplie, accorde à Muhammad la wasilah et l’excellence, et élève-le à la place louée que Tu lui as promise”, il aura droit à mon intercession. »","en":"Jabir b. ‘Abd Allah reported the Messenger of Allah (ﷺ) as saying:if anyone says when he hears the call to prayer : “O Allah, Lord of this perfect call and of the prayer which is established for all time, grant Muhammad the wasilah and excellency, and raise him up in a praiseworthy position which Thou hast promised, he will be assured of my intercession","ref":{"ar":"رواه أبي داود 529","fr":"Abû Dâwûd 529","en":"Abu Dawud 529"}},{"type":"hadith","ar":"إياكم والظن، فإن الظن أكذب الحديث","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Méfiez-vous des soupçons, car c’est la pire des fausses histoires. Ne cherchez pas les défauts des autres, ne vous espionnez pas, ne vous détestez pas et ne coupez pas vos liens les uns avec les autres. Ô serviteurs d’Allah, soyez frères ! »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, 'Beware of suspicion, for it is the worst of false tales and don't look for the other's faults and don't spy and don't hate each other, and don't desert (cut your relations with) one another O Allah's slaves, be brothers!\" (See Hadith No)","ref":{"ar":"رواه البخاري 6724","fr":"al-Bukhârî 6724","en":"Bukhari 6724"}},{"type":"hadith","ar":"ركعتا الفجر خير من الدنيا وما فيها","fr":"Rapporté par Aïcha رضي الله عنها : Lorsque le Messager d’Allah ﷺ faisait le grand lavage après un rapport sexuel, il demandait un récipient, prenait une poignée d’eau et se lavait d’abord le côté droit de la tête, puis le côté gauche, puis il prenait une poignée d’eau et la versait sur sa tête","en":"A'isha reported:When the Messenger of Allah (ﷺ) took a bath because of sexual intercourse, he called for a vessel and took a handful of water from it and first (washed) the right side of his head, then left, and then took a handful (of water) and poured it on his head","ref":{"ar":"رواه مسلم 725","fr":"Muslim 725","en":"Muslim 725"}},{"type":"hadith","ar":"الندم توبة","fr":"Rapporté par Ibn Ma’qil : J’ai accompagné mon père chez ‘Abdullah, et je l’ai entendu dire : “Le Messager d’Allah (ﷺ) a dit : « Le regret, c’est le repentir. »” Mon père lui demanda : “As-tu entendu le Prophète (ﷺ) dire : « Le regret, c’est le repentir » ?” Il répondit : “Oui.”","en":"It was narrated that Ibn Ma’qil said:“I entered with my father upon ‘Abdullah, and I heard him say: ‘The messenger of Allah (ﷺ) said: “Regret is repentance.” My father said: ‘Did you hear the Prophet (ﷺ) say: “Regret is repentance?” He said: ‘Yes.’”","ref":{"ar":"رواه ابن ماجه 4252","fr":"Ibn Mâjah 4252","en":"Ibn Majah 4252"}},{"type":"hadith","ar":"ومن صنع إليكم معروفا فكافئوه","fr":"Rapporté par Abdullah ibn Umar رضي الله عنه : Le Prophète ﷺ a dit : « Si quelqu’un demande protection au nom d’Allah, accorde-lui la protection ; si quelqu’un demande l’aumône au nom d’Allah, donne-lui quelque chose ; si quelqu’un t’invite, accepte son invitation ; et si quelqu’un te rend service, rends-lui la pareille ; mais si tu n’en as pas les moyens, prie pour lui jusqu’à ce que tu penses l’avoir récompensé. »","en":"Narrated Abdullah ibn Umar: The Prophet (ﷺ) said: If anyone seeks protection in Allah's name, grant him protection; if anyone begs in Allah's name, give him something; if anyone gives you an invitation, accept it; and if anyone does you a kindness, recompense him; but if you have not the means to do so, pray for him until you feel that you have compensated him","ref":{"ar":"رواه أبي داود 1672","fr":"Abû Dâwûd 1672","en":"Abu Dawud 1672"}},{"type":"hadith","ar":"لا تباغضوا، ولا تحاسدوا، ولا تدابروا، وكونوا عباد الله إخوانا","fr":"Rapporté par Anas bin Malik : Le Messager d'Allah (ﷺ) a dit : « Ne vous détestez pas les uns les autres, ne soyez pas jaloux les uns des autres, et ne vous tournez pas le dos. Ô serviteurs d'Allah, soyez frères ! Il n'est pas permis à un musulman de couper les liens avec son frère musulman (et de ne pas lui parler) plus de trois nuits. »","en":"Narrated Anas bin Malik:Allah's Messenger (ﷺ) said, \"Do not hate one another, nor be jealous of one another; and do not desert one another, but O Allah's worshipers! Be Brothers! And it is unlawful for a Muslim to desert his brother Muslim (and not to talk to him) for more than three nights","ref":{"ar":"رواه البخاري 6076","fr":"al-Bukhârî 6076","en":"Bukhari 6076"}},{"type":"hadith","ar":"من توضأ فأحسن الوضوء خرجت خطاياه من جسده","fr":"Rapporté par A’mash رضي الله عنه : Il a rapporté ce hadith avec la même chaîne de transmetteurs, en disant que Satan a dit : « J’ai désobéi et je suis destiné à l’Enfer. »","en":"A'mash narrated this hadith with the same chain of transmitters, with this change of words that he (the Satan) said:I disobeyed and I am doomed to Hell","ref":{"ar":"رواه مسلم 245","fr":"Muslim 245","en":"Muslim 245"}},{"type":"hadith","ar":"الحمد لله الذي بنعمته تتم الصالحات","fr":"Rapporté par Aisha رضي الله عنها : Lorsque le Messager d’Allah (ﷺ) voyait quelque chose qui lui plaisait, il disait : « Al-hamdu lillahil-ladhi bi ni’matihi tatimmus-salihat (Louange à Allah par Sa grâce grâce à laquelle les bonnes œuvres sont accomplies). » Et s’il voyait quelque chose qu’il n’aimait pas, il disait : « Al-hamdu lillahi ‘ala kulli hal (Louange à Allah en toute circonstance). »","en":"It was narrated that 'Aishah said:\"When the Messenger of Allah (ﷺ) saw something he liked, he would say: 'Al-hamdu lillahil-ladhi bi ni'matihi tatimmus-salihat (Praise is to Allah by Whose grace good deeds are completed).' And if he saw something that he disliked, he would say: 'Al-hamdu lillahi 'ala kulli hal (Praise is to Allah in all circumstances)","ref":{"ar":"رواه ابن ماجه 3803","fr":"Ibn Mâjah 3803","en":"Ibn Majah 3803"}},{"type":"hadith","ar":"ومن يستعفف يعفه الله ومن يستغن يغنه الله ومن يتصبر يصبره الله","fr":"Abu Sa'id al-Khudri رضي الله عنه a dit : Certains Ansar ont demandé l’aumône au Messager d’Allah ﷺ et il leur a donné. Ils lui ont ensuite redemandé et il leur a encore donné, jusqu’à ce qu’il n’ait plus rien. Il a alors dit : « Je ne garderai jamais rien pour moi en vous le refusant, mais Allah donnera la force à celui qui veut s’abstenir, satisfera celui qui veut se contenter, et donnera la patience à celui qui veut endurer. Personne n’a reçu de don plus grand que la patience. »","en":"Abu Said al-Khudri said :Some of the Ansar begged from the Messenger of Allah (May peace be upon him) and he gave them something. They later begged from him again and he gave them something so that what he had was exhausted. He then said :What I have I shall never store away from you but Allah will strengthen the abstinence of him who abstains, will give a satisfaction to him who wants to be satisfied, and will strengthen the endurance of him who shows endurance. No one has been given a more ample gift than endurance","ref":{"ar":"رواه أبي داود 1644","fr":"Abû Dâwûd 1644","en":"Abu Dawud 1644"}},{"type":"hadith","ar":"من ستر مسلما ستره الله يوم القيامة","fr":"Rapporté par ‘Abdullah bin ‘Umar : Le Messager d’Allah (ﷺ) a dit : « Un musulman est le frère d’un autre musulman, il ne doit donc pas lui faire de tort ni le livrer à un injuste. Celui qui satisfait les besoins de son frère, Allah satisfera ses besoins ; celui qui soulage son frère musulman d’une difficulté, Allah le soulagera des difficultés du Jour de la Résurrection ; et celui qui couvre un musulman, Allah le couvrira le Jour de la Résurrection. »","en":"Narrated `Abdullah bin `Umar:Allah's Messenger (ﷺ) said, \"A Muslim is a brother of another Muslim, so he should not oppress him, nor should he hand him over to an oppressor. Whoever fulfilled the needs of his brother, Allah will fulfill his needs; whoever brought his (Muslim) brother out of a discomfort, Allah will bring him out of the discomforts of the Day of Resurrection, and whoever screened a Muslim, Allah will screen him on the Day of Resurrection","ref":{"ar":"رواه البخاري 2442","fr":"al-Bukhârî 2442","en":"Bukhari 2442"}},{"type":"hadith","ar":"ألا أدلكم على ما يمحو الله به الخطايا ويرفع به الدرجات","fr":"Rapporté par Muhammad ibn Abu Rafi’ رضي الله عنه : Il a rapporté le hadith d’Abu Dharr avec une légère différence","en":"Muhammad b. Abu Rafi' narrated the hadith on the authority of Abu Dharr with a slight difference","ref":{"ar":"رواه مسلم 251","fr":"Muslim 251","en":"Muslim 251"}},{"type":"hadith","ar":"ماء زمزم لما شرب له","fr":"Rapporté par Jabir bin ‘Abdullah : J’ai entendu le Messager d’Allah (ﷺ) dire : “L’eau de Zamzam sert à ce pour quoi on la boit.”","en":"It was narrated that Jabir bin ‘Abdullah said:“I heard the Messenger of Allah (ﷺ) say: ‘The water of Zamzam is for whatever it is drunk for.’”","ref":{"ar":"رواه ابن ماجه 3062","fr":"Ibn Mâjah 3062","en":"Ibn Majah 3062"}},{"type":"hadith","ar":"من أحب لله وأبغض لله وأعطى لله ومنع لله فقد استكمل الإيمان","fr":"Abu Umamah رضي الله عنه a rapporté que le Prophète ﷺ a dit : « Si quelqu’un aime pour Allah, déteste pour Allah, donne pour Allah et retient pour Allah, sa foi sera parfaite. »","en":"Narrated AbuUmamah: The Prophet (ﷺ) said: If anyone loves for Allah's sake, hates for Allah's sake, gives for Allah's sake and withholds for Allah's sake, he will have perfect faith","ref":{"ar":"رواه أبي داود 4681","fr":"Abû Dâwûd 4681","en":"Abu Dawud 4681"}},{"type":"hadith","ar":"صلاة الجماعة تفضل صلاة الفذ بسبع وعشرين درجة","fr":"Rapporté par `Abdullah bin `Umar : Le Messager d’Allah (ﷺ) a dit : « La prière en groupe est vingt-sept fois supérieure à la prière faite seul. »","en":"Narrated `Abdullah bin `Umar:Allah's Messenger (ﷺ) said, \"The prayer in congregation is twenty seven times superior to the prayer offered by a person alone","ref":{"ar":"رواه البخاري 645","fr":"al-Bukhârî 645","en":"Bukhari 645"}},{"type":"hadith","ar":"من صلى علي صلاة صلى الله عليه بها عشرا","fr":"Rapporté par Abdullah ibn Amr ibn al-As : Le Messager d’Allah ﷺ a dit : « Quand tu entends le muezzin, répète ce qu’il dit, puis invoque la bénédiction sur moi, car celui qui invoque une bénédiction sur moi recevra dix bénédictions d’Allah. Ensuite, demande à Allah de m’accorder al-Wasila, qui est un rang au Paradis réservé à un seul des serviteurs d’Allah, et j’espère être ce serviteur. Celui qui demande à Allah que je reçoive al-Wasila, mon intercession lui sera assurée. »","en":"Abdullah b. Amr b. al-As reported Allah's Messenger (ﷺ) as saying:When you hear the Mu'adhdhin, repeat what he says, then invoke a blessing on me, for everyone who invokes a blessing on me will receive ten blessings from Allah; then beg from Allah al-Wasila for me, which is a rank in Paradise fitting for only one of Allah's servants, and I hope that I may be that one. If anyone who asks that I be given the Wasila, he will be assured of my intercession","ref":{"ar":"رواه مسلم 849","fr":"Muslim 849","en":"Muslim 849"}},{"type":"hadith","ar":"إذا قرأ ابن آدم السجدة فسجد اعتزل الشيطان يبكي","fr":"Rapporté par Abu Hurairah : Le Messager d’Allah (ﷺ) a dit : “Quand un fils d’Adam récite un verset de prosternation et se prosterne, Satan s’éloigne en pleurant et dit : ‘Malheur à moi ! Le fils d’Adam a reçu l’ordre de se prosterner, il s’est prosterné et le Paradis sera pour lui ; moi, j’ai reçu l’ordre de me prosterner, j’ai refusé et je serai donc en Enfer.’”","en":"It was narrated that Abu Hurairah said:“The Messenger of Allah (ﷺ) said: ‘When a son of Adam recites a Sajdah* and prostrates, Satan withdraws weeping, saying: ‘Woe is me! The son of Adam was commanded to prostrate and he prostrated, and Paradise will be his; I was commanded to prostrate and I refused, so I am doomed to Hell.’” * An Ayah indicating prostration","ref":{"ar":"رواه ابن ماجه 1052","fr":"Ibn Mâjah 1052","en":"Ibn Majah 1052"}},{"type":"hadith","ar":"بسم الله توكلت على الله لا حول ولا قوة إلا بالله","fr":"Rapporté par Anas ibn Malik رضي الله عنه : Le Prophète ﷺ a dit : « Quand un homme sort de chez lui et dit : “Au nom d’Allah, je place ma confiance en Allah ; il n’y a de force ni de puissance qu’en Allah”, il lui sera dit à ce moment-là : “Tu es guidé, protégé et préservé.” Les diables s’éloigneront de lui et un autre diable dira : “Que peux-tu faire contre un homme qui a été guidé, protégé et préservé ?” »","en":"Narrated Anas ibn Malik: The Prophet (ﷺ) said: When a man goes out of his house and says: \"In the name of Allah, I trust in Allah; there is no might and no power but in Allah,\" the following will be said to him at that time: \"You are guided, defended and protected.\" The devils will go far from him and another devil will say: How can you deal with a man who has been guided, defended and protected?","ref":{"ar":"رواه أبي داود 5095","fr":"Abû Dâwûd 5095","en":"Abu Dawud 5095"}},{"type":"hadith","ar":"من صام رمضان إيمانا واحتسابا غفر له ما تقدم من ذنبه","fr":"Rapporté par Abu Huraira : Le Messager d'Allah (ﷺ) a dit : « Celui qui jeûne pendant le mois de Ramadan avec une foi sincère et dans l’espoir d’obtenir la récompense d’Allah, alors tous ses péchés passés seront pardonnés. »","en":"Narrated Abu Huraira: Allah's Messenger (ﷺ) said, \"Whoever observes fasts during the month of Ramadan out of sincere faith, and hoping to attain Allah's rewards, then all his past sins will be forgiven","ref":{"ar":"رواه البخاري 38","fr":"al-Bukhârî 38","en":"Bukhari 38"}},{"type":"hadith","ar":"لأن أقول سبحان الله والحمد لله ولا إله إلا الله والله أكبر أحب إلي مما طلعت عليه الشمس","fr":"Ce hadith a été rapporté par Ibn 'Abbas رضي الله عنهما du Messager d’Allah ﷺ","en":"This hadith has been narrated on the authority of Ibn 'Abbas (Allah be pleased with them) from the Messenger of Allah (ﷺ)","ref":{"ar":"رواه مسلم 2695","fr":"Muslim 2695","en":"Muslim 2695"}},{"type":"hadith","ar":"ترضون خلقه ودينه فزوجوه","fr":"Rapporté par Abu Hurairah : Le Messager d’Allah a dit : « Si quelqu’un vient vers vous et que vous êtes satisfaits de sa moralité et de sa pratique religieuse, alors mariez-lui (votre fille ou la femme dont vous avez la charge), car si vous ne le faites pas, il y aura des troubles et une grande corruption sur terre. »","en":"It was narrated from Abu Hurairah:that the Messenger of Allah said: \"If there comes to you one with whose character and religious commitment you are pleased, then marry (your daughter or female relative under your care) to him, for if you do not do that there will be Fitnah in the land and widespread corruption","ref":{"ar":"رواه ابن ماجه 1967","fr":"Ibn Mâjah 1967","en":"Ibn Majah 1967"}},{"type":"hadith","ar":"اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Prophète ﷺ avait l’habitude de dire le matin : « Ô Allah, c’est par Toi que nous arrivons au matin, par Toi que nous arrivons au soir, et par Toi que nous serons ressuscités. » Et le soir, il disait : « Ô Allah, c’est par Toi que nous arrivons au soir, par Toi que nous mourons, et vers Toi que nous serons ressuscités. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) used to say in the morning: \"O Allah, by Thee we come to the morning, by Thee we come to the evening, by Thee are we resurrected.\" In the evening he would say: \"O Allah, by Thee we come to the evening, by Thee we die, and to Thee are we resurrected","ref":{"ar":"رواه أبي داود 5068","fr":"Abû Dâwûd 5068","en":"Abu Dawud 5068"}},{"type":"hadith","ar":"تسحروا فإن في السحور بركة","fr":"Rapporté par Anas bin Malik : Le Prophète (ﷺ) a dit : « Prenez le Suhur car il y a une bénédiction dedans. »","en":"Narrated Anas bin Malik:The Prophet (ﷺ) said, \"Take Suhur as there is a blessing in it","ref":{"ar":"رواه البخاري 1923","fr":"al-Bukhârî 1923","en":"Bukhari 1923"}},{"type":"hadith","ar":"أيعجز أحدكم أن يكسب كل يوم ألف حسنة","fr":"Rapporté par Abdullah b. Buraida رضي الله عنه d’après son père : J’étais assis avec le Messager d’Allah ﷺ ; le reste du hadith est identique, mais le narrateur précise : « Il s’agissait de deux mois de jeûne. »","en":"Abdullah b. Buraida (Allah be pleased with him) reported on the authority of his father:I was sitting with the Messenger of Allah (ﷺ) ; the rest of the hadith is the same but with this variation that the (the narrator) said:\" Fasts of two months","ref":{"ar":"رواه مسلم 2698","fr":"Muslim 2698","en":"Muslim 2698"}},{"type":"hadith","ar":"بسم الله أرقيك من كل شيء يؤذيك","fr":"Rapporté par Abu Sa’eed : Jibra’il est venu voir le Prophète (ﷺ) et a dit : « Ô Muhammad, tu es malade. » Il a répondu : « Oui. » Il a dit : « Bismillahi arqika, min kulli shay’in yu’dhika, min sharri kulli nafsin aw ‘aynin aw hasidin. Allahu yashfika, bismillahi arqika (Au nom d’Allah, je fais une Ruqyah pour toi, contre tout ce qui te nuit, contre le mal de toute âme ou d’un œil envieux. Qu’Allah te guérisse. Au nom d’Allah, je fais une Ruqyah pour toi). »","en":"It was narrated from Abu Sa’eed that Jibra’il came to the Prophet (ﷺ) and said:“O Muhammad, you are ill. He said: ‘Yes.’ He said: Bismillahi arqika, min kulli shay’in yu’dhika, min sharri kulli nafsin aw ‘aynin aw hasidin. Allahu yashfika, bismillahi arqika (In the Name of Allah I perform Ruqyah for you, from everything that is harming you, from the evil of every soul or envious eye, may Allah heal you. In the Name of Allah I perform Ruqyah for you)","ref":{"ar":"رواه ابن ماجه 3523","fr":"Ibn Mâjah 3523","en":"Ibn Majah 3523"}},{"type":"hadith","ar":"اللهم أنت السلام ومنك السلام تباركت يا ذا الجلال والإكرام","fr":"Aishah رضي الله عنها a dit : Lorsque le Prophète ﷺ prononçait le taslim, il disait : « Ô Allah, Tu es As-Salam, et de Toi vient As-Salam. Tu es béni, ô Détenteur de majesté et de générosité. »","en":"Aishah said:When the Prophet (ﷺ) uttered taslim, he used to say: \"O Allah, You are As-Salam, and from you is As-Salam. You are blessed, O One of Magnificence and Generosity","ref":{"ar":"رواه أبي داود 1512","fr":"Abû Dâwûd 1512","en":"Abu Dawud 1512"}},{"type":"hadith","ar":"العمرة إلى العمرة كفارة لما بينهما، والحج المبرور ليس له جزاء إلا الجنة","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « La ‘Umra efface les péchés commis entre elle et la précédente. Et la récompense d’un Hajj Mabrur (accepté par Allah) n’est rien d’autre que le Paradis. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"(The performance of) `Umra is an expiation for the sins committed (between it and the previous one). And the reward of Hajj Mabrur (the one accepted by Allah) is nothing except Paradise","ref":{"ar":"رواه البخاري 1773","fr":"al-Bukhârî 1773","en":"Bukhari 1773"}},{"type":"hadith","ar":"توبوا إلى الله فإني أتوب في اليوم إليه مائة مرة","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Si l’un d’entre vous est invité à un repas alors qu’il jeûne, qu’il dise : “Je jeûne.” »","en":"Abu Huraira (Allah be pleased with him) reported Allah's Apostle (ﷺ) as saying:If any one of you is invited to a meal when he is fasting, he should say:\" I am fasting","ref":{"ar":"رواه مسلم 2702","fr":"Muslim 2702","en":"Muslim 2702"}},{"type":"hadith","ar":"ولد صالح يدعو له وصدقة تجري يبلغه أجرها وعلم يعمل به من بعده","fr":"Rapporté par Abdullah bin Abu Qatadah, d’après son père : Le Messager d’Allah ﷺ a dit : « Les meilleures choses qu’un homme peut laisser derrière lui sont trois : un fils pieux qui prie pour lui, une aumône continue dont la récompense lui parvient, et un savoir qui continue d’être utilisé après sa mort. » (Hasan) Une autre chaîne rapporte des paroles similaires","en":"Abdullah bin Abu Qatadah narrated that his father said:\"The Messenger of Allah said: 'The best things that a man can leave behind are three: A righteous son who will pray for him, ongoing charity whose reward will reach him, and knowledge which is acted upon after his death.'\" (Hasan) Another chain with similar wording","ref":{"ar":"رواه ابن ماجه 241","fr":"Ibn Mâjah 241","en":"Ibn Majah 241"}},{"type":"hadith","ar":"إن ربكم تبارك وتعالى حيي كريم يستحيي من عبده إذا رفع يديه إليه أن يردهما صفرا","fr":"Rapporté par Salman al-Farsi رضي الله عنه : Le Prophète ﷺ a dit : « Votre Seigneur est généreux et plein de bonté, et Il a honte de renvoyer les mains de Son serviteur vides lorsqu’il les lève vers Lui. »","en":"Narrated Salman al-Farsi: The Prophet (ﷺ) said: Your Lord is munificent and generous, and is ashamed to turn away empty the hands of His servant when he raises them to Him","ref":{"ar":"رواه أبي داود 1488","fr":"Abû Dâwûd 1488","en":"Abu Dawud 1488"}},{"type":"hadith","ar":"نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ","fr":"Rapporté par Ibn `Abbas : Le Prophète (ﷺ) a dit : « Il y a deux bienfaits dont beaucoup de gens se laissent tromper : la santé et le temps libre. »","en":"Narrated Ibn `Abbas:The Prophet (ﷺ) said: \"There are two blessings that many people are deceived into losing: health and free time","ref":{"ar":"رواه البخاري 6412","fr":"al-Bukhârî 6412","en":"Bukhari 6412"}},{"type":"hadith","ar":"اللهم إني أسألك الهدى والتقى والعفاف والغنى","fr":"Rapporté par Aïsha (la mère des croyants) رضي الله عنها : Le Messager d’Allah ﷺ jeûnait parfois de façon si continue que nous pensions qu’il ne s’arrêterait pas, et parfois il ne jeûnait pas du tout, à tel point que nous pensions qu’il ne jeûnerait plus. Je n’ai jamais vu le Messager d’Allah ﷺ compléter le jeûne d’un mois entier, sauf pendant le Ramadan, et je ne l’ai jamais vu jeûner autant dans un autre mois que pendant le mois de Cha’ban","en":"A'isha, the Mother of the Believers (Allah be pleased with her), reported that the Messenger of Allah (ﷺ) used to fast (so continuously) that we said that he would not break, and did not fast at all till we said that he would not fast. And I did not see the Messenger of Allah (ﷺ) completing the fast of a month, but that of Ramadan, and I did not see him fasting more in any other month than that of Sha'ban","ref":{"ar":"رواه مسلم 2721","fr":"Muslim 2721","en":"Muslim 2721"}},{"type":"hadith","ar":"رب صائم ليس له من صيامه إلا الجوع","fr":"Rapporté par Abu Hurairah : Le Messager d’Allah (ﷺ) a dit : \"Il y a des gens qui jeûnent et ne retirent de leur jeûne que la faim, et il y en a qui prient et ne retirent de leur prière qu’une nuit sans sommeil","en":"It was narrated from Abu Hurairah that the Messenger of Allah (ﷺ) said:“There are people who fast and get nothing from their fast except hunger, and there are those who pray and get nothing from their prayer but a sleepless night.”","ref":{"ar":"رواه ابن ماجه 1690","fr":"Ibn Mâjah 1690","en":"Ibn Majah 1690"}},{"type":"hadith","ar":"ثلاث دعوات مستجابات لا شك فيهن","fr":"Rapporté par Abu Hurayrah رضي الله عنه : Le Prophète ﷺ a dit : « Trois invocations sont exaucées sans aucun doute : celle d’un père, celle d’un voyageur et celle de la personne qui subit une injustice. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: Three supplications are answered, there being no doubt about them; that of a father, that of a traveller and that of one who has been wronged","ref":{"ar":"رواه أبي داود 1536","fr":"Abû Dâwûd 1536","en":"Abu Dawud 1536"}},{"type":"hadith","ar":"سباب المسلم فسوق، وقتاله كفر","fr":"Rapporté par `Abdullah : Le Prophète a dit : « Insulter un musulman est une mauvaise action (Fusuq) et le tuer est un acte de mécréance (Kufr). »","en":"Narrated `Abdullah:The Prophet, said, \"Abusing a Muslim is Fusuq (evil doing) and killing him is Kufr (disbelief)","ref":{"ar":"رواه البخاري 7076","fr":"al-Bukhârî 7076","en":"Bukhari 7076"}},{"type":"hadith","ar":"اللهم أصلح لي ديني الذي هو عصمة أمري","fr":"Un hadith similaire a été rapporté par Abdullah b. Shaqiq, mais dans la chaîne de transmetteurs, Hisham et Muhammad ne sont pas mentionnés","en":"A hadith like this has been narrated on the authority of Abdullah b. Shaqiq but in the chain of transmitters no mention is made of Hisham and Muhammad","ref":{"ar":"رواه مسلم 2720","fr":"Muslim 2720","en":"Muslim 2720"}},{"type":"hadith","ar":"الشرك الخفي أن يقوم الرجل يصلي فيزين صلاته لما يرى من نظر رجل","fr":"Rapporté par Abu Sa’eed : Le Messager d’Allah (ﷺ) est venu vers nous alors que nous parlions du Dajjal (le Faux Messie) et a dit : « Voulez-vous que je vous dise ce que je crains pour vous encore plus que le Dajjal ? » Nous avons répondu : « Oui. » Il a dit : « Le polythéisme caché : c’est lorsqu’un homme se lève pour prier et embellit sa prière parce qu’il voit qu’un autre homme le regarde. »","en":"It was narrated that Abu Sa’eed said:“The Messenger of Allah (ﷺ) came out to us when we were discussing Dajjal (False Christ) and said: ‘Shall I not tell you of that which I fear more for you than Dajjal?’ We said: ‘Yes.’ He said: ‘Hidden polytheism, when a man stands to pray and makes it look good because he sees a man looking at him.’”","ref":{"ar":"رواه ابن ماجه 4204","fr":"Ibn Mâjah 4204","en":"Ibn Majah 4204"}},{"type":"hadith","ar":"ويل للذي يحدث فيكذب ليضحك به القوم","fr":"Rapporté par Mu’awiyah ibn Jaydah al-Qushayri : Le Messager d’Allah ﷺ a dit : « Malheur à celui qui raconte des choses fausses pour faire rire les gens. Malheur à lui ! Malheur à lui ! »","en":"Narrated Mu'awiyah ibn Jaydah al-Qushayri: The Messenger of Allah (ﷺ) said: Woe to him who tells things, speaking falsely, to make people laugh thereby. Woe to him! Woe to him","ref":{"ar":"رواه أبي داود 4990","fr":"Abû Dâwûd 4990","en":"Abu Dawud 4990"}},{"type":"hadith","ar":"لا يلدغ المؤمن من جحر واحد مرتين","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Un croyant ne se fait pas piquer deux fois par le même trou. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"A believer is not stung twice (by something) out of one and the same hole","ref":{"ar":"رواه البخاري 6133","fr":"al-Bukhârî 6133","en":"Bukhari 6133"}},{"type":"hadith","ar":"اللهم إني أعوذ بك من زوال نعمتك","fr":"Rapporté par Abdullah ibn Amr رضي الله عنهما : Le Messager d’Allah ﷺ a dit : « Auprès d’Allah, le meilleur jeûne est celui de Dawud, et la meilleure prière est celle de Dawud عليه السلام, car il dormait la moitié de la nuit, priait pendant un tiers, puis dormait le sixième restant, et il jeûnait un jour et s’arrêtait le lendemain. »","en":"Abdullah b. 'Amr (Allah be pleased with both of them) reported Allah's Messenger (ﷺ) as saying:With Allah the best fasting is that of David and the best prayer is that of David (peace be upon him) for he slept half of the night and stood for prayer for the third of it and (then) slept the sixth part of it and he observed fast one day and broke on the other","ref":{"ar":"رواه مسلم 2739","fr":"Muslim 2739","en":"Muslim 2739"}},{"type":"hadith","ar":"إن الله يوصيكم بأمهاتكم","fr":"Rapporté par Miqdam bin Ma’dikarib, رضي الله عنه : Le Messager d’Allah a dit : « Allah vous ordonne d’être bons envers vos mères » — trois fois — « Allah vous ordonne d’être bons envers vos pères, Allah vous ordonne d’être bons envers vos proches, puis les plus proches. »","en":"Miqdam bin Ma'dikarib, may Allah be pleased with them, narrated that:Allah's Messenger said: \"Allah enjoins you to treat your mother's kindly\"-three times- \"Allah enjoins you to treat your fathers kindly, Allah enjoins you to treat the closest and the next closest kindly","ref":{"ar":"رواه ابن ماجه 3661","fr":"Ibn Mâjah 3661","en":"Ibn Majah 3661"}},{"type":"hadith","ar":"من كظم غيظا وهو قادر على أن ينفذه","fr":"Rapporté par Mu'adh ibn Anas رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Celui qui retient sa colère alors qu’il pourrait la laisser éclater, Allah, le Très-Haut, l’appellera au Jour de la Résurrection devant toutes les créatures et lui demandera de choisir parmi les houris celle qu’il souhaite. » Abu Dawud a dit : Le nom du transmetteur Abu Marhum est ‘Abd al-Rahman b. Maimun","en":"Narrated Mu'adh ibn Anas: The Messenger of Allah (ﷺ) said: If anyone suppresses anger when he is in a position to give vent to it, Allah, the Exalted, will call him on the Day of Resurrection over the heads of all creatures, and ask him to choose any of the bright and large eyed maidens he wishes. Abu Dawud said: The name of the transmitter Abu Marhum is 'Abd al-Rahman b. Maimun","ref":{"ar":"رواه أبي داود 4777","fr":"Abû Dâwûd 4777","en":"Abu Dawud 4777"}},{"type":"hadith","ar":"رحم الله رجلا سمحا إذا باع، وإذا اشترى، وإذا اقتضى","fr":"Rapporté par Jabir bin `Abdullah : Le Messager d'Allah (ﷺ) a dit : Qu’Allah fasse miséricorde à celui qui est indulgent dans ses achats, ses ventes et quand il réclame son argent","en":"Narrated Jabir bin `Abdullah:Allah's Messenger (ﷺ) said, \"May Allah's mercy be on him who is lenient in his buying, selling, and in demanding back his money","ref":{"ar":"رواه البخاري 2076","fr":"al-Bukhârî 2076","en":"Bukhari 2076"}},{"type":"hadith","ar":"ذاق طعم الإيمان من رضي بالله ربا","fr":"Rapporté par ‘Abbas ibn ‘Abdul-Muttalib رضي الله عنه : Il a entendu le Messager d’Allah ﷺ dire : « Celui qui est satisfait d’Allah comme Seigneur, de l’Islam comme religion et de Muhammad ﷺ comme Prophète a trouvé la douceur de la foi. »","en":"It is narrated on the authority of 'Abbas b. 'Abdul-Muttalib that he heard the Messenger of Allah saying:He has found the taste of faith (iman) who is content with Allah as his Lord, with Islam as his religion (code of life) and with Muhammad (ﷺ) as his Prophet","ref":{"ar":"رواه مسلم 151","fr":"Muslim 151","en":"Muslim 151"}},{"type":"hadith","ar":"أنا مع عبدي إذا هو ذكرني وتحركت بي شفتاه","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Allah dit : “Je suis avec Mon serviteur quand il se souvient de Moi et que ses lèvres prononcent Mon Nom.” »","en":"It was narrated from Abu Hurairah that the Prophet(ﷺ) said:\"Allah says: 'I am with My slave when he remembers Me and his lips move saying My Name","ref":{"ar":"رواه ابن ماجه 3792","fr":"Ibn Mâjah 3792","en":"Ibn Majah 3792"}},{"type":"hadith","ar":"رحم الله رجلا قام من الليل فصلى وأيقظ امرأته","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Prophète ﷺ a dit : « Qu’Allah fasse miséricorde à un homme qui se lève la nuit pour prier et réveille sa femme ; si elle refuse, il lui asperge le visage d’eau. Qu’Allah fasse miséricorde à une femme qui se lève la nuit pour prier et réveille son mari ; s’il refuse, elle lui asperge le visage d’eau. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: May Allah have mercy on a man who gets up at night and prays, and awakens his wife; if she refuses, he should sprinkle water on her face. May Allah have mercy on a woman who gets up at night and prays, and awakens her husband; if he refuses, she would sprinkle water on his face","ref":{"ar":"رواه أبي داود 1308","fr":"Abû Dâwûd 1308","en":"Abu Dawud 1308"}},{"type":"hadith","ar":"ما أنزل الله داء إلا أنزل له شفاء","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Il n’y a pas de maladie qu’Allah ait créée sans qu’Il ait aussi créé son remède. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"There is no disease that Allah has created, except that He also has created its treatment","ref":{"ar":"رواه البخاري 5678","fr":"al-Bukhârî 5678","en":"Bukhari 5678"}},{"type":"hadith","ar":"من صام رمضان ثم أتبعه ستا من شوال","fr":"Rapporté par Abu Ayyub al-Ansari رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Celui qui jeûne le mois de Ramadan puis le suit de six jours de Chawwal, c’est comme s’il avait jeûné toute l’année. »","en":"Abu Ayyub al-Ansari (Allah be pleased with him) reported Allah's Messenger (ﷺ) as saying:He who observed the fast of Ramadan and then followed it with six (fasts) of Shawwal. it would be as if he fasted perpetually","ref":{"ar":"رواه مسلم 2758","fr":"Muslim 2758","en":"Muslim 2758"}},{"type":"hadith","ar":"إن أطيب ما أكلتم من كسبكم","fr":"Rapporté par 'Aishah : Le Messager d'Allah (ﷺ) a dit : \"La meilleure de vos provisions est ce que vous gagnez, et vos enfants font partie de ce que vous gagnez","en":"It was narrated from 'Aishah that the Messenger of Allah (ﷺ) said:\"The best of your provision is what you earn, and your children are part of what you earn","ref":{"ar":"رواه ابن ماجه 2290","fr":"Ibn Mâjah 2290","en":"Ibn Majah 2290"}},{"type":"hadith","ar":"فأكثروا علي من الصلاة فيه","fr":"Rapporté par Aws b. Aws رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Parmi vos meilleurs jours se trouve le vendredi ; alors multipliez les prières sur moi ce jour-là, car vos prières me seront présentées. » Les Compagnons ont demandé : « Messager d’Allah, comment nos prières te seront-elles présentées alors que ton corps se sera décomposé ? » Il ﷺ a répondu : « Allah a interdit à la terre de consommer les corps des Prophètes. »","en":"Aws b. Aws reported the Messenger of Allah (ﷺ) as saying:Among the most excellent of your days is Friday; so invoke many blessings on me on that day, for your blessing will be submitted to me. They (the Companions) asked: Messenger of Allah, how can our blessings be submitted to you, when your body has decayed? He (ﷺ) said: Allah has prohibited the earth from consuming the bodies of Prophets","ref":{"ar":"رواه أبي داود 1531","fr":"Abû Dâwûd 1531","en":"Abu Dawud 1531"}},{"type":"hadith","ar":"يا غلام، سم الله، وكل بيمينك، وكل مما يليك","fr":"Rapporté par ‘Umar ibn Abi Salama : J’étais un garçon sous la garde du Messager d’Allah (ﷺ) et ma main allait dans tous les sens dans le plat pendant que je mangeais. Alors le Messager d’Allah (ﷺ) m’a dit : « Ô garçon ! Dis le nom d’Allah, mange avec ta main droite et mange ce qui est devant toi dans le plat. » Depuis ce jour-là, j’ai toujours suivi ces conseils en mangeant","en":"Narrated `Umar bin Abi Salama:I was a boy under the care of Allah's Messenger (ﷺ) and my hand used to go around the dish while I was eating. So Allah's Messenger (ﷺ) said to me, 'O boy! Mention the Name of Allah and eat with your right hand, and eat of the dish what is nearer to you.\" Since then I have applied those instructions when eating","ref":{"ar":"رواه البخاري 5376","fr":"al-Bukhârî 5376","en":"Bukhari 5376"}},{"type":"hadith","ar":"إذا طبخت مرقة فأكثر ماءها وتعاهد جيرانك","fr":"Rapporté par Aïsha (la mère des croyants) رضي الله عنها : Hamza ibn ‘Amr al-Aslami a demandé au Messager d’Allah ﷺ au sujet du jeûne en voyage, et il lui a répondu : « Jeûne si tu veux, et romps-le si tu veux. »","en":"A'isha (Allah be pleased with her) reported that Hamza b. 'Amr al-Aslami asked the Messenger of Allah (ﷺ) about fasting on a journey, and he (the Holy Prophet) said:Fast if you like and break it if you like","ref":{"ar":"رواه مسلم 2625","fr":"Muslim 2625","en":"Muslim 2625"}},{"type":"hadith","ar":"اصنعوا لآل جعفر طعاما فقد أتاهم ما يشغلهم","fr":"Rapporté par ‘Abdullah bin Ja’far : Quand la nouvelle de la mort de Ja’far est arrivée, le Messager d'Allah (ﷺ) a dit : « Préparez à manger pour la famille de Ja’far, car il leur est arrivé quelque chose qui les occupe. »","en":"It was narrated that ‘Abdullah bin Ja’far said:“When news of the death of Ja’far was brought, the Messenger of Allah (ﷺ) said: ‘Prepare food for the family of Ja’far, for there has come to them that which is keeping them busy or something which is keeping them busy.”","ref":{"ar":"رواه ابن ماجه 1610","fr":"Ibn Mâjah 1610","en":"Ibn Majah 1610"}},{"type":"hadith","ar":"بشر المشائين في الظلم إلى المساجد بالنور التام يوم القيامة","fr":"Rapporté par Buraydah ibn al-Hasib رضي الله عنه : Le Prophète ﷺ a dit : « Annoncez une bonne nouvelle à ceux qui vont à la mosquée dans l’obscurité : ils auront une lumière parfaite le Jour du Jugement. »","en":"Narrated Buraydah ibn al-Hasib: The Prophet (ﷺ) said: Give good tidings to those who walk to the mosques in darkness for having a perfect light on the Day of Judgment","ref":{"ar":"رواه أبي داود 561","fr":"Abû Dâwûd 561","en":"Abu Dawud 561"}},{"type":"hadith","ar":"طعام الاثنين كافي الثلاثة","fr":"Rapporté par Abu Huraira : Le Messager d'Allah (ﷺ) a dit : « La nourriture pour deux personnes suffit pour trois, et la nourriture pour trois personnes suffit pour quatre. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The food for two persons is sufficient for three, and the food of three persons is sufficient for four persons","ref":{"ar":"رواه البخاري 5392","fr":"al-Bukhârî 5392","en":"Bukhari 5392"}},{"type":"hadith","ar":"من أحق الناس بحسن صحابتي","fr":"Rapporté par Samura b. Jundub : Un hadith similaire a été rapporté par Samura b. Jundub","en":"A hadith like this has been narrated on the authority of Samura b. Jundub","ref":{"ar":"رواه مسلم 2548","fr":"Muslim 2548","en":"Muslim 2548"}},{"type":"hadith","ar":"لا يزال الله يغرس في هذا الدين غرسا يستعملهم في طاعته","fr":"Rapporté par Abu 'Inabah Al-Khawlani : Le Messager d’Allah (ﷺ) a dit : \"Allah continuera à faire apparaître de nouvelles personnes dans cette religion et les utilisera pour Lui obéir","en":"Abu 'Inabah Al-Khawlani said that:The Messenger of Allah (ﷺ) said: \"Allah will continue to plant new people in this religion and use them in His obedience","ref":{"ar":"رواه ابن ماجه 8","fr":"Ibn Mâjah 8","en":"Ibn Majah 8"}},{"type":"hadith","ar":"الملائكة تصلي على أحدكم ما دام في مصلاه","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Les anges invoquent la bénédiction sur celui d’entre vous qui reste assis à l’endroit où il a prié, tant qu’il n’est pas en état d’impureté ou qu’il ne se lève pas, en disant : “Ô Allah, pardonne-lui ; Ô Allah, fais-lui miséricorde.” »","en":"Abu Hurairah reported the Messenger of Allah (May peace be upon him) as saying; The angels invoke blessings on any of you who remains sitting at the place where he says his prayers so long as he is defiled (needs ablution) or stands up, saying:O Allah, forgives him; O Allah, have mercy on him","ref":{"ar":"رواه أبي داود 469","fr":"Abû Dâwûd 469","en":"Abu Dawud 469"}},{"type":"hadith","ar":"والله إني لأستغفر الله وأتوب إليه في اليوم أكثر من سبعين مرة","fr":"Rapporté par Abu Huraira : J’ai entendu le Messager d’Allah (ﷺ) dire : « Par Allah ! Je demande pardon à Allah et je me repens auprès de Lui plus de soixante-dix fois par jour. »","en":"Narrated Abu Huraira:I heard Allah's Messenger (ﷺ) saying.\" By Allah! I ask for forgiveness from Allah and turn to Him in repentance more than seventy times a day","ref":{"ar":"رواه البخاري 6307","fr":"al-Bukhârî 6307","en":"Bukhari 6307"}},{"type":"hadith","ar":"رغم أنف ثم رغم أنف ثم رغم أنف","fr":"Rapporté par Mousa b. ‘Ali : Ce hadith a été rapporté par la même chaîne de transmetteurs","en":"Musa b. 'Ali has narrated this hadith through the same chain of transmitters","ref":{"ar":"رواه مسلم 2551","fr":"Muslim 2551","en":"Muslim 2551"}},{"type":"hadith","ar":"رحم الله امرأ صلى قبل العصر أربعا","fr":"Rapporté par Abdullah ibn Umar رضي الله عنه : Le Prophète ﷺ a dit : « Qu’Allah fasse miséricorde à celui qui prie quatre unités avant la prière de l’après-midi. »","en":"Narrated Abdullah ibn Umar: The Prophet (ﷺ) said: May Allah show mercy to a man who prays four rak'ahs before the afternoon prayer","ref":{"ar":"رواه أبي داود 1271","fr":"Abû Dâwûd 1271","en":"Abu Dawud 1271"}},{"type":"hadith","ar":"إن الله لا يمل حتى تملوا","fr":"Rapporté par 'Aisha : Une femme de la tribu de Bani Asad était assise avec moi et l’Envoyé d’Allah (ﷺ) entra chez moi et demanda : « Qui est-ce ? » Je répondis : « C’est une telle. Elle ne dort pas la nuit car elle prie. » Le Prophète (ﷺ) dit, en désapprouvant : « Faites des actions selon vos capacités, car Allah ne se lasse pas de donner des récompenses tant que vous ne vous lassez pas de faire le bien. »","en":"Narrated 'Aisha: A woman from the tribe of Bani Asad was sitting with me and Allah's Apostle (ﷺ) came to my house and said, \"Who is this?\" I said, \"(She is) So and so. She does not sleep at night because she is engaged in prayer.\" The Prophet (ﷺ) said disapprovingly: Do (good) deeds which is within your capacity as Allah never gets tired of giving rewards till you get tired of doing good deeds","ref":{"ar":"رواه البخاري 1151","fr":"al-Bukhârî 1151","en":"Bukhari 1151"}},{"type":"hadith","ar":"من عال جاريتين حتى تبلغا","fr":"Rapporté par Abou Darda’ رضي الله عنه : Nous étions avec le Messager d’Allah ﷺ lors d’un de ses voyages, par une journée extrêmement chaude, au point que chacun se protégeait la tête avec sa main. Aucun de nous ne jeûnait, sauf le Messager d’Allah ﷺ et Abdullah ibn Rawaha","en":"Abu Darda' reported:We were with the Messenger of Allah (ﷺ) on some of his journeys on an intensely hot day so much so that a person would place his hand on his head (in order to protect himself) against excessive heat, and none amongst us was fasting but the Messenger of Allah (ﷺ) and Abdullah b. Rawaha","ref":{"ar":"رواه مسلم 2631","fr":"Muslim 2631","en":"Muslim 2631"}},{"type":"hadith","ar":"إن أولى الناس بالله من بدأهم بالسلام","fr":"Rapporté par Abu Umamah رضي الله عنه : Le Prophète ﷺ a dit : « Les plus proches d’Allah sont ceux qui saluent les premiers. »","en":"Narrated AbuUmamah: The Prophet (ﷺ) said: Those who are nearest to Allah are they who are first to give a salutation","ref":{"ar":"رواه أبي داود 5197","fr":"Abû Dâwûd 5197","en":"Abu Dawud 5197"}},{"type":"hadith","ar":"استوصوا بالنساء خيرا","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Celui qui croit en Allah et au Jour dernier ne doit pas faire de mal à son voisin. Et je vous recommande de bien traiter les femmes, car elles ont été créées à partir d’une côte, et la partie la plus courbée de la côte est son extrémité supérieure ; si tu essaies de la redresser, elle se cassera, et si tu la laisses, elle restera courbée. Donc, je vous encourage à bien traiter les femmes. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"Whoever believes in Allah and the Last Day should not hurt (trouble) his neighbor. And I advise you to take care of the women, for they are created from a rib and the most crooked portion of the rib is its upper part; if you try to straighten it, it will break, and if you leave it, it will remain crooked, so I urge you to take care of the women","ref":{"ar":"رواه البخاري 5185","fr":"al-Bukhârî 5185","en":"Bukhari 5185"}},{"type":"hadith","ar":"لا يفرك مؤمن مؤمنة إن كره منها خلقا رضي منها آخر","fr":"Rapporté par Abu Dharr رضي الله عنه : Le Messager d’Allah ﷺ a frappé ma cuisse et a dit : « Que feras-tu si tu vis parmi des gens qui retardent la prière au-delà de son heure prescrite ? » J’ai demandé : « Que me recommandes-tu dans ce cas ? » Il (le Prophète ﷺ) a dit : « Fais la prière à son heure, puis vaque à tes occupations, et si l’Iqama est prononcée et que tu es présent à la mosquée, alors fais la prière avec le groupe. »","en":"Abu Dharr reported:The Messenger of Allah (ﷺ) struck my thigh and said: How would you act if you survive among the people who would delay prayers beyond their (prescribed) time? He (Abu Dharr) said: What do you command (under this situation)? He (the Holy Prophet) slid: Observe prayer at its prescribed time, then go (to meet) your needs, and if the Iqama is pronounced, and you are present in the mosque, then observe prayer (along with the Jama'at)","ref":{"ar":"رواه مسلم 1468","fr":"Muslim 1468","en":"Muslim 1468"}},{"type":"hadith","ar":"ما من مسلمين يلتقيان فيتصافحان إلا غفر لهما قبل أن يفترقا","fr":"Rapporté par Al-Bara’ ibn Azib رضي الله عنه : Le Prophète ﷺ a dit : « Deux musulmans ne se rencontrent pas et ne se serrent pas la main sans que leurs péchés soient pardonnés avant qu’ils ne se séparent. »","en":"Narrated Al-Bara' ibn Azib: The Prophet (ﷺ) said: Two Muslims will not meet and shake hands having their sins forgiven them before they separate","ref":{"ar":"رواه أبي داود 5212","fr":"Abû Dâwûd 5212","en":"Abu Dawud 5212"}},{"type":"hadith","ar":"مثل الجليس الصالح والسوء كحامل المسك ونافخ الكير","fr":"Rapporté par Abu Musa : Le Prophète (ﷺ) a dit : « L'exemple d'un bon compagnon pieux et d'un mauvais compagnon est comme celui d'une personne qui porte du musc et d'une autre qui souffle sur un soufflet de forgeron. Celui qui porte du musc t'en offrira peut-être, ou tu en achèteras, ou tu sentiras une bonne odeur venant de lui. Mais celui qui souffle sur le soufflet de forgeron te brûlera peut-être les vêtements, ou tu sentiras une mauvaise odeur venant de lui. »","en":"Narrated Abu Musa:The Prophet (ﷺ) said, 'The example of a good pious companion and an evil one is that of a person carrying musk and another blowing a pair of bellows. The one who is carrying musk will either give you some perfume as a present, or you will buy some from him, or you will get a good smell from him, but the one who is blowing a pair of bellows will either burn your clothes or you will get a bad smell from him","ref":{"ar":"رواه البخاري 5534","fr":"al-Bukhârî 5534","en":"Bukhari 5534"}},{"type":"hadith","ar":"إذا دخل الرجل بيته فذكر الله عند دخوله","fr":"Rapporté par Jabir ibn Abdullah رضي الله عنه : Alors que le Messager d’Allah ﷺ prononçait le sermon du vendredi, un homme arriva et le Prophète ﷺ lui dit : « Untel, as-tu prié deux rak‘a ? » Il répondit : « Non. » Le Prophète ﷺ dit alors : « Lève-toi et prie. »","en":"Jabir b. 'Abdullah reported that while Allah's Messenger (ﷺ) was delivering the sermon on Friday a person came there, and the Messenger of Allah (ﷺ) said to him:So and so, have you prayed (two rak'ahs)? He said: No. He (the Holy Prophet) said: Then stand and pray","ref":{"ar":"رواه مسلم 2018","fr":"Muslim 2018","en":"Muslim 2018"}},{"type":"hadith","ar":"اجتمعوا على طعامكم واذكروا اسم الله عليه يبارك لكم فيه","fr":"Rapporté par Wahshi ibn Harb : Les compagnons du Prophète ﷺ dirent : « Messager d’Allah ﷺ, nous mangeons mais nous ne sommes pas rassasiés. » Il dit : « Peut-être mangez-vous chacun de votre côté. » Ils répondirent : « Oui. » Il dit : « Si vous vous réunissez autour de la nourriture et mentionnez le nom d’Allah, elle sera bénie. » Abu Dawud a dit : Si vous êtes invités à un festin de mariage, n’y touchez pas avant que le propriétaire des lieux (l’hôte) ne vous y autorise","en":"Narrated Wahshi ibn Harb: The Companions of the Prophet (ﷺ) said: Messenger of Allah (ﷺ) we eat but we are not satisfied. He said: Perhaps you eat separately. They replied: Yes. He said: If you gather together at your food and mention Allah's name, you will be blessed in it. Abu Dawud said: If you are invited to a wedding feast before you, do not take it until the owner of the house (i.e. the host) allows you (to eat)","ref":{"ar":"رواه أبي داود 3764","fr":"Abû Dâwûd 3764","en":"Abu Dawud 3764"}},{"type":"hadith","ar":"إن في الجنة بابا يقال له الريان، يدخل منه الصائمون","fr":"Rapporté par Sahl : Le Prophète (ﷺ) a dit : « Il y a une porte au Paradis appelée Ar-Raiyan, et seuls ceux qui jeûnaient entreront par cette porte le Jour de la Résurrection. Il sera dit : ‘Où sont ceux qui jeûnaient ?’ Ils se lèveront, et seuls eux entreront par cette porte. Après leur entrée, la porte sera fermée et plus personne n’y entrera. »","en":"Narrated Sahl:The Prophet (ﷺ) said, \"There is a gate in Paradise called Ar-Raiyan, and those who observe fasts will enter through it on the Day of Resurrection and none except them will enter through it. It will be said, 'Where are those who used to observe fasts?' They will get up, and none except them will enter through it. After their entry the gate will be closed and nobody will enter through it","ref":{"ar":"رواه البخاري 1896","fr":"al-Bukhârî 1896","en":"Bukhari 1896"}},{"type":"hadith","ar":"إذا كنتم ثلاثة فلا يتناجى اثنان دون الآخر","fr":"Rapporté par Zuhri رضي الله عنه : Ce hadith a été rapporté avec la même chaîne de transmission","en":"This hadith has been narrated by Zuhri with the same chain of transmitters","ref":{"ar":"رواه مسلم 2184","fr":"Muslim 2184","en":"Muslim 2184"}},{"type":"hadith","ar":"إن من إجلال الله إكرام ذي الشيبة المسلم","fr":"Rapporté par Abu Musa al-Ash‘ari رضي الله عنه : Le Prophète ﷺ a dit : « Glorifier Allah, c’est honorer un musulman aux cheveux blancs, et celui qui connaît bien le Coran, à condition qu’il n’en abuse pas ou ne s’en détourne pas, ainsi qu’honorer un dirigeant juste. »","en":"Narrated AbuMusa al-Ash'ari: The Prophet (ﷺ) said: Glorifying Allah involves showing honour to a grey-haired Muslim and to one who can expound the Qur'an, but not to one who acts extravagantly regarding it, or turns away from it, and showing honour to a just ruler","ref":{"ar":"رواه أبي داود 4843","fr":"Abû Dâwûd 4843","en":"Abu Dawud 4843"}},{"type":"hadith","ar":"لا يؤمن أحدكم حتى أكون أحب إليه من والده وولده","fr":"Rapporté par Abu Huraira : Le Messager d'Allah (ﷺ) a dit : Par Celui qui détient ma vie entre Ses mains, aucun de vous n'aura la foi tant qu'il ne m'aimera pas plus que son père et ses enfants","en":"Narrated Abu Huraira: \"Allah's Messenger (ﷺ) said, \"By Him in Whose Hands my life is, none of you will have faith till he loves me more than his father and his children","ref":{"ar":"رواه البخاري 14","fr":"al-Bukhârî 14","en":"Bukhari 14"}},{"type":"hadith","ar":"إن فيك خصلتين يحبهما الله الحلم والأناة","fr":"Rapporté par Ibn ‘Abbas رضي الله عنهما : Un autre hadith similaire est rapporté par Shu’ba, où le Prophète ﷺ dit : « Je vous interdis de préparer du nabidh dans une gourde, un bloc de bois creusé, une jarre vernie ou un récipient. » Ibn Mu’adh ajoute que le Messager d’Allah ﷺ a dit à Ashajj, de la tribu d’Abdul Qais : « Tu possèdes deux qualités qu’Allah aime : la clairvoyance et la réflexion. »","en":"There is another hadith narrated on the authority of Ibn Abbas (the contents of which are similar to the one) narrated by Shu'ba in which the Prophet (ﷺ) said:I forbid you to prepare nabidh in a gourd, hollowed block of wood, a varnished jar or receptacle. Ibn Mu'adh made this addition on the authority of his father that the Messenger of Allah said to Ashajj, of the tribe of 'Abdul-Qais: You possess two qualities which are liked by Allah: insight and deliberateness","ref":{"ar":"رواه مسلم 117","fr":"Muslim 117","en":"Muslim 117"}},{"type":"hadith","ar":"إذا حدث الرجل بالحديث ثم التفت فهي أمانة","fr":"Rapporté par Jabir ibn Abdullah رضي الله عنه : Le Prophète ﷺ a dit : « Quand un homme te confie quelque chose puis s’en va, cela devient un secret à garder. »","en":"Narrated Jabir ibn Abdullah: The Prophet (ﷺ) said: When a man tells something and then departs, it is a trust","ref":{"ar":"رواه أبي داود 4868","fr":"Abû Dâwûd 4868","en":"Abu Dawud 4868"}},{"type":"hadith","ar":"ثلاث من كن فيه وجد حلاوة الإيمان","fr":"Rapporté par Anas : Le Prophète (ﷺ) a dit : Celui qui possède ces trois qualités goûtera à la douceur de la foi : 1. Celui pour qui Allah et Son Messager sont plus chers que tout le reste. 2. Celui qui aime une personne uniquement pour Allah. 3. Celui qui déteste retourner à l'incroyance après qu'Allah l'en ait sauvé, autant qu'il déteste être jeté dans le feu","en":"Narrated Anas: The Prophet (ﷺ) said, \"Whoever possesses the following three qualities will taste the sweetness of faith: 1. The one to whom Allah and His Apostle become dearer than anything else. 2. Who loves a person and he loves him only for Allah's sake. 3. Who hates to revert to disbelief (Atheism) after Allah has brought (saved) him out from it, as he hates to be thrown in fire","ref":{"ar":"رواه البخاري 21","fr":"al-Bukhârî 21","en":"Bukhari 21"}},{"type":"hadith","ar":"خيركم أحسنكم قضاء","fr":"Rapporté par Ibn 'Umar رضي الله عنه : Il a appelé les gens à la prière lors d’une nuit froide, venteuse et pluvieuse, puis, à la fin de l’adhan, il a dit : « Priez dans vos maisons, priez dans vos maisons. » Ensuite, il a expliqué : « Quand il faisait froid ou qu’il pleuvait pendant un voyage, le Messager d’Allah ﷺ demandait au muezzin d’annoncer : “Priez dans vos maisons.” »","en":"Ibn 'Umar reported that he summoned (people) to pray on a cold, windy and rainy night, and then observed at the end of the Adhin:Pray in your dwellings, pray in your dwellings, and then said: When it was a cold night or it was raining in a journey the Messenger of Allah (may peace he upon him) used to command the Mu'adhdhin to announce: Pray in your dwellings","ref":{"ar":"رواه مسلم 1601","fr":"Muslim 1601","en":"Muslim 1601"}},{"type":"hadith","ar":"اللهم إني أعوذ بك من الفقر والقلة والذلة","fr":"Rapporté par Abu Hurayrah رضي الله عنه : Le Prophète ﷺ disait : « Ô Allah, je cherche refuge auprès de Toi contre la pauvreté, le manque et l’humiliation, et je cherche refuge auprès de Toi pour ne pas commettre d’injustice ni en subir. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) used to say: \"O Allah, I seek refuge in Thee from poverty\", lack and abasement, and I seek refuge in Thee lest I cause or suffer wrong","ref":{"ar":"رواه أبي داود 1544","fr":"Abû Dâwûd 1544","en":"Abu Dawud 1544"}},{"type":"hadith","ar":"اجتنبوا السبع الموبقات","fr":"Rapporté par Abu Huraira : Le Prophète (ﷺ) a dit : « Évitez les sept grands péchés destructeurs. » Les gens ont demandé : « Ô Messager d’Allah ! Quels sont-ils ? » Il a répondu : « Associer des partenaires à Allah ; pratiquer la sorcellerie ; tuer une vie qu’Allah a interdite sauf pour une raison valable ; consommer l’usure (Riba) ; manger les biens de l’orphelin ; tourner le dos à l’ennemi et fuir le champ de bataille pendant le combat ; et accuser des femmes chastes qui n’ont jamais pensé à rien d’indécent et sont de bonnes croyantes. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"Avoid the seven great destructive sins.\" They (the people!) asked, \"O Allah's Apostle! What are they?\" He said, \"To join partners in worship with Allah; to practice sorcery; to kill the life which Allah has forbidden except for a just cause (according to Islamic law); to eat up usury (Riba), to eat up the property of an orphan; to give one's back to the enemy and fleeing from the battle-field at the time of fighting and to accuse chaste women who never even think of anything touching chastity and are good believers","ref":{"ar":"رواه البخاري 6857","fr":"al-Bukhârî 6857","en":"Bukhari 6857"}},{"type":"hadith","ar":"لا يحتكر إلا خاطئ","fr":"Rapporté par 'Abd al-Hamid رضي الله عنه : J’ai entendu 'Abdullah b. al-Harith dire : 'Abdullah b. 'Abbas nous a adressé un discours un jour de pluie, et le reste du hadith est le même, mais il n’a pas mentionné la prière du vendredi et a ajouté : « Celui qui a fait cela (qui nous a ordonné de prier dans nos maisons), c’est-à-dire le Messager d’Allah ﷺ, est meilleur que moi. »","en":"Abd al-Hamid reported:I heard 'Abdullah b. al-Harith say: 'Abdullah b. 'Abbas addressed us on a rainy day, and the rest of the hadith is the same, but he made no mention of Jumu'a prayer, and added: He who did it (who commanded us to say prayer in our houses), i. e. the Messenger of Allah (ﷺ), is better than I","ref":{"ar":"رواه مسلم 1605","fr":"Muslim 1605","en":"Muslim 1605"}},{"type":"hadith","ar":"قل هو الله أحد والمعوذتين حين تمسي وحين تصبح ثلاث مرات تكفيك من كل شيء","fr":"Rapporté par Abdullah ibn Khubayb رضي الله عنه : Nous sommes sortis une nuit pluvieuse et très sombre pour chercher le Messager d’Allah ﷺ afin qu’il dirige la prière, et quand nous l’avons trouvé, il a demandé : « Avez-vous prié ? » mais je n’ai rien répondu. Il a dit : « Dis », mais je n’ai rien dit. Il a répété : « Dis », mais je n’ai rien dit. Il a alors dit : « Dis. » J’ai demandé : « Que dois-je dire ? » Il a dit : « Dis : “Dis : Il est Allah, Unique”, et les deux sourates protectrices, trois fois le matin et le soir ; elles te suffiront pour tout. »","en":"Narrated Abdullah ibn Khubayb: We went out one rainy and intensely dark night to look for the Messenger of Allah (ﷺ) to lead us in prayer, and when we found him, he asked: Have you prayed?, but I did not say anything. So he said: Say, but I did not say anything. He again said: Say, but I did not say anything. He then said: Say. So I said: What am I to say? He said: Say: \"Say, He is Allah, One,\" and al-Mu'awwadhatan three times in the morning and evening; they will serve you for every purpose","ref":{"ar":"رواه أبي داود 5082","fr":"Abû Dâwûd 5082","en":"Abu Dawud 5082"}},{"type":"hadith","ar":"إن الله تجاوز عن أمتي ما حدثت به أنفسها","fr":"Rapporté par Abu Huraira : Le Prophète ﷺ a dit : « Allah a pardonné à ma communauté les mauvaises pensées qui leur viennent à l’esprit, tant qu’elles ne sont ni mises en pratique ni prononcées. » Et Qatada a dit : « Si quelqu’un divorce de sa femme seulement dans sa tête, ce divorce non exprimé n’a aucun effet. »","en":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"Allah has forgiven my followers the evil thoughts that occur to their minds, as long as such thoughts are not put into action or uttered.\" And Qatada said, \"If someone divorces his wife just in his mind, such an unuttered divorce has no effect.:","ref":{"ar":"رواه البخاري 5269","fr":"al-Bukhârî 5269","en":"Bukhari 5269"}},{"type":"hadith","ar":"حفت الجنة بالمكاره وحفت النار بالشهوات","fr":"Rapporté par ‘Abdullah b. ‘Umar رضي الله عنه : J’ai vu le Messager d’Allah ﷺ à dos de chameau à Dhu’l-Hulaifa, prononçant la Talbiya alors que son chameau se levait avec lui","en":"Abdullah b. 'Umar reported:I saw the Messenger of Allah (ﷺ) riding on his camel at Dhu'l-Hulaifa and pronouncing Talbiya as it stood up with him","ref":{"ar":"رواه مسلم 2822","fr":"Muslim 2822","en":"Muslim 2822"}},{"type":"hadith","ar":"اللهم أنت الصاحب في السفر والخليفة في الأهل","fr":"Rapporté par Abu Hurayra رضي الله عنه : Quand le Messa
