ches one of you and he says, \"My Lord, if only You would delay me for a brief term so I would give charity and be among the righteous.\"","ref":{"ar":"سورة المنافقون · الآية 10","fr":"Al-Munaafiqoon · 63:10","en":"Al-Munaafiqoon · 63:10"}},{"type":"ayah","ar":"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ","fr":"Allah nulle autre divinité que Lui! Et c'est à Allah que les croyants [doivent] s'en remettre.","en":"Allah - there is no deity except Him. And upon Allah let the believers rely.","ref":{"ar":"سورة التغابن · الآية 13","fr":"At-Taghaabun · 64:13","en":"At-Taghaabun · 64:13"}},{"type":"ayah","ar":"إِن تُقْرِضُوا۟ ٱللَّهَ قَرْضًا حَسَنًۭا يُضَٰعِفْهُ لَكُمْ وَيَغْفِرْ لَكُمْ وَٱللَّهُ شَكُورٌ حَلِيمٌ","fr":"Si vous faites à Allah un prêt sincère, Il le multipliera pour vous et vous pardonnera. Allah cependant est très Reconnaissant et Indulgent.","en":"If you loan Allah a goodly loan, He will multiply it for you and forgive you. And Allah is Most Appreciative and Forbearing.","ref":{"ar":"سورة التغابن · الآية 17","fr":"At-Taghaabun · 64:17","en":"At-Taghaabun · 64:17"}},{"type":"ayah","ar":"لِيُنفِقْ ذُو سَعَةٍۢ مِّن سَعَتِهِۦ وَمَن قُدِرَ عَلَيْهِ رِزْقُهُۥ فَلْيُنفِقْ مِمَّآ ءَاتَىٰهُ ٱللَّهُ لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا مَآ ءَاتَىٰهَا سَيَجْعَلُ ٱللَّهُ بَعْدَ عُسْرٍۢ يُسْرًۭا","fr":"Que celui qui est aisé dépense de sa fortune; et que celui dont les biens sont restreints dépense selon ce qu'Allah lui a accordé. Allah n'impose à personne que selon ce qu'Il lui a donné, et Allah fera succéder l'aisance à la gêne.","en":"Let a man of wealth spend from his wealth, and he whose provision is restricted - let him spend from what Allah has given him. Allah does not charge a soul except [according to] what He has given it. Allah will bring about, after hardship, ease.","ref":{"ar":"سورة الطلاق · الآية 7","fr":"At-Talaaq · 65:7","en":"At-Talaaq · 65:7"}},{"type":"ayah","ar":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ قُوٓا۟ أَنفُسَكُمْ وَأَهْلِيكُمْ نَارًۭا وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ عَلَيْهَا مَلَٰٓئِكَةٌ غِلَاظٌۭ شِدَادٌۭ لَّا يَعْصُونَ ٱللَّهَ مَآ أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ","fr":"O vous qui avez cru! Préservez vos personnes et vos familles, d'un Feu dont le combustible sera les gens et les pierres, surveillé par des Anges rudes, durs, ne désobéissant jamais à Allah en ce qu'Il leur commande, et faisant strictement ce qu'on leur ordonne.","en":"O you who have believed, protect yourselves and your families from a Fire whose fuel is people and stones, over which are [appointed] angels, harsh and severe; they do not disobey Allah in what He commands them but do what they are commanded.","ref":{"ar":"سورة التحريم · الآية 6","fr":"At-Tahrim · 66:6","en":"At-Tahrim · 66:6"}},{"type":"ayah","ar":"إِنَّ ٱلَّذِينَ يَخْشَوْنَ رَبَّهُم بِٱلْغَيْبِ لَهُم مَّغْفِرَةٌۭ وَأَجْرٌۭ كَبِيرٌۭ","fr":"Ceux qui redoutent leur Seigneur bien qu'ils ne L'aient jamais vu auront un pardon et une grande récompense.","en":"Indeed, those who fear their Lord unseen will have forgiveness and great reward.","ref":{"ar":"سورة الملك · الآية 12","fr":"Al-Mulk · 67:12","en":"Al-Mulk · 67:12"}},{"type":"ayah","ar":"وَٱصْبِرْ عَلَىٰ مَا يَقُولُونَ وَٱهْجُرْهُمْ هَجْرًۭا جَمِيلًۭا","fr":"Et endure ce qu'ils disent; et écarte-toi d'eux d'une façon convenable.","en":"And be patient over what they say and avoid them with gracious avoidance.","ref":{"ar":"سورة المزمل · الآية 10","fr":"Al-Muzzammil · 73:10","en":"Al-Muzzammil · 73:10"}}],"hadith":[{"type":"hadith","ar":"إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى","fr":"Rapporté par 'Umar ibn Al-Khattab : J'ai entendu le Messager d'Allah (ﷺ) dire : « La récompense des actions dépend des intentions, et chacun sera récompensé selon son intention. Donc, celui qui a émigré pour obtenir des biens matériels ou pour épouser une femme, son émigration sera pour ce pour quoi il a émigré. »","en":"Narrated 'Umar bin Al-Khattab: I heard Allah's Messenger (ﷺ) saying, \"The reward of deeds depends upon the intentions and every person will get the reward according to what he has intended. So whoever emigrated for worldly benefits or for a woman to marry, his emigration was for what he emigrated for","ref":{"ar":"رواه البخاري 1","fr":"al-Bukhârî 1","en":"Bukhari 1"}},{"type":"hadith","ar":"الدين النصيحة","fr":"Rapporté par Tamim ad-Dari : Le Prophète ﷺ a dit : « La religion, c’est la sincérité. » Nous avons demandé : « Envers qui ? » Il a répondu : « Envers Allah, envers Son Livre, envers Son Messager, envers les dirigeants des musulmans et envers l’ensemble des musulmans. »","en":"It is narrated on the authority of Tamim ad-Dari that the Prophet (ﷺ) said:\"The Religion is sincerity.\" We said, \"To whom?\" He said \"To Allah, to His Book, To His Messenger, and to the leaders of the Muslims and their masses","ref":{"ar":"رواه مسلم 196","fr":"Muslim 196","en":"Muslim 196"}},{"type":"hadith","ar":"من حسن إسلام المرء تركه ما لا يعنيه","fr":"Rapporté par Abu Hurairah : Le Messager d’Allah (ﷺ) a dit : « Une partie de la perfection de la foi d’une personne est de laisser ce qui ne la regarde pas. »","en":"It was narrated from Abu Hurairah that the Messenger of Allah (ﷺ) said:“Part of a person’s goodness in Islam is his leaving alone that which does not concern him.”","ref":{"ar":"رواه ابن ماجه 3976","fr":"Ibn Mâjah 3976","en":"Ibn Majah 3976"}},{"type":"hadith","ar":"الراحمون يرحمهم الرحمن","fr":"Rapporté par Abdullah ibn Amr ibn al-‘As رضي الله عنه : Le Prophète ﷺ a dit : « Le Miséricordieux fait miséricorde à ceux qui sont miséricordieux. Si vous faites miséricorde à ceux qui sont sur la terre, Celui qui est au ciel vous fera miséricorde. » Musaddad n’a pas dit : Le client de ‘Abd Allah b. ‘Amr. Il a dit : Le Prophète ﷺ a dit","en":"Narrated Abdullah ibn Amr ibn al-'As: The Prophet (ﷺ) said: The Compassionate One has mercy on those who are merciful. If you show mercy to those who are on the earth, He Who is in the heaven will show mercy to you. Musaddad did not say: The client of 'Adb Allah b. 'Amr. He said: The Prophet (ﷺ) said","ref":{"ar":"رواه أبي داود 4941","fr":"Abû Dâwûd 4941","en":"Abu Dawud 4941"}},{"type":"hadith","ar":"أكثروا ذكر هاذم اللذات","fr":"Rapporté par Abu Hurairah : Le Messager d'Allah a dit : \"Rappelez-vous souvent celle qui détruit les plaisirs.\" (Hasan) Abu 'Abdur-Rahaman (An-Nasai) a dit : Muhammad bin Ibrahim (un des rapporteurs) est le père d'Abu Bakr Ibn Abi Shaibah","en":"It was narrated that Abu Hurairah said:\"The Messenger of Allah said: 'Remember often the destroyer of pleasures.\"' (Hasan) Abu 'Abdur-Rahaman (An-Nasai) said: Muhammad bin Ibrahim (one of the narrators) is the father of Abu Bakr Ibn Abi Shaibah","ref":{"ar":"رواه النسائي 1824","fr":"an-Nasâï 1824","en":"Nasa'i 1824"}},{"type":"hadith","ar":"الكلمة الطيبة صدقة","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Il y a une aumône obligatoire pour chaque articulation du corps humain chaque jour où le soleil se lève. Rendre justice entre deux personnes est une aumône, aider quelqu’un avec sa monture en l’aidant à monter ou à porter ses affaires dessus est aussi une aumône, dire une bonne parole est une aumône, chaque pas fait pour aller prier à la mosquée est une aumône, et enlever un obstacle du chemin est aussi une aumône. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"There is a (compulsory) Sadaqa (charity) to be given for every joint of the human body (as a sign of gratitude to Allah) everyday the sun rises. To judge justly between two persons is regarded as Sadaqa, and to help a man concerning his riding animal by helping him to ride it or by lifting his luggage on to it, is also regarded as Sadaqa, and (saying) a good word is also Sadaqa, and every step taken on one's way to offer the compulsory prayer (in the mosque) is also Sadaqa and to remove a harmful thing from the way is also Sadaqa","ref":{"ar":"رواه البخاري 2989","fr":"al-Bukhârî 2989","en":"Bukhari 2989"}},{"type":"hadith","ar":"الطهور شطر الإيمان","fr":"Rapporté par Jarir b. 'Abdullah رضي الله عنه : Le Messager d’Allah ﷺ lui a demandé lors du pèlerinage d’Adieu de faire taire les gens, puis il a dit : Ne redevenez pas des incroyants après moi en vous frappant les uns les autres au cou","en":"It is narrated on the authority of Jarir b. 'Abdullah that the Messenger of Allah (may peace and blessings be upon him) asked him on the occasion of the Farewell Pilgrimage to make the people silent and then said:Do not return to unbelief after me by striking the necks of one another","ref":{"ar":"رواه مسلم 223","fr":"Muslim 223","en":"Muslim 223"}},{"type":"hadith","ar":"خيركم خيركم لأهله، وأنا خيركم لأهلي","fr":"Rapporté par Ibn 'Abbas : Le Prophète a dit : \"Le meilleur d’entre vous est celui qui est le meilleur envers sa femme, et je suis le meilleur d’entre vous envers mes femmes","en":"It was narrated from Ibn 'Abbas that:the Prophet said: \"The best of you is the one who is best to his wife, and I am the best of you to my wives","ref":{"ar":"رواه ابن ماجه 1977","fr":"Ibn Mâjah 1977","en":"Ibn Majah 1977"}},{"type":"hadith","ar":"الدعاء هو العبادة","fr":"Rapporté par An-Nu'man ibn Bashir : Le Prophète ﷺ a dit : « L’invocation (du’a) est en elle-même l’adoration. » Puis il a récité : « Et votre Seigneur a dit : Invoquez-Moi, Je vous répondrai. »","en":"Narrated An-Nu'man ibn Bashir: The Prophet (ﷺ) said: Supplication (du'a') is itself the worship. (He then recited:) \"And your Lord said: Call on Me, I will answer you\" (xI)","ref":{"ar":"رواه أبي داود 1479","fr":"Abû Dâwûd 1479","en":"Abu Dawud 1479"}},{"type":"hadith","ar":"العهد الذي بيننا وبينهم الصلاة","fr":"Rapporté par ‘Abdullah bin Buraidah, d’après son père : Le Messager d’Allah (ﷺ) a dit : \"Le pacte qui nous distingue d’eux, c’est la prière ; celui qui l’abandonne a commis un acte de mécréance","en":"It was narrated from 'Abdullah bin Buraidah that his father said:\"The Messenger of Allah (ﷺ) said: 'The covenant that stands between us and them is the Salah; whoever abandons it, he has committed disbelief","ref":{"ar":"رواه النسائي 463","fr":"an-Nasâï 463","en":"Nasa'i 463"}},{"type":"hadith","ar":"لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه","fr":"Rapporté par Anas : Le Prophète (ﷺ) a dit : Aucun de vous n'aura vraiment la foi tant qu'il n'aimera pas pour son frère (musulman) ce qu'il aime pour lui-même","en":"Narrated Anas: The Prophet (ﷺ) said, \"None of you will have faith till he wishes for his (Muslim) brother what he likes for himself","ref":{"ar":"رواه البخاري 13","fr":"al-Bukhârî 13","en":"Bukhari 13"}},{"type":"hadith","ar":"إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم","fr":"Rapporté par Ibn ‘Omar رضي الله عنه : Le Messager d’Allah ﷺ jeûnait sans interruption pendant le Ramadan et les gens faisaient de même. Mais il leur a interdit de le faire. On lui a dit : « Mais toi, tu jeûnes sans interruption (et tu nous l’interdis). » Il a répondu : « Je ne suis pas comme vous ; Allah me nourrit et m’abreuve. »","en":"Ibn 'Umar reported that the Messenger of Allah (ﷺ) observed fasts uninterruptedly in Ramadan and the people (in his wake) did this. But he forbade them to do so. It was said to him (to the Holy Prophet):You yourself observe the fasts uninterruptedly (but you forbid us to do so) Upon this he said: I am not like you; I am fed and supplied drink (by Allah)","ref":{"ar":"رواه مسلم 2564","fr":"Muslim 2564","en":"Muslim 2564"}},{"type":"hadith","ar":"لا ضرر ولا ضرار","fr":"Rapporté par Ibn 'Abbas : Le Messager d’Allah (ﷺ) a dit : “Il ne doit y avoir ni préjudice ni riposte au préjudice.”","en":"It was narrated from Ibn 'Abbas that the Messenger of Allah (ﷺ) said:“There should be neither harming nor reciprocating harm.”","ref":{"ar":"رواه ابن ماجه 2341","fr":"Ibn Mâjah 2341","en":"Ibn Majah 2341"}},{"type":"hadith","ar":"أكمل المؤمنين إيمانا أحسنهم خلقا","fr":"Abu Huraira رضي الله عنه a rapporté que le Prophète ﷺ a dit : « Le croyant dont la foi est la plus parfaite est celui qui a le meilleur comportement. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: The most perfect believer in respect of faith is he who is best of them in manners","ref":{"ar":"رواه أبي داود 4682","fr":"Abû Dâwûd 4682","en":"Abu Dawud 4682"}},{"type":"hadith","ar":"أفضل الصلاة بعد الفريضة صلاة الليل","fr":"Rapporté par Humaid bin 'Abdur-Rahman – c’est-à-dire Ibn 'Awf – que Abu Hurairah a dit : Le Messager d’Allah (ﷺ) a dit : \"Le meilleur jeûne après le mois de Ramadan est le mois d’Allah, Al-Mouharram, et la meilleure prière est la prière de nuit","en":"It was narrated from Humaid bin 'Abdur-Rahman- that is Ibn 'Awf, that Abu Hurairah said:\"The Messenger of Allah (ﷺ) said: 'The best fasting after the month of Ramadan is the month of Allah, Al-Muharram, and the best prayer is prayer at night","ref":{"ar":"رواه النسائي 1613","fr":"an-Nasâï 1613","en":"Nasa'i 1613"}},{"type":"hadith","ar":"من كان يؤمن بالله واليوم الآخر فليقل خيرا أو ليصمت","fr":"Rapporté par Abu Huraira : Le Messager d’Allah (ﷺ) a dit : « Celui qui croit en Allah et au Jour dernier ne doit pas nuire à son voisin ; celui qui croit en Allah et au Jour dernier doit être généreux envers son invité ; et celui qui croit en Allah et au Jour dernier doit dire du bien ou se taire. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Anybody who believes in Allah and the Last Day should not harm his neighbor, and anybody who believes in Allah and the Last Day should entertain his guest generously and anybody who believes in Allah and the Last Day should talk what is good or keep quiet. (i.e. abstain from all kinds of evil and dirty talk)","ref":{"ar":"رواه البخاري 6018","fr":"al-Bukhârî 6018","en":"Bukhari 6018"}},{"type":"hadith","ar":"من دل على خير فله مثل أجر فاعله","fr":"Rapporté par les Compagnons de Muhammad ﷺ : Ce hadith a été rapporté par une autre chaîne de transmetteurs directement des Compagnons de Muhammad ﷺ","en":"This hadith has been narrated through another chain of transmitters directly from the Companions of Muhammad (ﷺ)","ref":{"ar":"رواه مسلم 1893","fr":"Muslim 1893","en":"Muslim 1893"}},{"type":"hadith","ar":"لو أنكم توكلتم على الله حق توكله لرزقكم كما يرزق الطير، تغدو خماصا وتروح بطانا","fr":"Rapporté par ‘Umar : J’ai entendu le Messager d’Allah (ﷺ) dire : “Si vous placiez votre confiance en Allah comme il se doit, Il vous accorderait votre subsistance comme Il la donne aux oiseaux : ils sortent le matin affamés et reviennent le soir rassasiés.”","en":"‘Umar said:“I heard the Messenger of Allah (ﷺ) say: ‘If you were to rely upon Allah with the reliance He is due, you would be given provision like the birds: They go out hungry in the morning and come back with full bellies in the evening.”","ref":{"ar":"رواه ابن ماجه 4164","fr":"Ibn Mâjah 4164","en":"Ibn Majah 4164"}},{"type":"hadith","ar":"أفشوا السلام بينكم","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Par Celui qui détient mon âme dans Sa main, vous n’entrerez pas au Paradis tant que vous ne croirez pas, et vous ne croirez pas tant que vous ne vous aimerez pas les uns les autres. Voulez-vous que je vous indique quelque chose qui, si vous le faites, vous fera vous aimer les uns les autres ? Répandez la salutation entre vous. »","en":"Abu Hurairah reported the Messenger of Allah (May peace be upon him) as saying:By him in whose hand my soul is, you will not enter Paradise until you believe, and you will not believe until you love one another: should I not guide you to something doing which you will love one another: spread out salutation among you","ref":{"ar":"رواه أبي داود 5193","fr":"Abû Dâwûd 5193","en":"Abu Dawud 5193"}},{"type":"hadith","ar":"اللهم إني أعوذ بك من علم لا ينفع","fr":"Rapporté par Anas : Le Prophète ﷺ récitait ces invocations : \"Allahumma inni a'udhu bika min 'ilmin la yanfa'u, wa qalbin la yakhsha'u, wa du'a'in la yasma'u, wa nafsin la tashba'u.\" (Ô Allah, je cherche refuge auprès de Toi contre un savoir inutile, un cœur qui n'est pas humble, une invocation non entendue et une âme jamais satisfaite.) Puis il disait : \"Allahumma inni a'udhu bika min ha'ula'il-arba'\" (Ô Allah, je cherche refuge auprès de Toi contre ces quatre choses)","en":"It was narrated from Anas that :The Prophet [SAW] used to say these supplications: \"Allahumma inni a'udhu bika min 'ilmin la yanfa'u, wa qalbin la yakhsha'u, wa du'a'in la yasma'u, wa nafsin la tashba'u. (O Allah, I seek refuge with You from knowledge that is of no benefit, a heart that is not humble, a supplication that is not heard and a soul that is not satisfied.)\" Then he would say: 'Allahumma inni a'udhu bika min ha'ula'il-arba' (O Allah, I seek refuge with You from these four)","ref":{"ar":"رواه النسائي 5470","fr":"an-Nasâï 5470","en":"Nasa'i 5470"}},{"type":"hadith","ar":"المسلم من سلم المسلمون من لسانه ويده","fr":"Rapporté par `Abdullah bin `Amr : Le Prophète (ﷺ) a dit : « Un musulman est celui qui ne fait de mal à aucun autre musulman, ni par sa langue ni par ses mains. Et un Muhajir (un émigrant) est celui qui abandonne tout ce qu’Allah a interdit. »","en":"Narrated `Abdullah bin `Amr:The Prophet (ﷺ) said, \"A Muslim is the one who avoids harming Muslims with his tongue or his hands. And a Muhajir (an emigrant) is the one who gives up (abandons) all what Allah has forbidden","ref":{"ar":"رواه البخاري 6484","fr":"al-Bukhârî 6484","en":"Bukhari 6484"}},{"type":"hadith","ar":"لا تحقرن من المعروف شيئا، ولو أن تلقى أخاك بوجه طلق","fr":"Rapporté par Aïsha (la mère des croyants) رضي الله عنها : Hamza ibn ‘Amr al-Aslami a demandé au Messager d’Allah ﷺ : « Messager d’Allah, je jeûne beaucoup. Dois-je jeûner pendant le voyage ? » Le Prophète ﷺ a répondu : « Jeûne si tu veux, et romps-le si tu veux. »","en":"A'isha (Allah be pleased with her) reported that Hamza b. Amr al-Aslami asked the Messenger of Allah (ﷺ) thus:Messenger of Allah, I am a person devoted much to fasting. Should I fast during the journey? He (the Holy Prophet) said: Fast if you like and break it if you like","ref":{"ar":"رواه مسلم 2626","fr":"Muslim 2626","en":"Muslim 2626"}},{"type":"hadith","ar":"أعطوا الأجير أجره قبل أن يجف عرقه","fr":"Rapporté par 'Abdullah bin 'Umar : Le Messager d’Allah (ﷺ) a dit : « Donnez au travailleur son salaire avant que sa sueur ne sèche. »","en":"It was narrated from 'Abdullah bin 'Umar that the Messenger of Allah (ﷺ) said:“Give the worker his wages before his sweat dries.”","ref":{"ar":"رواه ابن ماجه 2443","fr":"Ibn Mâjah 2443","en":"Ibn Majah 2443"}},{"type":"hadith","ar":"أقرب ما يكون العبد من ربه وهو ساجد، فأكثروا الدعاء","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Le moment où le serviteur est le plus proche de son Seigneur, c’est lorsqu’il est en prosternation, alors multipliez les invocations. »","en":"Abu Hurairah reported the Messenger of Allah (ﷺ) as saying:The nearest a servant come to his Lord is when he is prostrating himself, so make supplication often","ref":{"ar":"رواه أبي داود 875","fr":"Abû Dâwûd 875","en":"Abu Dawud 875"}},{"type":"hadith","ar":"تابعوا بين الحج والعمرة","fr":"Rapporté par Ibn 'Abbas رضي الله عنهما : Le Messager d'Allah ﷺ a dit : « Faites le Hajj et la 'Omra l'un après l'autre, car ils enlèvent la pauvreté et les péchés comme le soufflet enlève les impuretés du fer. »","en":"Ibn 'abbas said:\"The Messenger of Allah said: 'Perform Hajj and 'Umrah consecutively; for they remove poverty and sin as the bellows removes impurity from iron","ref":{"ar":"رواه النسائي 2630","fr":"an-Nasâï 2630","en":"Nasa'i 2630"}},{"type":"hadith","ar":"خيركم من تعلم القرآن وعلمه","fr":"Rapporté par `Uthman : Le Prophète (ﷺ) a dit : « Les meilleurs parmi vous sont ceux qui apprennent le Coran et l’enseignent. »","en":"Narrated `Uthman:The Prophet (ﷺ) said, \"The best among you (Muslims) are those who learn the Qur'an and teach it","ref":{"ar":"رواه البخاري 5027","fr":"al-Bukhârî 5027","en":"Bukhari 5027"}},{"type":"hadith","ar":"المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كل خير","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Le croyant fort est meilleur et plus aimé d’Allah que le croyant faible, mais il y a du bien en chacun. Recherche ce qui t’est bénéfique (dans l’au-delà), demande l’aide d’Allah et ne te décourage pas. Si un malheur t’arrive, ne dis pas : “Si je n’avais pas fait ceci, cela ne serait pas arrivé”, mais dis : “Allah a fait ce qu’Il avait décidé.” Car le “si” ouvre la porte au diable. »","en":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:A strong believer is better and is more lovable to Allah than a weak believer, and there is good in everyone, (but) cherish that which gives you benefit (in the Hereafter) and seek help from Allah and do not lose heart, and if anything (in the form of trouble) comes to you, don't say: If I had not done that, it would not have happened so and so, but say: Allah did that what He had ordained to do and your\" if\" opens the (gate) for the Satan","ref":{"ar":"رواه مسلم 6774","fr":"Muslim 6774","en":"Muslim 6774"}},{"type":"hadith","ar":"ما ملأ آدمي وعاء شرا من بطن","fr":"Rapporté par Miqdam bin Madikarib : J’ai entendu le Messager d’Allah (ﷺ) dire : “Aucun récipient n’est pire à remplir pour un humain que son estomac. Il suffit à l’être humain de quelques bouchées pour tenir son dos droit. Mais s’il doit (le remplir), alors un tiers pour la nourriture, un tiers pour la boisson et un tiers pour l’air.”","en":"Miqdam bin Madikarib said:“I heard the Messenger of Allah (ﷺ) say: ‘A human being fills no worse vessel than his stomach. It is sufficient for a human being to eat a few mouthfuls to keep his spine straight. But if he must (fill it), then one third of food, one third for drink and one third for air.’”","ref":{"ar":"رواه ابن ماجه 3349","fr":"Ibn Mâjah 3349","en":"Ibn Majah 3349"}},{"type":"hadith","ar":"لا يشكر الله من لا يشكر الناس","fr":"Rapporté par Abu Hurayrah : Le Prophète ﷺ a dit : « Celui qui ne remercie pas les gens ne remercie pas Allah. »","en":"Narrated Abu Hurayrah: The Prophet (ﷺ) said: He who does not thank the people is not thankful to Allah","ref":{"ar":"رواه أبي داود 4811","fr":"Abû Dâwûd 4811","en":"Abu Dawud 4811"}},{"type":"hadith","ar":"سبق درهم مائة ألف درهم","fr":"Rapporté par Abu Hurairah : Le Messager d’Allah a dit : \"Un dirham a surpassé cent mille dirhams.\" Ils ont demandé : \"Comment ?\" Il a répondu : \"Un homme avait deux dirhams et en a donné un en aumône, et un autre homme a pris une partie de sa richesse et a donné cent mille dirhams en aumône","en":"It was narrated from Abu Hurairah that the Messenger of Allah said:\"A Dirham surpassed a hundred thousand Dirhams.\" They said: \"How?\" He said: \"A man had two Dirhams and gave one in charity, and another man went part of his wealth and took out a hundred thousand Dirhams and gave them in charity","ref":{"ar":"رواه النسائي 2527","fr":"an-Nasâï 2527","en":"Nasa'i 2527"}},{"type":"hadith","ar":"يسروا ولا تعسروا، وبشروا ولا تنفروا","fr":"Rapporté par Anas bin Malik : Le Prophète (ﷺ) a dit : « Rendez les choses faciles aux gens (concernant la religion), ne les rendez pas difficiles, annoncez-leur de bonnes nouvelles et ne les faites pas fuir (de l’islam). »","en":"Narrated Anas bin Malik:The Prophet (ﷺ) said, \"Facilitate things to people (concerning religious matters), and do not make it hard for them and give them good tidings and do not make them run away (from Islam)","ref":{"ar":"رواه البخاري 69","fr":"al-Bukhârî 69","en":"Bukhari 69"}},{"type":"hadith","ar":"ما نقصت صدقة من مال","fr":"Rapporté par Omar ibn Abu Salama : Il a demandé au Messager d’Allah ﷺ : « Celui qui jeûne peut-il embrasser son épouse ? » Le Messager d’Allah ﷺ lui a dit : « Demande à Umm Salama. » Elle lui a appris que le Messager d’Allah ﷺ le faisait. Il a alors dit : « Messager d’Allah, Allah t’a pardonné tous tes péchés, les premiers et les derniers. » Le Messager d’Allah ﷺ répondit : « Par Allah, je suis le plus pieux d’entre vous et celui qui Le craint le plus. »","en":"Umar b Abu Salama reported that he asked the Messenger of Allah (ﷺ):Should one observing fast kiss (his wife)? The Messenger of Allah (ﷺ) said to him: Ask her (Umm Salama). She informed him that the Messenger of Allah (ﷺ) did that, where upon he said: Messenger of Allah, Allah pardoned thee all thy sins, the previous and the later ones. Upon this the Messenger of Allah (ﷺ) ) said: By Allah, I am the most God conscious among you and I fear Him most among you","ref":{"ar":"رواه مسلم 2588","fr":"Muslim 2588","en":"Muslim 2588"}},{"type":"hadith","ar":"لله أفرح بتوبة عبده","fr":"Rapporté par Abu Sa’eed : Le Messager d’Allah (ﷺ) a dit : “Allah se réjouit plus du repentir de Son serviteur qu’un homme qui perd sa monture dans un désert, la cherche jusqu’à être épuisé, couvre son visage avec son vêtement, et alors qu’il est ainsi, il entend les pas de sa monture là où il l’a perdue, alors il enlève le vêtement de son visage et retrouve sa monture.”","en":"It was narrated from Abu Sa’eed that the Messenger of Allah (ﷺ) said:“Allah rejoices more over the repentance of His slave, than a man who loses his mount in a barren land, and he searches for it until he gets tired and covers his face with his garment, and while he is like that, he heard the footsteps of his mount where he lost it, so he lifts the garment from his face and there is his mount.”","ref":{"ar":"رواه ابن ماجه 4249","fr":"Ibn Mâjah 4249","en":"Ibn Majah 4249"}},{"type":"hadith","ar":"إذا أحب الرجل أخاه فليخبره أنه يحبه","fr":"Rapporté par Al-Miqdam ibn Ma’dikarib : Le Prophète ﷺ a dit : « Quand un homme aime son frère, il doit lui dire qu’il l’aime. »","en":"Narrated Al-Miqdam ibn Ma'dikarib: The Prophet (ﷺ) said: When a man loves his brother, he should tell him that he loves him","ref":{"ar":"رواه أبي داود 5124","fr":"Abû Dâwûd 5124","en":"Abu Dawud 5124"}},{"type":"hadith","ar":"على كل مسلم صدقة","fr":"Rapporté par Abu Musa : Le Prophète ﷺ a dit : \"Chaque musulman doit donner en aumône.\" On a demandé : \"Et s’il ne trouve rien à donner ?\" Il a dit : \"Qu’il travaille de ses mains, profite à lui-même et donne en aumône.\" On a dit : \"Et s’il ne peut pas faire cela ?\" Il a dit : \"Qu’il aide une personne dans le besoin.\" On a dit : \"Et s’il ne peut pas faire cela ?\" Il a dit : \"Qu’il encourage le bien.\" On a dit : \"Et s’il ne peut pas faire cela ?\" Il a dit : \"Qu’il s’abstienne de faire le mal, car c’est aussi une aumône","en":"It was narrated from Abu Musa that the Prophet said:\"Every Muslim must give charity.\" It was said: \"What if he cannot find (anything to give)? \"He said: \"Let him work with his hands and benefit himself and give in charity.\" It was said: \"What if he cannot do that?\" He said: \"Let him help someone who is in desperate need.\" It was said: \"What if he cannot do that?\" He said: \"Let him enjoin good.\" It was said: \"What if he cannot do that? He said: \"Let him refrain from doing evil, for that is an act of charity","ref":{"ar":"رواه النسائي 2538","fr":"an-Nasâï 2538","en":"Nasa'i 2538"}},{"type":"hadith","ar":"ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب","fr":"Rapporté par Abu Huraira : Le Messager d'Allah (ﷺ) a dit : « Le fort n’est pas celui qui l’emporte sur les autres par sa force, mais celui qui sait se maîtriser lorsqu’il est en colère. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The strong is not the one who overcomes the people by his strength, but the strong is the one who controls himself while in anger","ref":{"ar":"رواه البخاري 6114","fr":"al-Bukhârî 6114","en":"Bukhari 6114"}},{"type":"hadith","ar":"البر حسن الخلق","fr":"Rapporté par Qatada : Ce hadith a aussi été transmis par Qatada","en":"This hadith has been transmitted on the authority of Qatada too","ref":{"ar":"رواه مسلم 2553","fr":"Muslim 2553","en":"Muslim 2553"}},{"type":"hadith","ar":"أفضل الذكر لا إله إلا الله","fr":"Rapporté par Jabir bin ‘Abdullah : J’ai entendu le Messager d’Allah (ﷺ) dire : « La meilleure évocation est “La ilaha illallah” (Nul n’a le droit d’être adoré en dehors d’Allah), et la meilleure invocation est “Al-Hamdu Lillah” (Louange à Allah). »","en":"Jabir bin 'Abdullah said:\"I heard the Messenger of Allah (ﷺ) say: 'The best of remembrance is La ilaha illallah (None has the right to be worshipped but Allah), and the best of supplication is Al-Hamdu Lillah (praise is to Allah)","ref":{"ar":"رواه ابن ماجه 3800","fr":"Ibn Mâjah 3800","en":"Ibn Majah 3800"}},{"type":"hadith","ar":"مفتاح الصلاة الطهور","fr":"Rapporté par Ali ibn Abu Talib رضي الله عنه : « La clé de la prière, c’est la purification ; elle commence par le takbir et se termine par le salut. »","en":"Narrated Ali ibn AbuTalib: The key to prayer is purification; its beginning is takbir and its end is taslim","ref":{"ar":"رواه أبي داود 61","fr":"Abû Dâwûd 61","en":"Abu Dawud 61"}},{"type":"hadith","ar":"من سأل الله الجنة ثلاث مرات قالت الجنة اللهم أدخله الجنة","fr":"Rapporté par Anas bin Malik : Le Messager d’Allah ﷺ a dit : « Celui qui demande à Allah le Paradis trois fois, le Paradis dira : “Ô Allah, fais-le entrer au Paradis.” Et celui qui demande à être protégé de l’Enfer trois fois, l’Enfer dira : “Ô Allah, protège-le du Feu.” »","en":"It was narrated that Anas bin Malik said:\"The Messenger of Allah [SAW] said: 'Whoever asks Allah for Paradise three times, Paradise will say: 'O Allah, admit him to Paradise.' And whoever seeks protection from Hell three times, Hell will say: 'O Allah, protect him from the Fire","ref":{"ar":"رواه النسائي 5521","fr":"an-Nasâï 5521","en":"Nasa'i 5521"}},{"type":"hadith","ar":"من لا يرحم لا يرحم","fr":"Rapporté par Jarir bin `Abdullah : Le Prophète (ﷺ) a dit : « Celui qui n’est pas miséricordieux envers les autres ne recevra pas de miséricorde. »","en":"Narrated Jarir bin `Abdullah:The Prophet (ﷺ) said, \"He who is not merciful to others, will not be treated mercifully","ref":{"ar":"رواه البخاري 6013","fr":"al-Bukhârî 6013","en":"Bukhari 6013"}},{"type":"hadith","ar":"إن الله طيب لا يقبل إلا طيبا","fr":"Rapporté par Abu Sa’id al-Khudri : Le Messager d’Allah ﷺ récitait, dans chaque unité des deux premières unités du dhor, environ trente versets, et dans les deux dernières, environ quinze versets ou la moitié (de la première unité). Dans chaque unité des deux premières unités du asr, il récitait environ quinze versets, et dans les deux dernières, la moitié (de ce qu’il récitait dans les premières)","en":"Abu Sa'id al-Khudri reported:The Apostle of Allah (ﷺ) used to recite in every rak'ah of the first two rak'ahs of the noon prayer about thirty verses and in the last two about fifteen verses or half (of the first rak'ah) and in every rak'ah of the 'Asr prayer of the first two rak'ahs about fifteen verses and in the last two verses half (of the first ones)","ref":{"ar":"رواه مسلم 1015","fr":"Muslim 1015","en":"Muslim 1015"}},{"type":"hadith","ar":"من فطر صائما كان له مثل أجره","fr":"Rapporté par Zaid bin Khalid Al-Juhani : Le Messager d’Allah (ﷺ) a dit : « Celui qui donne à manger à une personne qui jeûne pour qu’elle rompe son jeûne aura la même récompense qu’elle, sans que cela ne diminue en rien la récompense de la personne qui jeûne. »","en":"It was narrated from Zaid bin Khalid Al-Juhani that the Messenger of Allah (ﷺ) said:“Whoever gives food for a fasting person to break his fast, he will have a reward like theirs, without that detracting from their reward in the slightest.”","ref":{"ar":"رواه ابن ماجه 1746","fr":"Ibn Mâjah 1746","en":"Ibn Majah 1746"}},{"type":"hadith","ar":"يا بلال، أقم الصلاة، أرحنا بها","fr":"Un homme a rapporté : Salim ibn Abul Ja’dah a dit : Un homme a dit (Mis’ar a précisé : Je pense qu’il était de la tribu de Khuza’ah) : « Si seulement j’avais prié et trouvé du réconfort. » Les gens lui ont reproché ces paroles. Il a alors dit : « J’ai entendu le Messager d’Allah ﷺ dire : “Ô Bilal, fais l’iqama pour la prière ; apporte-nous du réconfort par elle.” »","en":"Narrated A man: Salim ibn AbulJa'dah said: A man said: (Mis'ar said: I think he was from the tribe of Khuza'ah): would that I had prayed, and got comfort. The people objected to him for it. Thereupon he said: I heard the Messenger of Allah (ﷺ) as saying: O Bilal, call iqamah for prayer: give us comfort by it","ref":{"ar":"رواه أبي داود 4985","fr":"Abû Dâwûd 4985","en":"Abu Dawud 4985"}},{"type":"hadith","ar":"فالزمها فإن الجنة تحت رجليها","fr":"Rapporté par Mu'awiyah bin Jahimah As-Sulami : Jahimah est venu voir le Prophète (ﷺ) et lui a dit : « Ô Messager d’Allah ! Je veux partir combattre (au Jihad) et je viens demander ton avis. » Il a dit : « As-tu une mère ? » Il a répondu : « Oui. » Il a dit : « Reste alors auprès d’elle, car le Paradis se trouve sous ses pieds. »","en":"It was narrated from Mu'awiyah bin Jahimah As-Sulami, that Jahimah came to the Prophet (ﷺ) and said:\"O Messenger of Allah! I want to go out and fight (in Jihad) and I have come to ask your advice.\" He said: \"Do you have a mother?\" He said: \"Yes.\" He said: \"Then stay with her, for Paradise is beneath her feet","ref":{"ar":"رواه النسائي 3104","fr":"an-Nasâï 3104","en":"Nasa'i 3104"}},{"type":"hadith","ar":"كل معروف صدقة","fr":"Rapporté par Jabir bin `Abdullah : Le Prophète (ﷺ) a dit : « Encourager tout ce qui est bien est une aumône (Sadaqa). »","en":"Narrated Jabir bin `Abdullah:The Prophet (ﷺ) said, Enjoining, all that is good is a Sadaqa","ref":{"ar":"رواه البخاري 6021","fr":"al-Bukhârî 6021","en":"Bukhari 6021"}},{"type":"hadith","ar":"الدنيا سجن المؤمن وجنة الكافر","fr":"Rapporté par Jubair b. Mut’im : J’ai perdu ma chamelle et je suis parti à sa recherche le jour de ‘Arafa. J’ai vu le Messager d’Allah ﷺ en train de séjourner avec les gens à ‘Arafat. J’ai alors dit : « Par Allah, il fait pourtant partie des Hums (Quraysh) ; qu’est-ce qui lui arrive pour qu’il soit venu ici ? » Les Quraysh étaient considérés comme faisant partie des Hums","en":"Jubair. b. Mut'im reported:I lost my camel and went in search of it on the day of 'Arafa, and I saw the Messenger of Allah (ﷺ) staying along with people in 'Ara'fit. Thereupon I said: By Allah, he is among the Hums (Quraish) ; what has happened to him that he has come to this (place)? The Quraish were counted among Hums","ref":{"ar":"رواه مسلم 2956","fr":"Muslim 2956","en":"Muslim 2956"}},{"type":"hadith","ar":"اللهم إنك عفو تحب العفو فاعف عني","fr":"Rapporté par ‘Aishah : Elle a dit : « Ô Messager d’Allah, que dois-je dire dans mon invocation si je tombe sur la nuit du Destin (Laylatul-Qadr) ? » Il a dit : « Dis : Allahumma innaka ‘afuwwun tuhibbul-‘afwa, fa’fu ‘anni (Ô Allah, Tu es Pardonneur et Tu aimes le pardon, alors pardonne-moi). »","en":"It was narrated from 'Aishah that she said:\"O Messenger of Allah, what do you think I should say in my supplication, if I come upon Laylatul-Qadr?\" He said: \"Say: 'Allahumma innaka 'afuwwun tuhibbul-'afwa, fa'fu 'anni (O Allah, You are Forgiving and love forgiveness, so forgive me)","ref":{"ar":"رواه ابن ماجه 3850","fr":"Ibn Mâjah 3850","en":"Ibn Majah 3850"}},{"type":"hadith","ar":"أد الأمانة إلى من ائتمنك، ولا تخن من خانك","fr":"Rapporté par Yusuf ibn Malik al-Makki : J’écrivais les comptes des dépenses engagées pour des orphelins sous la tutelle d’un certain homme. Ils l’ont trompé de mille dirhams et il leur a versé cette somme. J’ai ensuite reçu le double de ce qu’ils méritaient. J’ai dit à cet homme : « Prends les mille dirhams qu’ils t’ont pris en te trompant. » Il répondit : « Non, mon père m’a dit qu’il avait entendu le Messager d’Allah ﷺ dire : “Rends le dépôt à celui qui te l’a confié, et ne trahis pas celui qui t’a trahi.” »","en":"Narrated Yusuf ibn Malik al-Makki: I used to write (the account of) the expenditure incurred on orphans who were under the guardianship of so-and-so. They cheated him by one thousand dirhams and he paid these (this amount) to them. I then got double the property which they deserved. I said (to the man: Take one thousand (dirhams) which they have taken from you (by cheating). He said: No, my father has told me that he heard the Messenger of Allah (ﷺ) say: Pay the deposit to him who deposited it with you, and do not betray him who betrays you","ref":{"ar":"رواه أبي داود 3534","fr":"Abû Dâwûd 3534","en":"Abu Dawud 3534"}},{"type":"hadith","ar":"عليك بالصوم فإنه لا مثل له","fr":"Rapporté par Muhammad bin 'Abdullah bin Abi Yaqub : Raja bin Haiwah a rapporté qu’Abu Umamah a dit : \"Je suis allé voir le Messager d’Allah ﷺ et j’ai dit : Dis-moi quelque chose que je pourrais apprendre de toi. Il a dit : 'Pratique le jeûne, car il n’y a rien de comparable","en":"Muhammad bin 'Abdullah bin Abi Yaqub said:\"Raja bin Haiwah narrated that Abu Umamah said: 'I came to the Messenger of Allah and said: Tel l me of something that I may take (learn) from you. He said: \"Take to fasting, for there is nothing like it","ref":{"ar":"رواه النسائي 2220","fr":"an-Nasâï 2220","en":"Nasa'i 2220"}},{"type":"hadith","ar":"إن الله رفيق يحب الرفق في الأمر كله","fr":"Rapporté par `Aisha : Un groupe de Juifs a demandé la permission de rendre visite au Prophète (ﷺ. Quand ils sont entrés, ils ont dit : « As-Samu 'Alaika » (Que la mort soit sur toi). J’ai répondu : « Mais que la mort et la malédiction d’Allah soient sur vous ! » Le Prophète (ﷺ) m’a dit : « Ô `Aisha ! Allah est doux et clément, et Il aime que l’on soit doux et clément en toute chose. » J’ai dit : « N’as-tu pas entendu ce qu’ils ont dit ? » Il a répondu : « Je leur ai dit : ‘Wa 'Alaikum’ (et sur vous aussi). »","en":"Narrated `Aisha:A group of Jews asked permission to visit the Prophet (and when they were admitted) they said, \"As- Samu 'Alaika (Death be upon you).\" I said (to them), \"But death and the curse of Allah be upon you!\" The Prophet (ﷺ) said, \"O `Aisha! Allah is kind and lenient and likes that one should be kind and lenient in all matters.\" I said, \"Haven't you heard what they said?\" He said, \"I said (to them), 'Wa 'Alaikum (and upon you)","ref":{"ar":"رواه البخاري 6927","fr":"al-Bukhârî 6927","en":"Bukhari 6927"}},{"type":"hadith","ar":"إن الله كتب الإحسان على كل شيء","fr":"Rapporté par Abdullah ibn Umar رضي الله عنه alors qu'il donnait un sermon : Un des Compagnons du Messager d’Allah ﷺ entra (dans la mosquée) pendant qu’Omar parlait aux gens le vendredi. Omar lui dit à haute voix : « Pourquoi arrives-tu à cette heure pour la prière ? » Il répondit : « J’étais occupé aujourd’hui et je ne suis pas rentré chez moi quand j’ai entendu l’appel à la prière du vendredi, alors je n’ai fait que les ablutions. » Omar lui dit alors : « Seulement les ablutions ! Tu sais pourtant que le Messager d’Allah ﷺ nous a ordonné de prendre un bain le vendredi. »","en":"Abdullah (b. 'Umar) reported from his father that while he was addressing the people on Friday (sermon), a person, one of the Companions of the Messenger of Allah (ﷺ), entered (the mosque). Umar said to him loudly:What is this hour (for attending the prayer)? He said: I was busy today and I did not return to my house when I heard the call (to Friday prayer), and I did no more but performed ablution only. Upon this Umar said: just ablution! You know that the Messenger of Allah (ﷺ) commanded (us) to take a bath (on Friday)","ref":{"ar":"رواه مسلم 1955","fr":"Muslim 1955","en":"Muslim 1955"}},{"type":"hadith","ar":"عمرة في رمضان تعدل حجة","fr":"Rapporté par Wahb bin Khanbash : Le Messager d’Allah (ﷺ) a dit : « Une ‘Umrah pendant le Ramadan équivaut à un Hajj (en récompense). »","en":"It was narrated from Wahb bin Khanbash that the Messenger of Allah (ﷺ) said:“ ‘Umrah during Ramadan is equivalent to Hajj (i.e. in reward).”","ref":{"ar":"رواه ابن ماجه 2991","fr":"Ibn Mâjah 2991","en":"Ibn Majah 2991"}},{"type":"hadith","ar":"الرجل على دين خليله، فلينظر أحدكم من يخالل","fr":"Rapporté par Abu Hurayrah رضي الله عنه : Le Prophète ﷺ a dit : « Une personne suit la religion de son ami. Chacun doit donc bien réfléchir à qui il prend pour ami. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: A man follows the religion of his friend; so each one should consider whom he makes his friend","ref":{"ar":"رواه أبي داود 4833","fr":"Abû Dâwûd 4833","en":"Abu Dawud 4833"}},{"type":"hadith","ar":"إن الله عز وجل حليم حيي ستير يحب الحياء والستر","fr":"Rapporté par Ya'la : Le Messager d’Allah (ﷺ) a vu un homme faire le ghusl dans un endroit découvert. Il est alors monté sur le minbar, a loué et glorifié Allah, puis il a dit : « Allah, le Puissant et le Sublime, est indulgent, pudique et discret, et Il aime la pudeur et la discrétion. Quand l’un de vous fait le ghusl, qu’il se cache. »","en":"It was narrated from Ya'la that the Messenger of Allah (ﷺ) saw a man performing Ghusl in an open place, so he ascended the Minbar and praised and glorified Allah, then he said:'Allah, the Mighty and Sublime, is forbearing, modest and concealing, and He loves modesty and concealment. When any one of you performs Ghusl, let him conceal himself","ref":{"ar":"رواه النسائي 406","fr":"an-Nasâï 406","en":"Nasa'i 406"}},{"type":"hadith","ar":"الحياء من الإيمان","fr":"Rapporté par 'Abdullah (bin 'Umar) : Un jour, le Messager d'Allah (ﷺ) est passé près d'un homme des Ansar qui réprimandait son frère à propos de la pudeur (Haya'). Alors le Messager d'Allah (ﷺ) a dit : Laisse-le, car la pudeur fait partie de la foi","en":"Narrated 'Abdullah (bin 'Umar): Once Allah's Messenger (ﷺ) passed by an Ansari (man) who was admonishing his brother regarding Haya'. On that Allah's Messenger (ﷺ) said, \"Leave him as Haya' is a part of faith.\" (See Hadith)","ref":{"ar":"رواه البخاري 24","fr":"al-Bukhârî 24","en":"Bukhari 24"}},{"type":"hadith","ar":"من غشنا فليس منا","fr":"Un autre hadith, similaire à celui rapporté par Mālik bin Anas, est aussi rapporté par Talha b. ‘Ubaidullah رضي الله عنه, avec seulement cette différence : le Prophète ﷺ a dit : « Par son père, il réussira s’il est sincère dans ce qu’il affirme », ou : « Par son père, il entrera au Paradis s’il est sincère dans ce qu’il affirme. »","en":"Another hadith, the like of which has been narrated by Malik (b. Anas) (and mentioned above) is also reported by Talha b. 'Ubaidullah, with the only variation that the Prophet remarked:By his father, he shall succeed if he were true (to what he professed), or: By his father, he would enter heaven if he were true (to what he professed)","ref":{"ar":"رواه مسلم 101","fr":"Muslim 101","en":"Muslim 101"}},{"type":"hadith","ar":"الوالد أوسط أبواب الجنة","fr":"Rapporté par Abu Darda’ : Il a entendu le Prophète (ﷺ) dire : « Le père est la porte du milieu du Paradis (c’est-à-dire le meilleur chemin vers le Paradis), à toi de profiter de cette porte ou non. »","en":"Abu Darda' heard the Prophet (ﷺ) say that:\"The father is the middle door of Paradise (i.e. the best way to Paradise), so it is up to you whether you take advantage of it or not","ref":{"ar":"رواه ابن ماجه 3663","fr":"Ibn Mâjah 3663","en":"Ibn Majah 3663"}},{"type":"hadith","ar":"الإيمان بضع وسبعون","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « La foi comporte plus de soixante-dix branches. La meilleure est d’affirmer qu’il n’y a pas d’autre dieu qu’Allah, et la plus simple est d’enlever un obstacle du chemin. La pudeur est aussi une branche de la foi. »","en":"Abu Hurairah reported the Messenger of Allah (May peace be upon him) as saying :Faith has over seventy branches, the most excellent of which is the declaration that there is no god but Allah, and the humblest of which is the removal of a bone from the road. And modesty is a branch of faith","ref":{"ar":"رواه أبي داود 4676","fr":"Abû Dâwûd 4676","en":"Abu Dawud 4676"}},{"type":"hadith","ar":"إن الله لا يقبل من العمل إلا ما كان له خالصا وابتغي به وجهه","fr":"Rapporté par Abu ‘Umamah Al-Bahili : Un homme est venu voir le Prophète (ﷺ) et a dit : « Que penses-tu d’un homme qui combat en cherchant à la fois la récompense et la renommée – qu’aura-t-il ? » Le Messager d’Allah (ﷺ) a dit : « Il n’aura rien. » Il a répété la question trois fois, et le Prophète (ﷺ) lui a dit : « Il n’aura rien. » Puis il a dit : « Allah n’accepte aucune action, sauf si elle est faite uniquement pour Lui et pour rechercher Sa Face. »","en":"It was narrated that Abu 'Umamah Al-Bahili said:\"A man came to the Prophet (ﷺ) and said: 'What do you think of a man who fights seeking reward and fame - what will he have?' The Messenger of Allah (ﷺ) said: 'He will not have anything.' He repeated it three times, and the Prophet (ﷺ) said to him: 'He will not have anything.' Then he said: 'Allah does not accept any deed, except that which is purely for Him, and seeking His Face","ref":{"ar":"رواه النسائي 3140","fr":"an-Nasâï 3140","en":"Nasa'i 3140"}},{"type":"hadith","ar":"الحياء لا يأتي إلا بخير","fr":"Rapporté par Abu As-Sawar Al-Adawi : `Imran bin Husain a dit : Le Prophète (ﷺ) a dit : « La pudeur (haya’) n’apporte que du bien. » Bashir bin Ka`b a alors dit : « Il est écrit dans le livre de la sagesse : la pudeur mène à la dignité ; la pudeur mène à la tranquillité. » `Imran lui a répondu : « Je te rapporte la parole du Messager d’Allah (ﷺ) et toi, tu me parles de ton livre (de sagesse) ? »","en":"Narrated Abu As-Sawar Al-Adawi:`Imran bin Husain said: The Prophet (ﷺ) said, \"Haya' (pious shyness from committing religeous indiscretions) does not bring anything except good.\" Thereupon Bashir bin Ka`b said, 'It is written in the wisdom paper: Haya' leads to solemnity; Haya' leads to tranquility (peace of mind).\" `Imran said to him, \"I am narrating to you the saying of Allah's Messenger (ﷺ) and you are speaking about your paper (wisdom book)?","ref":{"ar":"رواه البخاري 6117","fr":"al-Bukhârî 6117","en":"Bukhari 6117"}},{"type":"hadith","ar":"مثل المؤمنين في توادهم وتراحمهم وتعاطفهم مثل الجسد","fr":"Rapporté par Hafsa رضي الله عنها : Le Messager d’Allah ﷺ embrassait ses épouses alors qu’il jeûnait","en":"Hafsa (Allah be pleased with her) reported that the Messenger of Allah (ﷺ) kissed (his wives) while fasting","ref":{"ar":"رواه مسلم 2586","fr":"Muslim 2586","en":"Muslim 2586"}},{"type":"hadith","ar":"نفس المؤمن معلقة بدينه حتى يقضى عنه","fr":"Rapporté par Abu Hurairah : Le Messager d’Allah (ﷺ) a dit : “L’âme du croyant reste liée à sa dette jusqu’à ce qu’elle soit remboursée.”","en":"It was narrated from Abu Hurairah that the Messenger of Allah (ﷺ) that the Messenger of Allah (ﷺ) said:“The soul of the believer is attached to his debt until it is paid off.”","ref":{"ar":"رواه ابن ماجه 2413","fr":"Ibn Mâjah 2413","en":"Ibn Majah 2413"}},{"type":"hadith","ar":"أنا زعيم ببيت في ربض الجنة لمن ترك المراء","fr":"Rapporté par Abu Umamah رضي الله عنه : Le Prophète ﷺ a dit : « Je garantis une maison à la périphérie du Paradis à celui qui évite la dispute même s’il a raison, une maison au centre du Paradis à celui qui évite le mensonge même en plaisantant, et une maison dans la partie la plus élevée du Paradis à celui qui améliore son caractère. »","en":"Narrated AbuUmamah: The Prophet (ﷺ) said: I guarantee a house in the surroundings of Paradise for a man who avoids quarrelling even if he were in the right, a house in the middle of Paradise for a man who avoids lying even if he were joking, and a house in the upper part of Paradise for a man who made his character good","ref":{"ar":"رواه أبي داود 4800","fr":"Abû Dâwûd 4800","en":"Abu Dawud 4800"}},{"type":"hadith","ar":"فمن رغب عن سنتي فليس مني","fr":"Rapporté par Anas : Il a été rapporté de Anas qu'il y avait un groupe de Compagnons du Prophète ﷺ, dont l'un a dit : \"Je ne me marierai pas avec des femmes.\" Un autre a dit : \"Je ne mangerai pas de viande.\" Un autre a dit : \"Je ne dormirai pas sur un lit.\" Un autre a dit : \"Je jeûnerai sans jamais rompre mon jeûne.\" Le Messager d'Allah a entendu parler de cela, il a loué Allah puis a dit : \"Qu'ont donc ces gens à dire de telles choses ? Pourtant moi, je prie et je dors, je jeûne et je romps mon jeûne, et je me marie avec des femmes. Celui qui se détourne de ma tradition n'est pas des miens","en":"Narrated Anas:It was narrated from Anas that there was a group of the Companions of the Prophet, one of whom said: \"I will not marry women.\" Another said: \"I will not eat meat.\" Another said: \"I will not sleep on a bed.\" Another said: \"I will fast and not break my fast.\" News of that reached the Messenger of Allah and he praised Allah then said: \"What is the matter with people who say such and such? But I pray and I sleep, I fast and I break my fast, and I marry women. Whoever turns away from my Sunnah is not of me","ref":{"ar":"رواه النسائي 3217","fr":"an-Nasâï 3217","en":"Nasa'i 3217"}},{"type":"hadith","ar":"إن من أحبكم إلي أحسنكم أخلاقا","fr":"Rapporté par `Abdullah bin `Amr : Le Messager d’Allah (ﷺ) ne parlait jamais de façon insultante ni ne disait du mal volontairement. Il disait : « Celui d’entre vous que j’aime le plus est celui qui a le meilleur caractère et les meilleures manières. » Il ajoutait : « Apprenez le Coran auprès de l’un de ces quatre : `Abdullah bin Mas`ud, Salim l’affranchi d’Abu Hudhaifa, Ubai bin Ka`b et Mu`adh bin Jabal. »","en":"Narrated `Abdullah bin `Amr:Allah's Messenger (ﷺ) neither talked in an insulting manner nor did he ever speak evil intentionally. He used to say, \"The most beloved to me amongst you is the one who has the best character and manners.\" He added, \" Learn the Qur'an from (any of these) four persons. `Abdullah bin Mas`ud, Salim the freed slave of Abu Hudhaifa, Ubai bin Ka`b, and Mu`adh bin Jabal","ref":{"ar":"رواه البخاري 3759","fr":"al-Bukhârî 3759","en":"Bukhari 3759"}},{"type":"hadith","ar":"اقرءوا القرآن فإنه يأتي يوم القيامة شفيعا لأصحابه","fr":"Rapporté par ‘Abbad ibn Tamim d’après son oncle : Un homme a dit au Messager d’Allah ﷺ qu’il avait un doute, pensant avoir annulé ses ablutions. Le Prophète ﷺ a dit : « Qu’il ne quitte pas la prière à moins d’entendre un son ou de sentir une odeur. » Abu Bakr et Zuhair ibn Harb précisent dans leurs récits que cet homme était Abdullah ibn Zayd","en":"Abbad b. Tamim reported from his uncle that a person made a complaint to the Apostle (ﷺ) that he entertained (doubt) as it something had happened to him breaking his ablution. He (the Holy Prophet) said:He should not return (from prayer) unless he hears a sound or perceives a smell (of passing wind). Abu Bakr and Zuhair b. Harb have pointed out in their narrations that it was 'Abdullah b. Zaid","ref":{"ar":"رواه مسلم 804","fr":"Muslim 804","en":"Muslim 804"}},{"type":"hadith","ar":"إن الله إذا أحب قوما ابتلاهم","fr":"Rapporté par Anas ibn Malik : Le Messager d’Allah (ﷺ) a dit : « La plus grande récompense vient avec la plus grande épreuve. Quand Allah aime un peuple, Il l’éprouve. Celui qui accepte cela obtient Sa satisfaction, mais celui qui s’en plaint attire Sa colère. »","en":"It was narrated from Anas bin Malik that the Messenger of Allah (ﷺ) said:“The greatest reward comes with the greatest trial. When Allah loves a people He tests them. Whoever accepts that wins His pleasure but whoever is discontent with that earns His wrath.”","ref":{"ar":"رواه ابن ماجه 4031","fr":"Ibn Mâjah 4031","en":"Ibn Majah 4031"}},{"type":"hadith","ar":"المؤمن مرآة المؤمن","fr":"Rapporté par Abu Hurayrah رضي الله عنه : Le Prophète ﷺ a dit : « Le croyant est le miroir du croyant, et le croyant est le frère du croyant : il le protège contre la perte et veille sur lui en son absence. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: The believer is the believer's mirror, and the believer is the believer's brother who guards him against loss and protects him when he is absent","ref":{"ar":"رواه أبي داود 4918","fr":"Abû Dâwûd 4918","en":"Abu Dawud 4918"}},{"type":"hadith","ar":"السواك مطهرة للفم مرضاة للرب","fr":"Rapporté par Abdur-Rahman bin Abu 'Atiq : Mon père m’a dit : \"J’ai entendu 'Aishah dire, rapportant du Prophète (ﷺ) : 'Le siwak purifie la bouche et plaît au Seigneur","en":"Abdur-Rahman bin Abu 'Atiq said:\"My father told me: 'I heard 'Aishah say, (narrating) from the Prophet (ﷺ): \"Siwak is a means of purification for the mouth and is pleasing to the Lord","ref":{"ar":"رواه النسائي 5","fr":"an-Nasâï 5","en":"Nasa'i 5"}},{"type":"hadith","ar":"اتقوا النار ولو بشق تمرة","fr":"Rapporté par `Adi bin Hatim : J'ai entendu le Prophète (ﷺ) dire : « Protégez-vous du Feu de l'Enfer, même en donnant la moitié d'une datte en aumône. »","en":"Narrated `Adi bin Hatim heard the Prophet (ﷺ) saying:\"Save yourself from Hell-fire even by giving half a date-fruit in charity","ref":{"ar":"رواه البخاري 1417","fr":"al-Bukhârî 1417","en":"Bukhari 1417"}},{"type":"hadith","ar":"إن الله يحب العبد التقي الغني الخفي","fr":"Rapporté par Abu Dharr رضي الله عنه : Le Tamattu’ pendant le Hajj était une permission spéciale uniquement pour les compagnons de Muhammad ﷺ","en":"Abu Dharr (Allah be pleased with him) said that Tamattu' in Hajj was a special (concession) only for the Companions of Muhammad (ﷺ)","ref":{"ar":"رواه مسلم 2965","fr":"Muslim 2965","en":"Muslim 2965"}},{"type":"hadith","ar":"المؤمن الذي يخالط الناس ويصبر على أذاهم","fr":"Rapporté par Ibn ‘Umar : Le Messager d’Allah (ﷺ) a dit : « Le croyant qui vit avec les gens et supporte leurs désagréments avec patience aura une plus grande récompense que le croyant qui ne vit pas avec les gens et ne supporte pas leurs désagréments. »","en":"It was narrated from Ibn ‘Umar that the Messenger of Allah (ﷺ) said:“The believer who mixes with people and bears their annoyance with patience will have a greater reward than the believer who does not mix with people and does not put up with their annoyance.”","ref":{"ar":"رواه ابن ماجه 4032","fr":"Ibn Mâjah 4032","en":"Ibn Majah 4032"}},{"type":"hadith","ar":"المستشار مؤتمن","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Prophète ﷺ a dit : « Celui à qui on demande conseil est digne de confiance. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: He who is consulted is trustworthy","ref":{"ar":"رواه أبي داود 5128","fr":"Abû Dâwûd 5128","en":"Abu Dawud 5128"}},{"type":"hadith","ar":"إن لله ملائكة سياحين في الأرض يبلغوني من أمتي السلام","fr":"Rapporté par Abdullah : Le Messager d'Allah (ﷺ) a dit : \"Allah (SWT) a des anges qui parcourent la Terre pour me transmettre les salutations de ma communauté","en":"It was narrated that Abdullah said:\"The Messenger of Allah (ﷺ) said: 'Allah (SWT) has angels who travel around on Earth conveying to me the Salams of my Ummah","ref":{"ar":"رواه النسائي 1282","fr":"an-Nasâï 1282","en":"Nasa'i 1282"}},{"type":"hadith","ar":"كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله وبحمده، سبحان الله العظيم","fr":"Rapporté par Abu Huraira : Le Messager d'Allah (ﷺ) a dit : « (Voici) deux paroles très faciles à dire avec la langue, très lourdes dans la balance (des récompenses), et les plus aimées du Tout Miséricordieux (et ce sont) : Subhan Allahi wa bi-hamdihi ; Subhan Allahi-l-'Adhim. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"(The following are) two words (sentences or utterances) that are very easy for the tongue to say, and very heavy in the balance (of reward), and most beloved to the Gracious Almighty (And they are): Subhan Allahi wa bi-hamdihi; Subhan Allahi-l-'Adhim","ref":{"ar":"رواه البخاري 6682","fr":"al-Bukhârî 6682","en":"Bukhari 6682"}},{"type":"hadith","ar":"قد أفلح من أسلم، ورزق كفافا، وقنعه الله بما آتاه","fr":"Rapporté par Anas : Je n’ai jamais prié derrière un imam qui faisait une prière plus courte et plus parfaite que le Messager d’Allah ﷺ","en":"Anas reported:I never prayed behind an Imam who was more brief and more perfect in prayer than the Messenger of Allah (ﷺ)","ref":{"ar":"رواه مسلم 1054","fr":"Muslim 1054","en":"Muslim 1054"}},{"type":"hadith","ar":"من أحدث في أمرنا هذا ما ليس منه فهو رد","fr":"Rapporté par Aishah رضي الله عنها : Le Messager d’Allah (ﷺ) a dit : \"Celui qui invente quelque chose dans notre affaire (c’est-à-dire l’Islam) qui n’en fait pas partie, cela sera rejeté","en":"Aishah narrated that:The Messenger of Allah (ﷺ) said: \"Whoever innovates something in this matter of ours (i.e. Islam) that is not part of it, will have it rejected","ref":{"ar":"رواه ابن ماجه 14","fr":"Ibn Mâjah 14","en":"Ibn Majah 14"}},{"type":"hadith","ar":"من سئل عن علم فكتمه","fr":"Rapporté par Abu Hurayrah : Le Prophète ﷺ a dit : « Celui à qui l’on pose une question sur un sujet qu’il connaît et qui la cache aura un mors de feu mis dans sa bouche le Jour de la Résurrection. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: He who is asked something he knows and conceals it will have a bridle of fire put on him on the Day of Resurrection","ref":{"ar":"رواه أبي داود 3658","fr":"Abû Dâwûd 3658","en":"Abu Dawud 3658"}},{"type":"hadith","ar":"اللهم إني أعوذ برضاك من سخطك وبمعافاتك من عقوبتك","fr":"Rapporté par 'Aishah : Une nuit, j’ai remarqué que le Messager d’Allah (ﷺ) n’était pas là, et je l’ai trouvé alors qu’il était en prosternation, les pieds dressés. Il disait : \"Allahumma, inni a'udhu biridaka min sakhatik, wa bimu'afatika min 'uqubatik, wa bika minka la uhsi thana'an 'alaika anta kama athnaita 'ala nafsik\" (\"Ô Allah, je cherche refuge auprès de Ta satisfaction contre Ta colère, auprès de Ton pardon contre Ton châtiment, et auprès de Toi contre Toi-même. Je ne peux pas Te louer comme il se doit, Tu es tel que Tu T’es loué Toi-même)","en":"It was narrated that 'Aishah said:\"I noticed the Messenger of Allah (ﷺ) was missing one night, and I found him when he was prostrating with his feet held upright, and he was saying: 'Allahumma, inni a'udhu biridaka min sakhatik, wa bimu'afatika min 'uqubatik, wa bika minka la uhsi thana'an 'alaika anta kama athnaita 'ala nafsik (O Allah, I seek refuge with Your pleasure from Your wrath, in Your forgiveness from Your punishment and in You from You. I cannot praise You enough, You are as You have praised Yourself)","ref":{"ar":"رواه النسائي 1100","fr":"an-Nasâï 1100","en":"Nasa'i 1100"}},{"type":"hadith","ar":"كن في الدنيا كأنك غريب أو عابر سبيل","fr":"Rapporté par Mujahid : `Abdullah bin `Umar a dit : Le Messager d’Allah (ﷺ) m’a pris par l’épaule et a dit : « Sois dans ce monde comme un étranger ou un voyageur. » Le rapporteur a ajouté : Ibn `Umar disait : « Si tu survis jusqu’au soir, ne t’attends pas à vivre jusqu’au matin, et si tu survis jusqu’au matin, ne t’attends pas à vivre jusqu’au soir. Tire profit de ta santé avant la maladie, et de ta vie avant la mort. »","en":"Narrated Mujahid:`Abdullah bin `Umar said, \"Allah's Messenger (ﷺ) took hold of my shoulder and said, 'Be in this world as if you were a stranger or a traveler.\" The sub-narrator added: Ibn `Umar used to say, \"If you survive till the evening, do not expect to be alive in the morning, and if you survive till the morning, do not expect to be alive in the evening, and take from your health for your sickness, and (take) from your life for your death","ref":{"ar":"رواه البخاري 6416","fr":"al-Bukhârî 6416","en":"Bukhari 6416"}},{"type":"hadith","ar":"انظروا إلى من أسفل منكم، ولا تنظروا إلى من هو فوقكم","fr":"Rapporté par Shu’ba avec la même chaîne de rapporteurs","en":"This hadith has been narrated by Shu'ba with the same chain of transmitters","ref":{"ar":"رواه مسلم 2963","fr":"Muslim 2963","en":"Muslim 2963"}},{"type":"hadith","ar":"لا يزال لسانك رطبا من ذكر الله","fr":"Rapporté par Abdullah bin Busr : Un bédouin a dit au Messager d’Allah (ﷺ) : « Les règles de l’Islam sont lourdes pour moi. Dis-moi quelque chose que je pourrai appliquer. » Il a dit : « Que ta langue reste toujours occupée par l’évocation d’Allah, le Tout-Puissant, le Majestueux. »","en":"It was narrated from Abdullah bin Busr that a Bedouin said to the Messenger of Allah(ﷺ) said:\"The laws of Islam are burdensome for me. Tell me of something that I will be able to adhere to. He said: 'Always keep your tongue moist with the remembrance of Allah, the Mighty and Sublime","ref":{"ar":"رواه ابن ماجه 3793","fr":"Ibn Mâjah 3793","en":"Ibn Majah 3793"}},{"type":"hadith","ar":"نضر الله امرأ سمع منا حديثا فحفظه حتى يبلغه","fr":"Rapporté par Zayd ibn Thabit : J’ai entendu le Messager d’Allah ﷺ dire : « Qu’Allah illumine celui qui entend une tradition de nous, la retient et la transmet à d’autres. Il arrive qu’une personne porteuse de savoir le transmette à quelqu’un de plus savant qu’elle, et il arrive qu’une personne porteuse de savoir ne comprenne pas elle-même ce qu’elle transmet. »","en":"Narrated Zayd ibn Thabit: I heard the Messenger of Allah (ﷺ) say: May Allah brighten a man who hears a tradition from us, gets it by heart and passes it on to others. Many a bearer of knowledge conveys it to one who is more versed than he is; and many a bearer of knowledge is not versed in it","ref":{"ar":"رواه أبي داود 3660","fr":"Abû Dâwûd 3660","en":"Abu Dawud 3660"}},{"type":"hadith","ar":"أي الصدقة أفضل قال سقي الماء","fr":"Rapporté par Sa'd bin 'Ubadah : Sa mère est morte. Il a dit : « Ô Messager d'Allah, ma mère est morte ; puis-je donner une aumône pour elle ? » Il a dit : « Oui. » Il a dit : « Quelle est la meilleure aumône ? » Il a dit : « Donner de l'eau à boire. » Et c'est la fontaine de Sa'd à Al-Madinah","en":"It was narrated from Sa'd bin 'Ubadah that his mother died. He said:\"O Messenger of Allah, my mother has died; can I give charity on her behalf?\" He said: \"Yes.\" He said: \"What kind of charity is best?\" He said: \"Providing drinking water.\" And that is the drinking-fountain of Sa'd in Al-Madinah","ref":{"ar":"رواه النسائي 3666","fr":"an-Nasâï 3666","en":"Nasa'i 3666"}},{"type":"hadith","ar":"انصر أخاك ظالما أو مظلوما","fr":"Rapporté par Anas bin Malik : Le Messager d’Allah (ﷺ) a dit : « Aide ton frère, qu’il soit injuste ou victime d’injustice. »","en":"Narrated Anas bin Malik:Allah's Messenger (ﷺ) said, \"Help your brother, whether he is an oppressor or he is an oppressed one","ref":{"ar":"رواه البخاري 2443","fr":"al-Bukhârî 2443","en":"Bukhari 2443"}},{"type":"hadith","ar":"عجبا لأمر المؤمن إن أمره كله خير","fr":"Rapporté par ‘Amr ibn Dinar : Nous avons demandé à Ibn ‘Umar au sujet d’une personne qui vient pour la ‘Umra, fait le tawaf de la Maison mais ne parcourt pas la distance entre al-Safa et al-Marwa : peut-elle sortir de l’ihram et avoir des rapports avec sa femme ? Il répondit : « Le Messager d’Allah ﷺ a fait sept tours autour de la Maison, a prié deux rak‘a après être allé à ‘Arafat, puis a parcouru sept fois la distance entre al-Safa et al-Marwa. » Il cita : « Certes, il y a dans le Messager d’Allah un excellent exemple pour vous. » (33:)","en":"Amr b. Dinar said:We asked Ibn Umar about a person who came for Umra and circumambulated the House, but he did not run between al-Safa' and al-Marwa, whether he is allowed to (put off Ihram) and have intercourse with his wife. He replied: Allah's Messenger (ﷺ) circumambulated the House seven times and offered two rak'ahs of prayer after staying (at 'Arafat), and ran between al-Safa and al-Marwa seven times.\" Verily there is in Allah's Messenger a model pattern for you\" (xxxill)","ref":{"ar":"رواه مسلم 2999","fr":"Muslim 2999","en":"Muslim 2999"}},{"type":"hadith","ar":"المؤذنون أطول الناس أعناقا يوم القيامة","fr":"Rapporté par ‘Esa bin Talhah : J’ai entendu Mu’awiyah bin Abu Sufyan dire que le Messager d’Allah a dit : « Le muezzin aura le cou le plus long de tous les gens le Jour de la Résurrection. »","en":"It was narrated that 'Esa bin Talhah said:\"I heard Mu'awiyah bin Abu Sufyan say that Messenger of Allah said: \"The Mu'adh-dhin will have the longest necks of all people on the Day of Resurrection","ref":{"ar":"رواه ابن ماجه 725","fr":"Ibn Mâjah 725","en":"Ibn Majah 725"}},{"type":"hadith","ar":"زينوا القرآن بأصواتكم","fr":"Rapporté par Al-Bara’ ibn Azib رضي الله عنه : Le Prophète ﷺ a dit : « Embélissez le Coran avec vos voix. »","en":"Narrated Al-Bara' ibn Azib: The Prophet (ﷺ) said: Beautify the Qur'an with your voices","ref":{"ar":"رواه أبي داود 1468","fr":"Abû Dâwûd 1468","en":"Abu Dawud 1468"}},{"type":"hadith","ar":"من أتى فراشه وهو ينوي أن يقوم يصلي من الليل فغلبته عيناه حتى أصبح كتب له ما نوى","fr":"Rapporté par Abou Ad-Darda’ qui l’attribue au Prophète (ﷺ) : \"Celui qui va se coucher avec l’intention de se lever pour prier la nuit, puis le sommeil l’emporte jusqu’au matin, aura la récompense de ce qu’il avait l’intention de faire, et son sommeil sera une aumône que son Seigneur, le Tout-Puissant et Majestueux, lui a accordée","en":"It was narrated from Abu Ad-Darda' who attributed it to the Prophet (ﷺ):\"Whoever goes to his bed intending to get up and pray qiyam at night, then sleep overwhelms him until morning, will have recorded that which he intended and his sleep is a charity given to him by his Lord, the Mighty and Sublime","ref":{"ar":"رواه النسائي 1787","fr":"an-Nasâï 1787","en":"Nasa'i 1787"}},{"type":"hadith","ar":"المؤمن للمؤمن كالبنيان يشد بعضه بعضا","fr":"Rapporté par Abu Musa : Le Prophète (ﷺ) a dit : « Un croyant envers un autre croyant est comme un bâtiment dont les différentes parties se soutiennent les unes les autres. » Le Prophète (ﷺ) a alors joint ses mains en croisant les doigts","en":"Narrated Abu Musa:The Prophet (ﷺ) said, \"A believer to another believer is like a building whose different parts enforce each other.\" The Prophet (ﷺ) then clasped his hands with the fingers interlaced (while saying that)","ref":{"ar":"رواه البخاري 2446","fr":"al-Bukhârî 2446","en":"Bukhari 2446"}},{"type":"hadith","ar":"الصيام جنة","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Le jeûne est une protection. »","en":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:Fasting is a shield","ref":{"ar":"رواه مسلم 2705","fr":"Muslim 2705","en":"Muslim 2705"}},{"type":"hadith","ar":"ازهد في الدنيا يحبك الله وازهد فيما في أيدي الناس يحبوك","fr":"Rapporté par Sahl bin Sa’d As-Sa’idi : Un homme est venu voir le Prophète (ﷺ) et a dit : « Ô Messager d’Allah, montre-moi une action qui fera que si je la fais, Allah m’aimera et les gens m’aimeront. » Le Messager d’Allah (ﷺ) a dit : « Détache-toi de ce bas monde et Allah t’aimera. Détache-toi de ce que possèdent les gens et ils t’aimeront. »","en":"It was narrated that Sahl bin Sa’d As-Sa’idi said:“A man came to the Prophet (ﷺ) and said: ‘O Messenger of Allah, show me a deed which, if I do it, Allah will love me and people will love me. The Messenger of Allah (ﷺ) said: “Be indifferent towards this world, and Allah will love you. Be indifferent to what is in people’s hands, and they will love you.”","ref":{"ar":"رواه ابن ماجه 4102","fr":"Ibn Mâjah 4102","en":"Ibn Majah 4102"}},{"type":"hadith","ar":"اقرأ وارتق ورتل","fr":"Rapporté par Abdullah ibn Amr ibn al-‘As رضي الله عنه : Le Messager d’Allah ﷺ a dit : « Celui qui était attaché au Coran se verra dire : “Récite, élève-toi et récite avec soin comme tu récitais avec soin dans le monde, car tu atteindras ta place au dernier verset que tu réciteras.” »","en":"Narrated Abdullah ibn Amr ibn al-'As: The Messenger of Allah (ﷺ) said: One who was devoted to the Qur'an will be told to recite, ascend and recite carefully as he recited carefully when he was in the world, for he will reach his abode when he comes to the last verse he recites","ref":{"ar":"رواه أبي داود 1464","fr":"Abû Dâwûd 1464","en":"Abu Dawud 1464"}},{"type":"hadith","ar":"أسبغ الوضوء وخلل بين الأصابع","fr":"Rapporté par 'Asim bin Laqit, dont le père a dit : Le Messager d'Allah (ﷺ) a dit : « Lorsque tu fais les ablutions, fais-les correctement, et lave entre les doigts (Al-Asabi'). » [1] Al-Asabi' est le pluriel désignant aussi bien les doigts que les orteils, et l’auteur n’a mentionné qu’une seule version sur ce sujet, alors que certaines précisent « des mains et des pieds ». Il a donc cité la formulation générale au sein des chapitres sur la façon de laver les pieds. [2] Une partie de ce récit a déjà été mentionnée sous le numéro","en":"It was narrated from 'Asim bin Laqit that his father said:The Messenger of Allah (ﷺ) said: \"When you perform Wudu', do so properly, and wash in between the fingers (Al-Asabi').\"[2] [1] Al-Asabi' is plural meaning fingers as well as toes, and the author mentioned only one narration on the topic whereas some of them clarify \"of the hands and feet.\" So he mentioned the general wording amids chapters how to wash the feet. [2] Part of this narration preceded under No","ref":{"ar":"رواه النسائي 114","fr":"an-Nasâï 114","en":"Nasa'i 114"}},{"type":"hadith","ar":"لا يدخل الجنة قاطع","fr":"Rapporté par Jubair bin Mut`im : Il a entendu le Prophète (ﷺ) dire : « Celui qui coupe les liens de parenté n’entrera pas au Paradis. »","en":"Narrated Jubair bin Mut`im:That he heard the Prophet (ﷺ) saying, \"The person who severs the bond of kinship will not enter Paradise","ref":{"ar":"رواه البخاري 5984","fr":"al-Bukhârî 5984","en":"Bukhari 5984"}},{"type":"hadith","ar":"إن الرفق لا يكون في شيء إلا زانه، ولا ينزع من شيء إلا شانه","fr":"Rapporté par Souleyman ibn Yassar : Il a demandé à Umm Salama si une personne qui se lève le matin en état de grande impureté doit jeûner. Elle a répondu : « Le Messager d’Allah ﷺ se levait parfois le matin en état de grande impureté, non pas à cause d’un rêve mais après un rapport pendant la nuit, puis il jeûnait. »","en":"Sulaiman b. Yasar reported that he asked Umm Salama whether a person (who gets up) in the morning in a state of junub should observe fast. She said:The Messenger of Allah (ﷺ) (at times) got up in the morning in a state of junub, not because of sexual dreams (but on account of intercourse at night), and then observed fast","ref":{"ar":"رواه مسلم 2594","fr":"Muslim 2594","en":"Muslim 2594"}},{"type":"hadith","ar":"حق الله على العباد أن يعبدوه ولا يشركوا به شيئا","fr":"Rapporté par Mu’adh bin Jabal : Le Messager d’Allah (ﷺ) est passé près de moi alors que j’étais sur un âne, et il a dit : « Ô Mu’adh, sais-tu quel est le droit d’Allah sur Ses serviteurs et quel est le droit des serviteurs sur Allah ? » J’ai répondu : « Allah et Son Messager savent mieux. » Il a dit : « Le droit d’Allah sur Ses serviteurs est qu’ils L’adorent sans rien Lui associer. Et le droit des serviteurs sur Allah, s’ils font cela, est qu’Il ne les punisse pas. »","en":"It was narrated that Mu’adh bin Jabal said:“The Messenger of Allah (ﷺ) passed by me when I was riding a donkey, and said: ‘O Mu’adh, do you know what Allah’s right over His slaves is and what His slaves’ right over Allah is?’ I said: ‘Allah and His Messenger know best.’ He said: ‘The right of Allah over His slaves is that they should worship Him and not associate anything with Him. And the right of the slaves over Allah, if they do that, is that He should not punish them.’”","ref":{"ar":"رواه ابن ماجه 4296","fr":"Ibn Mâjah 4296","en":"Ibn Majah 4296"}},{"type":"hadith","ar":"اللهم أعني على ذكرك وشكرك وحسن عبادتك","fr":"Mu’adh b. Jabal a rapporté que le Messager d’Allah ﷺ a pris sa main et a dit : « Par Allah, je t’aime, Mu’adh. Je vais te donner un conseil. N’oublie jamais de réciter cette invocation après chaque prière prescrite : “Ô Allah, aide-moi à me souvenir de Toi, à Te remercier et à T’adorer de la meilleure façon.” » Mu’adh a transmis cette invocation au narrateur al-Sunabihi, et al-Sunabihi à Abu Abd al-Rahman","en":"Mu'adh b. Jabal reported that the Messenger of Allah (ﷺ) caught his hand and said:By Allah, I love you, Mu'adh. I give some instruction to you. Never leave to recite this supplication after every (prescribed) prayer: \"O Allah, help me in remembering You, in giving You thanks, and worshipping You well.\" Mu'adh willed this supplication to the narrator al-Sunabihi and al-Sunabihi to 'Abu Abd al-Rahman","ref":{"ar":"رواه أبي داود 1522","fr":"Abû Dâwûd 1522","en":"Abu Dawud 1522"}},{"type":"hadith","ar":"من أحب أن يبسط له في رزقه، وينسأ له في أثره، فليصل رحمه","fr":"Rapporté par Anas bin Malik : Le Messager d’Allah (ﷺ) a dit : « Celui qui aime avoir plus de richesse et une vie plus longue doit entretenir de bonnes relations avec sa famille. »","en":"Narrated Anas bin Malik:Allah's Apostle said, \"Whoever loves that he be granted more wealth and that his lease of life be prolonged then he should keep good relations with his Kith and kin","ref":{"ar":"رواه البخاري 5986","fr":"al-Bukhârî 5986","en":"Bukhari 5986"}},{"type":"hadith","ar":"اتقوا الظلم، فإن الظلم ظلمات يوم القيامة","fr":"Rapporté par Aïcha رضي الله عنها : Le Messager d’Allah ﷺ prenait ses épouses dans ses bras alors qu’il jeûnait","en":"A'isha (Allah be pleased with her) said that the Messenger of Allah (ﷺ) used to embrace (his wives) while fasting","ref":{"ar":"رواه مسلم 2578","fr":"Muslim 2578","en":"Muslim 2578"}},{"type":"hadith","ar":"اللهم إني أسألك علما نافعا ورزقا طيبا وعملا متقبلا","fr":"Rapporté par Umm Salamah : Quand le Prophète (ﷺ) accomplissait la prière du Subh (prière du matin), au moment de dire le Salam, il disait : « Allahumma inni as’aluka ‘ilman nafi’an, wa rizqan tayyiban, wa ‘amalan mutaqabbalan. » (Ô Allah, je Te demande un savoir utile, une bonne subsistance et des œuvres acceptées)","en":"It was narrated from Umm Salamah that when the Prophet (ﷺ) performed the Subh (morning prayer), while he said the Salam, he would say:‘Allahumma inni as’aluka ‘ilman nafi’an, wa rizqan tayyiban, wa ‘amalan mutaqabbalan (O Allah, I ask You for beneficial knowledge, goodly provision and acceptable deeds).’”","ref":{"ar":"رواه ابن ماجه 925","fr":"Ibn Mâjah 925","en":"Ibn Majah 925"}},{"type":"hadith","ar":"إذا انتهى أحدكم إلى المجلس فليسلم","fr":"Rapporté par Abu Huraira رضي الله عنه : Le Prophète ﷺ a dit : « Quand l’un de vous arrive dans une assemblée, qu’il salue, et s’il veut partir, qu’il salue aussi, car le premier salut n’est pas plus obligatoire que le dernier. »","en":"Narrated AbuHurayrah: The Prophet (ﷺ) said: When one of you comes to an assembly, he should give a salutation and if he feels inclined to get up, he should give a salutation, for the former is not more of a duty than the latter","ref":{"ar":"رواه أبي داود 5208","fr":"Abû Dâwûd 5208","en":"Abu Dawud 5208"}},{"type":"hadith","ar":"من صلى البردين دخل الجنة","fr":"Rapporté par Abu Bakr bin Abi Musa : Mon père a dit : Le Messager d’Allah (ﷺ) a dit : « Celui qui prie les deux prières fraîches (`Asr et Fajr) entrera au Paradis. »","en":"Narrated Abu Bakr bin Abi Musa:My father said, \"Allah's Messenger (ﷺ) said, 'Whoever prays the two cool prayers (`Asr and Fajr) will go to Paradise","ref":{"ar":"رواه البخاري 574","fr":"al-Bukhârî 574","en":"Bukhari 574"}},{"type":"hadith","ar":"إن الله وتر يحب الوتر","fr":"Rapporté par Abu Huraira : Le Messager d’Allah ﷺ a dit : « Il y a quatre-vingt-dix-neuf noms d’Allah ; celui qui les retient par cœur entrera au Paradis. En vérité, Allah est Impair (Il est Un, un nombre impair) et Il aime les nombres impairs. » Et dans la version d’Ibn 'Umar : « Celui qui les énumère. »","en":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:There are ninety-nine names of Allah; he who commits them to memory would get into Paradise. Verily, Allah is Odd (He is one, and it is an odd number) and He loves odd number. And in the narration of Ibn 'Umar (the words are):\" He who enumerated them","ref":{"ar":"رواه مسلم 6809","fr":"Muslim 6809","en":"Muslim 6809"}},{"type":"hadith","ar":"اللهم انفعني بما علمتني وعلمني ما ينفعني","fr":"Rapporté par Abu Hurairah : Le Messager d’Allah avait l’habitude de dire : « Allahummanfa'ni bima 'allamtani, wa 'allimni ma yanfa'uni, wa zidni 'ilman. Wal-hamdu Lillahi 'ala kulli hal. » [Ô Allah, fais-moi profiter de ce que Tu m’as appris, apprends-moi ce qui me sera utile et augmente mes connaissances. Louange à Allah en toute circonstance]","en":"It was narrated that Abu Hurairah said:\"The Messenger of Allah used to say: 'Allahummanfa'ni bima 'allamtani, wa 'allimnima yanfa'uni, wa zidni 'ilman. Wal-hamdu Lillahi 'ala kulli hal. [O Allah, benefit me by that which You have taught me, and teach me that which will benefit me, and increase my knowledge. Praise is to Allah in all circumstances]","ref":{"ar":"رواه ابن ماجه 251","fr":"Ibn Mâjah 251","en":"Ibn Majah 251"}},{"type":"hadith","ar":"إذا أكل أحدكم فليذكر اسم الله","fr":"Rapporté par Aisha (la mère des croyants) رضي الله عنها : Le Messager d’Allah ﷺ a dit : « Quand l’un de vous mange, qu’il mentionne le nom d’Allah ; s’il l’oublie au début, qu’il dise : “Au nom d’Allah au début et à la fin.” »","en":"Narrated Aisha, Ummul Mu'minin: The Messenger of Allah (ﷺ) said: When one of you eats, he should mention Allah's name; if he forgets to mention Allah's name at the beginning, he should say: \"In the name of Allah at the beginning and at the end of it","ref":{"ar":"رواه أبي داود 3767","fr":"Abû Dâwûd 3767","en":"Abu Dawud 3767"}},{"type":"hadith","ar":"من قال سبحان الله وبحمده في يوم مائة مرة حطت خطاياه، وإن كانت مثل زبد البحر","fr":"Rapporté par Abu Huraira : Le Messager d’Allah ﷺ a dit : « Celui qui dit ‘Subhan Allah wa bihamdihi’ cent fois par jour verra tous ses péchés pardonnés, même s’ils étaient aussi nombreux que l’écume de la mer. »","en":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Whoever says, 'Subhan Allah wa bihamdihi,' one hundred times a day, will be forgiven all his sins even if they were as much as the foam of the sea","ref":{"ar":"رواه البخاري 6405","fr":"al-Bukhârî 6405","en":"Bukhari 6405"}},{"type":"hadith","ar":"أحب البلاد إلى الله مساجدها","fr":"Rapporté par Hammam : Il a rapporté le hadith d’Aïcha رضي الله عنها comme les traditions mentionnées ci-dessus","en":"Hammam narrated the hadith from A'isha like the (above-mentioned) traditions","ref":{"ar":"رواه مسلم 671","fr":"Muslim 671","en":"Muslim 671"}},{"type":"hadith","ar":"طوبى لمن وجد في صحيفته استغفارا كثيرا","fr":"Rapporté par Abdullah bin Busr : Le Prophète (ﷺ) a dit : « Bonne nouvelle à ceux qui trouvent beaucoup de demandes de pardon dans le registre de leurs actions. »","en":"Abdullah bin Busr said that :the Prophet (saas) said: \"Glad tidings to those who find a lot of seeking forgiveness in the record of their deeds","ref":{"ar":"رواه ابن ماجه 3818","fr":"Ibn Mâjah 3818","en":"Ibn Majah 3818"}},{"type":"hadith","ar":"إذا غضب أحدكم وهو قائم فليجلس","fr":"Rapporté par Abu Dharr رضي الله عنه : Le Messager d’Allah ﷺ nous a dit : « Quand l’un de vous se met en colère alors qu’il est debout, qu’il s’asseye. Si la colère le quitte, tant mieux ; sinon, qu’il s’allonge. »","en":"Narrated AbuDharr: The Messenger of Allah (ﷺ) said to us: When one of you becomes angry while standing, he should sit down. If the anger leaves him, well and good; otherwise he should lie down","ref":{"ar":"رواه أبي داود 4782","fr":"Abû Dâwûd 4782","en":"Abu Dawud 4782"}},{"type":"hadith","ar":"من يرد الله به خيرا يفقهه في الدين","fr":"Rapporté par Muawiya : Le Messager d'Allah ﷺ a dit : « Si Allah veut du bien pour quelqu'un, Il lui donne la compréhension de la religion (c'est-à-dire l'Islam). Allah est Celui qui donne et moi, je suis Al-Qasim (le distributeur), et cette communauté restera victorieuse sur ses adversaires jusqu'à ce que l'ordre d'Allah arrive, et ils resteront victorieux. »","en":"Narrated Muawiya:Allah's Messenger (ﷺ) said, \"If Allah wants to do good for somebody, he makes him comprehend the Religion (i.e. Islam), and Allah is the Giver and I am Al-Qasim (i.e. the distributor), and this (Muslim) nation will remain victorious over their opponents, till Allah's Order comes and they will still be victorious","ref":{"ar":"رواه البخاري 3116","fr":"al-Bukhârî 3116","en":"Bukhari 3116"}},{"type":"hadith","ar":"من يحرم الرفق يحرم الخير","fr":"Rapporté par Abu Bakr ibn Abd al-Rahman ibn al-Harith ibn Hisham, d’après Aïcha et Umm Salama, les épouses du Messager d’Allah ﷺ : Il arrivait que le Messager d’Allah ﷺ se lève le matin en état de grande impureté à cause d’un rapport (pendant la nuit) mais pas à cause d’un rêve, pendant le Ramadan, et il jeûnait","en":"Abu Bakr b. 'Abd al-Rahman b. al-Harith b. Hisham reported on the authority of 'A'isha and Umm Salama, the wives of the Messenger of Allah (ﷺ):
