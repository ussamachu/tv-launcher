plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ossamah.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.ossamah.tvlauncher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Ships only the languages the launcher actually uses — trims every
        // unused resource qualifier bundle from AAR dependencies.
        resConfigs "ar", "fr", "en"
    }

    buildTypes {
        release {
            // Full R8 shrinking: unused library code/resources are stripped,
            // keeping the APK as small as possible on TV boxes.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
}
